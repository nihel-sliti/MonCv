      <p>Les deux réponses se répondent : la section Tables n'accepte que le format delta. Ce n'est pas une préférence, c'est une <b>exigence structurelle</b> — un raccourci placé dans <code class="inl">Tables/</code> doit pointer vers des données Delta Lake, sinon il ne peut pas être enregistré comme table.</p>
      <ul>
        <li><b>C — CSV.</b> Format texte brut, sans métadonnées de table. Il ne peut vivre que dans <code class="inl">Files/</code>, donc invisible pour le SQL endpoint.</li>
        <li><b>B — Parquet.</b> Le distracteur sérieux, car Parquet est bien un format colonnaire performant. Mais <b>delta = Parquet + un journal de transactions</b> (<code class="inl">_delta_log</code>). C'est ce journal qui apporte le versioning, les transactions ACID et surtout l'enregistrement au metastore. Du Parquet nu ne suffit pas pour la section Tables.</li>
      </ul>
      <p class="note"><b>La hiérarchie des formats, à ne pas confondre.</b> CSV (texte) → Parquet (colonnaire compressé) → Delta (Parquet + journal transactionnel). Seul le dernier est une <i>table</i> au sens de Fabric. <b>Attention : la question suivante pose le même scénario avec un corrigé différent.</b></p>`,
      en:`
      <p>A single constraint in the stem determines both answers: <i>query sales data files <b>by using the SQL endpoint</b></i>.</p>
      <pre class="code">SQL endpoint  →  Tables section  →  delta format</pre>
      <p class="why">D — the Tables section</p>
      <p>The SQL analytics endpoint sees only managed tables and shortcuts in the <code class="inl">Tables</code> section. Anything living in <code class="inl">Files/</code> is invisible to it.</p>
      <p class="why">E — the delta format</p>
      <p>The two answers answer each other: the Tables section accepts delta only. That is not a preference but a <b>structural requirement</b> — a shortcut placed in <code class="inl">Tables/</code> must point at Delta Lake data, or it cannot be registered as a table.</p>
      <ul>
        <li><b>C — CSV.</b> Plain text, with no table metadata. It can only live in <code class="inl">Files/</code>, so it is invisible to the SQL endpoint.</li>
        <li><b>B — Parquet.</b> The serious distractor, since Parquet is a genuinely efficient columnar format. But <b>delta = Parquet + a transaction log</b> (<code class="inl">_delta_log</code>). That log brings versioning, ACID transactions and above all metastore registration. Bare Parquet is not enough for the Tables section.</li>
      </ul>
      <p class="note"><b>The format hierarchy, not to be confused.</b> CSV (text) → Parquet (compressed columnar) → Delta (Parquet + transaction log). Only the last is a <i>table</i> in Fabric's sense. <b>Careful: the next question poses the same scenario with a different answer key.</b></p>`}
  },
  {
    id:"q217", kind:"multi", contested:true, type:TM,
    title:{fr:"Raccourci S3 — variante du corrigé",en:"S3 shortcut — the other answer key"},
    stem:{fr:`<p><b>Même énoncé que la question précédente</b>, mêmes options. Cette variante circule avec un corrigé différent — l'objet de la question est de savoir lequel retenir.</p><p class="ask">Quelles <b>deux</b> actions devez-vous inclure ?</p>`,
          en:`<p><b>Same stem as the previous question</b>, same options. This variant circulates with a different answer key — the point of the question is knowing which one to keep.</p><p class="ask">Which <b>two</b> actions should you include?</p>`},
    options:[
      {k:"A", fr:"Créer un raccourci dans la section <b>Files</b>.", en:"Create a shortcut in the <b>Files</b> section."},
      {k:"B", fr:"Utiliser le format <b>Parquet</b>.", en:"Use the <b>Parquet</b> format."},
      {k:"C", fr:"Utiliser le format <b>CSV</b>.", en:"Use the <b>CSV</b> format."},
      {k:"D", fr:"Créer un raccourci dans la section <b>Tables</b>.", en:"Create a shortcut in the <b>Tables</b> section."},
      {k:"E", fr:"Utiliser le format <b>delta</b>.", en:"Use the <b>delta</b> format."}
    ],
    answer:["B","D"],
    explain:{fr:`
      <p class="why">D — certain dans toutes les lectures</p>
      <p>L'objectif est de requêter via le SQL endpoint, qui ne voit que les tables gérées et les raccourcis de la section <code class="inl">Tables</code>. A tombe, D passe. Ce point ne varie jamais entre les deux corrigés.</p>
      <p class="why">B — le format, plus discutable</p>
      <p>La lecture qui soutient Parquet : <b>Fabric sait générer les métadonnées Delta pour un dossier Parquet placé en raccourci dans la section Tables</b>. Le dossier apparaît alors comme table interrogeable en T-SQL, sans que vous ayez à convertir vous-même.</p>
      <p class="contested"><b>Attention à la justification du dump.</b> Le corrigé justifie Parquet par la <i>performance</i> (« columnar, better than CSV »). C'est vrai en général, mais ce n'est pas le critère ici : la vraie contrainte est la compatibilité avec la section Tables. Il affirme aussi que Delta ne serait pas le choix le plus efficace — c'est inexact, puisque Delta <i>est</i> du Parquet plus un <code class="inl">_delta_log</code>, jamais moins performant que du Parquet nu. Ce type d'explication est typique des dumps générés automatiquement : la conclusion peut venir du corrigé officiel, mais la justification est reconstruite après coup.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Réponse</th><th>Logique</th></tr>
        <tr><td class="m">B — Parquet</td><td>Format source suffisant : Fabric gère la conversion Delta</td></tr>
        <tr><td class="m">E — Delta</td><td>Format strictement requis par la section Tables</td></tr>
      </table></div>
      <p class="note"><b>Comment trancher le jour J.</b> Si la question oppose Parquet et Delta avec cette formulation exacte, allez sur Parquet — c'est le corrigé qui circule. Mais retenez que la raison n'est pas la performance : c'est que Fabric sait construire les métadonnées manquantes. <b>D est constant dans les deux versions</b> ; c'est uniquement sur le format que les sources divergent.</p>`,
      en:`
      <p class="why">D — certain under every reading</p>
      <p>The goal is querying through the SQL endpoint, which sees only managed tables and shortcuts in the <code class="inl">Tables</code> section. A falls, D stands. This point never varies between the two keys.</p>
      <p class="why">B — the format, more arguable</p>
      <p>The reading that supports Parquet: <b>Fabric can generate Delta metadata for a Parquet folder shortcut placed in the Tables section</b>. The folder then appears as a table queryable in T-SQL, with no conversion on your part.</p>
      <p class="contested"><b>Beware the dump's justification.</b> The key justifies Parquet on <i>performance</i> grounds ("columnar, better than CSV"). Generally true, but not the criterion here: the real constraint is compatibility with the Tables section. It also claims Delta would not be the most efficient choice — which is inaccurate, since Delta <i>is</i> Parquet plus a <code class="inl">_delta_log</code>, never slower than bare Parquet. This kind of explanation is typical of auto-generated dumps: the conclusion may come from the official key, but the justification is reconstructed after the fact.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Answer</th><th>Logic</th></tr>
        <tr><td class="m">B — Parquet</td><td>Sufficient source format: Fabric handles the Delta conversion</td></tr>
        <tr><td class="m">E — Delta</td><td>Format strictly required by the Tables section</td></tr>
      </table></div>
      <p class="note"><b>How to decide on the day.</b> If the question pits Parquet against Delta with this exact wording, go with Parquet — that is the circulating key. But remember the reason is not performance: it is that Fabric can construct the missing metadata. <b>D is constant across both versions</b>; only the format is where sources diverge.</p>`}
  },
  {
    id:"q218", kind:"single", type:T1,
    title:{fr:"Convertir des CSV en delta depuis Lakehouse explorer",en:"Converting CSV files to delta from Lakehouse explorer"},
    stem:{fr:`<p>Vous avez un lakehouse nommé <b>Lakehouse1</b> avec un sous-dossier <b>Subfolder1</b> contenant des fichiers CSV. Vous devez <b>convertir</b> ces fichiers CSV au format delta avec l'<b>optimisation V-Order activée</b>.</p><p class="ask">Que devez-vous faire depuis Lakehouse explorer ?</p>`,
          en:`<p>You have a lakehouse named <b>Lakehouse1</b> with a subfolder named <b>Subfolder1</b> that contains CSV files. You need to <b>convert</b> the CSV files into the delta format that has <b>V-Order optimization enabled</b>.</p><p class="ask">What should you do from Lakehouse explorer?</p>`},
    options:[
      {k:"A", fr:"Utiliser la fonctionnalité <i>Load to Tables</i>.", en:"Use the <i>Load to Tables</i> feature."},
      {k:"B", fr:"Créer un nouveau raccourci dans la section Files.", en:"Create a new shortcut in the Files section."},
      {k:"C", fr:"Créer un nouveau raccourci dans la section Tables.", en:"Create a new shortcut in the Tables section."},
      {k:"D", fr:"Utiliser la fonctionnalité <i>Optimize</i>.", en:"Use the <i>Optimize</i> feature."}
    ],
    answer:["A"],
    explain:{fr:`
      <p>Le verbe qui décide est <b>convert</b>. Il ne s'agit pas de référencer des fichiers existants, mais de les <b>transformer</b> en tables delta. Un raccourci ne convertit rien — il pointe.</p>
      <p><i>Load to Tables</i> fait exactement cela : clic droit sur un dossier ou un fichier dans <code class="inl">Files/</code>, puis <i>Load to Tables → New table</i>. Fabric lit les CSV, les écrit en Delta dans <code class="inl">Tables/</code>, et applique V-Order par défaut.</p>
      <p class="why">Pourquoi V-Order est déjà couvert</p>
      <p>Le détail qui rend la question moins piégeuse qu'elle n'en a l'air : <b>V-Order est activé par défaut sur les écritures Delta dans Fabric</b>. C'est une optimisation de tri des données Parquet qui accélère la lecture par Direct Lake, Power BI et SQL. Load to Tables produit donc du delta V-Ordered en une seule opération.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>B et C — créer un raccourci.</b> Un raccourci est un pointeur, jamais une transformation : les fichiers resteraient en CSV. Et pour C spécifiquement, c'est doublement impossible — la section <code class="inl">Tables/</code> n'accepte que du delta.</li>
        <li><b>D — Optimize.</b> Le distracteur sérieux, parce que le mot <i>optimization</i> apparaît dans l'énoncé. Mais Optimize s'applique à une table delta <b>déjà existante</b> : il fusionne les petits fichiers et peut réappliquer V-Order. Or vous ne pouvez pas optimiser une table qui n'existe pas encore.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Le verbe de l'énoncé</th><th>L'opération</th></tr>
        <tr><td><i>convert, load, ingest</i></td><td><b>Load to Tables</b></td></tr>
        <tr><td><i>optimize, compact</i>, améliorer une table existante</td><td><b>Optimize</b></td></tr>
        <tr><td><i>reference, point to, access without copying</i></td><td><b>Shortcut</b></td></tr>
        <tr><td><i>clean up, remove old versions</i></td><td><b>Vacuum</b></td></tr>
      </table></div>
      <p class="note"><b>Test rapide.</b> Un raccourci ne transforme jamais les données. Dès qu'un énoncé emploie <i>convert</i>, <i>transform</i> ou <i>load</i>, toute option contenant le mot <i>shortcut</i> est éliminable immédiatement — ici, deux options sur quatre.</p>`,
      en:`
      <p>The deciding verb is <b>convert</b>. This is not about referencing existing files but about <b>transforming</b> them into delta tables. A shortcut converts nothing — it points.</p>
      <p><i>Load to Tables</i> does precisely that: right-click a folder or file in <code class="inl">Files/</code>, then <i>Load to Tables → New table</i>. Fabric reads the CSVs, writes them as Delta into <code class="inl">Tables/</code>, and applies V-Order by default.</p>
      <p class="why">Why V-Order is already covered</p>
      <p>The detail that makes this less of a trap than it looks: <b>V-Order is on by default for Delta writes in Fabric</b>. It is a sort optimisation of the Parquet data that speeds up reads by Direct Lake, Power BI and SQL. Load to Tables therefore produces V-Ordered delta in a single operation.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>B and C — create a shortcut.</b> A shortcut is a pointer, never a transformation: the files would stay CSV. And C specifically is doubly impossible — the <code class="inl">Tables/</code> section accepts delta only.</li>
        <li><b>D — Optimize.</b> The serious distractor, because the word <i>optimization</i> appears in the stem. But Optimize applies to an <b>already existing</b> delta table: it merges small files and can reapply V-Order. You cannot optimise a table that does not yet exist.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>The stem's verb</th><th>The operation</th></tr>
        <tr><td><i>convert, load, ingest</i></td><td><b>Load to Tables</b></td></tr>
        <tr><td><i>optimize, compact</i>, improve an existing table</td><td><b>Optimize</b></td></tr>
        <tr><td><i>reference, point to, access without copying</i></td><td><b>Shortcut</b></td></tr>
        <tr><td><i>clean up, remove old versions</i></td><td><b>Vacuum</b></td></tr>
      </table></div>
      <p class="note"><b>Quick test.</b> A shortcut never transforms data. Whenever a stem uses <i>convert</i>, <i>transform</i> or <i>load</i>, any option containing the word <i>shortcut</i> can be eliminated at once — here, two options out of four.</p>`}
  },
  {
    id:"q219", kind:"fields", type:TY,
    title:{fr:"Zero-copy clone dans un warehouse",en:"Zero-copy clone in a warehouse"},
    stem:{fr:`<p>Vous avez un warehouse nommé <b>Warehouse1</b> avec une table de faits <b>FactSales</b> de <b>un milliard de lignes</b>. Vous exécutez l'instruction suivante :</p>
    <pre class="code">CREATE TABLE test.FactSales AS CLONE OF dbo.FactSales;</pre>
    <p class="ask">Pour chacune des affirmations suivantes, indiquez si elle est vraie.</p>`,
          en:`<p>You have a Fabric warehouse named <b>Warehouse1</b> with a fact table named <b>FactSales</b> that has <b>one billion rows</b>. You run the following T-SQL statement:</p>
    <pre class="code">CREATE TABLE test.FactSales AS CLONE OF dbo.FactSales;</pre>
    <p class="ask">For each statement, select Yes if it is true. Otherwise, select No.</p>`},
    fields:[
      {label:{fr:"Une réplique de dbo.FactSales est créée dans le schéma test en copiant uniquement les métadonnées.",en:"A replica of dbo.FactSales is created in the test schema by copying the metadata only."}, hint:{fr:"metadata only",en:"metadata only"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0},
      {label:{fr:"Les modifications de données ultérieures sur dbo.FactSales s'appliqueront aussi à test.FactSales.",en:"Additional data changes to dbo.FactSales will also apply to test.FactSales."}, hint:{fr:"propagation des données",en:"data propagation"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1},
      {label:{fr:"Les modifications de schéma ultérieures sur dbo.FactSales s'appliqueront aussi à test.FactSales.",en:"Additional schema changes to dbo.FactSales will also apply to test.FactSales."}, hint:{fr:"propagation du schéma",en:"schema propagation"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1}
    ],
    explain:{fr:`
      <p>Cette syntaxe crée un <b>clone sans copie de données</b>. Malgré le milliard de lignes, l'opération est quasi instantanée et ne consomme presque aucun stockage : Fabric copie uniquement les <b>métadonnées</b> — la définition de la table et les pointeurs vers les fichiers Parquet sous-jacents. Les deux tables partagent physiquement les mêmes fichiers dans OneLake.</p>
      <p class="why">1 — metadata only : Yes</p>
      <p>C'est la définition exacte de l'opération. Aucune donnée n'est dupliquée au moment du clonage ; seule la structure de référencement l'est. C'est ce qui rend le clone si utile : créer un environnement de test sur un milliard de lignes en quelques secondes, sans doubler les coûts de stockage.</p>
      <p class="why">2 et 3 — la propagation : No</p>
      <p>Le point que la question teste vraiment, et l'intuition trompe. <b>Un clone est un snapshot indépendant, pas une vue ni un lien vivant.</b> Après sa création, les deux tables évoluent séparément.</p>
      <p>Le mécanisme sous-jacent est le <b>copy-on-write</b> : tant que rien n'est modifié, les fichiers Parquet restent partagés. Dès qu'une des deux tables change, de nouveaux fichiers sont écrits pour elle seule, et l'autre continue de pointer vers les fichiers d'origine.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Objet</th><th>Copie les données ?</th><th>Reflète les changements de la source ?</th></tr>
        <tr><td class="m">Clone</td><td>Non (métadonnées seules)</td><td><b>Non</b> — figé au moment du clonage</td></tr>
        <tr><td class="m">Shortcut</td><td>Non (pointeur)</td><td><b>Oui</b> — toujours à jour</td></tr>
        <tr><td class="m">Vue</td><td>Non (requête stockée)</td><td>Oui — recalculée à chaque appel</td></tr>
        <tr><td class="m">Table copiée par pipeline</td><td>Oui</td><td>Non</td></tr>
      </table></div>
      <p class="note"><b>Clone et shortcut se ressemblent</b> — aucun ne duplique les données — <b>mais leur comportement dans le temps est opposé.</b> Le shortcut suit la source ; le clone s'en détache immédiatement. Dans les énoncés, l'indépendance est la fonctionnalité recherchée : environnement de test sur données de production, point de restauration avant une transformation risquée, reporting figé à une date donnée.</p>`,
      en:`
      <p>This syntax creates a <b>zero-copy clone</b>. Despite the billion rows, the operation is near-instant and consumes almost no extra storage: Fabric copies only the <b>metadata</b> — the table definition and the pointers to the underlying Parquet files. Both tables physically share the same files in OneLake.</p>
      <p class="why">1 — metadata only: Yes</p>
      <p>That is the exact definition of the operation. No data is duplicated at clone time; only the referencing structure is. That is what makes clones so useful: spinning up a test environment over a billion rows in seconds, without doubling storage costs.</p>
      <p class="why">2 and 3 — propagation: No</p>
      <p>The point the question really tests, and intuition misleads. <b>A clone is an independent snapshot, not a view and not a live link.</b> After creation, the two tables evolve separately.</p>
      <p>The underlying mechanism is <b>copy-on-write</b>: while nothing changes, the Parquet files stay shared. As soon as either table changes, new files are written for it alone, and the other keeps pointing at the original files.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Object</th><th>Copies the data?</th><th>Reflects source changes?</th></tr>
        <tr><td class="m">Clone</td><td>No (metadata only)</td><td><b>No</b> — frozen at clone time</td></tr>
        <tr><td class="m">Shortcut</td><td>No (pointer)</td><td><b>Yes</b> — always current</td></tr>
        <tr><td class="m">View</td><td>No (stored query)</td><td>Yes — recomputed on each call</td></tr>
        <tr><td class="m">Table copied by pipeline</td><td>Yes</td><td>No</td></tr>
      </table></div>
      <p class="note"><b>Clone and shortcut look alike</b> — neither duplicates data — <b>but their behaviour over time is opposite.</b> The shortcut follows the source; the clone detaches immediately. In exam stems, that independence is the feature being sought: a test environment over production data, a restore point before a risky transformation, reporting frozen at a given date.</p>`}
  },
  {
    id:"q220", kind:"fields", contested:true, type:TY,
    title:{fr:"Écriture Spark partitionnée en Parquet",en:"Partitioned Spark write to Parquet"},
    stem:{fr:`<p>Vous utilisez un notebook Fabric pour enregistrer un grand DataFrame avec le code suivant :</p>
    <pre class="code">df.write.partitionBy("year", "month", "day")
  .mode("overwrite").parquet("Files/SalesOrder")</pre>
    <p class="ask">Pour chacune des affirmations suivantes, indiquez si elle est vraie.</p>`,
          en:`<p>You are using a Fabric notebook to save a large DataFrame with the following code:</p>
    <pre class="code">df.write.partitionBy("year", "month", "day")
  .mode("overwrite").parquet("Files/SalesOrder")</pre>
    <p class="ask">For each statement, select Yes if it is true. Otherwise, select No.</p>`},
    fields:[
      {label:{fr:"Le résultat formera une hiérarchie de dossiers pour chaque clé de partition.",en:"The results will form a hierarchy of folders for each partition key."}, hint:{fr:"hierarchy of folders",en:"hierarchy of folders"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0},
      {label:{fr:"Les partitions de fichiers résultantes peuvent être lues en parallèle sur plusieurs nœuds.",en:"The resulting file partitions can be read in parallel across multiple nodes."}, hint:{fr:"read in parallel",en:"read in parallel"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0},
      {label:{fr:"Les partitions de fichiers résultantes utiliseront la compression de fichier.",en:"The resulting file partitions will use file compression."}, hint:{fr:"file compression",en:"file compression"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1}
    ],
    explain:{fr:`
      <p class="why">1 — hiérarchie de dossiers : Yes</p>
      <p><code class="inl">partitionBy("year", "month", "day")</code> crée une arborescence physique, un niveau par clé, dans l'ordre déclaré :</p>
      <pre class="code">Files/SalesOrder/year=2024/month=01/day=15/part-00000-....snappy.parquet
Files/SalesOrder/year=2024/month=01/day=16/...
Files/SalesOrder/year=2025/...</pre>
      <p>Le nom du dossier encode <code class="inl">colonne=valeur</code>. Conséquence pratique : la colonne n'est plus stockée dans les fichiers, elle est déduite du chemin — ce qui économise de l'espace et permet le <b>partition pruning</b>.</p>
      <p class="why">2 — lecture en parallèle : Yes</p>
      <p>C'est la raison d'être du partitionnement dans Spark. Chaque fichier constitue une unité de travail indépendante, donc Spark distribue la lecture sur les nœuds disponibles.</p>
      <p class="why">3 — <i>file compression</i> : No</p>
      <p>Tout se joue sur un <b>mot</b>. L'affirmation dit <i>the resulting file partitions will use <b>file</b> compression</i> — une compression appliquée au <b>fichier entier</b>, comme un <code class="inl">.gz</code> ou un <code class="inl">.zip</code> qui enveloppe son contenu.</p>
      <p>Parquet ne fonctionne pas ainsi. Sa compression est <b>interne et colonnaire</b> : chaque <i>column chunk</i> est encodé et compressé séparément <b>à l'intérieur</b> du fichier, lequel reste un fichier binaire non enveloppé. Deux niveaux coexistent — l'encodage colonnaire (dictionnaire, run-length) et le codec snappy appliqué par-dessus — et <b>aucun des deux n'est une compression du fichier en tant que tel</b>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Si l'affirmation dit…</th><th>Réponse</th></tr>
        <tr><td>« les <b>données</b> seront compressées »</td><td><b>Yes</b> — snappy par défaut</td></tr>
        <tr><td>« le <b>fichier</b> utilisera la compression de fichier »</td><td><b>No</b> — la compression est interne au format</td></tr>
      </table></div>
      <p class="contested"><b>Question contestée — l'autre lecture.</b> Un corrigé répond <b>Yes</b> : en pratique Spark écrit bien des fichiers nommés <code class="inl">part-00000-xxx.snappy.parquet</code>, le codec est appliqué par défaut, et la documentation parle couramment de « fichiers compressés ». L'argument est solide sur le fond, mais il ignore l'adjectif <i>file</i>, qui est précisément ce que la question teste. <b>Retenez No</b> : c'est le corrigé le plus répandu, et le seul qui donne un sens à la présence du mot <i>file</i>. Si une variante demandait simplement « les données sont-elles compressées ? », la réponse redeviendrait Yes.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Élément du code</th><th>Ce qu'il détermine</th></tr>
        <tr><td class="m">.partitionBy(...)</td><td>La hiérarchie de dossiers et le parallélisme</td></tr>
        <tr><td class="m">.mode("overwrite")</td><td>Remplace le contenu existant</td></tr>
        <tr><td class="m">.parquet(...)</td><td>Le format — encodage colonnaire + codec snappy interne</td></tr>
        <tr><td class="m">"Files/..."</td><td>L'emplacement — donc <b>invisible pour le SQL endpoint</b></td></tr>
      </table></div>`,
      en:`
      <p class="why">1 — folder hierarchy: Yes</p>
      <p><code class="inl">partitionBy("year", "month", "day")</code> creates a physical tree, one level per key, in the order declared:</p>
      <pre class="code">Files/SalesOrder/year=2024/month=01/day=15/part-00000-....snappy.parquet
Files/SalesOrder/year=2024/month=01/day=16/...
Files/SalesOrder/year=2025/...</pre>
      <p>The folder name encodes <code class="inl">column=value</code>. Practical consequence: the column is no longer stored in the files, it is inferred from the path — which saves space and enables <b>partition pruning</b>.</p>
      <p class="why">2 — parallel reads: Yes</p>
      <p>That is the whole point of partitioning in Spark. Each file is an independent unit of work, so Spark distributes the read across available nodes.</p>
      <p class="why">3 — <i>file compression</i>: No</p>
      <p>Everything turns on one <b>word</b>. The statement says <i>the resulting file partitions will use <b>file</b> compression</i> — compression applied to the <b>whole file</b>, like a <code class="inl">.gz</code> or a <code class="inl">.zip</code> wrapping its contents.</p>
      <p>Parquet does not work that way. Its compression is <b>internal and columnar</b>: each column chunk is encoded and compressed separately <b>inside</b> the file, which itself remains an unwrapped binary file. Two levels coexist — the columnar encoding (dictionary, run-length) and the snappy codec applied on top — and <b>neither is compression of the file as such</b>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>If the statement says…</th><th>Answer</th></tr>
        <tr><td>"the <b>data</b> will be compressed"</td><td><b>Yes</b> — snappy by default</td></tr>
        <tr><td>"the <b>file</b> will use file compression"</td><td><b>No</b> — compression is internal to the format</td></tr>
      </table></div>
      <p class="contested"><b>Disputed question — the other reading.</b> One key answers <b>Yes</b>: in practice Spark does write files named <code class="inl">part-00000-xxx.snappy.parquet</code>, the codec is applied by default, and documentation routinely speaks of "compressed files". The argument is sound on substance, but it ignores the adjective <i>file</i>, which is precisely what the question tests. <b>Go with No</b>: it is the more widely circulated key, and the only one that gives the word <i>file</i> any purpose. Were a variant to ask simply "is the data compressed?", the answer would be Yes again.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Code element</th><th>What it determines</th></tr>
        <tr><td class="m">.partitionBy(...)</td><td>The folder hierarchy and parallelism</td></tr>
        <tr><td class="m">.mode("overwrite")</td><td>Replaces existing content</td></tr>
        <tr><td class="m">.parquet(...)</td><td>The format — columnar encoding + internal snappy codec</td></tr>
        <tr><td class="m">"Files/..."</td><td>The location — therefore <b>invisible to the SQL endpoint</b></td></tr>
      </table></div>`}
  },
  {
    id:"q221", kind:"fields", contested:true, type:TY,
    title:{fr:"Spark — lecture CSV, partitionBy et inferSchema",en:"Spark — CSV read, partitionBy and inferSchema"},
    stem:{fr:`<p>Vous prévoyez de lire un fichier <code class="inl">Sales_raw.csv</code> (<b>12 colonnes</b>) dans un lakehouse, de sélectionner des colonnes et d'enregistrer les données en table Delta. Vous avez le code suivant :</p>
    <pre class="code">(spark.read.format("csv").option("header", "true")
   .load("Files/sales_raw.csv")
   .select('SalesOrderNumber','OrderDate','CustomerName','UnitPrice')
   .withColumn("Year", year("OrderDate"))
   .write.partitionBy('Year').saveAsTable("sales"))</pre>
    <p class="ask">Pour chacune des affirmations suivantes, indiquez si elle est vraie.</p>`,
          en:`<p>You plan to read a CSV file named <code class="inl">Sales_raw.csv</code> (<b>12 columns</b>) in a lakehouse, select columns, and save the data as a Delta table. You have the following code:</p>
    <pre class="code">(spark.read.format("csv").option("header", "true")
   .load("Files/sales_raw.csv")
   .select('SalesOrderNumber','OrderDate','CustomerName','UnitPrice')
   .withColumn("Year", year("OrderDate"))
   .write.partitionBy('Year').saveAsTable("sales"))</pre>
    <p class="ask">For each statement, select Yes if it is true. Otherwise, select No.</p>`},
    fields:[
      {label:{fr:"Le moteur Spark ne lira que les quatre colonnes sélectionnées.",en:"The Spark engine will read only the four selected columns from Sales_raw.csv."}, hint:{fr:"column pruning",en:"column pruning"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0},
      {label:{fr:"Supprimer le partitionnement réduirait le temps d'exécution.",en:"Removing the partition will reduce the execution time of the query."}, hint:{fr:"coût de partitionBy",en:"cost of partitionBy"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1},
      {label:{fr:"Ajouter inferSchema='true' augmenterait le temps d'exécution.",en:"Adding inferSchema='true' to the options will increase the execution time."}, hint:{fr:"coût de l'inférence",en:"cost of inference"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0}
    ],
    explain:{fr:`
      <p class="why">1 — lecture des 4 colonnes seulement : Yes</p>
      <p>Le <code class="inl">.select()</code> intervient <i>après</i> le <code class="inl">.load()</code>, mais Spark <b>pousse la projection vers la source</b> : c'est le <b>column pruning</b>. Depuis Spark 2.4, <code class="inl">spark.sql.csv.parser.columnPruning.enabled</code> est activée par défaut — le parser CSV ne <b>matérialise</b> que les colonnes demandées par le plan d'exécution. Les huit autres sont ignorées au moment du parsing, sans être converties ni chargées en mémoire.</p>
      <p class="why">La nuance qui fait hésiter</p>
      <p>Il est tentant de répondre No en raisonnant : « CSV est un format ligne par ligne, donc il faut tout lire. » C'est vrai au niveau des <b>octets sur disque</b> — le fichier est bien parcouru en entier — mais pas au niveau de ce que le moteur <b>traite</b>. L'affirmation dit <i>the Spark engine will read only…</i> : dans le sens qui compte, celui du travail effectué par le moteur, c'est <b>Yes</b>.</p>
      <p>Le format reste déterminant pour la performance : sur du Parquet ou du Delta, les colonnes inutiles ne sont <b>même pas lues sur disque</b>, car chaque colonne est stockée séparément. Le pruning CSV évite le <b>parsing</b>, pas la lecture.</p>
      <p class="contested"><b>Question contestée — l'argument inverse.</b> Un corrigé répond <b>No</b>, au motif qu'un format orienté lignes oblige à faire transiter tous les octets : pour atteindre la quatrième colonne, il faut traverser les trois premières. C'est exact au niveau du disque, mais cela revient à lire <i>read</i> comme « lire des octets » plutôt que « traiter des colonnes » — et à nier une optimisation que Spark applique réellement. <b>Retenez Yes</b>, qui est le corrigé du recueil de référence et celui qui décrit le comportement effectif du moteur.</p>
      <p class="why">2 — supprimer la partition réduirait le temps : No</p>
      <p>Le point le plus contre-intuitif. On imagine spontanément que <code class="inl">partitionBy</code> impose une réorganisation coûteuse. Ce n'est pas le cas : <b>sur une écriture, chaque tâche Spark écrit simplement ses propres lignes dans les dossiers correspondants</b> — une même tâche peut alimenter plusieurs dossiers <code class="inl">Year=</code>. Aucune redistribution entre nœuds, donc <b>aucun shuffle</b>. Le coût se limite à la création de dossiers, ce qui est marginal.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Opération</th><th>Déclenche un shuffle ?</th></tr>
        <tr><td class="m">.write.partitionBy("col")</td><td><b>Non</b> — chaque tâche écrit dans les dossiers voulus</td></tr>
        <tr><td class="m">.repartition("col")</td><td>Oui — redistribution explicite entre nœuds</td></tr>
        <tr><td class="m">groupBy, join, distinct, orderBy</td><td>Oui</td></tr>
      </table></div>
      <p class="why">3 — inferSchema augmente le temps : Yes</p>
      <p>Sans <code class="inl">inferSchema</code>, Spark traite toutes les colonnes CSV comme du texte — aucun coût supplémentaire. Avec <code class="inl">inferSchema='true'</code>, Spark effectue une <b>passe de lecture supplémentaire</b> pour examiner les valeurs et déduire les types : le fichier est parcouru deux fois. Sur les gros fichiers, fournissez plutôt un schéma explicite via <code class="inl">.schema(StructType([...]))</code>.</p>
      <p class="note"><b>Trois principes Spark.</b> Le column pruning s'applique <b>aussi au CSV</b> — le parser ne matérialise que les colonnes du <code class="inl">select</code>, par défaut depuis Spark 2.4. <code class="inl">partitionBy</code> ne <b>shuffle pas</b> : coût marginal à l'écriture, gain réel à la lecture. Et <code class="inl">inferSchema</code> coûte une passe complète — toujours plus lent qu'un schéma explicite.<br><br>Ne confondez pas lecture des octets et traitement par le moteur : sur du CSV le fichier est parcouru en entier mais seules les colonnes utiles sont parsées ; sur du Parquet les colonnes inutiles ne sont même pas lues.</p>`,
      en:`
      <p class="why">1 — only the four columns are read: Yes</p>
      <p>The <code class="inl">.select()</code> comes <i>after</i> the <code class="inl">.load()</code>, but Spark <b>pushes the projection down to the source</b>: this is <b>column pruning</b>. Since Spark 2.4, <code class="inl">spark.sql.csv.parser.columnPruning.enabled</code> has been on by default — the CSV parser <b>materialises</b> only the columns the execution plan asks for. The other eight are skipped at parse time, never converted, never loaded into memory.</p>
      <p class="why">The nuance that makes people hesitate</p>
      <p>It is tempting to answer No, reasoning: "CSV is a row-by-row format, so everything must be read." True at the level of <b>bytes on disk</b> — the file is scanned in full — but not at the level of what the engine <b>processes</b>. The statement says <i>the Spark engine will read only…</i>: in the sense that matters, the work the engine actually does, it is <b>Yes</b>.</p>
      <p>The format still drives performance: on Parquet or Delta, unneeded columns are <b>not even read from disk</b>, because each column is stored separately. CSV pruning avoids the <b>parsing</b>, not the read.</p>
      <p class="contested"><b>Disputed question — the opposing argument.</b> One key answers <b>No</b>, on the grounds that a row-oriented format forces every byte through: to reach the fourth column you must cross the first three. That is accurate at the disk level, but it reads <i>read</i> as "read bytes" rather than "process columns" — and denies an optimisation Spark genuinely applies. <b>Go with Yes</b>, the reference collection's key and the one that describes the engine's actual behaviour.</p>
      <p class="why">2 — removing the partition would cut execution time: No</p>
      <p>The most counter-intuitive point. One instinctively imagines <code class="inl">partitionBy</code> forcing a costly reorganisation. It does not: <b>on a write, each Spark task simply writes its own rows into the matching folders</b> — one task can feed several <code class="inl">Year=</code> folders. No redistribution between nodes, so <b>no shuffle</b>. The cost is limited to creating extra folders, which is marginal.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Operation</th><th>Triggers a shuffle?</th></tr>
        <tr><td class="m">.write.partitionBy("col")</td><td><b>No</b> — each task writes into the folders it needs</td></tr>
        <tr><td class="m">.repartition("col")</td><td>Yes — explicit redistribution across nodes</td></tr>
        <tr><td class="m">groupBy, join, distinct, orderBy</td><td>Yes</td></tr>
      </table></div>
      <p class="why">3 — inferSchema increases the time: Yes</p>
      <p>Without <code class="inl">inferSchema</code>, Spark treats every CSV column as text — no extra cost. With <code class="inl">inferSchema='true'</code>, Spark makes an <b>additional read pass</b> to inspect values and deduce types: the file is scanned twice. On large files, supply an explicit schema via <code class="inl">.schema(StructType([...]))</code> instead.</p>
      <p class="note"><b>Three Spark principles.</b> Column pruning applies <b>to CSV too</b> — the parser materialises only the <code class="inl">select</code>'s columns, by default since Spark 2.4. <code class="inl">partitionBy</code> does <b>not shuffle</b>: marginal cost on write, real gain on read. And <code class="inl">inferSchema</code> costs a whole extra pass — always slower than an explicit schema.<br><br>Do not confuse reading bytes with engine processing: on CSV the file is scanned in full but only the needed columns are parsed; on Parquet the unneeded columns are not even read.</p>`}
  },
  {
    id:"q222", kind:"single", type:T1,
    title:{fr:"Power Query — unpivot vers des paires attribut-valeur",en:"Power Query — unpivot into attribute-value pairs"},
    stem:{fr:`<p>Vous avez un dataflow dont une requête retourne un <b>tableau croisé</b> : une colonne VendorID suivie d'<b>une colonne par date</b> (2015-01-01, 2015-01-02, …). Vous devez transformer les colonnes de données en <b>paires attribut-valeur</b>, où les colonnes deviennent des lignes. <b>Vous sélectionnez la colonne VendorID.</b></p><p class="ask">Quelle transformation devez-vous choisir dans le menu contextuel de la colonne VendorID ?</p>`,
          en:`<p>You have a dataflow whose query returns a <b>cross-tab</b>: a VendorID column followed by <b>one column per date</b> (2015-01-01, 2015-01-02, …). You need to transform the data columns into <b>attribute-value pairs</b>, where columns become rows. <b>You select the VendorID column.</b></p><p class="ask">Which transformation should you select from the context menu of the VendorID column?</p>`},
    options:[
      {k:"A", fr:"Group by", en:"Group by"},
      {k:"B", fr:"Unpivot columns", en:"Unpivot columns"},
      {k:"C", fr:"Unpivot other columns", en:"Unpivot other columns"},
      {k:"D", fr:"Split column", en:"Split column"},
      {k:"E", fr:"Remove other columns", en:"Remove other columns"}
    ],
    answer:["C"],
    explain:{fr:`
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Avant (croisé)</th><th>Après (déplié)</th></tr>
        <tr><td class="m">VendorID | 2015-01-01 | 2015-01-02<br>1 | 16 | 15<br>2 | 20 | 15</td><td class="m">VendorID | Attribute | Value<br>1 | 2015-01-01 | 16<br>1 | 2015-01-02 | 15<br>2 | 2015-01-01 | 20<br>2 | 2015-01-02 | 15</td></tr>
      </table></div>
      <p class="why">Pourquoi <i>other columns</i> et non <i>columns</i></p>
      <p>Tout l'enjeu tient à la colonne sélectionnée. L'énoncé précise : <b>vous sélectionnez VendorID</b>. Or VendorID est justement la colonne qu'il faut <b>conserver</b> — c'est l'identifiant qui doit rester en colonne, tandis que toutes les dates deviennent des lignes.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Commande</th><th>Effet sur la sélection</th></tr>
        <tr><td class="m">Unpivot columns</td><td>Déplie les colonnes <b>sélectionnées</b> → déplierait VendorID, l'inverse du but</td></tr>
        <tr><td class="m">Unpivot other columns</td><td>Déplie toutes <b>les autres</b> et conserve la sélection → exactement ce qu'on veut</td></tr>
      </table></div>
      <p class="why">L'avantage pratique de cette commande</p>
      <p>Raison supplémentaire : les colonnes de dates sont nombreuses et <b>évolutives</b>. Chaque nouvelle journée ajoutera une colonne. <i>Unpivot other columns</i> s'exprime en M par <code class="inl">Table.UnpivotOtherColumns</code>, qui liste les colonnes <b>à garder</b>, pas celles à déplier : la requête reste donc valide quand de nouvelles dates apparaissent. Avec <i>Unpivot columns</i>, chaque colonne dépliée est nommée explicitement, et l'ajout d'une date casserait la transformation.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — Group by.</b> Agrège des lignes. Elle réduit le nombre de lignes, elle ne transforme pas des colonnes en lignes.</li>
        <li><b>D — Split column.</b> Découpe le contenu d'une colonne en plusieurs. Va dans le sens opposé.</li>
        <li><b>E — Remove other columns.</b> Supprime les données non sélectionnées : vous perdriez toutes les valeurs de dates au lieu de les convertir.</li>
      </ul>
      <p class="note"><b>La règle qui décide entre les deux variantes.</b> Regardez ce qui est sélectionné. Sélection = les colonnes à déplier → <i>Unpivot columns</i>. Sélection = les colonnes à garder → <i>Unpivot other columns</i>. Dès qu'un identifiant est sélectionné et que les colonnes à déplier sont nombreuses ou variables, c'est toujours <i>other columns</i>.</p>`,
      en:`
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Before (cross-tab)</th><th>After (unpivoted)</th></tr>
        <tr><td class="m">VendorID | 2015-01-01 | 2015-01-02<br>1 | 16 | 15<br>2 | 20 | 15</td><td class="m">VendorID | Attribute | Value<br>1 | 2015-01-01 | 16<br>1 | 2015-01-02 | 15<br>2 | 2015-01-01 | 20<br>2 | 2015-01-02 | 15</td></tr>
      </table></div>
      <p class="why">Why <i>other columns</i> and not <i>columns</i></p>
      <p>Everything hinges on which column is selected. The stem states: <b>you select VendorID</b>. And VendorID is precisely the column to <b>keep</b> — it is the identifier that must stay as a column, while all the dates become rows.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Command</th><th>Effect on the selection</th></tr>
        <tr><td class="m">Unpivot columns</td><td>Unpivots the <b>selected</b> columns → would unpivot VendorID, the opposite of the goal</td></tr>
        <tr><td class="m">Unpivot other columns</td><td>Unpivots all <b>the others</b> and keeps the selection → exactly what is wanted</td></tr>
      </table></div>
      <p class="why">The practical advantage of that command</p>
      <p>A further reason: the date columns are numerous and <b>growing</b>. Every new day adds a column. <i>Unpivot other columns</i> is expressed in M as <code class="inl">Table.UnpivotOtherColumns</code>, which lists the columns <b>to keep</b>, not the ones to unpivot: the query therefore stays valid as new dates appear. With <i>Unpivot columns</i>, each unpivoted column is named explicitly, and adding a date would break the transformation.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — Group by.</b> Aggregates rows. It reduces the row count; it does not turn columns into rows.</li>
        <li><b>D — Split column.</b> Splits one column's contents into several. It goes the opposite way.</li>
        <li><b>E — Remove other columns.</b> Deletes the unselected data: you would lose all the date values instead of converting them.</li>
      </ul>
      <p class="note"><b>The rule that decides between the two variants.</b> Look at what is selected. Selection = the columns to unpivot → <i>Unpivot columns</i>. Selection = the columns to keep → <i>Unpivot other columns</i>. Whenever an identifier is selected and the columns to unpivot are numerous or variable, it is always <i>other columns</i>.</p>`}
  },
  {
    id:"q223", kind:"single", type:T1,
    title:{fr:"Planification d'un pipeline",en:"Scheduling a pipeline"},
    stem:{fr:`<p>Vous avez un pipeline de données. Vous devez garantir qu'il s'exécute <b>toutes les quatre heures, les lundis et vendredis</b>.</p><p class="ask">Sur quoi devez-vous régler <i>Repeat</i> dans la planification ?</p>`,
          en:`<p>You have a Fabric data pipeline. You need to ensure that the pipeline runs <b>every four hours on Mondays and Fridays</b>.</p><p class="ask">To what should you set <i>Repeat</i> for the schedule?</p>`},
    options:[{k:"A",fr:"Daily",en:"Daily"},{k:"B",fr:"By the minute",en:"By the minute"},{k:"C",fr:"Weekly",en:"Weekly"},{k:"D",fr:"Hourly",en:"Hourly"}],
    answer:["C"],
    explain:{fr:`
      <p>La contrainte forte de l'énoncé n'est pas <i>toutes les quatre heures</i> mais <b>les lundis et vendredis</b>. Or seule la fréquence <b>Weekly</b> permet de sélectionner des jours précis de la semaine.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Repeat</th><th>Options disponibles</th><th>Peut cibler des jours précis ?</th></tr>
        <tr><td class="m">By the minute</td><td>Intervalle en minutes</td><td>Non</td></tr>
        <tr><td class="m">Hourly</td><td>Intervalle en heures</td><td>Non</td></tr>
        <tr><td class="m">Daily</td><td>Heures d'exécution dans la journée</td><td>Non — tous les jours</td></tr>
        <tr><td class="m">Weekly</td><td>Jours de la semaine + heures d'exécution</td><td><b>Oui</b></td></tr>
      </table></div>
      <p>En choisissant Weekly, vous cochez Monday et Friday, puis indiquez les heures : 00:00, 04:00, 08:00, 12:00, 16:00, 20:00. Six exécutions, uniquement ces deux jours.</p>
      <p class="why">Pourquoi les autres échouent</p>
      <ul>
        <li><b>D — Hourly.</b> Le distracteur qui capte l'attention, parce que <i>every four hours</i> évoque immédiatement une fréquence horaire. Vous pourriez bien régler l'intervalle sur 4 heures — mais le pipeline s'exécuterait <b>tous les jours</b>.</li>
        <li><b>A — Daily.</b> Même problème, en pire : exécution quotidienne sans sélection de jours.</li>
        <li><b>B — By the minute.</b> Granularité inadaptée, et toujours aucune sélection de jours.</li>
      </ul>
      <p class="why">La logique à retenir</p>
      <p>Face à une contrainte de planification composite, identifiez la <b>contrainte la plus restrictive</b> — c'est elle qui détermine le type de récurrence. Contrainte de <b>jour</b> → Weekly (seule fréquence exposant les jours). Contrainte d'<b>heure</b> → se règle ensuite, dans les options de Weekly.</p>
      <p class="note"><b>Test rapide.</b> La question mentionne-t-elle un jour nommé ? Si oui, la réponse est Weekly, quelle que soit la fréquence horaire demandée. L'erreur classique consiste à choisir la fréquence qui correspond à l'<i>intervalle</i>, alors qu'il faut choisir celle qui correspond au <i>périmètre</i>.</p>`,
      en:`
      <p>The binding constraint is not <i>every four hours</i> but <b>on Mondays and Fridays</b>. And only the <b>Weekly</b> frequency lets you select specific days of the week.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Repeat</th><th>Options available</th><th>Can target specific days?</th></tr>
        <tr><td class="m">By the minute</td><td>Interval in minutes</td><td>No</td></tr>
        <tr><td class="m">Hourly</td><td>Interval in hours</td><td>No</td></tr>
        <tr><td class="m">Daily</td><td>Run times within the day</td><td>No — every day</td></tr>
        <tr><td class="m">Weekly</td><td>Days of the week + run times</td><td><b>Yes</b></td></tr>
      </table></div>
      <p>Choosing Weekly, you tick Monday and Friday, then set the times: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00. Six runs, on those two days only.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>D — Hourly.</b> The attention-grabbing distractor, because <i>every four hours</i> immediately suggests an hourly frequency. You could indeed set the interval to 4 hours — but the pipeline would run <b>every day</b>.</li>
        <li><b>A — Daily.</b> Same problem, worse: a daily run with no day selection.</li>
        <li><b>B — By the minute.</b> Unsuitable granularity, and still no day selection.</li>
      </ul>
      <p class="why">The logic to keep</p>
      <p>Faced with a composite scheduling constraint, identify the <b>most restrictive</b> one — that is what determines the recurrence type. A <b>day</b> constraint → Weekly (the only frequency that exposes days). An <b>hour</b> constraint → set afterwards, within Weekly's options.</p>
      <p class="note"><b>Quick test.</b> Does the question name a day? If so, the answer is Weekly, whatever hourly frequency is requested. The classic error is picking the frequency that matches the <i>interval</i>, when you must pick the one that matches the <i>perimeter</i>.</p>`}
  },
  {
    id:"q224", kind:"fields", type:TH,
    title:{fr:"Query folding dans un dataflow",en:"Query folding in a dataflow"},
    stem:{fr:`<p>Vous construisez un dataflow qui <b>combine des données de deux lakehouses</b>. Les étapes appliquées d'une des requêtes sont : <i>Source, Navigation 1, Capitalized each word, Appended query, Changed column type, Added custom, Filtered rows</i>. Dans le menu contextuel ouvert sur <b>Filtered rows</b>, les entrées <i>View data source query</i> et <i>View query plan</i> sont <b>grisées</b>.</p><p class="ask">Complétez les deux affirmations.</p>`,
          en:`<p>You are building a dataflow that <b>combines data from two lakehouses</b>. The applied steps of one query are: <i>Source, Navigation 1, Capitalized each word, Appended query, Changed column type, Added custom, Filtered rows</i>. In the context menu opened on <b>Filtered rows</b>, the entries <i>View data source query</i> and <i>View query plan</i> are <b>greyed out</b>.</p><p class="ask">Complete the two statements.</p>`},
    fields:[
      {label:{fr:"… des étapes de transformation de la requête se replieront (fold).",en:"… of the transformation steps in the query will fold."}, hint:{fr:"quelle proportion",en:"how many"},
       opts:{fr:["All","None","Some"],en:["All","None","Some"]}, ans:2},
      {label:{fr:"L'étape Added custom sera exécutée dans…",en:"The Added custom step will be performed in…"}, hint:{fr:"quel moteur",en:"which engine"},
       opts:{fr:["le moteur de requête de chaque lakehouse","le moteur Microsoft Power Query","le moteur de requête du lakehouse source"],en:["each lakehouse's query engine","the Microsoft Power Query engine","the source lakehouse query engine"]}, ans:1}
    ],
    explain:{fr:`
      <p>Le <b>query folding</b> est la capacité de Power Query à traduire vos étapes en une requête native exécutée <b>à la source</b> — du SQL envoyé au lakehouse plutôt qu'un traitement en local. Quand une étape se replie, la source fait le travail et ne renvoie que le résultat ; quand elle ne se replie pas, toutes les données transitent vers le moteur Power Query.</p>
      <p class="why">❶ Pourquoi Some</p>
      <ul>
        <li><b>Les icônes des étapes.</b> Dans le volet <i>Applied steps</i>, les étapes qui se replient portent un indicateur supplémentaire. Ici Source, Navigation 1, Capitalized each word et Appended query en ont un ; Added custom et Filtered rows n'ont qu'une icône d'engrenage.</li>
        <li><b>Le menu contextuel sur Filtered rows.</b> <i>View data source query</i> et <i>View query plan</i> sont <b>grisées</b>. C'est le signal le plus net : s'il n'existe aucune requête source à afficher, c'est que cette étape ne se replie pas.</li>
      </ul>
      <p>Donc ni All, ni None — <b>Some</b>.</p>
      <p class="why">❷ Pourquoi le moteur Power Query</p>
      <p><i>Added custom</i> crée une colonne personnalisée avec une expression M. Deux raisons pour lesquelles elle ne peut pas être repliée :</p>
      <ul>
        <li><b>Le repli est déjà rompu en amont.</b> L'étape <i>Appended query</i> combine des données provenant des <b>deux lakehouses</b>. Un moteur SQL ne peut pas générer une requête unique couvrant deux sources distinctes → le folding s'arrête là.</li>
        <li><b>Les expressions M personnalisées sont rarement traduisibles.</b> Beaucoup de fonctions M n'ont aucun équivalent SQL.</li>
      </ul>
      <p class="why">La règle du domino</p>
      <p>Le point à vraiment retenir : <b>une fois le folding rompu, il ne reprend jamais.</b> Toutes les étapes suivantes s'exécutent localement, même celles qui auraient été parfaitement repliables isolément.</p>
      <pre class="code">Source           → se replie
Navigation       → se replie
Capitalized      → se replie
Appended query   → ROMPT le folding (deux sources)
Added custom     → moteur Power Query
Filtered rows    → moteur Power Query</pre>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Se replie généralement</th><th>Rompt le folding</th></tr>
        <tr><td>Filtrer des lignes</td><td>Combiner deux sources différentes</td></tr>
        <tr><td>Sélectionner ou supprimer des colonnes</td><td>Colonnes personnalisées en M complexe</td></tr>
        <tr><td>Renommer, changer un type simple</td><td><code class="inl">Table.Buffer</code></td></tr>
        <tr><td>Regrouper, joindre (même source)</td><td>Fonctions sans équivalent SQL</td></tr>
        <tr><td>Trier</td><td>Ajouter une colonne d'index</td></tr>
      </table></div>
      <p class="note"><b>Réflexe de lecture d'exhibit.</b> Cherchez <i>View data source query</i> dans le menu contextuel. Entrée active → l'étape se replie ; entrée grisée → elle ne se replie pas. Bonne pratique induite : placer les étapes repliables le plus tôt possible et repousser les autres à la fin.</p>`,
      en:`
      <p><b>Query folding</b> is Power Query's ability to translate your steps into a native query executed <b>at the source</b> — SQL sent to the lakehouse rather than local processing. When a step folds, the source does the work and returns only the result; when it does not, all the data travels to the Power Query engine.</p>
      <p class="why">❶ Why Some</p>
      <ul>
        <li><b>The step icons.</b> In the <i>Applied steps</i> pane, folding steps carry an extra indicator. Here Source, Navigation 1, Capitalized each word and Appended query have one; Added custom and Filtered rows show only a gear icon.</li>
        <li><b>The context menu on Filtered rows.</b> <i>View data source query</i> and <i>View query plan</i> are <b>greyed out</b>. That is the clearest signal: if there is no source query to display, the step does not fold.</li>
      </ul>
      <p>So neither All nor None — <b>Some</b>.</p>
      <p class="why">❷ Why the Power Query engine</p>
      <p><i>Added custom</i> creates a custom column with an M expression. Two reasons it cannot fold:</p>
      <ul>
        <li><b>Folding is already broken upstream.</b> The <i>Appended query</i> step combines data from <b>both lakehouses</b>. A SQL engine cannot generate a single query spanning two distinct sources → folding stops there.</li>
        <li><b>Custom M expressions are rarely translatable.</b> Many M functions have no SQL equivalent.</li>
      </ul>
      <p class="why">The domino rule</p>
      <p>The point genuinely worth keeping: <b>once folding breaks, it never resumes.</b> Every subsequent step runs locally, even those that would have folded perfectly in isolation.</p>
      <pre class="code">Source           → folds
Navigation       → folds
Capitalized      → folds
Appended query   → BREAKS folding (two sources)
Added custom     → Power Query engine
Filtered rows    → Power Query engine</pre>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Usually folds</th><th>Breaks folding</th></tr>
        <tr><td>Filtering rows</td><td>Combining two different sources</td></tr>
        <tr><td>Selecting or removing columns</td><td>Custom columns with complex M</td></tr>
        <tr><td>Renaming, simple type changes</td><td><code class="inl">Table.Buffer</code></td></tr>
        <tr><td>Grouping, joining (same source)</td><td>Functions with no SQL equivalent</td></tr>
        <tr><td>Sorting</td><td>Adding an index column</td></tr>
      </table></div>
      <p class="note"><b>Exhibit-reading reflex.</b> Look for <i>View data source query</i> in the context menu. Entry active → the step folds; entry greyed out → it does not. The practice that follows: put foldable steps as early as possible and push the others to the end.</p>`}
  },
  {
    id:"q225", kind:"fields", type:TH,
    title:{fr:"Value.NativeQuery et EnableFolding",en:"Value.NativeQuery and EnableFolding"},
    stem:{fr:`<p>Vous créez un dataflow pour ingérer des données depuis une base Azure SQL <b>avec une instruction T-SQL</b>. Vous devez garantir que <b>les étapes Power Query repliables soient traitées par le moteur SQL Server</b>.</p>
    <pre class="code">let
    Source = Sql.Databases("server.database.windows.net"),
    Database = Source{[Name = "db"]}[Data],
    Query = ❶ . ❷ (
        Database,
        "SELECT * FROM customer WHERE country IN ('USA','UK')",
        null,
        [ ❸ = true] )
in Query</pre>
    <p class="ask">Comment devez-vous compléter le code ?</p>`,
          en:`<p>You are creating a dataflow in Fabric to ingest data from an Azure SQL database <b>by using a T-SQL statement</b>. You need to ensure that <b>any foldable Power Query transformation steps are processed by the SQL Server engine</b>.</p>
    <pre class="code">let
    Source = Sql.Databases("server.database.windows.net"),
    Database = Source{[Name = "db"]}[Data],
    Query = ❶ . ❷ (
        Database,
        "SELECT * FROM customer WHERE country IN ('USA','UK')",
        null,
        [ ❸ = true] )
in Query</pre>
    <p class="ask">How should you complete the code?</p>`},
    fields:[
      {label:{fr:"❶ Espace de noms",en:"❶ Namespace"}, hint:{fr:"préfixe de la fonction",en:"function prefix"},
       opts:{fr:["EnableFolding","NativeQuery","Optimize","Record","StopFolding","Table","Value"],en:["EnableFolding","NativeQuery","Optimize","Record","StopFolding","Table","Value"]}, ans:6},
      {label:{fr:"❷ Nom de la fonction",en:"❷ Function name"}, hint:{fr:"après le point",en:"after the dot"},
       opts:{fr:["EnableFolding","NativeQuery","Optimize","Record","StopFolding","Table","Value"],en:["EnableFolding","NativeQuery","Optimize","Record","StopFolding","Table","Value"]}, ans:1},
      {label:{fr:"❸ Option",en:"❸ Option"}, hint:{fr:"dans le record d'options",en:"in the options record"},
       opts:{fr:["EnableFolding","NativeQuery","Optimize","Record","StopFolding","Table","Value"],en:["EnableFolding","NativeQuery","Optimize","Record","StopFolding","Table","Value"]}, ans:0}
    ],
    explain:{fr:`
      <p class="why">La fonction : Value.NativeQuery</p>
      <p>C'est la fonction M qui exécute une requête SQL native contre une source. Sa signature comporte quatre arguments : <code class="inl">Value.NativeQuery(target, query, parameters, options)</code>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Argument</th><th>Ici</th></tr>
        <tr><td class="m">target</td><td><code class="inl">Database</code> — la connexion</td></tr>
        <tr><td class="m">query</td><td>la chaîne <code class="inl">"SELECT * FROM customer..."</code></td></tr>
        <tr><td class="m">parameters</td><td><code class="inl">null</code> — aucun paramètre</td></tr>
        <tr><td class="m">options</td><td><code class="inl">[EnableFolding = true]</code> — un record d'options</td></tr>
      </table></div>
      <p>La structure du code vous le dit : les deux premiers trous encadrent un point, et une parenthèse ouvrante suit.</p>
      <p class="why">❸ EnableFolding — le cœur de la question</p>
      <p>Par défaut, <code class="inl">Value.NativeQuery</code> <b>casse le query folding</b> : toute transformation ajoutée après cette étape s'exécute dans le moteur Power Query, en local. <code class="inl">EnableFolding = true</code> change ce comportement : Power Query enveloppe votre requête native dans une sous-requête SQL et pousse les transformations suivantes vers la source. Si vous ajoutez ensuite un filtre sur <code class="inl">city</code>, SQL Server reçoit :</p>
      <pre class="code">SELECT * FROM (
    SELECT * FROM customer WHERE country IN ('USA','UK')
) AS x WHERE city = 'London'</pre>
      <p>Au lieu de rapatrier toutes les lignes USA/UK puis de filtrer en local.</p>
      <p class="why">Pourquoi les autres valeurs tombent</p>
      <ul>
        <li><b>Optimize</b> et <b>StopFolding</b> n'existent pas comme fonctions M. <i>StopFolding</i> est le distracteur miroir : il évoque l'inverse de ce qu'on veut.</li>
        <li><b>Record.</b> et <b>Table.</b> existent comme espaces de noms (<code class="inl">Record.Field</code>, <code class="inl">Table.Profile</code>), mais aucune fonction <code class="inl">Record.NativeQuery</code> ni <code class="inl">Table.NativeQuery</code>.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Préfixe</th><th>Ce qu'il manipule</th><th>Exemples</th></tr>
        <tr><td class="m">Value.</td><td>Valeurs, requêtes natives</td><td class="m">Value.NativeQuery, Value.Type</td></tr>
        <tr><td class="m">Table.</td><td>Tables entières</td><td class="m">Table.Profile, Table.UnpivotOtherColumns</td></tr>
        <tr><td class="m">List.</td><td>Colonnes uniques, listes</td><td class="m">List.Max, List.Distinct</td></tr>
        <tr><td class="m">Sql.</td><td>Connexions SQL</td><td class="m">Sql.Database, Sql.Databases</td></tr>
      </table></div>
      <p class="note"><b>Le préfixe est déterminé par ce que la fonction manipule</b>, pas par ce qu'elle renvoie. Ici on manipule une valeur de requête, d'où <code class="inl">Value.</code></p>`,
      en:`
      <p class="why">The function: Value.NativeQuery</p>
      <p>This is the M function that runs a native SQL query against a source. Its signature has four arguments: <code class="inl">Value.NativeQuery(target, query, parameters, options)</code>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Argument</th><th>Here</th></tr>
        <tr><td class="m">target</td><td><code class="inl">Database</code> — the connection</td></tr>
        <tr><td class="m">query</td><td>the string <code class="inl">"SELECT * FROM customer..."</code></td></tr>
        <tr><td class="m">parameters</td><td><code class="inl">null</code> — no parameters</td></tr>
        <tr><td class="m">options</td><td><code class="inl">[EnableFolding = true]</code> — an options record</td></tr>
      </table></div>
      <p>The code's structure tells you: the first two blanks straddle a dot, with an opening parenthesis after.</p>
      <p class="why">❸ EnableFolding — the heart of the question</p>
      <p>By default, <code class="inl">Value.NativeQuery</code> <b>breaks query folding</b>: any transformation added after that step runs in the Power Query engine, locally. <code class="inl">EnableFolding = true</code> changes that: Power Query wraps your native query in a SQL subquery and pushes subsequent transformations to the source. If you then add a filter on <code class="inl">city</code>, SQL Server receives:</p>
      <pre class="code">SELECT * FROM (
    SELECT * FROM customer WHERE country IN ('USA','UK')
) AS x WHERE city = 'London'</pre>
      <p>Instead of pulling back every USA/UK row and filtering locally.</p>
      <p class="why">Why the other values fail</p>
      <ul>
        <li><b>Optimize</b> and <b>StopFolding</b> do not exist as M functions. <i>StopFolding</i> is the mirror distractor: it evokes the opposite of what is wanted.</li>
        <li><b>Record.</b> and <b>Table.</b> exist as namespaces (<code class="inl">Record.Field</code>, <code class="inl">Table.Profile</code>), but there is no <code class="inl">Record.NativeQuery</code> or <code class="inl">Table.NativeQuery</code>.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Prefix</th><th>What it manipulates</th><th>Examples</th></tr>
        <tr><td class="m">Value.</td><td>Values, native queries</td><td class="m">Value.NativeQuery, Value.Type</td></tr>
        <tr><td class="m">Table.</td><td>Whole tables</td><td class="m">Table.Profile, Table.UnpivotOtherColumns</td></tr>
        <tr><td class="m">List.</td><td>Single columns, lists</td><td class="m">List.Max, List.Distinct</td></tr>
        <tr><td class="m">Sql.</td><td>SQL connections</td><td class="m">Sql.Database, Sql.Databases</td></tr>
      </table></div>
      <p class="note"><b>The prefix is set by what the function manipulates</b>, not by what it returns. Here we manipulate a query value, hence <code class="inl">Value.</code></p>`}
  },
  {
    id:"q226", kind:"fields", type:TD,
    title:{fr:"Maintenance Delta — VACUUM et OPTIMIZE",en:"Delta maintenance — VACUUM and OPTIMIZE"},
    stem:{fr:`<p>Les relevés de 100 appareils IoT sont ajoutés à une table Delta. Chaque jeu de relevés pèse environ 25 Ko ; environ <b>10 Go de données sont reçus quotidiennement</b>. Tous les paramètres de table et de SparkSession sont par défaut. Les requêtes sont lentes, et le stockage contient des fichiers de données et de log <b>qui ne sont plus utilisés</b>.</p>
    <p>Vous devez <b>supprimer les fichiers qui ne sont plus utilisés</b> et <b>combiner les petits fichiers en fichiers plus gros, avec une taille cible de 1 Go par fichier</b>.</p>
    <p class="ask">Quelle action pour chaque cible ?</p>`,
          en:`<p>Readings from 100 IoT devices are appended to a Delta table. Each set of readings is approximately 25 KB; approximately <b>10 GB of data is received daily</b>. All the table and SparkSession settings are set to the default. Queries are slow to execute, and the lakehouse storage contains data and log files <b>that are no longer used</b>.</p>
    <p>You need to <b>remove the files that are no longer used</b> and <b>combine small files into larger files with a target size of 1 GB per file</b>.</p>
    <p class="ask">Which action for each target?</p>`},
    fields:[
      {label:{fr:"Remove the files",en:"Remove the files"}, hint:{fr:"supprimer les fichiers obsolètes",en:"delete obsolete files"},
       opts:{fr:["Set the autoCompact table setting","Set the optimizeWrite table setting","Run the VACUUM command on a schedule","Set the autoCompact SparkSession setting","Run the OPTIMIZE command on a schedule","Set the parallelDelete SparkSession setting"],en:["Set the autoCompact table setting","Set the optimizeWrite table setting","Run the VACUUM command on a schedule","Set the autoCompact SparkSession setting","Run the OPTIMIZE command on a schedule","Set the parallelDelete SparkSession setting"]}, ans:2},
      {label:{fr:"Combine the files",en:"Combine the files"}, hint:{fr:"fusionner les petits fichiers",en:"merge small files"},
       opts:{fr:["Set the autoCompact table setting","Set the optimizeWrite table setting","Run the VACUUM command on a schedule","Set the autoCompact SparkSession setting","Run the OPTIMIZE command on a schedule","Set the parallelDelete SparkSession setting"],en:["Set the autoCompact table setting","Set the optimizeWrite table setting","Run the VACUUM command on a schedule","Set the autoCompact SparkSession setting","Run the OPTIMIZE command on a schedule","Set the parallelDelete SparkSession setting"]}, ans:4}
    ],
    explain:{fr:`
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Commande</th><th>Ce qu'elle fait</th></tr>
        <tr><td class="m">VACUUM</td><td>Supprime physiquement les fichiers de données et de log <b>plus référencés par aucune version active</b></td></tr>
        <tr><td class="m">OPTIMIZE</td><td>Fusionne les nombreux petits fichiers en fichiers plus gros (<b>compaction</b>)</td></tr>
      </table></div>
      <p>Le mapping avec l'énoncé est direct : <i>remove the files that are no longer used</i> → VACUUM ; <i>combine small files into larger files</i> → OPTIMIZE. Le vocabulaire de la question reprend littéralement la fonction de chaque commande.</p>
      <p class="why">Pourquoi VACUUM</p>
      <p>Quand vous écrivez dans une table Delta, les anciennes versions des fichiers sont conservées pour permettre le <i>time travel</i>. Ces fichiers restent sur le disque même après un UPDATE ou un DELETE. VACUUM les supprime définitivement, au-delà d'une période de rétention (7 jours par défaut) :</p>
      <pre class="code">VACUUM Lakehouse1.ma_table RETAIN 168 HOURS;</pre>
      <p>Aucun réglage de table ou de session ne fait cela — c'est nécessairement une commande exécutée périodiquement, d'où le <i>on a schedule</i>.</p>
      <p class="why">Pourquoi OPTIMIZE et pas les réglages automatiques</p>
      <p>C'est ici que se joue la partie intéressante. Trois options concurrentes proposent des réglages :</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>Pourquoi elle ne suffit pas</th></tr>
        <tr><td class="m">autoCompact</td><td>Fusionne les petits fichiers après chaque écriture, mais avec une <b>taille cible d'environ 128 Mo</b>. L'énoncé demande 1 Go.</td></tr>
        <tr><td class="m">optimizeWrite</td><td>Agit pendant l'écriture en réduisant le nombre de fichiers produits. Elle limite le problème à la source mais <b>ne réorganise pas les fichiers déjà écrits</b>, et sa cible est aussi autour de 128 Mo.</td></tr>
        <tr><td class="m">parallelDelete</td><td>Paramètre auxiliaire qui accélère la suppression parallèle lors d'un VACUUM. Pas une action de maintenance en soi.</td></tr>
      </table></div>
      <p><b>Le mot qui tranche est « 1 GB ».</b> Sans cette précision, autoCompact serait défendable. Avec elle, seul OPTIMIZE fonctionne, car sa taille de fichier cible est configurable — un détail chiffré de l'énoncé qui élimine trois options d'un coup.</p>
      <p class="note"><b>L'ordre logique dans le temps :</b> on charge, puis on compacte régulièrement, puis on nettoie. OPTIMIZE crée d'ailleurs de nouveaux fichiers en laissant les anciens en place — c'est justement VACUUM qui les élimine ensuite. Les deux commandes se complètent, elles ne se remplacent pas.</p>`,
      en:`
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Command</th><th>What it does</th></tr>
        <tr><td class="m">VACUUM</td><td>Physically deletes data and log files <b>no longer referenced by any active version</b></td></tr>
        <tr><td class="m">OPTIMIZE</td><td>Merges many small files into larger ones (<b>compaction</b>)</td></tr>
      </table></div>
      <p>The mapping to the stem is direct: <i>remove the files that are no longer used</i> → VACUUM; <i>combine small files into larger files</i> → OPTIMIZE. The question's vocabulary restates each command's function literally.</p>
      <p class="why">Why VACUUM</p>
      <p>When you write to a Delta table, old file versions are retained to allow <i>time travel</i>. Those files remain on disk even after an UPDATE or DELETE. VACUUM removes them permanently, beyond a retention period (7 days by default):</p>
      <pre class="code">VACUUM Lakehouse1.my_table RETAIN 168 HOURS;</pre>
      <p>No table or session setting does this — it necessarily is a command run periodically, hence <i>on a schedule</i>.</p>
      <p class="why">Why OPTIMIZE and not the automatic settings</p>
      <p>This is where the interesting part lies. Three competing options offer settings:</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>Why it is not enough</th></tr>
        <tr><td class="m">autoCompact</td><td>Merges small files after each write, but with a <b>target size of roughly 128 MB</b>. The stem asks for 1 GB.</td></tr>
        <tr><td class="m">optimizeWrite</td><td>Acts during the write by reducing the number of files produced. It limits the problem at source but <b>does not reorganise already-written files</b>, and its target is also around 128 MB.</td></tr>
        <tr><td class="m">parallelDelete</td><td>An auxiliary setting that speeds up parallel deletion during a VACUUM. Not a maintenance action in itself.</td></tr>
      </table></div>
      <p><b>The deciding words are "1 GB".</b> Without that detail, autoCompact would be defensible. With it, only OPTIMIZE works, because its target file size is configurable — a numeric detail in the stem that eliminates three options at once.</p>
      <p class="note"><b>The logical order over time:</b> you load, then compact regularly, then clean up. OPTIMIZE in fact creates new files while leaving the old ones in place — and it is VACUUM that removes those afterwards. The two commands complement each other; they do not replace each other.</p>`}
  },
  {
    id:"q227", kind:"multi", type:TM,
    title:{fr:"Authentification d'un raccourci vers S3",en:"Authenticating a shortcut to S3"},
    stem:{fr:`<p>Vous avez un abonnement AWS contenant un bucket Amazon S3 nommé <b>bucket1</b>, et un locataire Fabric contenant un lakehouse <b>LH1</b>. Dans LH1, vous prévoyez de créer un <b>raccourci OneLake vers bucket1</b>. Vous devez configurer l'authentification de la connexion.</p><p class="ask">Quelles <b>deux</b> valeurs devez-vous fournir ?</p>`,
          en:`<p>You have an AWS subscription that contains an Amazon S3 bucket named <b>bucket1</b>, and a Fabric tenant that contains a lakehouse named <b>LH1</b>. In LH1, you plan to create a <b>OneLake shortcut to bucket1</b>. You need to configure authentication for the connection.</p><p class="ask">Which <b>two</b> values should you provide?</p>`},
    options:[
      {k:"A", fr:"le jeton de signature d'accès partagé (SAS)", en:"the shared access signature (SAS) token"},
      {k:"B", fr:"la secret access key", en:"the secret access key"},
      {k:"C", fr:"l'access ID", en:"the access ID"},
      {k:"D", fr:"l'access key ID", en:"the access key ID"},
      {k:"E", fr:"l'empreinte de certificat (certificate thumbprint)", en:"the certificate thumbprint"}
    ],
    answer:["B","D"],
    explain:{fr:`
      <p>Lors de la création d'un raccourci OneLake vers Amazon S3, Fabric demande l'URL du bucket puis une connexion authentifiée par la <b>paire d'identifiants IAM standard d'AWS</b> : l'<b>access key ID</b> (format <code class="inl">AKIA…</code>, équivalent d'un nom d'utilisateur) et la <b>secret access key</b> (le secret associé, visible une seule fois à la création).</p>
      <p>Ces valeurs se génèrent dans la console AWS IAM. Le principe de moindre privilège impose de limiter l'utilisateur IAM à <code class="inl">s3:GetObject</code> et <code class="inl">s3:ListBucket</code> sur le bucket concerné.</p>
      <p class="why">Le vrai piège de la question</p>
      <p>La distinction entre <b>« access ID »</b> (option C, incorrecte) et <b>« access key ID »</b> (option D, correcte). <b>AWS ne nomme jamais cet élément « access ID »</b> : la dénomination officielle est <i>access key ID</i>. C'est un distracteur conçu pour vérifier la connaissance exacte du vocabulaire AWS, pas la compréhension du mécanisme.</p>
      <p class="why">Les deux autres</p>
      <ul>
        <li><b>A — SAS token.</b> Mécanisme propre à <b>Azure Storage</b> : un jeton d'accès délégué à durée limitée. Sans équivalent dans l'authentification S3 telle que Fabric la consomme.</li>
        <li><b>E — Certificate thumbprint.</b> Empreinte X.509 utilisée pour l'authentification par certificat dans Entra ID ou TLS. Sans rapport avec les clés d'accès S3.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> Raccourci S3 = access key ID + secret access key. SAS = Azure. Et sur les questions de vocabulaire produit, lisez les options <b>au mot près</b> : un seul terme manquant suffit à invalider une option.</p>`,
      en:`
      <p>When creating a OneLake shortcut to Amazon S3, Fabric asks for the bucket URL then a connection authenticated with <b>AWS's standard IAM credential pair</b>: the <b>access key ID</b> (format <code class="inl">AKIA…</code>, the equivalent of a username) and the <b>secret access key</b> (the matching secret, shown only once at creation).</p>
      <p>These values are generated in the AWS IAM console. Least privilege calls for restricting the IAM user to <code class="inl">s3:GetObject</code> and <code class="inl">s3:ListBucket</code> on the bucket concerned.</p>
      <p class="why">The question's real trap</p>
      <p>The distinction between <b>"access ID"</b> (option C, incorrect) and <b>"access key ID"</b> (option D, correct). <b>AWS never names this element "access ID"</b>: the official term is <i>access key ID</i>. This distractor tests exact knowledge of AWS vocabulary, not understanding of the mechanism.</p>
      <p class="why">The other two</p>
      <ul>
        <li><b>A — SAS token.</b> A mechanism specific to <b>Azure Storage</b>: a time-limited delegated access token. It has no equivalent in S3 authentication as Fabric consumes it.</li>
        <li><b>E — Certificate thumbprint.</b> An X.509 fingerprint used for certificate authentication in Entra ID or TLS. Unrelated to S3 access keys.</li>
      </ul>
      <p class="note"><b>The reflex.</b> S3 shortcut = access key ID + secret access key. SAS = Azure. And on product-vocabulary questions, read the options <b>word for word</b>: one missing term is enough to invalidate an option.</p>`}
  },
  {
    id:"q228", kind:"single", type:T1,
    title:{fr:"Ajouter des données avec un effort minimal",en:"Adding data with minimal effort"},
    stem:{fr:`<p>Vous avez un locataire Fabric contenant un lakehouse nommé <b>Lakehouse1</b>. Vous devez <b>ajouter des données</b> à Lakehouse1 depuis un fichier CSV situé dans un compte de stockage Azure <b>extérieur à Fabric</b>. La solution doit <b>minimiser l'effort de développement</b>.</p><p class="ask">Qu'utiliserez-vous pour ajouter les données ?</p>`,
          en:`<p>You have a Fabric tenant named Tenant1 that contains a lakehouse named <b>Lakehouse1</b>. You need to <b>add data</b> to Lakehouse1 from a CSV file in an Azure storage account <b>outside Fabric</b>. The solution must <b>minimize development effort</b>.</p><p class="ask">What should you use to add the data?</p>`},
    options:[
      {k:"A", fr:"copy job", en:"copy job"},
      {k:"B", fr:"shortcut", en:"shortcut"},
      {k:"C", fr:"pipeline", en:"pipeline"},
      {k:"D", fr:"Dataflow Gen2", en:"Dataflow Gen2"}
    ],
    answer:["A"],
    explain:{fr:`
      <p>Le <b>Copy job</b> est une fonctionnalité de Fabric Data Factory conçue précisément pour ce cas : déplacer des données d'une source vers une destination <b>via un assistant guidé</b>, sans construire de pipeline ni écrire de transformations. L'expérience se limite à quelques écrans — choix de la source, sélection du fichier CSV, choix de la destination, puis mode de copie (complète ou incrémentielle).</p>
      <p class="why">B — le point important de cette question</p>
      <p><b>Un raccourci ne copie rien.</b> Il crée une <b>référence virtuelle</b>, les données restant physiquement dans le compte source — alors que l'énoncé demande d'<b>ajouter les données</b>. Deux limites s'y ajoutent : dans la section <code class="inl">Tables</code>, un raccourci exige le format Delta (un CSV n'y serait pas reconnu) ; dans <code class="inl">Files</code>, le CSV resterait un fichier brut non interrogeable en SQL.</p>
