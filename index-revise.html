      <p><b>Le raccourci redevient la bonne réponse</b> dès que l'énoncé insiste sur « minimiser la duplication » ou « accéder sans copier ». Tout se joue sur ce verbe.</p>
      <p class="why">Les deux options qui ne sont pas fausses, mais perdantes</p>
      <ul>
        <li><b>C — Pipeline.</b> Fonctionnerait techniquement (activité Copy data), mais exige de créer le pipeline, configurer connexions et datasets, puis publier.</li>
        <li><b>D — Dataflow Gen2.</b> Conçu pour la <b>transformation</b> via Power Query : utilisable, mais surdimensionné pour une simple copie.</li>
      </ul>
      <p>Ces deux options ne sont pas incapables — elles <b>perdent sur le critère explicite</b> de l'énoncé.</p>
      <p class="note"><b>Le couple à retenir.</b> « Ajouter des données + effort minimal » = <b>Copy job</b>. « Accéder sans copier » = <b>shortcut</b>. Le verbe de l'énoncé tranche à lui seul.</p>`,
      en:`
      <p>The <b>Copy job</b> is a Fabric Data Factory feature designed for exactly this case: moving data from a source to a destination <b>through a guided wizard</b>, without building a pipeline or writing transformations. The experience is a handful of screens — pick the source, select the CSV file, pick the destination, then the copy mode (full or incremental).</p>
      <p class="why">B — the important point in this question</p>
      <p><b>A shortcut copies nothing.</b> It creates a <b>virtual reference</b>, with the data staying physically in the source account — whereas the stem asks to <b>add the data</b>. Two further limits: in the <code class="inl">Tables</code> section a shortcut requires Delta format (a CSV would not be recognised); in <code class="inl">Files</code>, the CSV would remain a raw file not queryable in SQL.</p>
      <p><b>The shortcut becomes the right answer again</b> the moment a stem stresses "minimize duplication" or "access without copying". Everything turns on that verb.</p>
      <p class="why">The two options that are not wrong, merely losing</p>
      <ul>
        <li><b>C — Pipeline.</b> Would work technically (Copy data activity), but requires creating the pipeline, configuring connections and datasets, then publishing.</li>
        <li><b>D — Dataflow Gen2.</b> Built for <b>transformation</b> through Power Query: usable, but oversized for a plain copy.</li>
      </ul>
      <p>Neither is incapable — both <b>lose on the stem's explicit criterion</b>.</p>
      <p class="note"><b>The pair to remember.</b> "Add data + minimal effort" = <b>Copy job</b>. "Access without copying" = <b>shortcut</b>. The stem's verb decides it on its own.</p>`}
  },
  {
    id:"q229", kind:"fields", type:TH,
    title:{fr:"Changer le type d'une colonne Spark",en:"Changing a Spark column's data type"},
    stem:{fr:`<p>Vous avez un DataFrame Spark assigné à une variable <code class="inl">df</code>, retournant <b>quatre colonnes</b>. Vous devez changer le type d'une colonne string nommée <code class="inl">Age</code> en <b>integer</b>. La solution doit retourner un DataFrame qui <b>inclut toutes les colonnes</b>.</p>
    <pre class="code">df. ❶ ("age",  ❷ ("age"). ❸ ("int")).show()</pre>
    <p class="ask">Comment devez-vous compléter le code ?</p>`,
          en:`<p>You have a Spark DataFrame assigned to a variable named <code class="inl">df</code>, returning <b>four columns</b>. You need to change the data type of a string column named <code class="inl">Age</code> to <b>integer</b>. The solution must return a DataFrame that <b>includes all the columns</b>.</p>
    <pre class="code">df. ❶ ("age",  ❷ ("age"). ❸ ("int")).show()</pre>
    <p class="ask">How should you complete the code?</p>`},
    fields:[
      {label:{fr:"❶ Méthode du DataFrame",en:"❶ DataFrame method"}, hint:{fr:"df.___",en:"df.___"},
       opts:{fr:["cast","col","get","select","selectExpr","transform","withColumn"],en:["cast","col","get","select","selectExpr","transform","withColumn"]}, ans:6},
      {label:{fr:"❷ Référence à la colonne",en:"❷ Column reference"}, hint:{fr:"___(\"age\")",en:"___(\"age\")"},
       opts:{fr:["cast","col","get","select","selectExpr","transform","withColumn"],en:["cast","col","get","select","selectExpr","transform","withColumn"]}, ans:1},
      {label:{fr:"❸ Conversion",en:"❸ Conversion"}, hint:{fr:".___(\"int\")",en:".___(\"int\")"},
       opts:{fr:["cast","col","get","select","selectExpr","transform","withColumn"],en:["cast","col","get","select","selectExpr","transform","withColumn"]}, ans:0}
    ],
    explain:{fr:`
      <pre class="code">df.withColumn("age", col("age").cast("int")).show()</pre>
      <p><code class="inl">withColumn(colName, col)</code> <b>ajoute une nouvelle colonne ou remplace une colonne existante</b> portant le même nom, tout en préservant l'ensemble des autres colonnes — c'est exactement l'exigence « includes all the columns ».</p>
      <p><code class="inl">col("age")</code> crée une <b>référence</b> à la colonne, sur laquelle on peut chaîner des opérations, et <code class="inl">.cast("int")</code> convertit son type de string vers integer.</p>
      <p class="why">Pourquoi les autres valeurs tombent</p>
      <ul>
        <li><b>select</b> ne retournerait que les colonnes explicitement listées : <code class="inl">df.select(col("age").cast("int"))</code> perdrait les trois autres — l'exigence est violée.</li>
        <li><b>selectExpr</b> a le même problème de projection, et attend des expressions SQL sous forme de chaîne (<code class="inl">"CAST(age AS INT) AS age"</code>), incompatible avec la syntaxe imposée par le code.</li>
        <li><b>get</b> n'existe pas comme méthode de DataFrame pour cet usage.</li>
        <li><b>transform</b> applique une fonction personnalisée au DataFrame entier, pas à une colonne.</li>
      </ul>
      <p class="note"><b>Variante équivalente en pratique :</b> <code class="inl">df.withColumn("age", df["age"].cast("int"))</code>. Et le couple à retenir : <code class="inl">withColumn</code> = modifier ou ajouter <b>en gardant tout le reste</b> ; <code class="inl">select</code> = projeter <b>uniquement ce qui est listé</b>.</p>`,
      en:`
      <pre class="code">df.withColumn("age", col("age").cast("int")).show()</pre>
      <p><code class="inl">withColumn(colName, col)</code> <b>adds a new column or replaces an existing one</b> of the same name, while preserving every other column — exactly the "includes all the columns" requirement.</p>
      <p><code class="inl">col("age")</code> creates a <b>reference</b> to the column, on which operations can be chained, and <code class="inl">.cast("int")</code> converts its type from string to integer.</p>
      <p class="why">Why the other values fail</p>
      <ul>
        <li><b>select</b> would return only the columns explicitly listed: <code class="inl">df.select(col("age").cast("int"))</code> would lose the other three — the requirement is violated.</li>
        <li><b>selectExpr</b> has the same projection problem, and expects SQL expressions as strings (<code class="inl">"CAST(age AS INT) AS age"</code>), incompatible with the syntax the code imposes.</li>
        <li><b>get</b> does not exist as a DataFrame method for this purpose.</li>
        <li><b>transform</b> applies a custom function to the whole DataFrame, not to a column.</li>
      </ul>
      <p class="note"><b>Equivalent variant in practice:</b> <code class="inl">df.withColumn("age", df["age"].cast("int"))</code>. And the pair to remember: <code class="inl">withColumn</code> = modify or add <b>while keeping everything else</b>; <code class="inl">select</code> = project <b>only what is listed</b>.</p>`}
  },
  {
    id:"q230", kind:"fields", type:TH,
    title:{fr:"Ajouter des données comportant deux colonnes supplémentaires",en:"Appending data with two extra columns"},
    stem:{fr:`<p>Lakehouse1 contient une <b>table Delta à huit colonnes</b>. Vous recevez de nouvelles données contenant les huit mêmes colonnes <b>plus deux colonnes supplémentaires</b>, dans un DataFrame <code class="inl">df</code>. Vous devez ajouter ces données à la table Delta en <b>conservant toutes les lignes existantes</b> et en garantissant que <b>toutes les nouvelles données sont ajoutées</b>.</p>
    <pre class="code">df.write.format("delta").mode( ❶ ) \\
    .option( ❷ ) \\
    .saveAsTable("table")</pre>
    <p class="ask">Comment devez-vous compléter le code ?</p>`,
          en:`<p>Lakehouse1 contains a <b>Delta table with eight columns</b>. You receive new data that contains the same eight columns <b>plus two additional columns</b>, in a DataFrame named <code class="inl">df</code>. You need to add the new data to the Delta table while <b>keeping all existing rows</b> and ensuring that <b>all new data is added</b>.</p>
    <pre class="code">df.write.format("delta").mode( ❶ ) \\
    .option( ❷ ) \\
    .saveAsTable("table")</pre>
    <p class="ask">How should you complete the code?</p>`},
    fields:[
      {label:{fr:"❶ mode",en:"❶ mode"}, hint:{fr:"comment écrire",en:"how to write"},
       opts:{fr:['("append")','("error")','("errorifexists")','("ignore")','("overwrite")'],en:['("append")','("error")','("errorifexists")','("ignore")','("overwrite")']}, ans:0},
      {label:{fr:"❷ option",en:"❷ option"}, hint:{fr:"gestion du schéma",en:"schema handling"},
       opts:{fr:['("mergeSchema","false")','("mergeSchema","true")','("overwriteSchema","false")','("overwriteSchema","true")'],en:['("mergeSchema","false")','("mergeSchema","true")','("overwriteSchema","false")','("overwriteSchema","true")']}, ans:1}
    ],
    explain:{fr:`
      <p><code class="inl">mode("append")</code> ajoute les nouvelles lignes à la suite des lignes existantes, <b>sans toucher aux données déjà présentes</b> : c'est le seul mode qui satisfait la première exigence.</p>
      <p><code class="inl">option("mergeSchema", "true")</code> active <b>l'évolution de schéma</b> de Delta Lake. Par défaut, Delta applique un contrôle strict (<i>schema enforcement</i>) : une écriture comportant des colonnes inconnues <b>échoue</b>. Avec l'option activée, Delta ajoute automatiquement les deux nouvelles colonnes à la définition de la table ; les lignes historiques reçoivent <code class="inl">NULL</code> pour ces colonnes.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option écartée</th><th>Problème</th></tr>
        <tr><td class="m">mode("overwrite")</td><td>Supprime les lignes existantes → viole la 1<sup>re</sup> exigence</td></tr>
        <tr><td class="m">mode("error") / ("errorifexists")</td><td>Lève une exception si la table existe → rien n'est écrit</td></tr>
        <tr><td class="m">mode("ignore")</td><td>Ne fait rien si la table existe → aucune donnée ajoutée</td></tr>
        <tr><td class="m">("mergeSchema","false")</td><td>L'écriture échoue à cause des colonnes supplémentaires</td></tr>
        <tr><td class="m">("overwriteSchema", …)</td><td>Ne fonctionne qu'avec <code class="inl">mode("overwrite")</code> : remplace schéma <b>et</b> données</td></tr>
      </table></div>
      <p class="note"><b>La formule.</b> <code class="inl">append</code> + <code class="inl">mergeSchema=true</code> = ajouter des lignes avec de nouvelles colonnes. Et la paire à ne pas confondre : <code class="inl">mergeSchema</code> <b>fusionne</b> (append), <code class="inl">overwriteSchema</code> <b>remplace</b> (overwrite).</p>`,
      en:`
      <p><code class="inl">mode("append")</code> adds the new rows after the existing ones, <b>without touching the data already there</b>: the only mode that satisfies the first requirement.</p>
      <p><code class="inl">option("mergeSchema", "true")</code> enables Delta Lake's <b>schema evolution</b>. By default Delta applies strict <i>schema enforcement</i>: a write containing unknown columns <b>fails</b>. With the option on, Delta automatically adds the two new columns to the table definition; historical rows get <code class="inl">NULL</code> for them.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option ruled out</th><th>Problem</th></tr>
        <tr><td class="m">mode("overwrite")</td><td>Deletes existing rows → violates the 1st requirement</td></tr>
        <tr><td class="m">mode("error") / ("errorifexists")</td><td>Raises an exception if the table exists → nothing is written</td></tr>
        <tr><td class="m">mode("ignore")</td><td>Does nothing if the table exists → no data added</td></tr>
        <tr><td class="m">("mergeSchema","false")</td><td>The write fails because of the extra columns</td></tr>
        <tr><td class="m">("overwriteSchema", …)</td><td>Works only with <code class="inl">mode("overwrite")</code>: replaces schema <b>and</b> data</td></tr>
      </table></div>
      <p class="note"><b>The formula.</b> <code class="inl">append</code> + <code class="inl">mergeSchema=true</code> = add rows carrying new columns. And the pair not to confuse: <code class="inl">mergeSchema</code> <b>merges</b> (append), <code class="inl">overwriteSchema</code> <b>replaces</b> (overwrite).</p>`}
  },
  {
    id:"q231", kind:"fields", type:TY,
    title:{fr:"Lecture WASBS et écriture Delta",en:"WASBS read and Delta write"},
    stem:{fr:`<p>Vous avez un notebook PySpark. Vous définissez <code class="inl">sas_token</code> dans la première cellule, puis exécutez :</p>
    <pre class="code">customers_path = \\
  f'wasbs://contacts@contoso.blob.core.windows.net/customers?{sas_token}'
customers = spark.read.parquet(customers_path)
customers.write \\
  .format("delta") \\
  .mode("overwrite") \\
  .saveAsTable("Customers")</pre>
    <p class="ask">Pour chacune des affirmations suivantes, indiquez si elle est vraie.</p>`,
          en:`<p>You have a PySpark notebook. You define <code class="inl">sas_token</code> in the first cell, then run:</p>
    <pre class="code">customers_path = \\
  f'wasbs://contacts@contoso.blob.core.windows.net/customers?{sas_token}'
customers = spark.read.parquet(customers_path)
customers.write \\
  .format("delta") \\
  .mode("overwrite") \\
  .saveAsTable("Customers")</pre>
    <p class="ask">For each statement, select Yes if it is true. Otherwise, select No.</p>`},
    fields:[
      {label:{fr:"customers est un DataFrame pandas.",en:"customers is a pandas DataFrame."}, hint:{fr:"type de l'objet",en:"object type"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1},
      {label:{fr:"Si une table delta nommée Customers n'existe PAS, une erreur sera générée.",en:"If a delta table named Customers does NOT exist, an error will be generated."}, hint:{fr:"comportement d'overwrite",en:"overwrite behaviour"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1},
      {label:{fr:"Les données source sont dans le dossier customers d'un conteneur nommé contacts.",en:"The source data is in the customers folder of a container named contacts."}, hint:{fr:"lecture de l'URI",en:"reading the URI"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0}
    ],
    explain:{fr:`
      <p class="why">1 — DataFrame pandas : No</p>
      <p>L'objet <code class="inl">spark</code> est la <b>SparkSession</b> ; <code class="inl">spark.read.parquet()</code> retourne un <code class="inl">pyspark.sql.DataFrame</code> — distribué, évalué paresseusement et réparti sur les exécuteurs. Un DataFrame pandas nécessiterait <code class="inl">pd.read_parquet()</code> ou une conversion via <code class="inl">.toPandas()</code>.</p>
      <p><b>La preuve est dans la suite du code :</b> <code class="inl">.write.format("delta").saveAsTable()</code> est une API propre à Spark, indisponible sur un objet pandas.</p>
      <p class="why">2 — Erreur si la table n'existe pas : No</p>
      <p><code class="inl">mode("overwrite")</code> signifie « <b>remplacer le contenu s'il existe, créer sinon</b> » : c'est précisément le mode qui ne génère <b>jamais</b> d'erreur liée à l'existence de la cible.</p>
      <p>Le mode qui produirait une erreur est <code class="inl">mode("error")</code> (alias <code class="inl">errorifexists</code>, mode par défaut) — et encore, <b>dans le cas inverse</b> : quand la table existe déjà.</p>
      <p class="why">3 — Emplacement : Yes</p>
      <p>L'URI WASBS suit la structure <code class="inl">wasbs://&lt;conteneur&gt;@&lt;compte&gt;.blob.core.windows.net/&lt;chemin&gt;</code>. Le conteneur est donc <b>contacts</b> et les fichiers Parquet se trouvent dans le dossier <b>customers</b>. Le fragment <code class="inl">?{sas_token}</code> transmet le jeton d'authentification, <b>il ne fait pas partie du chemin</b>.</p>
      <p class="note"><b>Trois réflexes.</b> <code class="inl">spark.read.*</code> → toujours un Spark DataFrame. <code class="inl">mode("overwrite")</code> crée ou remplace sans erreur. Dans une URI WASBS, <b>le conteneur précède le <code class="inl">@</code></b>, le compte de stockage le suit.</p>`,
      en:`
      <p class="why">1 — pandas DataFrame: No</p>
      <p>The <code class="inl">spark</code> object is the <b>SparkSession</b>; <code class="inl">spark.read.parquet()</code> returns a <code class="inl">pyspark.sql.DataFrame</code> — distributed, lazily evaluated and spread across executors. A pandas DataFrame would need <code class="inl">pd.read_parquet()</code> or a conversion through <code class="inl">.toPandas()</code>.</p>
      <p><b>The proof is in the rest of the code:</b> <code class="inl">.write.format("delta").saveAsTable()</code> is a Spark-specific API, unavailable on a pandas object.</p>
      <p class="why">2 — Error if the table does not exist: No</p>
      <p><code class="inl">mode("overwrite")</code> means "<b>replace the content if it exists, create it otherwise</b>": precisely the mode that <b>never</b> raises an error about the target's existence.</p>
      <p>The mode that would raise one is <code class="inl">mode("error")</code> (alias <code class="inl">errorifexists</code>, the default) — and even then, <b>in the opposite case</b>: when the table already exists.</p>
      <p class="why">3 — Location: Yes</p>
      <p>The WASBS URI follows the structure <code class="inl">wasbs://&lt;container&gt;@&lt;account&gt;.blob.core.windows.net/&lt;path&gt;</code>. The container is therefore <b>contacts</b> and the Parquet files sit in the <b>customers</b> folder. The <code class="inl">?{sas_token}</code> fragment carries the authentication token; <b>it is not part of the path</b>.</p>
      <p class="note"><b>Three reflexes.</b> <code class="inl">spark.read.*</code> → always a Spark DataFrame. <code class="inl">mode("overwrite")</code> creates or replaces without error. In a WASBS URI, <b>the container comes before the <code class="inl">@</code></b>, the storage account after.</p>`}
  },
  {
    id:"q232", kind:"fields", type:TH,
    title:{fr:"Créer une table d'entrepôt depuis un lakehouse",en:"Creating a warehouse table from a lakehouse"},
    stem:{fr:`<p>Workspace1 contient un lakehouse <b>Lakehouse1</b> et un entrepôt <b>Warehouse1</b>. Vous devez créer dans Warehouse1 une table <b>POSCustomers</b> en interrogeant la table <code class="inl">customer</code> de Lakehouse1.</p>
    <pre class="code">❶
DISTINCT customerid, customer, postalcode, category
❷</pre>
    <p class="ask">Comment devez-vous compléter l'instruction T-SQL ?</p>`,
          en:`<p>Workspace1 contains a lakehouse named <b>Lakehouse1</b> and a warehouse named <b>Warehouse1</b>. You need to create a new table named <b>POSCustomers</b> in Warehouse1 by querying the <code class="inl">customer</code> table in Lakehouse1.</p>
    <pre class="code">❶
DISTINCT customerid, customer, postalcode, category
❷</pre>
    <p class="ask">How should you complete the T-SQL statement?</p>`},
    fields:[
      {label:{fr:"❶ Début de l'instruction",en:"❶ Start of the statement"}, hint:{fr:"comment créer la table",en:"how to create the table"},
       opts:{fr:["CREATE TABLE dbo.POSCustomers","CREATE TABLE dbo.POSCustomers AS CLONE OF","CREATE TABLE dbo.POSCustomers AS SELECT"],en:["CREATE TABLE dbo.POSCustomers","CREATE TABLE dbo.POSCustomers AS CLONE OF","CREATE TABLE dbo.POSCustomers AS SELECT"]}, ans:2},
      {label:{fr:"❷ Source",en:"❷ Source"}, hint:{fr:"d'où viennent les lignes",en:"where the rows come from"},
       opts:{fr:["FROM dbo.Customer","FROM dbo.POSCustomers","FROM lakehouse1.dbo.customer"],en:["FROM dbo.Customer","FROM dbo.POSCustomers","FROM lakehouse1.dbo.customer"]}, ans:2}
    ],
    explain:{fr:`
      <p><b>CTAS</b> (<code class="inl">CREATE TABLE … AS SELECT</code>) est pris en charge par l'entrepôt Fabric et constitue la méthode standard pour matérialiser le résultat d'une requête dans une nouvelle table : <b>le schéma de la table cible est déduit automatiquement</b> des colonnes du SELECT.</p>
      <p class="why">Le point clé : la requête inter-bases</p>
      <p>Dans un même espace de travail Fabric, un entrepôt peut interroger <b>directement le point de terminaison SQL d'un lakehouse</b>, grâce à la notation en <b>trois parties</b> <code class="inl">base.schéma.table</code>. Aucun raccourci, pipeline ni copie n'est nécessaire — d'où le respect de l'exigence de moindre effort.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>CREATE TABLE dbo.POSCustomers</b> seul attend une <b>définition de colonnes entre parenthèses</b>, pas un SELECT — incompatible avec la suite du code déjà imprimée.</li>
        <li><b>AS CLONE OF</b> : le clonage zéro copie ne fonctionne qu'<b>entre tables d'un même entrepôt</b>, et ne permet ni projection de colonnes ni <code class="inl">DISTINCT</code>.</li>
        <li><b>FROM dbo.Customer</b> chercherait la table dans Warehouse1, où elle n'existe pas.</li>
        <li><b>FROM dbo.POSCustomers</b> désigne la table de <b>destination</b>, qui n'existe pas encore.</li>
      </ul>
      <p class="note"><b>La formule.</b> CTAS + notation en trois parties = créer une table d'entrepôt depuis un lakehouse, sans déplacement de données ni artefact intermédiaire.</p>`,
      en:`
      <p><b>CTAS</b> (<code class="inl">CREATE TABLE … AS SELECT</code>) is supported by the Fabric warehouse and is the standard way to materialise a query result into a new table: <b>the target table's schema is inferred automatically</b> from the SELECT's columns.</p>
      <p class="why">The key point: the cross-database query</p>
      <p>Within one Fabric workspace, a warehouse can query <b>a lakehouse's SQL endpoint directly</b>, thanks to the <b>three-part</b> notation <code class="inl">database.schema.table</code>. No shortcut, pipeline or copy is needed — hence the minimal-effort requirement is met.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>CREATE TABLE dbo.POSCustomers</b> alone expects a <b>column definition in parentheses</b>, not a SELECT — incompatible with the printed code that follows.</li>
        <li><b>AS CLONE OF</b>: zero-copy cloning works only <b>between tables in the same warehouse</b>, and allows neither column projection nor <code class="inl">DISTINCT</code>.</li>
        <li><b>FROM dbo.Customer</b> would look for the table in Warehouse1, where it does not exist.</li>
        <li><b>FROM dbo.POSCustomers</b> names the <b>destination</b> table, which does not yet exist.</li>
      </ul>
      <p class="note"><b>The formula.</b> CTAS + three-part notation = create a warehouse table from a lakehouse, with no data movement and no intermediate artifact.</p>`}
  },
  {
    id:"q233", kind:"single", type:T1,
    title:{fr:"Table point-in-time issue d'une jointure",en:"Point-in-time table from a join"},
    stem:{fr:`<p>Vous avez un entrepôt <b>DW1</b> et un lakehouse <b>LH1</b>. DW1 contient <code class="inl">Sales.Product</code> ; LH1 contient <code class="inl">Sales.Orders</code>. Vous prévoyez un processus automatisé qui créera dans DW1 une table <b>point-in-time</b> nommée <code class="inl">Sales.ProductOrder</code>, construite à partir d'une requête joignant les deux tables. Vous devez garantir que les <b>types des colonnes correspondent à ceux des sources</b>, en <b>minimisant le nombre d'opérations</b>.</p><p class="ask">Quelle opération devez-vous utiliser ?</p>`,
          en:`<p>You have a warehouse named <b>DW1</b> and a lakehouse named <b>LH1</b>. DW1 contains <code class="inl">Sales.Product</code>; LH1 contains <code class="inl">Sales.Orders</code>. You plan to schedule an automated process that will create a <b>point-in-time</b> table named <code class="inl">Sales.ProductOrder</code> in DW1, built from a query joining the two tables. You must ensure that the <b>column data types match those of the source tables</b>, while <b>minimizing the number of operations</b>.</p><p class="ask">Which operation should you use?</p>`},
    options:[
      {k:"A", fr:"INSERT INTO", en:"INSERT INTO"},
      {k:"B", fr:"CREATE TABLE AS SELECT (CTAS)", en:"CREATE TABLE AS SELECT (CTAS)"},
      {k:"C", fr:"CREATE TABLE AS CLONE OF", en:"CREATE TABLE AS CLONE OF"},
      {k:"D", fr:"CREATE MATERIALIZED VIEW AS SELECT", en:"CREATE MATERIALIZED VIEW AS SELECT"}
    ],
    answer:["B"],
    explain:{fr:`
      <p><b>CTAS crée la table et l'alimente en une unique instruction.</b> Le schéma de la table cible est déduit du SELECT : chaque colonne conserve le <b>type de données exact</b> de sa colonne source, sans déclaration manuelle ni risque de divergence — c'est précisément l'exigence de l'énoncé.</p>
      <p>Le résultat est une table matérialisée, <b>figée au moment de l'exécution</b> : la définition même d'une table point-in-time.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option écartée</th><th>Problème</th></tr>
        <tr><td class="m">A. INSERT INTO</td><td>Ne crée pas la table. Il faudrait d'abord un <code class="inl">CREATE TABLE</code> avec définition manuelle des colonnes et des types → <b>deux opérations</b>, plus un risque d'erreur de typage.</td></tr>
        <tr><td class="m">C. AS CLONE OF</td><td>Le clonage zéro copie ne fonctionne qu'<b>entre tables d'un même entrepôt</b> et duplique une table telle quelle — impossible d'y appliquer une jointure entre deux sources.</td></tr>
        <tr><td class="m">D. MATERIALIZED VIEW</td><td>Une vue matérialisée est <b>actualisée automatiquement</b> quand les données sources changent : c'est l'opposé d'un instantané point-in-time. Elle impose aussi des restrictions sur les jointures et les sources.</td></tr>
      </table></div>
      <p class="note"><b>Deux formules.</b> CTAS = créer + peupler + hériter des types <b>en une seule instruction</b>. Vue matérialisée = jamais un snapshot, puisqu'elle suit la source. Dès qu'un énoncé dit <i>point-in-time</i>, <i>snapshot</i> ou <i>figé</i>, écartez tout ce qui s'actualise seul.</p>`,
      en:`
      <p><b>CTAS creates the table and populates it in a single statement.</b> The target schema is inferred from the SELECT: each column keeps the <b>exact data type</b> of its source column, with no manual declaration and no risk of type drift — precisely the stem's requirement.</p>
      <p>The result is a materialised table, <b>frozen at execution time</b>: the very definition of a point-in-time table.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option ruled out</th><th>Problem</th></tr>
        <tr><td class="m">A. INSERT INTO</td><td>Does not create the table. You would first need a <code class="inl">CREATE TABLE</code> with manual column and type definitions → <b>two operations</b>, plus a typing-error risk.</td></tr>
        <tr><td class="m">C. AS CLONE OF</td><td>Zero-copy cloning works only <b>between tables in the same warehouse</b> and duplicates a table as-is — a join across two sources is impossible.</td></tr>
        <tr><td class="m">D. MATERIALIZED VIEW</td><td>A materialised view <b>refreshes automatically</b> when source data changes: the opposite of a point-in-time snapshot. It also imposes restrictions on joins and sources.</td></tr>
      </table></div>
      <p class="note"><b>Two formulas.</b> CTAS = create + populate + inherit types <b>in one statement</b>. Materialised view = never a snapshot, since it follows the source. Whenever a stem says <i>point-in-time</i>, <i>snapshot</i> or <i>frozen</i>, rule out anything that refreshes itself.</p>`}
  },
  {
    id:"q234", kind:"fields", type:TH,
    title:{fr:"COALESCE et LEAST",en:"COALESCE and LEAST"},
    stem:{fr:`<p>La table <code class="inl">Sales.Orders</code> contient OrderID, CustomerID, OrderDate, Quantity, Weight, <b>ListPrice (NOT NULL)</b> et <b>SalePrice (nullable)</b>. Vous devez écrire une requête retournant :</p>
    <ul>
      <li><b>ChargedQuantity</b> : la valeur <i>Weight</i> si elle est présente, sinon <i>Quantity</i> si elle est présente, sinon <b>1</b>.</li>
      <li><b>OrderPrice</b> : la valeur <b>la plus basse</b> entre ListPrice et SalePrice, en ignorant les NULL de SalePrice.</li>
    </ul>
    <pre class="code">SELECT OrderID, CustomerID, ProductID,
    ❶ (Weight, Quantity, 1) AS ChargedQuantity,
    ❷ (ListPrice, SalePrice) AS OrderPrice
FROM Sales.Orders;</pre>
    <p class="ask">Comment devez-vous compléter la requête ?</p>`,
          en:`<p>The <code class="inl">Sales.Orders</code> table contains OrderID, CustomerID, OrderDate, Quantity, Weight, <b>ListPrice (NOT NULL)</b> and <b>SalePrice (nullable)</b>. You need to write a query that returns:</p>
    <ul>
      <li><b>ChargedQuantity</b>: the <i>Weight</i> value if present, otherwise <i>Quantity</i> if present, otherwise <b>1</b>.</li>
      <li><b>OrderPrice</b>: the <b>lowest</b> value between ListPrice and SalePrice, ignoring NULLs in SalePrice.</li>
    </ul>
    <pre class="code">SELECT OrderID, CustomerID, ProductID,
    ❶ (Weight, Quantity, 1) AS ChargedQuantity,
    ❷ (ListPrice, SalePrice) AS OrderPrice
FROM Sales.Orders;</pre>
    <p class="ask">How should you complete the query?</p>`},
    fields:[
      {label:{fr:"❶ ChargedQuantity",en:"❶ ChargedQuantity"}, hint:{fr:"premier non-NULL",en:"first non-NULL"},
       opts:{fr:["CHOOSE","COALESCE","IIF"],en:["CHOOSE","COALESCE","IIF"]}, ans:1},
      {label:{fr:"❷ OrderPrice",en:"❷ OrderPrice"}, hint:{fr:"le plus bas des deux",en:"the lower of the two"},
       opts:{fr:["COALESCE","LEAST","MIN"],en:["COALESCE","LEAST","MIN"]}, ans:1}
    ],
    explain:{fr:`
      <p><b>COALESCE</b> parcourt ses arguments de gauche à droite et retourne le <b>premier non-NULL</b> : c'est exactement la logique décrite — Weight si présent, sinon Quantity, sinon 1. Le littéral <code class="inl">1</code> en dernière position garantit qu'aucun NULL ne subsiste.</p>
      <p><b>LEAST</b> retourne la plus petite valeur parmi une liste d'expressions <b>sur une même ligne</b>. Point clé ici : <b>LEAST ignore les NULL</b> et ne renvoie NULL que si <i>tous</i> ses arguments sont NULL. Comme ListPrice est déclaré NOT NULL, le résultat est toujours défini — la condition « ignore les NULL dans SalePrice » est satisfaite.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>CHOOSE</b> a pour signature <code class="inl">CHOOSE(index, val1, val2, …)</code> : il sélectionne par <b>position numérique</b>, pas par nullité. Ici le premier argument serait interprété comme un index.</li>
        <li><b>IIF</b> n'accepte que trois arguments sous la forme <code class="inl">IIF(condition, vrai, faux)</code> : <i>Weight</i> n'est pas un prédicat booléen.</li>
        <li><b>MIN</b> est une fonction d'agrégation <b>verticale</b> : elle calcule le minimum sur un ensemble de lignes et exige un <code class="inl">GROUP BY</code>. Elle ne compare pas deux colonnes d'une même ligne.</li>
      </ul>
      <p class="note"><b>Le triptyque à retenir.</b> <code class="inl">COALESCE</code> = premier non-NULL. <code class="inl">LEAST</code> / <code class="inl">GREATEST</code> = min/max <b>horizontal</b>, entre colonnes d'une même ligne. <code class="inl">MIN</code> / <code class="inl">MAX</code> = <b>vertical</b>, entre lignes.</p>`,
      en:`
      <p><b>COALESCE</b> walks its arguments left to right and returns the <b>first non-NULL</b>: exactly the logic described — Weight if present, otherwise Quantity, otherwise 1. The literal <code class="inl">1</code> in last position guarantees no NULL survives.</p>
      <p><b>LEAST</b> returns the smallest value among a list of expressions <b>on the same row</b>. Key point here: <b>LEAST ignores NULLs</b> and returns NULL only if <i>all</i> its arguments are NULL. Since ListPrice is declared NOT NULL, the result is always defined — the "ignore NULLs in SalePrice" condition is met.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>CHOOSE</b> has the signature <code class="inl">CHOOSE(index, val1, val2, …)</code>: it selects by <b>numeric position</b>, not by nullity. Here the first argument would be read as an index.</li>
        <li><b>IIF</b> takes only three arguments, as <code class="inl">IIF(condition, true, false)</code>: <i>Weight</i> is not a boolean predicate.</li>
        <li><b>MIN</b> is a <b>vertical</b> aggregate: it computes the minimum over a set of rows and requires a <code class="inl">GROUP BY</code>. It does not compare two columns on one row.</li>
      </ul>
      <p class="note"><b>The trio to remember.</b> <code class="inl">COALESCE</code> = first non-NULL. <code class="inl">LEAST</code> / <code class="inl">GREATEST</code> = <b>horizontal</b> min/max, across columns of one row. <code class="inl">MIN</code> / <code class="inl">MAX</code> = <b>vertical</b>, across rows.</p>`}
  },
  {
    id:"q235", kind:"fields", contested:true, type:TH,
    title:{fr:"GREATEST et COALESCE",en:"GREATEST and COALESCE"},
    stem:{fr:`<p>La table <code class="inl">Sales.Products</code> contient ProductID, ProductName, <b>ListPrice (NOT NULL)</b>, <b>WholesalePrice (nullable)</b> et <b>AgentPrice (nullable)</b>. Vous devez retourner :</p>
    <ul>
      <li><b>HighestSellingPrice</b> : la valeur la plus élevée parmi les trois prix.</li>
      <li><b>TradePrice</b> : AgentPrice si présent, sinon WholesalePrice, sinon ListPrice.</li>
    </ul>
    <pre class="code">SELECT ProductID,
    ❶ (ListPrice, WholesalePrice, AgentPrice) AS HighestSellingPrice,
    ❷ (ListPrice, WholesalePrice, AgentPrice) AS TradePrice
FROM Sales.Products;</pre>
    <p class="ask">Comment devez-vous compléter la requête ?</p>`,
          en:`<p>The <code class="inl">Sales.Products</code> table contains ProductID, ProductName, <b>ListPrice (NOT NULL)</b>, <b>WholesalePrice (nullable)</b> and <b>AgentPrice (nullable)</b>. You need to return:</p>
    <ul>
      <li><b>HighestSellingPrice</b>: the highest value among the three prices.</li>
      <li><b>TradePrice</b>: AgentPrice if present, otherwise WholesalePrice, otherwise ListPrice.</li>
    </ul>
    <pre class="code">SELECT ProductID,
    ❶ (ListPrice, WholesalePrice, AgentPrice) AS HighestSellingPrice,
    ❷ (ListPrice, WholesalePrice, AgentPrice) AS TradePrice
FROM Sales.Products;</pre>
    <p class="ask">How should you complete the query?</p>`},
    fields:[
      {label:{fr:"❶ HighestSellingPrice",en:"❶ HighestSellingPrice"}, hint:{fr:"la plus élevée des trois",en:"the highest of the three"},
       opts:{fr:["COALESCE","GREATEST","IIF","MAX"],en:["COALESCE","GREATEST","IIF","MAX"]}, ans:1},
      {label:{fr:"❷ TradePrice",en:"❷ TradePrice"}, hint:{fr:"repli en cascade",en:"cascading fallback"},
       opts:{fr:["CHOOSE","COALESCE","IIF","MAX"],en:["CHOOSE","COALESCE","IIF","MAX"]}, ans:1}
    ],
    explain:{fr:`
      <p><b>GREATEST</b> retourne la plus grande valeur parmi une liste d'expressions <b>sur une même ligne</b>, en ignorant les NULL — elle ne renvoie NULL que si tous les arguments le sont. Comme ListPrice est NOT NULL, le résultat est toujours défini.</p>
      <p><b>COALESCE</b> retourne le premier non-NULL : la logique de repli en cascade décrite pour TradePrice.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>MAX</b> est une agrégation <b>verticale</b> exigeant un <code class="inl">GROUP BY</code> : elle n'accepte qu'un seul argument et ne compare pas des colonnes entre elles.</li>
        <li><b>IIF</b> attend un prédicat booléen en premier argument.</li>
        <li><b>CHOOSE</b> sélectionne par position numérique.</li>
      </ul>
      <p class="contested"><b>Incohérence de l'énoncé — à reconnaître, pas à corriger.</b> L'ordre des arguments est imposé et <b>identique sur les deux lignes</b> : <code class="inl">(ListPrice, WholesalePrice, AgentPrice)</code>. Or la description de TradePrice demande <b>AgentPrice en priorité</b>. Avec COALESCE et cet ordre, ListPrice — qui n'est jamais NULL — serait <b>toujours</b> retourné, ce qui vide la logique de son sens. L'ordre correct serait <code class="inl">COALESCE(AgentPrice, WholesalePrice, ListPrice)</code>. GREATEST n'est pas concerné, le maximum étant indifférent à l'ordre.<br><br><b>C'est une erreur de rédaction du dump</b>, pas un piège : la fonction attendue reste bien COALESCE.</p>
      <p class="note"><b>Le réflexe.</b> Répondez sur <b>la fonction</b>, pas sur l'ordre des arguments — les dumps contiennent fréquemment ce type d'incohérence. Si le choix porte sur une fonction et que l'énoncé est bancal ailleurs, la fonction reste la réponse.</p>`,
      en:`
      <p><b>GREATEST</b> returns the largest value among a list of expressions <b>on the same row</b>, ignoring NULLs — it returns NULL only if all arguments are. Since ListPrice is NOT NULL, the result is always defined.</p>
      <p><b>COALESCE</b> returns the first non-NULL: the cascading fallback logic described for TradePrice.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>MAX</b> is a <b>vertical</b> aggregate requiring a <code class="inl">GROUP BY</code>: it takes a single argument and does not compare columns with one another.</li>
        <li><b>IIF</b> expects a boolean predicate as its first argument.</li>
        <li><b>CHOOSE</b> selects by numeric position.</li>
      </ul>
      <p class="contested"><b>An incoherent stem — recognise it, do not fix it.</b> The argument order is fixed and <b>identical on both lines</b>: <code class="inl">(ListPrice, WholesalePrice, AgentPrice)</code>. Yet TradePrice's description asks for <b>AgentPrice first</b>. With COALESCE and that order, ListPrice — never NULL — would <b>always</b> be returned, emptying the logic of meaning. The correct order would be <code class="inl">COALESCE(AgentPrice, WholesalePrice, ListPrice)</code>. GREATEST is unaffected, a maximum being indifferent to order.<br><br><b>This is a drafting error in the dump</b>, not a trap: the intended function is still COALESCE.</p>
      <p class="note"><b>The reflex.</b> Answer on <b>the function</b>, not on the argument order — dumps frequently contain this kind of inconsistency. When the choice is about a function and the stem is shaky elsewhere, the function remains the answer.</p>`}
  },
  {
    id:"q236", kind:"fields", type:TH,
    title:{fr:"DATETRUNC et DATENAME",en:"DATETRUNC and DATENAME"},
    stem:{fr:`<p>Vous devez écrire une requête sur <code class="inl">Sales.Orders</code> retournant :</p>
    <ul>
      <li><b>PeriodDate</b> : une <b>date</b> représentant le premier jour du mois de OrderDate.</li>
      <li><b>DayName</b> : le <b>nom</b> du jour de OrderDate, par exemple « Wednesday ».</li>
    </ul>
    <pre class="code">SELECT OrderID, CustomerID,
    ❶ (month, OrderDate) AS PeriodDate,
    DATENAME( ❷ , OrderDate) AS DayName
FROM Sales.Orders;</pre>
    <p class="ask">Comment devez-vous compléter la requête ?</p>`,
          en:`<p>You need to write a query over <code class="inl">Sales.Orders</code> returning:</p>
    <ul>
      <li><b>PeriodDate</b>: a <b>date</b> representing the first day of the month of OrderDate.</li>
      <li><b>DayName</b>: the <b>name</b> of the day of OrderDate, for example "Wednesday".</li>
    </ul>
    <pre class="code">SELECT OrderID, CustomerID,
    ❶ (month, OrderDate) AS PeriodDate,
    DATENAME( ❷ , OrderDate) AS DayName
FROM Sales.Orders;</pre>
    <p class="ask">How should you complete the query?</p>`},
    fields:[
      {label:{fr:"❶ PeriodDate",en:"❶ PeriodDate"}, hint:{fr:"premier jour du mois",en:"first day of the month"},
       opts:{fr:["DATE_BUCKET","DATEFROMPARTS","DATEPART","DATETRUNC"],en:["DATE_BUCKET","DATEFROMPARTS","DATEPART","DATETRUNC"]}, ans:3},
      {label:{fr:"❷ datepart de DayName",en:"❷ DayName datepart"}, hint:{fr:"le nom du jour",en:"the day's name"},
       opts:{fr:["day","dayofyear","weekday"],en:["day","dayofyear","weekday"]}, ans:2}
    ],
    explain:{fr:`
      <p><b>DATETRUNC</b> tronque une date à la granularité indiquée et <b>retourne une date</b>, pas un nombre : avec <code class="inl">month</code>, la valeur <code class="inl">2024-07-23</code> devient <code class="inl">2024-07-01</code> — exactement « le premier jour du mois ». C'est la fonction moderne (SQL Server 2022+, entrepôt Fabric) qui remplace les anciennes constructions du type <code class="inl">DATEADD(month, DATEDIFF(month, 0, OrderDate), 0)</code>.</p>
      <p><b>DATENAME</b> retourne une <b>chaîne</b>. Le datepart <code class="inl">weekday</code> (alias <code class="inl">dw</code>) produit le nom du jour : « Wednesday ».</p>
      <p><b>Nuance utile :</b> <code class="inl">DATEPART(weekday, …)</code> renverrait le <i>chiffre</i> du jour (1–7), tandis que <code class="inl">DATENAME(weekday, …)</code> renvoie son <i>libellé</i>, dépendant du paramètre de langue de la session.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option écartée</th><th>Problème / résultat</th></tr>
        <tr><td class="m">DATEPART(month, …)</td><td>Retourne un entier (7), pas une date</td></tr>
        <tr><td class="m">DATEFROMPARTS</td><td>Attend (année, mois, jour) — trois entiers, pas (month, date)</td></tr>
        <tr><td class="m">DATE_BUCKET</td><td>Signature (datepart, nombre, date [, origine]) : quatre paramètres, groupe par intervalles fixes</td></tr>
        <tr><td class="m">DATENAME(day, …)</td><td>« 23 » — le numéro du jour dans le mois</td></tr>
        <tr><td class="m">DATENAME(dayofyear, …)</td><td>« 205 » — le rang du jour dans l'année</td></tr>
      </table></div>
      <p class="note"><b>Les trois familles.</b> <code class="inl">DATETRUNC</code> → une <b>date</b> tronquée. <code class="inl">DATEPART</code> → un <b>entier</b>. <code class="inl">DATENAME</code> → une <b>chaîne</b>. Le type de retour demandé par l'énoncé désigne la fonction.</p>`,
      en:`
      <p><b>DATETRUNC</b> truncates a date to the stated granularity and <b>returns a date</b>, not a number: with <code class="inl">month</code>, the value <code class="inl">2024-07-23</code> becomes <code class="inl">2024-07-01</code> — exactly "the first day of the month". It is the modern function (SQL Server 2022+, Fabric warehouse) replacing older constructions such as <code class="inl">DATEADD(month, DATEDIFF(month, 0, OrderDate), 0)</code>.</p>
      <p><b>DATENAME</b> returns a <b>string</b>. The <code class="inl">weekday</code> datepart (alias <code class="inl">dw</code>) produces the day's name: "Wednesday".</p>
      <p><b>A useful nuance:</b> <code class="inl">DATEPART(weekday, …)</code> would return the day's <i>number</i> (1–7), whereas <code class="inl">DATENAME(weekday, …)</code> returns its <i>label</i>, dependent on the session's language setting.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option ruled out</th><th>Problem / result</th></tr>
        <tr><td class="m">DATEPART(month, …)</td><td>Returns an integer (7), not a date</td></tr>
        <tr><td class="m">DATEFROMPARTS</td><td>Expects (year, month, day) — three integers, not (month, date)</td></tr>
        <tr><td class="m">DATE_BUCKET</td><td>Signature (datepart, number, date [, origin]): four parameters, groups by fixed intervals</td></tr>
        <tr><td class="m">DATENAME(day, …)</td><td>"23" — the day number within the month</td></tr>
        <tr><td class="m">DATENAME(dayofyear, …)</td><td>"205" — the day's rank within the year</td></tr>
      </table></div>
      <p class="note"><b>The three families.</b> <code class="inl">DATETRUNC</code> → a truncated <b>date</b>. <code class="inl">DATEPART</code> → an <b>integer</b>. <code class="inl">DATENAME</code> → a <b>string</b>. The return type the stem asks for names the function.</p>`}
  },
  {
    id:"q237", kind:"fields", type:TH,
    title:{fr:"TRY_CAST et style de conversion de date",en:"TRY_CAST and date conversion style"},
    stem:{fr:`<p><code class="inl">Table1</code> contient item_id (Integer), item_name (varchar(50)), item_description (varchar(50)) et purchase_date (Datetime). Vous devez : retourner le nom de chaque article, et <b>une valeur null si le nom dépasse 20 caractères</b> ; retourner PurchaseDate au format <b>MMM dd, yy</b>.</p>
    <pre class="code">SELECT item_id as ItemId
    ❶ as ItemName
    ,item_description as ItemDescription
    ❷ as PurchaseDate
FROM Table1
WHERE item_type = @itemtype_parameter</pre>
    <p class="ask">Comment devez-vous compléter la requête ?</p>`,
          en:`<p><code class="inl">Table1</code> contains item_id (Integer), item_name (varchar(50)), item_description (varchar(50)) and purchase_date (Datetime). You need to: return each item's name, and <b>a null value if the name exceeds 20 characters</b>; return PurchaseDate in the <b>MMM dd, yy</b> format.</p>
    <pre class="code">SELECT item_id as ItemId
    ❶ as ItemName
    ,item_description as ItemDescription
    ❷ as PurchaseDate
FROM Table1
WHERE item_type = @itemtype_parameter</pre>
    <p class="ask">How should you complete the query?</p>`},
    fields:[
      {label:{fr:"❶ ItemName",en:"❶ ItemName"}, hint:{fr:"null si trop long",en:"null if too long"},
       opts:{fr:[",convert(varchar(20), item_name)",",convert(varchar(max), item_name)",",try_cast(item_name as varchar(20))"],en:[",convert(varchar(20), item_name)",",convert(varchar(max), item_name)",",try_cast(item_name as varchar(20))"]}, ans:2},
      {label:{fr:"❷ PurchaseDate",en:"❷ PurchaseDate"}, hint:{fr:"format MMM dd, yy",en:"MMM dd, yy format"},
       opts:{fr:[",convert(varchar, purchase_date, 7)",",convert(varchar, purchase_date, 109)",",convert(varchar, purchase_date, 112)"],en:[",convert(varchar, purchase_date, 7)",",convert(varchar, purchase_date, 109)",",convert(varchar, purchase_date, 112)"]}, ans:0}
    ],
    explain:{fr:`
      <p class="why">❶ Le comportement en cas d'échec</p>
      <p>Toute la distinction est là. <code class="inl">CONVERT(varchar(20), item_name)</code> <b>tronque silencieusement</b> à 20 caractères, tandis que <code class="inl">TRY_CAST(item_name AS varchar(20))</code> <b>retourne NULL</b>. TRY_CAST tente la conversion et renvoie NULL si elle échoue, au lieu de lever une erreur : c'est exactement le comportement décrit par l'exigence.</p>
      <p><code class="inl">convert(varchar(max), item_name)</code> n'impose aucune limite de longueur, donc <b>aucun NULL n'est jamais produit</b>.</p>
      <p class="why">❷ Le style de conversion</p>
      <p>Le troisième argument de <code class="inl">CONVERT(varchar, date, style)</code> sélectionne le format :</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Style</th><th>Format</th><th>Exemple</th></tr>
        <tr><td class="m">7</td><td class="m">MMM dd, yy</td><td class="m">Jul 23, 24</td></tr>
        <tr><td class="m">109</td><td class="m">mon dd yyyy hh:mi:ss:mmmAM</td><td class="m">Jul 23 2024 2:15:30:123PM</td></tr>
        <tr><td class="m">112</td><td class="m">yyyymmdd</td><td class="m">20240723</td></tr>
      </table></div>
      <p>Le <b>style 7</b> correspond littéralement au format demandé : mois abrégé sur trois lettres, jour, virgule, année sur deux chiffres. Le 109 ajoute l'heure et une année sur quatre chiffres ; le 112 produit une chaîne ISO compacte sans séparateur.</p>
      <p class="note"><b>Le couple à retenir.</b> <code class="inl">TRY_CAST</code> et <code class="inl">TRY_CONVERT</code> → <b>NULL</b> en cas d'échec. <code class="inl">CAST</code> et <code class="inl">CONVERT</code> → <b>erreur ou troncature</b>. Dès qu'un énoncé demande « null si », cherchez le préfixe TRY_.</p>`,
      en:`
      <p class="why">❶ Behaviour on failure</p>
      <p>The whole distinction sits here. <code class="inl">CONVERT(varchar(20), item_name)</code> <b>silently truncates</b> to 20 characters, whereas <code class="inl">TRY_CAST(item_name AS varchar(20))</code> <b>returns NULL</b>. TRY_CAST attempts the conversion and returns NULL if it fails, instead of raising an error: exactly the behaviour the requirement describes.</p>
      <p><code class="inl">convert(varchar(max), item_name)</code> imposes no length limit, so <b>no NULL is ever produced</b>.</p>
      <p class="why">❷ The conversion style</p>
      <p>The third argument of <code class="inl">CONVERT(varchar, date, style)</code> selects the format:</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Style</th><th>Format</th><th>Example</th></tr>
        <tr><td class="m">7</td><td class="m">MMM dd, yy</td><td class="m">Jul 23, 24</td></tr>
        <tr><td class="m">109</td><td class="m">mon dd yyyy hh:mi:ss:mmmAM</td><td class="m">Jul 23 2024 2:15:30:123PM</td></tr>
        <tr><td class="m">112</td><td class="m">yyyymmdd</td><td class="m">20240723</td></tr>
      </table></div>
      <p><b>Style 7</b> matches the requested format literally: three-letter abbreviated month, day, comma, two-digit year. Style 109 adds the time and a four-digit year; style 112 produces a compact ISO string with no separator.</p>
      <p class="note"><b>The pair to remember.</b> <code class="inl">TRY_CAST</code> and <code class="inl">TRY_CONVERT</code> → <b>NULL</b> on failure. <code class="inl">CAST</code> and <code class="inl">CONVERT</code> → <b>error or truncation</b>. Whenever a stem asks for "null if", look for the TRY_ prefix.</p>`}
  },
  {
    id:"q238", kind:"single", type:T1,
    title:{fr:"Proportion d'une ligne dans son groupe",en:"A row's share of its group"},
    stem:{fr:`<p>Vous avez une table <code class="inl">SalesOrderDetail</code> avec trois colonnes : <b>OrderQty</b>, <b>ProductID</b> et <b>SalesOrderID</b>. Elle contient une ligne par combinaison de SalesOrderID et ProductID. Vous devez calculer <b>la proportion de la quantité totale de chaque commande représentée par chaque produit au sein de cette commande</b>.</p><p class="ask">Quelle instruction devez-vous utiliser pour le dénominateur ?</p>`,
          en:`<p>You have a Fabric warehouse containing a table named <code class="inl">SalesOrderDetail</code> with three columns: <b>OrderQty</b>, <b>ProductID</b> and <b>SalesOrderID</b>. It contains one row per combination of SalesOrderID and ProductID. You need to calculate <b>the proportion of the total quantity of each order that each product represents within that order</b>.</p><p class="ask">Which statement should you use for the denominator?</p>`},
    options:[
      {k:"A", fr:`<code class="inl">SUM(OrderQty) OVER(PARTITION BY ProductID)</code>`, en:`<code class="inl">SUM(OrderQty) OVER(PARTITION BY ProductID)</code>`},
      {k:"B", fr:`<code class="inl">SUM(OrderQty) OVER(ORDER BY SalesOrderID)</code>`, en:`<code class="inl">SUM(OrderQty) OVER(ORDER BY SalesOrderID)</code>`},
      {k:"C", fr:`<code class="inl">SUM(OrderQty) OVER(ORDER BY ProductID)</code>`, en:`<code class="inl">SUM(OrderQty) OVER(ORDER BY ProductID)</code>`},
      {k:"D", fr:`<code class="inl">SUM(OrderQty) OVER(PARTITION BY SalesOrderID)</code>`, en:`<code class="inl">SUM(OrderQty) OVER(PARTITION BY SalesOrderID)</code>`}
    ],
    answer:["D"],
    explain:{fr:`
      <p>La formule attendue est : <b>quantité de la ligne ÷ total de la commande × 100</b>.</p>
      <pre class="code">SELECT SalesOrderID, ProductID, OrderQty
    ,CAST(1. * OrderQty / SUM(OrderQty) OVER(PARTITION BY SalesOrderID) * 100
    AS DECIMAL(5,2)) AS PercentbyProductID
FROM Sales.SalesOrderDetail;</pre>
      <p><code class="inl">PARTITION BY SalesOrderID</code> définit le <b>périmètre de calcul du dénominateur</b> : <code class="inl">SUM(OrderQty)</code> est recalculé indépendamment pour chaque commande. Toutes les lignes d'une même commande partagent donc le même total, et leurs pourcentages s'additionnent à 100 %.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>SalesOrderID</th><th>ProductID</th><th>OrderQty</th><th>SUM OVER</th><th>Percent</th></tr>
        <tr><td class="m">1001</td><td class="m">A</td><td class="m">3</td><td class="m">10</td><td class="m">30.00</td></tr>
        <tr><td class="m">1001</td><td class="m">B</td><td class="m">5</td><td class="m">10</td><td class="m">50.00</td></tr>
        <tr><td class="m">1001</td><td class="m">C</td><td class="m">2</td><td class="m">10</td><td class="m">20.00</td></tr>
      </table></div>
      <p>Le préfixe <code class="inl">1. *</code> force une division en virgule flottante ; sans lui, la division entre entiers renverrait <b>0</b> par troncature.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — PARTITION BY ProductID.</b> Calcule la part de chaque commande dans le total d'un produit : <b>l'axe est inversé</b>.</li>
        <li><b>B et C — ORDER BY sans PARTITION BY.</b> Dans un <code class="inl">OVER()</code>, un <code class="inl">ORDER BY</code> seul crée un <b>cumul progressif</b> (<code class="inl">ROWS UNBOUNDED PRECEDING</code> implicite) sur toute la table : le dénominateur croît ligne après ligne.</li>
      </ul>
      <p class="note"><b>La formule.</b> Part d'une ligne dans son groupe = <code class="inl">valeur / SUM(valeur) OVER (PARTITION BY clé)</code>. Et le réflexe : dans un <code class="inl">OVER()</code>, <b>PARTITION BY</b> = un total par groupe, <b>ORDER BY seul</b> = un cumul.</p>`,
      en:`
      <p>The expected formula is: <b>row quantity ÷ order total × 100</b>.</p>
      <pre class="code">SELECT SalesOrderID, ProductID, OrderQty
    ,CAST(1. * OrderQty / SUM(OrderQty) OVER(PARTITION BY SalesOrderID) * 100
    AS DECIMAL(5,2)) AS PercentbyProductID
FROM Sales.SalesOrderDetail;</pre>
      <p><code class="inl">PARTITION BY SalesOrderID</code> defines the <b>scope over which the denominator is computed</b>: <code class="inl">SUM(OrderQty)</code> is recalculated independently for each order. All rows of one order therefore share the same total, and their percentages add to 100 %.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>SalesOrderID</th><th>ProductID</th><th>OrderQty</th><th>SUM OVER</th><th>Percent</th></tr>
        <tr><td class="m">1001</td><td class="m">A</td><td class="m">3</td><td class="m">10</td><td class="m">30.00</td></tr>
        <tr><td class="m">1001</td><td class="m">B</td><td class="m">5</td><td class="m">10</td><td class="m">50.00</td></tr>
        <tr><td class="m">1001</td><td class="m">C</td><td class="m">2</td><td class="m">10</td><td class="m">20.00</td></tr>
      </table></div>
      <p>The <code class="inl">1. *</code> prefix forces floating-point division; without it, integer division would return <b>0</b> through truncation.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — PARTITION BY ProductID.</b> Computes each order's share of a product's total: <b>the axis is inverted</b>.</li>
        <li><b>B and C — ORDER BY without PARTITION BY.</b> Inside an <code class="inl">OVER()</code>, an <code class="inl">ORDER BY</code> alone creates a <b>running total</b> (implicit <code class="inl">ROWS UNBOUNDED PRECEDING</code>) across the whole table: the denominator grows row by row.</li>
      </ul>
      <p class="note"><b>The formula.</b> A row's share of its group = <code class="inl">value / SUM(value) OVER (PARTITION BY key)</code>. And the reflex: inside an <code class="inl">OVER()</code>, <b>PARTITION BY</b> = a total per group, <b>ORDER BY alone</b> = a running total.</p>`}
  },
  {
    id:"q239", kind:"fields", type:TH,
    title:{fr:"Somme d'un produit et type de jointure",en:"Sum of a product and join type"},
    stem:{fr:`<p>Lakehouse1 contient <code class="inl">dbo.publicholidays</code> (countryOrRegion, holidayName, Date) et <code class="inl">dbo.sales</code> (OrderDate, Quantity, UnitPrice). Vous devez retourner le <b>montant total des ventes par OrderDate, uniquement pour les jours fériés en Australie</b>. Le montant doit sommer la quantité multipliée par le prix <b>sur chaque ligne</b>.</p>
    <pre class="code">SELECT s.OrderDate,
    ❶ AS TotalSalesAmt
FROM [Lakehouse1].[dbo].[sales] AS s
❷ JOIN [Lakehouse1].[dbo].[publicholidays] AS ph ON s.OrderDate = ph.date
WHERE ph.countryOrRegion = 'Australia'
GROUP BY s.OrderDate</pre>
    <p class="ask">Comment devez-vous compléter la requête ?</p>`,
          en:`<p>Lakehouse1 contains <code class="inl">dbo.publicholidays</code> (countryOrRegion, holidayName, Date) and <code class="inl">dbo.sales</code> (OrderDate, Quantity, UnitPrice). You need to return the <b>total sales amount by OrderDate, only for public holidays in Australia</b>. The total must sum quantity multiplied by price <b>on each row</b>.</p>
    <pre class="code">SELECT s.OrderDate,
    ❶ AS TotalSalesAmt
FROM [Lakehouse1].[dbo].[sales] AS s
❷ JOIN [Lakehouse1].[dbo].[publicholidays] AS ph ON s.OrderDate = ph.date
WHERE ph.countryOrRegion = 'Australia'
GROUP BY s.OrderDate</pre>
    <p class="ask">How should you complete the query?</p>`},
    fields:[
      {label:{fr:"❶ Le calcul",en:"❶ The calculation"}, hint:{fr:"TotalSalesAmt",en:"TotalSalesAmt"},
       opts:{fr:["s.Quantity * s.UnitPrice","Sum(s.Quantity * s.UnitPrice)","Sum(s.quantity) * s.UnitPrice","Sum(s.Quantity) * Sum(s.UnitPrice)"],en:["s.Quantity * s.UnitPrice","Sum(s.Quantity * s.UnitPrice)","Sum(s.quantity) * s.UnitPrice","Sum(s.Quantity) * Sum(s.UnitPrice)"]}, ans:1},
      {label:{fr:"❷ Le type de jointure",en:"❷ The join type"}, hint:{fr:"avant JOIN",en:"before JOIN"},
       opts:{fr:["Cross","Full outer","Inner","Right outer"],en:["Cross","Full outer","Inner","Right outer"]}, ans:2}
    ],
    explain:{fr:`
      <p class="why">❶ Le calcul</p>
      <p>L'énoncé est explicite : <b>le produit s'effectue sur chaque ligne, puis les résultats sont additionnés</b> — le calcul classique d'un chiffre d'affaires.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option écartée</th><th>Problème</th></tr>
        <tr><td class="m">s.Quantity * s.UnitPrice</td><td>Aucune agrégation → incompatible avec GROUP BY, erreur SQL</td></tr>
        <tr><td class="m">Sum(s.quantity) * s.UnitPrice</td><td>Agrège les quantités puis multiplie par un prix <b>non agrégé</b> → erreur SQL, et logique fausse si les prix varient</td></tr>
        <tr><td class="m">Sum(s.Quantity) * Sum(s.UnitPrice)</td><td><b>Mathématiquement erroné</b> : avec 2×10 et 3×20, on obtiendrait 5 × 30 = 150 au lieu de 20 + 60 = 80</td></tr>
      </table></div>
      <p class="why">❷ Le mot <i>only</i></p>
      <p>Il est déterminant : <b>seules les dates figurant dans publicholidays doivent apparaître</b>. <code class="inl">INNER JOIN</code> ne conserve que les lignes ayant une correspondance des deux côtés.</p>
      <ul>
        <li><b>Cross</b> produit un produit cartésien et <b>n'autorise pas la clause ON</b>.</li>
        <li><b>Full outer</b> conserverait aussi les ventes hors jours fériés.</li>
        <li><b>Right outer</b> conserverait les jours fériés sans vente, générant des lignes à NULL.</li>
      </ul>
      <p><b>À noter :</b> avec un OUTER JOIN, le <code class="inl">WHERE ph.countryOrRegion = 'Australia'</code> annulerait de toute façon l'effet du OUTER en éliminant les lignes NULL — un piège fréquent en SQL, et une raison de plus de choisir INNER explicitement.</p>
      <p class="note"><b>Deux réflexes.</b> « Somme du produit ligne par ligne » = <code class="inl">SUM(a * b)</code>, jamais <code class="inl">SUM(a) * SUM(b)</code>. Et le mot <b>only</b> dans une jointure signale un INNER JOIN.</p>`,
      en:`
      <p class="why">❶ The calculation</p>
      <p>The stem is explicit: <b>the product is computed on each row, then the results are added</b> — the classic revenue calculation.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option ruled out</th><th>Problem</th></tr>
        <tr><td class="m">s.Quantity * s.UnitPrice</td><td>No aggregation → incompatible with GROUP BY, SQL error</td></tr>
        <tr><td class="m">Sum(s.quantity) * s.UnitPrice</td><td>Aggregates quantities then multiplies by a <b>non-aggregated</b> price → SQL error, and wrong logic when prices vary</td></tr>
        <tr><td class="m">Sum(s.Quantity) * Sum(s.UnitPrice)</td><td><b>Mathematically wrong</b>: with 2×10 and 3×20 you would get 5 × 30 = 150 instead of 20 + 60 = 80</td></tr>
      </table></div>
      <p class="why">❷ The word <i>only</i></p>
      <p>It is decisive: <b>only dates appearing in publicholidays must show up</b>. <code class="inl">INNER JOIN</code> keeps only rows matching on both sides.</p>
      <ul>
        <li><b>Cross</b> produces a Cartesian product and <b>does not allow an ON clause</b>.</li>
        <li><b>Full outer</b> would also keep sales outside public holidays.</li>
        <li><b>Right outer</b> would keep holidays with no sales, generating NULL rows.</li>
      </ul>
      <p><b>Note:</b> with an OUTER JOIN, the <code class="inl">WHERE ph.countryOrRegion = 'Australia'</code> would cancel the OUTER effect anyway by removing the NULL rows — a frequent SQL trap, and one more reason to choose INNER explicitly.</p>
      <p class="note"><b>Two reflexes.</b> "Sum of the row-by-row product" = <code class="inl">SUM(a * b)</code>, never <code class="inl">SUM(a) * SUM(b)</code>. And the word <b>only</b> in a join signals an INNER JOIN.</p>`}
  },
  {
    id:"q240", kind:"fields", type:TH,
    title:{fr:"Moyenne par groupe et GROUP BY",en:"Average per group and GROUP BY"},
    stem:{fr:`<p>Un entrepôt Fabric contient <code class="inl">DimDate</code> (DateID, IsHoliday de type <code class="inl">Bit</code>) et <code class="inl">Trips</code> (tripID, tripDistance de type <code class="inl">Integer</code>, dateID). Vous devez comparer le <b>nombre moyen de miles par trajet</b> pour les jours fériés officiels par rapport aux jours ordinaires.</p>
    <pre class="code">SELECT d.IsHoliday,
    ❶ AS MilesPerTrip
FROM dbo.Trips t
INNER JOIN dbo.DimDate d ON t.dateID = d.DateID
❷ d.IsHoliday</pre>
    <p class="ask">Comment devez-vous compléter la requête ?</p>`,
          en:`<p>A Fabric warehouse contains <code class="inl">DimDate</code> (DateID, IsHoliday of type <code class="inl">Bit</code>) and <code class="inl">Trips</code> (tripID, tripDistance of type <code class="inl">Integer</code>, dateID). You need to compare the <b>average miles per trip</b> for official holidays against ordinary days.</p>
    <pre class="code">SELECT d.IsHoliday,
    ❶ AS MilesPerTrip
FROM dbo.Trips t
INNER JOIN dbo.DimDate d ON t.dateID = d.DateID
❷ d.IsHoliday</pre>
    <p class="ask">How should you complete the query?</p>`},
    fields:[
      {label:{fr:"❶ MilesPerTrip",en:"❶ MilesPerTrip"}, hint:{fr:"miles ÷ trajets",en:"miles ÷ trips"},
       opts:{fr:["(count(t.tripID) / sum(t.tripDistance))","(sum(t.tripDistance) / count(t.tripID))","Sum(t.tripDistance) / t.tripID"],en:["(count(t.tripID) / sum(t.tripDistance))","(sum(t.tripDistance) / count(t.tripID))","Sum(t.tripDistance) / t.tripID"]}, ans:1},
      {label:{fr:"❷ clause finale",en:"❷ final clause"}, hint:{fr:"une ligne par valeur de IsHoliday",en:"one row per IsHoliday value"},
       opts:{fr:["group by","order by","where"],en:["group by","order by","where"]}, ans:0}
    ],
    explain:{fr:`
      <p>« <b>Miles par trajet</b> » se lit littéralement : miles ÷ trajets. Le numérateur est la distance totale, le dénominateur le nombre de trajets.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>Calcul réel</th><th>Verdict</th></tr>
        <tr><td class="m">count(tripID) / sum(tripDistance)</td><td>trajets ÷ miles</td><td>Ratio inversé — des « trajets par mile »</td></tr>
        <tr><td class="m">sum(tripDistance) / count(tripID)</td><td>miles ÷ trajets</td><td><b>Correct</b></td></tr>
        <tr><td class="m">Sum(tripDistance) / t.tripID</td><td>agrégat ÷ colonne non agrégée</td><td>Erreur SQL</td></tr>
      </table></div>
      <p class="why">Pourquoi GROUP BY, et pas autre chose</p>
      <p>Toute colonne du <code class="inl">SELECT</code> non enveloppée dans une fonction d'agrégation <b>doit</b> figurer dans le <code class="inl">GROUP BY</code>. Sans <code class="inl">group by d.IsHoliday</code>, le moteur renverrait une erreur. C'est aussi ce qui produit le résultat attendu : exactement <b>deux lignes</b>, IsHoliday = 0 et IsHoliday = 1.</p>
      <ul>
        <li><b>order by</b> trie, mais n'agrège rien — la requête resterait invalide.</li>
        <li><b>where</b> exige un <i>prédicat</i> (<code class="inl">where d.IsHoliday = 1</code>), pas une simple colonne.</li>
      </ul>
      <p class="why">Deux nuances qui font la différence sur un vrai jeu de données</p>
      <ul>
        <li><code class="inl">sum(distance)/count(tripID)</code> et <code class="inl">avg(tripDistance)</code> ne sont <b>pas strictement équivalents</b> : le premier compte les identifiants non NULL, le second ignore les distances NULL.</li>
        <li><code class="inl">tripDistance</code> étant un <code class="inl">Integer</code>, la <b>division entière tronquerait</b> le résultat. En production on écrirait <code class="inl">sum(cast(t.tripDistance as decimal(18,2))) / count(t.tripID)</code>.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> « X par Y » = <code class="inl">sum(X) / count(Y)</code>, dans cet ordre. Et toute colonne non agrégée du SELECT est obligatoire dans le GROUP BY.</p>`,
      en:`
      <p>"<b>Miles per trip</b>" reads literally: miles ÷ trips. The numerator is total distance, the denominator the number of trips.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>What it actually computes</th><th>Verdict</th></tr>
        <tr><td class="m">count(tripID) / sum(tripDistance)</td><td>trips ÷ miles</td><td>Inverted ratio — "trips per mile"</td></tr>
        <tr><td class="m">sum(tripDistance) / count(tripID)</td><td>miles ÷ trips</td><td><b>Correct</b></td></tr>
        <tr><td class="m">Sum(tripDistance) / t.tripID</td><td>aggregate ÷ non-aggregated column</td><td>SQL error</td></tr>
      </table></div>
      <p class="why">Why GROUP BY, and nothing else</p>
      <p>Any column in the <code class="inl">SELECT</code> not wrapped in an aggregate function <b>must</b> appear in the <code class="inl">GROUP BY</code>. Without <code class="inl">group by d.IsHoliday</code> the engine raises an error. It is also what produces the expected result: exactly <b>two rows</b>, IsHoliday = 0 and IsHoliday = 1.</p>
      <ul>
        <li><b>order by</b> sorts but aggregates nothing — the query would still be invalid.</li>
        <li><b>where</b> requires a <i>predicate</i> (<code class="inl">where d.IsHoliday = 1</code>), not a bare column.</li>
      </ul>
      <p class="why">Two nuances that matter on real data</p>
      <ul>
        <li><code class="inl">sum(distance)/count(tripID)</code> and <code class="inl">avg(tripDistance)</code> are <b>not strictly equivalent</b>: the first counts non-NULL identifiers, the second ignores NULL distances.</li>
        <li>Because <code class="inl">tripDistance</code> is an <code class="inl">Integer</code>, <b>integer division would truncate</b> the result. In production you would write <code class="inl">sum(cast(t.tripDistance as decimal(18,2))) / count(t.tripID)</code>.</li>
      </ul>
      <p class="note"><b>The reflex.</b> "X per Y" = <code class="inl">sum(X) / count(Y)</code>, in that order. And every non-aggregated SELECT column is mandatory in the GROUP BY.</p>`}
  },
  {
    id:"q241", kind:"fields", type:TH,
    title:{fr:"Top N avec agrégation",en:"Top N with aggregation"},
    stem:{fr:`<p><code class="inl">Warehouse1</code> contient une table <code class="inl">TaxiTrips</code> (Company, passengerCount, tripDistance, pickupDate, FareAmount). Vous devez créer une requête affichant les <b>trois premières compagnies</b> de taxi selon le <b>total des miles parcourus</b>.</p>
    <pre class="code">SELECT ❶
    company AS TaxiCompany,
    sum(passengerCount) AS TotalPassengers,
    sum(tripDistance) TotalDistance
FROM [Warehouse1].[dbo].[TaxiTrips]
❷
❸ DESC;</pre>
    <p class="ask">Comment devez-vous compléter la requête ?</p>`,
          en:`<p><code class="inl">Warehouse1</code> contains a table named <code class="inl">TaxiTrips</code> (Company, passengerCount, tripDistance, pickupDate, FareAmount). You need to create a query that shows the <b>top three taxi companies</b> by <b>total miles driven</b>.</p>
    <pre class="code">SELECT ❶
    company AS TaxiCompany,
    sum(passengerCount) AS TotalPassengers,
    sum(tripDistance) TotalDistance
FROM [Warehouse1].[dbo].[TaxiTrips]
❷
❸ DESC;</pre>
    <p class="ask">How should you complete the query?</p>`},
    fields:[
      {label:{fr:"❶ limitation des lignes",en:"❶ row limiter"}, hint:{fr:"juste après SELECT",en:"right after SELECT"},
       opts:{fr:["FETCH NEXT 3 ROWS ONLY","Limit (3)","Top (3)"],en:["FETCH NEXT 3 ROWS ONLY","Limit (3)","Top (3)"]}, ans:2},
      {label:{fr:"❷ regroupement",en:"❷ grouping"}, hint:{fr:"colonne source ou alias ?",en:"source column or alias?"},
       opts:{fr:["GROUP BY company","GROUP BY TaxiCompany","ORDER BY tripDistance"],en:["GROUP BY company","GROUP BY TaxiCompany","ORDER BY tripDistance"]}, ans:0},
      {label:{fr:"❸ tri",en:"❸ sort"}, hint:{fr:"sur le total, pas sur la ligne",en:"on the total, not the row"},
       opts:{fr:["GROUP BY company","ORDER BY sum(tripDistance)","ORDER BY tripDistance"],en:["GROUP BY company","ORDER BY sum(tripDistance)","ORDER BY tripDistance"]}, ans:1}
    ],
    explain:{fr:`
      <p><b>TOP</b> est la syntaxe T-SQL de limitation de lignes. Elle se place <b>juste après SELECT</b> et s'applique <i>après</i> le tri.</p>
      <ul>
        <li><b>LIMIT (3)</b> est une syntaxe <b>MySQL / PostgreSQL</b>, non supportée par T-SQL.</li>
        <li><b>FETCH NEXT 3 ROWS ONLY</b> est valide en T-SQL, mais se place en <b>fin de requête, après ORDER BY</b>, et exige un <code class="inl">OFFSET</code> — incompatible avec la position imposée ici.</li>
      </ul>
      <p class="why">Le point le plus testé : GROUP BY ne voit pas les alias</p>
      <p>L'ordre logique d'évaluation en SQL est :</p>
      <p><code class="inl">FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY</code></p>
      <p>Le <code class="inl">GROUP BY</code> est évalué <b>avant</b> le <code class="inl">SELECT</code> : les alias définis dans le SELECT n'existent pas encore. <code class="inl">GROUP BY TaxiCompany</code> échouerait donc, et il faut référencer la <b>colonne source</b> : <code class="inl">GROUP BY company</code>.</p>
      <p class="why">Le tri porte sur un agrégat</p>
      <p>« Les trois premières selon le total des miles » = tri sur la <b>somme par compagnie</b>, pas sur une valeur ligne à ligne. <code class="inl">ORDER BY tripDistance</code> échouerait : cette colonne n'est ni agrégée ni dans le GROUP BY.</p>
      <p><b>Particularité utile :</b> contrairement au GROUP BY, l'<code class="inl">ORDER BY</code> — évalué <b>en dernier</b> — <i>peut</i> utiliser les alias du SELECT. <code class="inl">ORDER BY TotalDistance DESC</code> fonctionnerait donc également.</p>
      <p class="note"><b>Le réflexe.</b> T-SQL utilise <code class="inl">TOP (n)</code>, jamais <code class="inl">LIMIT</code>. Le <code class="inl">GROUP BY</code> ne voit pas les alias du SELECT ; l'<code class="inl">ORDER BY</code> si.</p>`,
      en:`
      <p><b>TOP</b> is the T-SQL row-limiting syntax. It sits <b>immediately after SELECT</b> and is applied <i>after</i> the sort.</p>
      <ul>
        <li><b>LIMIT (3)</b> is <b>MySQL / PostgreSQL</b> syntax, unsupported in T-SQL.</li>
        <li><b>FETCH NEXT 3 ROWS ONLY</b> is valid T-SQL, but it goes at the <b>end of the query, after ORDER BY</b>, and requires an <code class="inl">OFFSET</code> — incompatible with the position required here.</li>
      </ul>
      <p class="why">The most-tested point: GROUP BY cannot see aliases</p>
      <p>SQL's logical evaluation order is:</p>
      <p><code class="inl">FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY</code></p>
      <p><code class="inl">GROUP BY</code> is evaluated <b>before</b> <code class="inl">SELECT</code>: aliases defined in the SELECT do not exist yet. <code class="inl">GROUP BY TaxiCompany</code> would therefore fail, and you must reference the <b>source column</b>: <code class="inl">GROUP BY company</code>.</p>
      <p class="why">The sort is on an aggregate</p>
      <p>"Top three by total miles" = sort on the <b>sum per company</b>, not on a row-level value. <code class="inl">ORDER BY tripDistance</code> would fail: that column is neither aggregated nor in the GROUP BY.</p>
      <p><b>Useful quirk:</b> unlike GROUP BY, <code class="inl">ORDER BY</code> — evaluated <b>last</b> — <i>can</i> use SELECT aliases. <code class="inl">ORDER BY TotalDistance DESC</code> would work too.</p>
      <p class="note"><b>The reflex.</b> T-SQL uses <code class="inl">TOP (n)</code>, never <code class="inl">LIMIT</code>. <code class="inl">GROUP BY</code> cannot see SELECT aliases; <code class="inl">ORDER BY</code> can.</p>`}
  },
  {
    id:"q242", kind:"fields", type:TH,
    title:{fr:"ROLLUP et sous-totaux hiérarchiques",en:"ROLLUP and hierarchical subtotals"},
    stem:{fr:`<p><code class="inl">DW1</code> contient <code class="inl">SalesOrderDetail</code> (ProductID, ModifiedDate, OrderQty) et <code class="inl">Product</code> (ProductID, Name). Vous devez résumer les quantités commandées <b>par année et par produit</b>. La solution doit inclure, sur chaque ligne, la <b>somme annuelle des quantités pour tous les produits</b>.</p>
    <pre class="code">SELECT ❶ (SO.ModifiedDate) AS OrderDate
    ,P.Name AS ProductName
    ,SUM(SO.OrderQty) AS OrderQty
FROM [dbo].[SalesOrderDetail] SO
INNER JOIN [dbo].[Product] P ON P.ProductID = SO.ProductID
GROUP BY ❷
ORDER BY OrderDate</pre>
    <p class="ask">Comment devez-vous compléter la requête ?</p>`,
          en:`<p><code class="inl">DW1</code> contains <code class="inl">SalesOrderDetail</code> (ProductID, ModifiedDate, OrderQty) and <code class="inl">Product</code> (ProductID, Name). You need to summarize the quantities ordered <b>by year and by product</b>. The solution must include, on each row, the <b>yearly sum of quantities for all products</b>.</p>
    <pre class="code">SELECT ❶ (SO.ModifiedDate) AS OrderDate
    ,P.Name AS ProductName
    ,SUM(SO.OrderQty) AS OrderQty
FROM [dbo].[SalesOrderDetail] SO
INNER JOIN [dbo].[Product] P ON P.ProductID = SO.ProductID
GROUP BY ❷
ORDER BY OrderDate</pre>
    <p class="ask">How should you complete the query?</p>`},
    fields:[
      {label:{fr:"❶ extraction de l'année",en:"❶ extracting the year"}, hint:{fr:"changer la granularité, pas le type",en:"change granularity, not type"},
       opts:{fr:["CAST","CONVERT","YEAR"],en:["CAST","CONVERT","YEAR"]}, ans:2},
      {label:{fr:"❷ clause GROUP BY",en:"❷ GROUP BY clause"}, hint:{fr:"détail + sous-total + total",en:"detail + subtotal + grand total"},
       opts:{fr:["CUBE(YEAR(SO.ModifiedDate), P.Name)","GROUPING SETS ((YEAR(SO.ModifiedDate), P.Name), (YEAR(SO.ModifiedDate)))","ROLLUP(YEAR(SO.ModifiedDate), P.Name)","YEAR(SO.ModifiedDate), P.Name"],en:["CUBE(YEAR(SO.ModifiedDate), P.Name)","GROUPING SETS ((YEAR(SO.ModifiedDate), P.Name), (YEAR(SO.ModifiedDate)))","ROLLUP(YEAR(SO.ModifiedDate), P.Name)","YEAR(SO.ModifiedDate), P.Name"]}, ans:2}
    ],
    explain:{fr:`
      <p><code class="inl">YEAR()</code> extrait directement l'année sous forme d'entier. <code class="inl">CAST</code> et <code class="inl">CONVERT</code> changent le <b>type</b> d'une valeur, pas sa <b>granularité</b> — ils ne réduiraient pas une date complète à son année.</p>
      <p class="why">Pourquoi ROLLUP</p>
      <p>L'exigence « le total annuel pour tous les produits » demande des <b>lignes de sous-total</b> en plus du détail. <code class="inl">ROLLUP</code> génère une agrégation <b>hiérarchique, de droite à gauche</b> :</p>
      <p><code class="inl">(Année, Produit) → (Année) → ()</code></p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>OrderDate</th><th>ProductName</th><th>OrderQty</th></tr>
        <tr><td>2024</td><td>Bike</td><td>150</td></tr>
        <tr><td>2024</td><td>Helmet</td><td>80</td></tr>
        <tr><td>2024</td><td><i>NULL</i></td><td>230 ← sous-total annuel</td></tr>
        <tr><td><i>NULL</i></td><td><i>NULL</i></td><td>430 ← total général</td></tr>
      </table></div>
      <p class="why">Les trois distracteurs, du plus proche au plus éloigné</p>
      <ul>
        <li><b>GROUPING SETS</b> — le plus proche. Il produit bien le détail <i>et</i> le sous-total annuel, mais <b>omet le total général</b> : la liste des groupements y est explicite, et <code class="inl">()</code> n'y figure pas.</li>
        <li><b>CUBE</b> génère <b>toutes</b> les combinaisons possibles, y compris <code class="inl">(Produit)</code> seul — un total par produit toutes années confondues, non demandé et sans logique hiérarchique.</li>
        <li><b>GROUP BY classique</b> ne donne que le détail, sans aucune ligne de sous-total.</li>
      </ul>
      <p class="note"><b>Le trio à retenir.</b> <code class="inl">ROLLUP</code> = sous-totaux hiérarchiques + total général · <code class="inl">CUBE</code> = toutes combinaisons · <code class="inl">GROUPING SETS</code> = liste explicite, rien de plus.</p>`,
      en:`
      <p><code class="inl">YEAR()</code> extracts the year directly as an integer. <code class="inl">CAST</code> and <code class="inl">CONVERT</code> change a value's <b>type</b>, not its <b>granularity</b> — they would not reduce a full date to its year.</p>
      <p class="why">Why ROLLUP</p>
      <p>The requirement "the yearly total for all products" calls for <b>subtotal rows</b> on top of the detail. <code class="inl">ROLLUP</code> generates a <b>hierarchical, right-to-left</b> aggregation:</p>
      <p><code class="inl">(Year, Product) → (Year) → ()</code></p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>OrderDate</th><th>ProductName</th><th>OrderQty</th></tr>
        <tr><td>2024</td><td>Bike</td><td>150</td></tr>
        <tr><td>2024</td><td>Helmet</td><td>80</td></tr>
        <tr><td>2024</td><td><i>NULL</i></td><td>230 ← yearly subtotal</td></tr>
        <tr><td><i>NULL</i></td><td><i>NULL</i></td><td>430 ← grand total</td></tr>
      </table></div>
      <p class="why">The three distractors, from closest to furthest</p>
      <ul>
        <li><b>GROUPING SETS</b> — the closest. It does produce the detail <i>and</i> the yearly subtotal, but <b>omits the grand total</b>: the grouping list is explicit, and <code class="inl">()</code> is not in it.</li>
        <li><b>CUBE</b> generates <b>every</b> possible combination, including <code class="inl">(Product)</code> alone — a per-product total across all years, not asked for and with no hierarchical logic.</li>
        <li><b>Plain GROUP BY</b> gives only the detail, with no subtotal row at all.</li>
      </ul>
      <p class="note"><b>The trio to remember.</b> <code class="inl">ROLLUP</code> = hierarchical subtotals + grand total · <code class="inl">CUBE</code> = all combinations · <code class="inl">GROUPING SETS</code> = explicit list, nothing more.</p>`}
  },
  {
    id:"q243", kind:"fields", type:TY,
