<meta name="description" content="125 questions d'entraînement DP-600 en français et en anglais, par domaine et par étude de cas, avec correction détaillée.">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;background:#E9ECEE}

<title>Révision DP-600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap">

<style>
:root{
  color-scheme: dark;
  --bg:#06090f; --surface:#0b1018; --surface-2:#0f1520;
  --line:rgba(245,158,11,.16); --line-soft:rgba(255,255,255,.06);
  --ink:#f1f5f9; --muted:#8aa0b8;
  --accent:#f59e0b; --accent-ink:#fbbf24; --accent-soft:rgba(245,158,11,.09);
  --ochre:#38bdf8; --ochre-soft:rgba(56,189,248,.09);
  --plum:#f472b6; --plum-soft:rgba(244,114,182,.09);
  --ok:#10b981; --ok-soft:rgba(16,185,129,.1);
  --no:#ef4444; --no-soft:rgba(239,68,68,.1);
  --shadow:none;
  --f-display:"Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Share Tech Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html.light{
  color-scheme: light;
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6;
  --line:rgba(217,119,6,.2); --line-soft:rgba(0,0,0,.07);
  --ink:#1e293b; --muted:#64748b;
  --accent:#d97706; --accent-ink:#b45309; --accent-soft:rgba(217,119,6,.08);
  --ochre:#0284c7; --ochre-soft:rgba(2,132,199,.08);
  --plum:#db2777; --plum-soft:rgba(219,39,119,.08);
  --ok:#059669; --ok-soft:rgba(5,150,105,.1);
  --no:#dc2626; --no-soft:rgba(220,38,38,.08);
  --shadow:0 1px 2px rgba(15,23,42,.04);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);
  font-size:16.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:840px;margin:0 auto;padding-inline:20px;padding-block:0}

.masthead{padding-block:40px 22px;border-bottom:1px solid var(--line)}
.topline{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:10px}
.kicker{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin:0}
.backcv{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;transition:color .2s,border-color .2s}.backcv:hover{color:var(--accent);border-color:var(--accent)}
.spacer{flex:1 1 auto}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;
  overflow:hidden;background:var(--surface)}
.langsw button{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.08em;
  padding:5px 12px;border:none;background:transparent;color:var(--muted);cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .langsw button[aria-pressed="true"]{color:#08201D}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .langsw button[aria-pressed="true"]{color:#08201D}}
.langsw button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

h1{font-family:var(--f-display);font-weight:500;font-size:clamp(34px,7vw,50px);
  line-height:1.06;letter-spacing:-.015em;margin:0;text-wrap:balance}
.dek{color:var(--muted);margin:12px 0 0;max-width:62ch;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;
  font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted)}
.meta b{color:var(--ink);font-weight:700}
.sidelink{display:inline-flex;align-items:center;gap:8px;margin-top:18px;
  font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;
  border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--surface)}
.sidelink:hover{border-color:var(--accent);background:var(--accent-soft)}
.sidelink .arw{font-family:var(--f-mono);opacity:.7}

.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  margin-inline:-20px;padding-inline:20px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-block:9px;padding-right:24px}
.tab{flex:0 0 auto;display:flex;align-items:baseline;gap:8px;
  border:1px solid transparent;background:transparent;color:var(--muted);
  font-family:var(--f-body);font-size:14px;font-weight:600;
  padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .15s, color .15s, border-color .15s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#08201D}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#08201D}}
.tab .n{font-family:var(--f-mono);font-size:11px;opacity:.75}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{padding-block:30px 60px}
.domain-head{margin-bottom:26px}
.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ochre);margin:0 0 8px}
h2{font-family:var(--f-display);font-weight:500;font-size:clamp(25px,4.6vw,33px);
  line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.domain-note{color:var(--muted);margin:10px 0 0;font-size:15.5px;max-width:64ch}

.scorebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  margin-top:20px;padding:12px 16px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface-2)}
.score-txt{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.03em;color:var(--muted)}
.score-txt b{color:var(--ink)}
.score-txt .hit{color:var(--ok)}
button.act{font-family:var(--f-body);font-size:13.5px;font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:6px 13px;border-radius:7px;cursor:pointer;transition:border-color .15s, background .15s}
button.act:hover{border-color:var(--accent);background:var(--accent-soft)}
button.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

details.case{border:1px solid var(--line);border-left:3px solid var(--ochre);
  border-radius:8px;background:var(--surface);margin:0 0 14px;overflow:hidden}
details.case>summary{cursor:pointer;padding:13px 16px;font-weight:600;font-size:14.5px;
  list-style:none;display:flex;align-items:center;gap:10px}
details.case>summary::-webkit-details-marker{display:none}
details.case>summary::after{content:"\25B8";margin-left:auto;color:var(--muted);transition:transform .2s}
details.case[open]>summary::after{transform:rotate(90deg)}
.case-body{padding:0 16px 16px;border-top:1px solid var(--line-soft);font-size:15px}
.case-body h4{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:18px 0 6px;font-weight:700}
.case-body ul{margin:0;padding-left:19px}
.case-body li{margin:3px 0;color:var(--muted)}
.case-body li b{color:var(--ink);font-weight:600}
.case-body p{margin:14px 0 0}
.cases{margin-bottom:22px}

.grp{margin:8px 0 22px;padding-top:4px;scroll-margin-top:72px}
.qlist > .grp:first-child{margin-top:0}
.grp h3{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,4vw,28px);
  line-height:1.15;margin:0;letter-spacing:-.01em;
  padding-bottom:7px;border-bottom:2px solid var(--accent)}
.grp-lead{color:var(--muted);margin:10px 0 0;font-size:15px;max-width:64ch}
.grp-count{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);margin:8px 0 14px;font-weight:700}
.grp details.case{margin-bottom:0}
.tab.tab-cases[aria-selected="true"]{background:var(--ochre);border-color:var(--ochre)}
.tab.tab-cases .n{font-size:12px}

.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden;scroll-margin-top:70px}
.q-head{padding:18px 20px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.qnum{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.qtitle{font-family:var(--f-body);font-weight:600;font-size:14.5px;flex:1 1 100%;
  color:var(--ink);margin-top:2px}
.chip{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;padding:3px 8px;border-radius:5px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line-soft)}
.chip.case{background:var(--ochre-soft);color:var(--ochre);border-color:transparent}
.chip.hot{background:var(--plum-soft);color:var(--plum);border-color:transparent}
.q-stem{padding:10px 20px 4px}
.q-stem p{margin:0 0 9px}
.q-stem p:last-child{margin-bottom:0}
.q-stem .ask{font-weight:600}
.q-stem ul{margin:0 0 9px;padding-left:20px}
.q-stem li{margin:3px 0}

pre.code{font-family:var(--f-mono);font-size:12.7px;line-height:1.62;
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:7px;
  padding:11px 13px;margin:10px 0;overflow-x:auto;color:var(--ink);white-space:pre}
code.inl{font-family:var(--f-mono);font-size:.875em;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:4px;padding:1px 4.5px}

.tbl-wrap{overflow-x:auto;margin:10px 0}
table.schema{border-collapse:collapse;font-size:13.5px;min-width:320px}
table.schema th,table.schema td{border:1px solid var(--line);padding:5px 11px;text-align:left;vertical-align:top}
table.schema th{background:var(--surface-2);font-family:var(--f-mono);font-size:11px;
  letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
table.schema td.m{font-family:var(--f-mono);font-size:12.3px}

.opts{display:flex;flex-direction:column;gap:7px;padding:12px 20px 18px}
.opt{display:flex;gap:11px;align-items:flex-start;
  border:1px solid var(--line);border-radius:9px;padding:10px 13px;
  cursor:pointer;background:var(--surface);transition:border-color .13s, background .13s}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin:0;flex:0 0 auto;margin-top:5px;accent-color:var(--accent);width:15px;height:15px}
.opt .lbl{flex:1 1 auto;min-width:0}
.opt .key{font-family:var(--f-mono);font-weight:700;font-size:13px;margin-right:6px;color:var(--muted)}
.opt pre.code{margin:4px 0 0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--no);background:var(--no-soft)}
.opt .mark{flex:0 0 auto;font-family:var(--f-mono);font-size:11.5px;font-weight:700;
  margin-top:3px;display:none;white-space:nowrap}
.opt.good .mark{display:block;color:var(--ok)}
.opt.bad .mark{display:block;color:var(--no)}
.q.done .opt{cursor:default}
.q.done .opt:hover{border-color:var(--line);background:var(--surface)}
.q.done .opt.good:hover{border-color:var(--ok);background:var(--ok-soft)}
.q.done .opt.bad:hover{border-color:var(--no);background:var(--no-soft)}

.fields{display:flex;flex-direction:column;gap:10px;padding:12px 20px 18px}
.fld{display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:var(--surface)}
.fld .fl{flex:1 1 200px;min-width:0;font-size:15px}
.fld .fl .hint{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.fld select{flex:0 1 280px;font-family:var(--f-body);font-size:14.5px;
  padding:6px 9px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);max-width:100%}
.fld select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fld .verdict{font-family:var(--f-mono);font-size:11.5px;font-weight:700;display:none;flex:0 0 auto}
.fld.good{border-color:var(--ok);background:var(--ok-soft)}
.fld.bad{border-color:var(--no);background:var(--no-soft)}
.fld.good .verdict{display:block;color:var(--ok)}
.fld.bad .verdict{display:block;color:var(--no)}
.fld.bad .verdict .sol{color:var(--ink);font-weight:400}

.q-foot{padding:0 20px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button.check{font-family:var(--f-body);font-size:14px;font-weight:600;
  background:var(--accent);color:#fff;border:1px solid var(--accent);
  padding:8px 17px;border-radius:8px;cursor:pointer}
:root[data-theme="dark"] button.check{color:#08201D}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) button.check{color:#08201D}}
button.check:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
button.check:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.verdict-line{font-family:var(--f-mono);font-size:12.5px;font-weight:700;letter-spacing:.04em}
.verdict-line.ok{color:var(--ok)}
.verdict-line.ko{color:var(--no)}

.explain{border-top:1px solid var(--line-soft);background:var(--surface-2);padding:18px 20px 20px}
.explain h5{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin:0 0 4px;font-weight:700}
.explain .sol{font-family:var(--f-display);font-size:20px;font-weight:600;margin:0 0 12px;line-height:1.3}
.explain p{margin:0 0 11px;font-size:15.5px}
.explain p:last-child{margin-bottom:0}
.explain ul{margin:0 0 11px;padding-left:20px;font-size:15.5px}
.explain li{margin:5px 0}
.explain .why{font-family:var(--f-mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);margin:16px 0 6px;font-weight:700}
.explain .note{border-left:3px solid var(--ochre);padding:8px 0 8px 13px;margin:14px 0 0;
  font-size:14.5px;color:var(--muted)}
.explain .note b{color:var(--ink)}
.explain .contested{border-left:3px solid var(--plum);padding:8px 0 8px 13px;margin:14px 0 0;
  font-size:14.5px;color:var(--muted)}
.explain .contested b{color:var(--ink)}
.explain pre.code{background:var(--surface)}

footer.end{border-top:1px solid var(--line);padding-block:26px 46px;color:var(--muted);font-size:14px}
footer.end b{color:var(--ink)}
footer.end a{color:var(--accent);font-weight:600}

@media (max-width:520px){
  body{font-size:16px}
  .opts,.fields,.q-stem,.q-head,.q-foot{padding-inline:15px}
  .explain{padding-inline:15px}
  pre.code{font-size:11.8px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ════════════════════════════════════════════
   Design aligné sur le CV Nihel Sliti
   ════════════════════════════════════════════ */
html{scroll-behavior:smooth}
html[lang="en"] .fr{display:none!important}
html:not([lang="en"]) .en{display:none!important}
body{transition:background .3s,color .3s}
html:not(.light) body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(245,158,11,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(245,158,11,.025) 1px,transparent 1px);
  background-size:50px 50px}
html.light body::after{background-image:linear-gradient(rgba(217,119,6,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(217,119,6,.06) 1px,transparent 1px)}
.wrap,.cvnav{position:relative;z-index:1}

/* Barre de navigation du CV */
.cvnav{background:var(--bg);border-bottom:1px solid var(--line)}
.cvnav-inner{max-width:880px;margin:0 auto;padding:.55rem 20px;display:flex;align-items:center;
  justify-content:space-between;gap:.8rem;flex-wrap:wrap}
.cv-brand{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:2px;
  text-transform:uppercase;text-decoration:none;white-space:nowrap}
.cv-links{display:flex;gap:.25rem;flex-wrap:wrap}
.cv-link{font-family:var(--f-mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
  padding:4px 9px;border-radius:2px;border:1px solid transparent;color:var(--ink);text-decoration:none;transition:all .2s}
.cv-link:hover,.cv-link.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.cv-tools{display:flex;align-items:center;gap:.45rem}
.theme-btn{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 8px;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--f-mono);font-size:10px;
  color:var(--ink);letter-spacing:1px;text-transform:uppercase;transition:all .2s;white-space:nowrap}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
html.light .th-d, html:not(.light) .th-l{display:none}
.langsw{border-color:var(--line);border-radius:20px;background:var(--surface)}
.langsw button{font-size:10px;font-weight:400;letter-spacing:1px;padding:4px 9px;color:var(--ink)}
.langsw button:hover{color:var(--accent)}
.langsw button[aria-pressed="true"]{background:var(--accent);color:#06090f!important}

/* Typographie */
h1{font-family:var(--f-display);font-weight:800;letter-spacing:1px;line-height:1;font-size:clamp(2.3rem,6vw,3.6rem)}
h2{font-family:var(--f-display);font-weight:700;letter-spacing:.5px}
.grp h3{font-family:var(--f-display);font-weight:700;letter-spacing:.5px;border-bottom-width:1px}
.explain .sol{font-family:var(--f-display);font-weight:700;letter-spacing:.3px}
.kicker,.eyebrow{letter-spacing:3px;font-weight:400;color:var(--accent)}
.kicker::before{content:"// "}
.meta,.chip,.qnum,.tab .n,.score-txt,.grp-count,.explain h5,.explain .why,.verdict-line,.opt .key,.opt .mark,
.fld .verdict,.fld .fl .hint,th,.case-body h4,table.schema th{font-weight:400}
.meta b,.score-txt b{font-weight:400;color:var(--accent)}
.dek,.domain-note,.grp-lead,.sub{font-weight:300}
html.light .dek,html.light .domain-note,html.light .grp-lead,html.light .sub{font-weight:400}
.masthead{padding-block:34px 22px}

/* Onglets = liens de navigation du CV */
.tabbar{background:var(--bg);backdrop-filter:none}
.tab{font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:1.2px;text-transform:uppercase;
  border-radius:3px;padding:6px 11px;color:var(--ink)}
.tab:hover{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)!important;border-color:var(--accent)}
.tab.tab-cases[aria-selected="true"]{background:var(--ochre-soft);color:var(--ochre)!important;border-color:var(--ochre)}
.jumps a{font-family:var(--f-mono);font-size:10.5px;font-weight:400;letter-spacing:1.2px;text-transform:uppercase;
  border-radius:3px;border:1px solid transparent;color:var(--ink)}
.jumps a:hover{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
nav.jump{background:var(--bg);backdrop-filter:none}

/* Cartes */

const CASE_CONTOSO = {
fr:`<div class="case-body">
  <p>Contoso, Ltd. — société américaine de compléments alimentaires. Deux divisions : <b>Sales</b> (départements Online Sales et Retail Sales) et <b>Research</b> (lignes de produits confiées à des équipes de chercheurs et d'analystes).</p>

en:`<div class="case-body">
  <p>Contoso, Ltd. is a US-based health supplements company with two divisions, <b>Sales</b> (Online Sales and Retail Sales departments) and <b>Research</b>, which assigns internally developed product lines to individual teams of researchers and analysts.</p>
  <h4>Existing environment</h4>
  <ul>
    <li>Microsoft Entra tenant <b>contoso.com</b>, containing <b>ResearchReviewersGroup1</b> and <b>ResearchReviewersGroup2</b>.</li>
    <li>The Sales division uses a <b>Power BI Premium</b> capacity.</li>
    <li>The Online Sales semantic model includes a fact table named <b>Orders</b> that uses <b>Import</b> mode. In the system of origin, <b>the OrderID value represents the sequence in which orders are created</b>.</li>
    <li>The Research division uses an on-premises, third-party data warehousing product.</li>
    <li><b>storage1</b> (ADLS Gen2) holds Research data for Productline1, in <b>delta</b> format.</li>
    <li><b>storage2</b> (ADLS Gen2) holds Research data for Productline2, in <b>CSV</b> format.</li>
  </ul>
  <h4>Planned changes</h4>
  <ul>
    <li>Enable Fabric support in the Sales division's Premium capacity.</li>
    <li>Create Fabric workspaces named <b>Productline1ws</b> and <b>Productline2ws</b>.</li>
    <li>In Productline1ws, create a lakehouse named <b>Lakehouse1</b>.</li>
    <li>In Lakehouse1, create a <b>shortcut to storage1 named ResearchProduct</b>.</li>
  </ul>
  <h4>Data analytics requirements</h4>
  <ul>
    <li>All workspaces must support <b>all Fabric experiences</b>.</li>
    <li>The Research workspaces must use a <b>dedicated, on-demand capacity that has per-minute billing</b>.</li>
    <li>They must be <b>grouped together logically</b> to support OneLake data hub filtering based on the department name.</li>
    <li>ResearchReviewersGroup1 must read lakehouse and warehouse data and shortcuts <b>by using SQL endpoints</b>. ResearchReviewersGroup2 must read lakehouse data <b>by using Lakehouse explorer</b>.</li>
    <li>All Research semantic models and reports must use <b>version control that supports branching</b>.</li>
  </ul>
  <h4>Data preparation and semantic models</h4>
  <ul>
    <li>Productline1 data must be retrieved from Lakehouse1 <b>by using Fabric notebooks</b>.</li>

  <ul><li>Follow the <b>principle of least privilege</b> · <b>minimize</b> implementation and maintenance effort.</li></ul>
</div>`};

  <h4>Données disponibles</h4>

    <li><b>Customer satisfaction surveys</b> — SurveyMonkey, <b>500 Go</b>. Tables Survey, Question, Response. Une ligne par enquête dans Survey, une ligne par question dans Response. <b>La troisième question de chaque enquête est le score de satisfaction globale.</b></li>

</div>`,
en:`<div class="case-body">
  <p>Litware, Inc. is a manufacturing company with offices throughout North America. The analytics team contains <b>data engineers</b>, <b>analytics engineers</b>, <b>data analysts</b> and <b>data scientists</b>. Litware has used a Power BI tenant for three years and has <b>NOT enabled any Fabric capacities or features</b>.</p>
  <h4>Available data</h4>
  <ul>
    <li><b>Customer data</b> — from the CRM system, <b>50 MB</b>.</li>
    <li><b>Product data</b> — from the CRM system, 200 MB. A single table: ProductID, ProductName, ProductCategory, ListPrice.</li>
    <li><b>Customer satisfaction surveys</b> — SurveyMonkey, <b>500 GB</b>. Survey, Question and Response tables. One row per survey in Survey, one row per question in Response. <b>The third question in each survey response is an overall satisfaction score.</b></li>
  </ul>
  <h4>User problems</h4>
  <ul>
    <li>Large volumes, some of it <b>semi-structured</b>. The team wants to use Fabric to create a new data store.</li>
    <li>Pricing group logic (high / medium / low) is <b>implemented in several databases and semantic models, and does NOT always match</b>.</li>
  </ul>
  <h4>Planned changes</h4>
  <ul>
    <li><b>AnalyticsPOC</b>: will contain the data store, semantic models, reports, pipelines, dataflows and notebooks used to populate it.</li>
    <li><b>DataEngPOC</b>: pipelines, dataflows and notebooks used to populate OneLake. <b>DataSciPOC</b>: notebooks and reports created by the data scientists.</li>
    <li><b>Whenever possible, the data engineers will use low-code tools for data ingestion.</b></li>
  </ul>
  <h4>Technical requirements</h4>
  <ul>
    <li>The data store must support: <b>read access by using T-SQL or Python</b>; <b>semi-structured and unstructured data</b>; <b>row-level security</b> for users executing T-SQL queries.</li>
    <li>Files loaded to OneLake will be stored in <b>Parquet</b> format and meet Delta Lake specifications.</li>
    <li>Data loaded without transformation into one area, then cleansed, merged and transformed into a <b>dimensional model</b>.</li>
    <li>The pricing group logic must be maintained in a <b>single location</b> and made available for T-SQL queries <b>and in the default semantic model</b>. List prices <b>greater than 50 and less than or equal to 1,000</b> are in the medium group.</li>
    <li>The data load process must ensure that the <b>raw and cleansed data is updated completely before</b> populating the dimensional model.</li>

  <h4>Security requirements</h4>
  <ul>
    <li><b>Data engineers</b>: read from and write to the data store. <b>No access must be granted to datasets or reports.</b></li>

    <li><b>Data scientists</b>: read only. <b>They will access the data by using a Spark notebook.</b></li>

    <li>Show data <b>as soon as it is updated</b>; respect <b>table-level security</b> in the source; <b>minimize query execution time</b>.</li>
  </ul>
</div>`};

const TESTS = [
{
  id:"d1", n:1, short:{fr:"Solution",en:"Solution"}, weight:{fr:"10–15 % de l'examen",en:"10–15 % of the exam"},
  title:{fr:"Planifier, implémenter et gérer une solution d'analyse",
         en:"Plan, implement and manage a solution for data analytics"},
  note:{fr:"Gouvernance du tenant, capacités, domaines, permissions, cycle de vie et contrôle de version. Peu de questions à l'examen, mais elles se jouent presque toutes sur un seul mot de l'énoncé — ou sur le niveau où se règle un paramètre.",
        en:"Tenant governance, capacities, domains, permissions, lifecycle and version control. Few questions on the exam, but nearly all of them turn on a single word in the stem — or on the level at which a setting lives."},
  cases:["contoso","litware"],
  questions:[
  {
    id:"q101", kind:"single", tag:"contoso", type:T1,
    title:{fr:"Contrôle de version pour la division Research",en:"Version control for the Research division"},
    stem:{fr:`<p>Vous devez garantir que Contoso puisse utiliser le <b>contrôle de version</b> pour satisfaire les exigences d'analyse de données et les exigences générales.</p><p class="ask">Que devez-vous faire ?</p>`,
          en:`<p>You need to ensure that Contoso can use <b>version control</b> to meet the data analytics requirements and the general requirements.</p><p class="ask">What should you do?</p>`},
    options:[
      {k:"A", fr:"Stocker tous les modèles sémantiques et rapports dans un stockage Data Lake Gen2.", en:"Store all the semantic models and reports in Data Lake Gen2 storage."},
      {k:"B", fr:"Modifier les paramètres des espaces de travail Research pour utiliser un dépôt GitHub.", en:"Modify the settings of the Research workspaces to use a GitHub repository."},
      {k:"C", fr:"Modifier les paramètres des espaces de travail de la division Research pour utiliser un dépôt Azure Repos.", en:"Modify the settings of the Research division workspaces to use an Azure Repos repository."},
      {k:"D", fr:"Stocker tous les modèles sémantiques et rapports dans Microsoft OneDrive.", en:"Store all the semantic models and reports in Microsoft OneDrive."}
    ],
    answer:["C"],
    explain:{fr:`
      <p>Deux fragments de l'énoncé suffisent : un contrôle de version <b>qui prend en charge le branching</b>, et l'exigence générale de <b>minimiser l'effort</b>.</p>
      <p>Le mot <i>branching</i> est un signal absolu : dès qu'il apparaît, toute option de type stockage tombe sans même être lue. Il ne reste que des dépôts Git.</p>
      <p>Fabric intègre nativement une fonctionnalité <b>Git integration</b>, activable dans les paramètres de l'espace de travail. Elle synchronise les éléments Fabric avec un dépôt, permet de travailler sur des branches, de committer et de recharger depuis l'interface — sans outillage externe.</p>
      <p class="why">Le vrai discriminant : C plutôt que B</p>
      <p>C'est là que se joue la question, puisque GitHub est bien du Git avec branching. Deux arguments écartent B :</p>
      <ul>
        <li><b>Le support produit.</b> L'intégration Git de Fabric a été lancée avec Azure DevOps / Azure Repos uniquement ; GitHub est arrivé plus tard, en préversion.</li>
        <li><b>Le mot <i>effort</i>.</b> L'écosystème Microsoft (Entra, contoso.com, Fabric) s'intègre nativement avec Azure DevOps : même identité, même tenant, aucune fédération à mettre en place.</li>
      </ul>
      <p class="why">Les deux options de stockage</p>
      <ul>
        <li><b>A — Data Lake Gen2.</b> Stocke des fichiers. Aucun commit, aucune branche, aucun merge.</li>
        <li><b>D — OneDrive.</b> Fait du versioning de fichiers, ce qui n'a rien à voir avec du branching. Distracteur classique jouant sur l'ambiguïté du mot <i>version</i>.</li>
      </ul>
      <p class="note"><b>Règle à emporter.</b> Entre deux fournisseurs Git valides, tranchez avec le contexte : Azure Repos est le choix par défaut dans un environnement Microsoft/Entra, sauf si l'énoncé mentionne explicitement GitHub comme déjà en place.</p>`,
      en:`
      <p>Two fragments of the stem are enough: version control <b>that supports branching</b>, and the general requirement to <b>minimize effort</b>.</p>
      <p>The word <i>branching</i> is an absolute signal: the moment it appears, every storage-type option falls without being read. Only Git repositories remain.</p>
      <p>Fabric has a native <b>Git integration</b> feature, enabled in the workspace settings. It syncs Fabric items with a repository, lets you work on branches, commit and update from inside Fabric — with no external tooling.</p>
      <p class="why">The real discriminator: C rather than B</p>
      <p>This is where the question is decided, since GitHub is Git and does support branching. Two arguments rule out B:</p>
      <ul>
        <li><b>Product support.</b> Fabric's Git integration shipped with Azure DevOps / Azure Repos only; GitHub support arrived later, in preview.</li>
        <li><b>The word <i>effort</i>.</b> The Microsoft ecosystem (Entra, contoso.com, Fabric) integrates natively with Azure DevOps: same identity, same tenant, no federation to set up.</li>
      </ul>
      <p class="why">The two storage options</p>
      <ul>
        <li><b>A — Data Lake Gen2.</b> Stores files. No commits, no branches, no merges.</li>
        <li><b>D — OneDrive.</b> Does file versioning, which has nothing to do with branching. A classic distractor playing on the ambiguity of the word <i>version</i>.</li>
      </ul>
      <p class="note"><b>Rule to take away.</b> Between two valid Git providers, decide on context: Azure Repos is the default choice in a Microsoft/Entra environment, unless the stem explicitly names GitHub as already in place.</p>`}
  },
  {
    id:"q102", kind:"fields", tag:"contoso", type:TH,
    title:{fr:"Regrouper les espaces de travail Research",en:"Grouping the Research division workspaces"},
    stem:{fr:`<p>Vous devez recommander une solution pour <b>regrouper les espaces de travail de la division Research</b>.</p><p class="ask">Que devez-vous inclure dans la recommandation ?</p>`,
          en:`<p>You need to recommend a solution to <b>group the Research division workspaces</b>.</p><p class="ask">What should you include in the recommendation?</p>`},
    fields:[
      {label:{fr:"Grouping method",en:"Grouping method"}, hint:{fr:"Méthode de regroupement",en:"Grouping method"},
       opts:{fr:["Capacity","Domain","Tenant"],en:["Capacity","Domain","Tenant"]}, ans:1},
      {label:{fr:"Tool",en:"Tool"}, hint:{fr:"Outil de configuration",en:"Configuration tool"},
       opts:{fr:["OneLake data hub","The Fabric Admin portal","The Microsoft Entra admin center"],en:["OneLake data hub","The Fabric Admin portal","The Microsoft Entra admin center"]}, ans:1}
    ],
    explain:{fr:`
      <p>Une seule phrase compte : <i>« The Research division workspaces must be grouped together <b>logically</b> to support <b>OneLake data hub filtering</b> based on the department name. »</i></p>
      <p class="why">Domain</p>
      <p>Dans Fabric, un <b>domaine</b> est le mécanisme conçu pour regrouper logiquement des espaces de travail par secteur d'activité ou département. Une fois les espaces assignés, on peut <b>filtrer par domaine dans le OneLake data hub</b> — l'exigence décrit la fonctionnalité mot pour mot.</p>
      <ul>
        <li><b>Capacity</b> — regroupe de la puissance de calcul et de la facturation, pas du métier. Elle répond à une <i>autre</i> exigence du même dossier, celle de la capacité facturée à la minute.</li>
        <li><b>Tenant</b> — déjà unique (contoso.com). On ne regroupe rien avec.</li>
      </ul>
      <p class="why">The Fabric Admin portal</p>
      <p>Les domaines se créent dans <b>Admin portal → Domains</b>, par un administrateur Fabric ou un administrateur de domaine délégué. C'est là qu'on crée le domaine, qu'on lui assigne des espaces de travail et qu'on désigne ses contributeurs.</p>
      <ul>
        <li><b>OneLake data hub</b> — là où l'on <i>consomme</i> le filtre, pas où on le crée.</li>
        <li><b>Microsoft Entra admin center</b> — gère les identités et les groupes, pas les objets Fabric.</li>
      </ul>
      <p class="note"><b>Le piège.</b> Ne confondez jamais l'outil de création avec l'outil de consultation. C'est le même schéma que pour le XMLA endpoint : le lieu de configuration n'est pas le lieu d'usage.</p>`,
      en:`
      <p>Only one sentence matters: <i>"The Research division workspaces must be grouped together <b>logically</b> to support <b>OneLake data hub filtering</b> based on the department name."</i></p>
      <p class="why">Domain</p>
      <p>In Fabric, a <b>domain</b> is the mechanism designed to group workspaces logically by business area or department. Once workspaces are assigned, users can <b>filter by domain in the OneLake data hub</b> — the requirement describes the feature word for word.</p>
      <ul>
        <li><b>Capacity</b> — groups compute power and billing, not business meaning. It answers a <i>different</i> requirement in the same dossier, the per-minute billed capacity.</li>
        <li><b>Tenant</b> — already unique (contoso.com). It groups nothing.</li>
      </ul>
      <p class="why">The Fabric Admin portal</p>
      <p>Domains are created in <b>Admin portal → Domains</b>, by a Fabric administrator or a delegated domain admin. That is where you create the domain, assign workspaces to it and name its contributors.</p>
      <ul>
        <li><b>OneLake data hub</b> — where the filter is <i>consumed</i>, not where it is created.</li>
        <li><b>Microsoft Entra admin center</b> — manages identities and groups, not Fabric items.</li>
      </ul>
      <p class="note"><b>The trap.</b> Never confuse the tool that creates something with the tool that displays it. Same pattern as the XMLA endpoint: the place you configure is not the place you use.</p>`}
  },
  {
    id:"q103", kind:"single", tag:"contoso", type:T1,
    title:{fr:"Quel SKU de capacité Fabric",en:"Which Fabric capacity SKU"},
    stem:{fr:`<p>Vous devez recommander le <b>type de SKU de capacité Fabric</b> qui satisfait les exigences d'analyse de données de la division Research.</p><p class="ask">Que devez-vous recommander ?</p>`,
          en:`<p>You need to recommend which <b>type of Fabric capacity SKU</b> meets the data analytics requirements for the Research division.</p><p class="ask">What should you recommend?</p>`},
    options:[{k:"A",fr:"A",en:"A"},{k:"B",fr:"EM",en:"EM"},{k:"C",fr:"P",en:"P"},{k:"D",fr:"F",en:"F"}],
    answer:["D"],
    explain:{fr:`
      <p>La phrase décisive : <i>« a <b>dedicated</b>, <b>on-demand</b> capacity that has <b>per-minute billing</b>. »</i> Trois mots, trois contraintes — et la facturation à la minute est le discriminant absolu.</p>
      <p>Le SKU <b>F (Fabric capacity)</b> s'achète depuis le portail Azure, se met en pause et reprend à la demande, et se facture à la minute d'utilisation. Suspendu, il ne coûte plus de calcul.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>SKU</th><th>Ce que c'est</th><th>Facturation</th></tr>
        <tr><td class="m">A</td><td>Azure Power BI Embedded</td><td>Horaire, pour applications embarquées</td></tr>
        <tr><td class="m">EM</td><td>Embedded avec engagement</td><td>Mensuelle, pas de pause possible</td></tr>
        <tr><td class="m">P</td><td>Power BI Premium par capacité</td><td>Mensuelle ou annuelle, engagement</td></tr>
        <tr><td class="m">F</td><td>Fabric capacity</td><td>À la minute, pause et reprise à volonté</td></tr>
      </table></div>
      <p>EM et P tombent tous deux sur le critère de facturation : engagement périodique, aucune granularité à la minute. A se facture à l'heure et vise l'embedding dans des applications tierces, pas l'hébergement des espaces de travail d'une division métier.</p>
      <p class="note"><b>Deux exigences convergent.</b> La première ligne du même bloc — <i>« All the workspaces must support all Fabric experiences »</i> — confirme F : seules les capacités F (et les capacités P avec Fabric activé) donnent accès à l'ensemble des charges de travail. Quand deux exigences pointent la même réponse, on répond avec confiance.</p>`,
      en:`
      <p>The decisive sentence: <i>"a <b>dedicated</b>, <b>on-demand</b> capacity that has <b>per-minute billing</b>."</i> Three words, three constraints — and per-minute billing is the absolute discriminator.</p>
      <p>The <b>F (Fabric capacity)</b> SKU is bought from the Azure portal, pauses and resumes on demand, and bills by the minute of use. While suspended, it costs no compute.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>SKU</th><th>What it is</th><th>Billing</th></tr>
        <tr><td class="m">A</td><td>Azure Power BI Embedded</td><td>Hourly, for embedded applications</td></tr>
        <tr><td class="m">EM</td><td>Embedded with a commitment</td><td>Monthly, cannot be paused</td></tr>
        <tr><td class="m">P</td><td>Power BI Premium per capacity</td><td>Monthly or annual, committed</td></tr>
        <tr><td class="m">F</td><td>Fabric capacity</td><td>Per minute, pause and resume at will</td></tr>
      </table></div>
      <p>EM and P both fail on billing: a periodic commitment, no per-minute granularity. A bills hourly and targets embedding in third-party applications, not hosting a business division's workspaces.</p>
      <p class="note"><b>Two requirements converge.</b> The first line of the same block — <i>"All the workspaces must support all Fabric experiences"</i> — confirms F: only F capacities (and P capacities with Fabric enabled) give access to every workload. When two requirements point at the same answer, answer with confidence.</p>`}
  },
  {
    id:"q104", kind:"fields", tag:"litware", contested:true, type:TH,
    title:{fr:"Permissions au partage du data store",en:"Permissions when sharing the data store"},
    stem:{fr:`<p>Vous devez assigner les permissions du data store de l'espace de travail AnalyticsPOC, en respectant les exigences de sécurité.</p><p class="ask">Quelles permissions supplémentaires assigner lors du partage du data store ?</p>`,
          en:`<p>You need to assign permissions for the data store in the AnalyticsPOC workspace. The solution must meet the security requirements.</p><p class="ask">Which additional permissions should you assign when you share the data store?</p>`},
    fields:[
      {label:{fr:"DataEngineers",en:"DataEngineers"}, hint:{fr:"lire ET écrire",en:"read AND write"},
       opts:{fr:["Build Reports on the default dataset","Read All Apache Spark","Read All SQL analytics endpoint data"],en:["Build Reports on the default dataset","Read All Apache Spark","Read All SQL analytics endpoint data"]}, ans:1},
      {label:{fr:"DataAnalysts",en:"DataAnalysts"}, hint:{fr:"créer des rapports",en:"build reports"},
       opts:{fr:["Build Reports on the default dataset","Read All Apache Spark","Read All SQL analytics endpoint data"],en:["Build Reports on the default dataset","Read All Apache Spark","Read All SQL analytics endpoint data"]}, ans:0},
      {label:{fr:"DataScientists",en:"DataScientists"}, hint:{fr:"lecture seule",en:"read only"},
       opts:{fr:["Build Reports on the default dataset","Read All Apache Spark","Read All SQL analytics endpoint data"],en:["Build Reports on the default dataset","Read All Apache Spark","Read All SQL analytics endpoint data"]}, ans:2}
    ],
    explain:{fr:`
      <p>Le partage de base d'un data store Fabric ne donne que la permission <b>Read</b> : « je peux me connecter à l'objet ». Aucune donnée n'est lisible sans grant supplémentaire, et chaque case débloque un <b>moteur d'accès différent</b>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>Canal débloqué</th></tr>
        <tr><td>Read All SQL analytics endpoint data</td><td class="m">T-SQL (ReadData)</td></tr>
        <tr><td>Read All Apache Spark</td><td class="m">Notebooks Spark (ReadAll)</td></tr>
        <tr><td>Build Reports on the default dataset</td><td class="m">Modèle sémantique par défaut (Build)</td></tr>
      </table></div>
      <p class="why">La logique du corrigé officiel : lire le <b>niveau d'accès</b>, pas l'outil</p>
      <p>La clé de cette question n'est pas « quel outil chaque métier utilise-t-il », mais <b>« de quelle profondeur d'accès chacun a-t-il besoin »</b> — et les trois permissions forment une échelle décroissante.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Permission</th><th>Portée réelle</th></tr>
        <tr><td><b>Read All Apache Spark</b></td><td>Accès <b>direct aux fichiers</b> OneLake. La plus large des trois : elle contourne toute sécurité définie dans le moteur SQL.</td></tr>
        <tr><td><b>Read All SQL analytics endpoint data</b></td><td>Lecture <b>en T-SQL</b>, <b>lecture seule</b> par nature, et la <b>RLS et la sécurité au niveau table s'appliquent</b>.</td></tr>
        <tr><td><b>Build Reports on the default dataset</b></td><td>La plus étroite : consommer le modèle sémantique par défaut pour bâtir des rapports.</td></tr>
      </table></div>
      <p class="why">DataEngineers → Read All Apache Spark</p>
      <p>Exigence : <i>« read from <b>and write to</b> the data store »</i>. Seul l'accès Spark, au niveau des fichiers, permet d'écrire — le SQL analytics endpoint est en lecture seule. Et l'autre moitié de la phrase, <i>« <b>No access must be granted to datasets or reports</b> »</i>, interdit formellement de leur donner <i>Build Reports</i>.</p>
      <p class="why">DataAnalysts → Build Reports on the default dataset</p>
      <p>Exigence : <i>« create Power BI reports »</i>. C'est la permission qui porte littéralement ce verbe. Elle est aussi la plus restrictive des trois, ce qui satisfait <i>« read access to <b>only</b> the dimensional model objects »</i>.</p>
      <p class="why">DataScientists → Read All SQL analytics endpoint data</p>
      <p>C'est la ligne la plus surprenante, et la plus instructive. Exigence : <i>« <b>read only</b> »</i>. Le SQL analytics endpoint est <b>structurellement en lecture seule</b> : aucun INSERT, UPDATE ou DELETE n'y est possible. À l'inverse, <i>Read All Apache Spark</i> ouvre les fichiers OneLake — un accès bien plus large que « read only ».</p>
      <p class="contested"><b>Le piège, et il est redoutable.</b> L'énoncé précise <i>« They will access the data by using a <b>Spark notebook</b> »</i>, ce qui pousse irrésistiblement vers <i>Read All Apache Spark</i> pour les data scientists. Le corrigé officiel ne suit pas cette phrase : il applique le <b>moindre privilège</b> à l'exigence <i>read only</i>, et laisse l'accès Spark — le plus large — à ceux qui doivent écrire. Retenez la clé officielle, mais sachez que cette phrase reste la principale objection au corrigé.</p>
      <p class="note"><b>Le réflexe à corriger.</b> On croit spontanément que ces questions se résolvent sur <b>l'outil cité</b> (Spark notebook → permission Spark). Le corrigé officiel montre qu'elles se résolvent sur le <b>niveau de privilège</b> : qui doit écrire reçoit l'accès le plus large, qui est en lecture seule reçoit le canal le plus contraint. Classez d'abord les trois permissions de la plus large à la plus étroite, puis les trois métiers du plus au moins privilégié, et alignez les deux listes.</p>`,
      en:`
      <p>Basic sharing of a Fabric data store grants only <b>Read</b>: "I can connect to the object." No data is readable without a further grant, and each checkbox unlocks a <b>different access engine</b>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>Channel unlocked</th></tr>
        <tr><td>Read All SQL analytics endpoint data</td><td class="m">T-SQL (ReadData)</td></tr>
        <tr><td>Read All Apache Spark</td><td class="m">Spark notebooks (ReadAll)</td></tr>
        <tr><td>Build Reports on the default dataset</td><td class="m">Default semantic model (Build)</td></tr>
      </table></div>
      <p class="why">The official key's logic: read the <b>access level</b>, not the tool</p>
      <p>The key to this question is not "which tool does each role use" but <b>"how deep an access does each one need"</b> — and the three permissions form a decreasing ladder.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Permission</th><th>Actual reach</th></tr>
        <tr><td><b>Read All Apache Spark</b></td><td><b>Direct access to the OneLake files</b>. The broadest of the three: it bypasses any security defined in the SQL engine.</td></tr>
        <tr><td><b>Read All SQL analytics endpoint data</b></td><td>Reading <b>in T-SQL</b>, <b>read-only</b> by nature, and <b>RLS and table-level security apply</b>.</td></tr>
        <tr><td><b>Build Reports on the default dataset</b></td><td>The narrowest: consuming the default semantic model to build reports.</td></tr>
      </table></div>
      <p class="why">DataEngineers → Read All Apache Spark</p>
      <p>Requirement: <i>"read from <b>and write to</b> the data store"</i>. Only Spark access, at file level, allows writing — the SQL analytics endpoint is read-only. And the other half of the sentence, <i>"<b>No access must be granted to datasets or reports</b>"</i>, formally forbids giving them <i>Build Reports</i>.</p>
      <p class="why">DataAnalysts → Build Reports on the default dataset</p>
      <p>Requirement: <i>"create Power BI reports"</i>. This is the permission that literally carries that verb. It is also the most restrictive of the three, which satisfies <i>"read access to <b>only</b> the dimensional model objects"</i>.</p>
      <p class="why">DataScientists → Read All SQL analytics endpoint data</p>
      <p>The most surprising row, and the most instructive. Requirement: <i>"<b>read only</b>"</i>. The SQL analytics endpoint is <b>structurally read-only</b>: no INSERT, UPDATE or DELETE is possible there. Conversely, <i>Read All Apache Spark</i> opens the OneLake files — a far broader access than "read only".</p>
      <p class="contested"><b>The trap, and it is a formidable one.</b> The stem states <i>"They will access the data by using a <b>Spark notebook</b>"</i>, which pushes irresistibly toward <i>Read All Apache Spark</i> for the data scientists. The official key does not follow that sentence: it applies <b>least privilege</b> to the <i>read only</i> requirement and leaves Spark access — the broadest — to those who must write. Keep the official key, but know that this sentence remains the main objection to it.</p>
      <p class="note"><b>The reflex to correct.</b> One instinctively assumes these questions are settled by the <b>named tool</b> (Spark notebook → Spark permission). The official key shows they are settled by <b>privilege level</b>: whoever must write gets the broadest access, whoever is read-only gets the most constrained channel. Rank the three permissions from broadest to narrowest, rank the three roles from most to least privileged, and line up the two lists.</p>`}
  },
  {
    id:"q105", kind:"single", type:T1,
    title:{fr:"Où se configure le XMLA endpoint",en:"Where the XMLA endpoint is configured"},
    stem:{fr:`<p>Vous avez un tenant Fabric nommé <b>Tenant1</b> contenant un espace de travail <b>WS1</b>. WS1 utilise une capacité nommée <b>C1</b> et contient un dataset nommé <b>DS1</b>. Vous devez garantir un accès <b>en lecture-écriture</b> à DS1 via le point de terminaison XMLA.</p><p class="ask">Que devez-vous modifier en premier ?</p>`,
          en:`<p>You have a Fabric tenant named <b>Tenant1</b> that contains a workspace named <b>WS1</b>. WS1 uses a capacity named <b>C1</b> and contains a dataset named <b>DS1</b>. You need to ensure <b>read-write</b> access to DS1 is available by using the XMLA endpoint.</p><p class="ask">What should be modified first?</p>`},
    options:[
      {k:"A", fr:"Les paramètres de DS1.", en:"The DS1 settings."},
      {k:"B", fr:"Les paramètres de WS1.", en:"The WS1 settings."},
      {k:"C", fr:"Les paramètres de C1.", en:"The C1 settings."},
      {k:"D", fr:"Les paramètres de Tenant1.", en:"The Tenant1 settings."}
    ],
    answer:["C"],
    explain:{fr:`
      <p>Le mode du XMLA endpoint est une <b>propriété de la capacité</b>, pas du workspace ni du dataset. On le trouve dans <i>Admin portal → Capacity settings → Power BI workloads → XMLA Endpoint</i>, avec trois valeurs : <b>Off</b>, <b>Read</b> (défaut sur beaucoup de SKU) et <b>Read Write</b>.</p>
      <p class="why">Le mot <i>first</i></p>
      <p>L'énoncé demande ce qu'il faut modifier <b>en premier</b>, ce qui suggère une hiérarchie — et c'est exact : le réglage de la capacité est bloquant. Tant que C1 est sur Read, aucun paramètre de workspace ou de dataset ne pourra autoriser l'écriture. C'est l'héritage descendant de Fabric : un niveau supérieur ne se contourne jamais par un niveau inférieur.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — DS1.</b> Les paramètres d'un dataset couvrent la planification du rafraîchissement, les identifiants de source, le mode de stockage, l'endorsement. Aucune option XMLA.</li>
        <li><b>B — WS1.</b> Nom, description, accès, capacité d'affectation, intégration Git. Le workspace <i>hérite</i> du mode XMLA de sa capacité, il ne le définit pas.</li>
        <li><b>D — Tenant1.</b> Le distracteur le plus crédible, car beaucoup de bascules Fabric se règlent au niveau du tenant. Mais le XMLA endpoint se configure par capacité, ce qui permet des politiques différentes — Read Write en production, Read en test.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Type de paramètre</th><th>Niveau</th></tr>
        <tr><td>XMLA endpoint, taille du workload, mémoire, réglages Spark</td><td><b>Capacité</b></td></tr>
        <tr><td>Activation de Fabric, création de workspaces, domaines, partage externe</td><td><b>Tenant</b></td></tr>
        <tr><td>Rôles d'accès, capacité d'affectation, intégration Git, OneDrive</td><td><b>Workspace</b></td></tr>
        <tr><td>Rafraîchissement planifié, identifiants, endorsement</td><td><b>Dataset / élément</b></td></tr>
      </table></div>
      <p class="note"><b>La logique sous-jacente.</b> Tout ce qui touche aux ressources de calcul se règle sur la capacité ; tout ce qui touche à la gouvernance globale, sur le tenant. Le XMLA endpoint est un mode d'accès au moteur Analysis Services — donc du calcul, donc la capacité.</p>`,
      en:`
      <p>The XMLA endpoint mode is a <b>property of the capacity</b>, not of the workspace or the dataset. It lives in <i>Admin portal → Capacity settings → Power BI workloads → XMLA Endpoint</i>, with three values: <b>Off</b>, <b>Read</b> (the default on many SKUs) and <b>Read Write</b>.</p>
      <p class="why">The word <i>first</i></p>
      <p>The stem asks what must be changed <b>first</b>, which implies a hierarchy — and there is one: the capacity setting is blocking. While C1 is on Read, no workspace or dataset setting can authorise writes. This is Fabric's downward inheritance: a higher level is never bypassed from below.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — DS1.</b> Dataset settings cover refresh scheduling, source credentials, storage mode, endorsement. No XMLA option.</li>
        <li><b>B — WS1.</b> Name, description, access, capacity assignment, Git integration. The workspace <i>inherits</i> its capacity's XMLA mode; it does not define it.</li>
        <li><b>D — Tenant1.</b> The most credible distractor, since many Fabric switches are tenant-level. But the XMLA endpoint is configured per capacity, which allows different policies — Read Write in production, Read in test.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Setting type</th><th>Level</th></tr>
        <tr><td>XMLA endpoint, workload size, memory, Spark settings</td><td><b>Capacity</b></td></tr>
        <tr><td>Enabling Fabric, workspace creation, domains, external sharing</td><td><b>Tenant</b></td></tr>
        <tr><td>Access roles, capacity assignment, Git integration, OneDrive</td><td><b>Workspace</b></td></tr>
        <tr><td>Scheduled refresh, credentials, endorsement</td><td><b>Dataset / item</b></td></tr>
      </table></div>
      <p class="note"><b>The underlying logic.</b> Anything touching compute resources is set on the capacity; anything touching organisation-wide governance is set on the tenant. The XMLA endpoint is an access mode to the Analysis Services engine — so compute, so capacity.</p>`}
  },
  {
    id:"q106", kind:"multi", type:TM,
    title:{fr:"Admin portal — publier des modèles Direct Lake",en:"Admin portal — publishing Direct Lake models"},
    stem:{fr:`<p>Vous avez un tenant Fabric contenant un espace de travail <b>Workspace1</b> assigné à une capacité Fabric. Vous devez permettre aux utilisateurs de <b>créer et publier des modèles sémantiques Direct Lake personnalisés en utilisant des outils externes</b>, en suivant le principe du moindre privilège.</p><p class="ask">Quelles <b>trois</b> actions du portail d'administration Fabric devez-vous inclure ?</p>`,
          en:`<p>You have a Fabric tenant that contains a workspace named <b>Workspace1</b>, assigned to a Fabric capacity. You need to recommend a solution that lets users <b>create and publish custom Direct Lake semantic models by using external tools</b>. The solution must follow the principle of least privilege.</p><p class="ask">Which <b>three</b> actions in the Fabric Admin portal should you include?</p>`},
    options:[
      {k:"A", fr:"Tenant settings : activer <i>Allow XMLA Endpoints and Analyze in Excel with on-premises datasets</i>.", en:"Tenant settings: set <i>Allow XMLA Endpoints and Analyze in Excel with on-premises datasets</i> to Enabled."},
      {k:"B", fr:"Tenant settings : activer <i>Allow Azure Active Directory guest users to access Microsoft Fabric</i>.", en:"Tenant settings: set <i>Allow Azure Active Directory guest users to access Microsoft Fabric</i> to Enabled."},
      {k:"C", fr:"Tenant settings : sélectionner <i>Users can edit data model in the Power BI service</i>.", en:"Tenant settings: select <i>Users can edit data model in the Power BI service</i>."},
      {k:"D", fr:"Capacity settings : régler <i>XMLA Endpoint</i> sur <b>Read Write</b>.", en:"Capacity settings: set <i>XMLA Endpoint</i> to <b>Read Write</b>."},
      {k:"E", fr:"Tenant settings : activer <i>Users can create Fabric items</i>.", en:"Tenant settings: set <i>Users can create Fabric items</i> to Enabled."},
      {k:"F", fr:"Tenant settings : activer <i>Publish to Web</i>.", en:"Tenant settings: enable <i>Publish to Web</i>."}
    ],
    answer:["A","D","E"],
    explain:{fr:`
      <p>La particularité de cette question : les trois actions ne sont pas redondantes. Chacune débloque une <b>couche distincte</b>, et il faut les trois pour que le scénario fonctionne.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Action</th><th>Niveau</th><th>Ce qu'elle débloque</th></tr>
        <tr><td class="m">A — Allow XMLA Endpoints</td><td>Tenant</td><td>Autorise la fonctionnalité XMLA dans l'organisation</td></tr>
        <tr><td class="m">D — XMLA = Read Write</td><td>Capacité</td><td>Autorise l'écriture, pas seulement la lecture</td></tr>
        <tr><td class="m">E — Users can create Fabric items</td><td>Tenant</td><td>Autorise la création d'éléments Fabric</td></tr>
      </table></div>
      <p class="why">Le décodage de l'énoncé</p>
      <ul>
        <li><i>by using external tools</i> → Tabular Editor, DAX Studio, SSMS se connectent tous via XMLA. D'où A (activer la fonctionnalité) et D (l'ouvrir en écriture).</li>
        <li><i>create and publish</i> → publier signifie écrire dans le workspace, ce qui exige Read Write sur la capacité.</li>
        <li><i>Direct Lake semantic models</i> → un modèle Direct Lake est un <b>élément Fabric</b>, pas un simple dataset Power BI. D'où E.</li>
      </ul>
      <p class="why">Pourquoi A et D ne font pas doublon</p>
      <p>Le point le plus subtil. Le paramètre tenant est un interrupteur général : il détermine si la fonctionnalité XMLA <i>existe</i> pour l'organisation. Le paramètre capacité définit le <i>mode</i> : Off, Read ou Read Write. Même avec le tenant activé, une capacité en Read ne permet que la lecture. Les deux fonctionnent en cascade.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>B — guest users.</b> Rien dans l'énoncé ne mentionne d'utilisateurs externes. Ouvrir l'accès à des invités sans nécessité viole directement le moindre privilège.</li>
        <li><b>C — Users can edit data model in the Power BI service.</b> Le distracteur sérieux, car <i>edit data model</i> semble coller. Mais ce paramètre concerne l'édition <b>dans le navigateur</b>. L'énoncé dit <i>by using external tools</i> — un canal différent, qui passe par XMLA.</li>
        <li><b>F — Publish to Web.</b> Publie des rapports en accès public anonyme sur Internet. Aucun rapport avec la création de modèles, et probablement le paramètre le plus dangereux de tout l'Admin portal.</li>
      </ul>
      <p class="note"><b>Deux réflexes.</b> Sur les questions « choisissez trois actions », cherchez des <b>couches différentes</b> : si vos trois réponses font la même chose, vous vous êtes trompé. Et dès que vous lisez <i>least privilege</i>, écartez systématiquement les options qui ouvrent un accès externe — elles sont là pour ça.</p>`,
      en:`
      <p>What makes this question distinctive: the three actions are not redundant. Each unlocks a <b>separate layer</b>, and all three are needed for the scenario to work.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Action</th><th>Level</th><th>What it unlocks</th></tr>
        <tr><td class="m">A — Allow XMLA Endpoints</td><td>Tenant</td><td>Permits the XMLA feature across the organisation</td></tr>
        <tr><td class="m">D — XMLA = Read Write</td><td>Capacity</td><td>Permits writing, not just reading</td></tr>
        <tr><td class="m">E — Users can create Fabric items</td><td>Tenant</td><td>Permits creating Fabric items</td></tr>
      </table></div>
      <p class="why">Decoding the stem</p>
      <ul>
        <li><i>by using external tools</i> → Tabular Editor, DAX Studio and SSMS all connect over XMLA. Hence A (enable the feature) and D (open it for writing).</li>
        <li><i>create and publish</i> → publishing means writing into the workspace, which requires Read Write on the capacity.</li>
        <li><i>Direct Lake semantic models</i> → a Direct Lake model is a <b>Fabric item</b>, not a plain Power BI dataset. Hence E.</li>
      </ul>
      <p class="why">Why A and D are not duplicates</p>
      <p>The subtlest point. The tenant setting is a master switch: it decides whether the XMLA feature <i>exists</i> for the organisation. The capacity setting defines the <i>mode</i>: Off, Read or Read Write. Even with the tenant enabled, a capacity on Read allows reads only. The two work in cascade.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>B — guest users.</b> Nothing in the stem mentions external users. Opening access to guests without need is a direct breach of least privilege.</li>
        <li><b>C — Users can edit data model in the Power BI service.</b> The serious distractor, because <i>edit data model</i> sounds right. But that setting concerns editing <b>in the browser</b>. The stem says <i>by using external tools</i> — a different channel, which runs over XMLA.</li>
        <li><b>F — Publish to Web.</b> Publishes reports with anonymous public access on the internet. Nothing to do with creating models, and probably the most dangerous setting in the whole Admin portal.</li>
      </ul>
      <p class="note"><b>Two reflexes.</b> On "select three actions" questions, look for <b>different layers</b>: if all three answers do the same thing, you have gone wrong. And whenever you read <i>least privilege</i>, systematically discard options that open external access — that is what they are there for.</p>`}
  },
  {
    id:"q107", kind:"single", type:T1,
    title:{fr:"Format de fichier pour éditer un modèle en TMDL",en:"File format for editing a model in TMDL"},
    stem:{fr:`<p>Vous créez un modèle sémantique dans Power BI Desktop. Vous prévoyez de faire des <b>modifications en masse</b> avec l'extension <b>TMDL</b> (Tabular Model Definition Language) pour Visual Studio Code. Vous devez enregistrer le modèle sémantique dans un fichier.</p><p class="ask">Quel format de fichier devez-vous utiliser ?</p>`,
          en:`<p>You are creating a semantic model in Microsoft Power BI Desktop. You plan to make <b>bulk changes</b> to the model by using the <b>TMDL</b> (Tabular Model Definition Language) extension for Visual Studio Code. You need to save the semantic model to a file.</p><p class="ask">Which file format should you use?</p>`},
    options:[{k:"A",fr:"PBIP",en:"PBIP"},{k:"B",fr:"PBIX",en:"PBIX"},{k:"C",fr:"PBIT",en:"PBIT"},{k:"D",fr:"PBIDS",en:"PBIDS"}],
    answer:["A"],
    explain:{fr:`
      <p>TMDL est un <b>format texte</b>. Pour qu'un éditeur de code puisse le lire et le modifier, le modèle doit être enregistré sous forme de fichiers texte lisibles, pas dans un conteneur binaire compressé.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Format</th><th>Nature</th><th>Ouvrable dans VS Code ?</th></tr>
        <tr><td class="m">PBIP</td><td>Un dossier de fichiers texte : modèle en TMDL, rapport en JSON</td><td><b>Oui</b></td></tr>
        <tr><td class="m">PBIX</td><td>Fichier binaire compressé : modèle + données + rapport</td><td>Non</td></tr>
        <tr><td class="m">PBIT</td><td>Template binaire : structure et requêtes, sans les données</td><td>Non</td></tr>
        <tr><td class="m">PBIDS</td><td>Petit fichier JSON décrivant une source de données. Aucun modèle</td><td>Non</td></tr>
      </table></div>
      <p class="why">À quoi ressemble un projet PBIP</p>
      <pre class="code">MonProjet.pbip
MonProjet.SemanticModel/definition/tables/Sales.tmdl
MonProjet.SemanticModel/definition/tables/Date.tmdl
MonProjet.SemanticModel/definition/relationships.tmdl
MonProjet.Report/report.json</pre>
      <p>Chaque table devient un fichier <code class="inl">.tmdl</code> qu'on ouvre, modifie et versionne comme du code. C'est ce qui rend possibles les <i>bulk changes</i> de l'énoncé : un rechercher-remplacer sur vingt tables, impensable dans l'interface graphique.</p>
      <p><b>PBIX</b> est le distracteur principal parce que c'est le format par défaut, celui que tout le monde connaît. Mais c'est une archive binaire : VS Code n'y verrait qu'une suite d'octets. Même logique pour PBIT, qui est un PBIX sans les données — toujours binaire.</p>
      <p class="note"><b>Recoupement avec la question sur le contrôle de version.</b> L'exigence <i>version control that supports branching</i> menait à Azure Repos ; ici c'est le pendant côté fichier. Seul PBIP produit des fichiers texte diffables, donc seul PBIP permet réellement de versionner un modèle Power BI dans Git. Les deux questions décrivent deux moitiés de la même solution.</p>`,
      en:`
      <p>TMDL is a <b>text format</b>. For a code editor to read and change it, the model must be saved as readable text files, not inside a compressed binary container.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Format</th><th>Nature</th><th>Opens in VS Code?</th></tr>
        <tr><td class="m">PBIP</td><td>A folder of text files: model in TMDL, report in JSON</td><td><b>Yes</b></td></tr>
        <tr><td class="m">PBIX</td><td>Compressed binary file: model + data + report</td><td>No</td></tr>
        <tr><td class="m">PBIT</td><td>Binary template: structure and queries, no data</td><td>No</td></tr>
        <tr><td class="m">PBIDS</td><td>Small JSON file describing a data source only. No model</td><td>No</td></tr>
      </table></div>
      <p class="why">What a PBIP project looks like</p>
      <pre class="code">MyProject.pbip
MyProject.SemanticModel/definition/tables/Sales.tmdl
MyProject.SemanticModel/definition/tables/Date.tmdl
MyProject.SemanticModel/definition/relationships.tmdl
MyProject.Report/report.json</pre>
      <p>Each table becomes a <code class="inl">.tmdl</code> file you open, edit and version like code. That is what makes the stem's <i>bulk changes</i> possible: a find-and-replace across twenty tables, unthinkable in the GUI.</p>
      <p><b>PBIX</b> is the main distractor because it is the default format everyone knows. But it is a binary archive: VS Code would see only a stream of bytes. Same logic for PBIT, which is a PBIX without the data — still binary.</p>
      <p class="note"><b>It ties back to the version-control question.</b> The requirement <i>version control that supports branching</i> led to Azure Repos; this is its file-side counterpart. Only PBIP produces diffable text files, so only PBIP genuinely lets you version a Power BI model in Git. The two questions describe two halves of one solution.</p>`}
  },
  {
    id:"q108", kind:"fields", type:TH,
    title:{fr:"Permission pour TRUNCATE sur un schéma",en:"Permission for TRUNCATE on a schema"},
    stem:{fr:`<p>Vous avez un warehouse Fabric nommé <b>Warehouse1</b> contenant trois schémas : <b>schemaA</b>, <b>schemaB</b> et <b>schemaC</b>. Vous devez garantir qu'un utilisateur nommé <b>User1</b> puisse tronquer les tables de <b>schemaA uniquement</b>.</p>
    <pre class="code">GRANT  ❶  ON  ❷  TO User1;</pre>
    <p class="ask">Comment devez-vous compléter l'instruction T-SQL ?</p>`,
          en:`<p>You have a Fabric warehouse named <b>Warehouse1</b> with three schemas named <b>schemaA</b>, <b>schemaB</b> and <b>schemaC</b>. You need to ensure that a user named <b>User1</b> can truncate tables in <b>schemaA only</b>.</p>
    <pre class="code">GRANT  ❶  ON  ❷  TO User1;</pre>
    <p class="ask">How should you complete the T-SQL statement?</p>`},
    fields:[
      {label:{fr:"❶ Permission",en:"❶ Permission"}, hint:{fr:"le droit à accorder",en:"the right to grant"},
       opts:{fr:["ALTER","CONNECT","EXECUTE"],en:["ALTER","CONNECT","EXECUTE"]}, ans:0},
      {label:{fr:"❷ Portée",en:"❷ Scope"}, hint:{fr:"le sécurisable visé",en:"the securable"},
       opts:{fr:["DATABASE::schemaA","OBJECT::schemaA","SCHEMA::schemaA"],en:["DATABASE::schemaA","OBJECT::schemaA","SCHEMA::schemaA"]}, ans:2}
    ],
    explain:{fr:`
      <p class="why">❶ Pourquoi ALTER</p>
      <p>Point central de la question : <b>il n'existe pas de permission TRUNCATE en T-SQL.</b> <code class="inl">TRUNCATE TABLE</code> est une opération <b>DDL</b>, pas DML, et le droit qui l'autorise est <b>ALTER</b> sur la table ou sur son conteneur.</p>
      <ul>
        <li><b>CONNECT</b> — se connecter à la base. Aucun droit sur les objets.</li>
        <li><b>EXECUTE</b> — exécuter des procédures stockées et des fonctions. Rien à voir avec les tables.</li>
      </ul>
      <p>Le piège est de chercher instinctivement une permission portant le nom de l'action. Elle n'existe pas.</p>
      <p class="why">❷ Pourquoi SCHEMA::</p>
      <p>Le mot qui décide est <b>only</b> : il faut couvrir toutes les tables de schemaA, présentes <b>et futures</b>, sans toucher à schemaB ni schemaC.</p>
      <ul>
        <li><b>DATABASE::schemaA</b> — syntaxe incohérente (<code class="inl">DATABASE::</code> attend un nom de base), et cela couvrirait les trois schémas : trop large.</li>
        <li><b>OBJECT::schemaA</b> — <code class="inl">OBJECT::</code> désigne un objet unique (une table, une vue). Un schéma est un conteneur, pas un objet.</li>
        <li><b>SCHEMA::schemaA</b> — portée exacte, ni plus ni moins.</li>
      </ul>
      <p>La hiérarchie des sécurisables : <code class="inl">SERVER:: → DATABASE:: → SCHEMA:: → OBJECT::</code>. Une permission accordée à un niveau descend à tout ce qu'il contient, donc <code class="inl">GRANT ALTER ON SCHEMA::schemaA</code> couvre automatiquement les tables créées demain — ce que ne ferait pas une série de GRANT table par table.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Action voulue</th><th>Permission à accorder</th></tr>
        <tr><td>SELECT</td><td class="m">SELECT</td></tr>
        <tr><td>INSERT / UPDATE / DELETE</td><td class="m">la permission du même nom</td></tr>
        <tr><td><b>TRUNCATE TABLE</b></td><td class="m"><b>ALTER</b></td></tr>
        <tr><td>CREATE TABLE dans un schéma</td><td class="m">CREATE TABLE + ALTER sur le schéma</td></tr>
        <tr><td>Exécuter une procédure</td><td class="m">EXECUTE</td></tr>
      </table></div>
      <p class="note"><b>À retenir.</b> Le cas TRUNCATE est le seul vraiment contre-intuitif du lot — c'est précisément pour cela qu'il est testé. Et quand vous voyez <i>only</i> dans un énoncé de permissions, cherchez le niveau qui épouse exactement le périmètre demandé.</p>`,
      en:`
      <p class="why">❶ Why ALTER</p>
      <p>The core of the question: <b>there is no TRUNCATE permission in T-SQL.</b> <code class="inl">TRUNCATE TABLE</code> is a <b>DDL</b> operation, not DML, and the right that authorises it is <b>ALTER</b> on the table or on its container.</p>
      <ul>
        <li><b>CONNECT</b> — connect to the database. No rights on objects.</li>
        <li><b>EXECUTE</b> — run stored procedures and functions. Nothing to do with tables.</li>
      </ul>
      <p>The trap is instinctively hunting for a permission named after the action. It does not exist.</p>
      <p class="why">❷ Why SCHEMA::</p>
      <p>The deciding word is <b>only</b>: you must cover every table in schemaA, present <b>and future</b>, without touching schemaB or schemaC.</p>
      <ul>
        <li><b>DATABASE::schemaA</b> — incoherent syntax (<code class="inl">DATABASE::</code> expects a database name), and it would cover all three schemas: too broad.</li>
        <li><b>OBJECT::schemaA</b> — <code class="inl">OBJECT::</code> designates a single object (a table, a view). A schema is a container, not an object.</li>
        <li><b>SCHEMA::schemaA</b> — the exact scope, no more and no less.</li>
      </ul>
      <p>The securable hierarchy: <code class="inl">SERVER:: → DATABASE:: → SCHEMA:: → OBJECT::</code>. A permission granted at one level flows down to everything it contains, so <code class="inl">GRANT ALTER ON SCHEMA::schemaA</code> automatically covers tables created tomorrow — which a table-by-table series of GRANTs would not.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Intended action</th><th>Permission to grant</th></tr>
        <tr><td>SELECT</td><td class="m">SELECT</td></tr>
        <tr><td>INSERT / UPDATE / DELETE</td><td class="m">the permission of the same name</td></tr>
        <tr><td><b>TRUNCATE TABLE</b></td><td class="m"><b>ALTER</b></td></tr>
        <tr><td>CREATE TABLE in a schema</td><td class="m">CREATE TABLE + ALTER on the schema</td></tr>
        <tr><td>Execute a procedure</td><td class="m">EXECUTE</td></tr>
      </table></div>
      <p class="note"><b>Worth memorising.</b> TRUNCATE is the one genuinely counter-intuitive case in the set — which is precisely why it is tested. And when you see <i>only</i> in a permissions stem, look for the level that matches the requested perimeter exactly.</p>`}
  },
  {
    id:"q109", kind:"multi", contested:true, type:TM,
    title:{fr:"Deployment pipelines — niveaux d'accès",en:"Deployment pipelines — access levels"},
    stem:{fr:`<p>Vous prévoyez de déployer des éléments Power BI avec des <b>deployment pipelines</b> Fabric. Le pipeline a trois étapes — Development, Test et Production — chacune avec son espace de travail. Vous devez donner accès au pipeline aux développeurs Power BI : ils doivent pouvoir <b>déployer vers Development et Test</b>, être <b>empêchés de déployer vers Production</b>, et le moindre privilège doit être respecté.</p><p class="ask">Quels <b>trois</b> niveaux d'accès devez-vous assigner ?</p>`,
          en:`<p>You plan to deploy Power BI items by using Fabric <b>deployment pipelines</b>. The pipeline has three stages named Development, Test and Production, each with a workspace. You need to provide Power BI developers with access to the pipeline: developers can <b>deploy items to Development and Test</b>; developers are <b>prevented from deploying to Production</b>; follow the principle of least privilege.</p><p class="ask">Which <b>three</b> levels of access should you assign?</p>`},
    options:[
      {k:"A", fr:"Permission <i>Build</i> sur les modèles sémantiques de production.", en:"<i>Build</i> permission to the production semantic models."},
      {k:"B", fr:"Accès <i>Admin</i> au deployment pipeline.", en:"<i>Admin</i> access to the deployment pipeline."},
      {k:"C", fr:"Accès <i>Viewer</i> aux espaces de travail Development et Test.", en:"<i>Viewer</i> access to the Development and Test workspaces."},
      {k:"D", fr:"Accès <i>Viewer</i> à l'espace de travail Production.", en:"<i>Viewer</i> access to the Production workspace."},
      {k:"E", fr:"Accès <i>Contributor</i> aux espaces de travail Development et Test.", en:"<i>Contributor</i> access to the Development and Test workspaces."},
      {k:"F", fr:"Accès <i>Contributor</i> à l'espace de travail Production.", en:"<i>Contributor</i> access to the Production workspace."}
    ],
    answer:["A","D","E"],
    explain:{fr:`
      <p>Pour déployer via un pipeline, il faut <b>deux droits simultanés, à deux endroits différents</b> : un accès au pipeline lui-même, sinon le développeur ne le voit même pas ; et un rôle suffisant sur le workspace cible, qui autorise ou bloque l'écriture. C'est cette séparation qui fait toute la question — <b>le blocage de Production ne se fait pas sur le pipeline, il se fait sur le workspace</b>.</p>
      <ul>
        <li><b>E — Contributor sur Dev et Test.</b> Contributor est le rôle minimal permettant de publier du contenu dans un workspace. C'est ce qui autorise le déploiement vers ces deux étapes.</li>
        <li><b>D — Viewer sur Production.</b> La réponse la plus intéressante, et celle qu'on oublie. Pourquoi donner un accès à Production alors qu'on veut l'interdire ? Parce que sans aucun accès, le développeur ne verrait pas l'étape Production dans le pipeline : il ne pourrait ni comparer son travail à la production, ni comprendre l'état de la chaîne. Viewer est le compromis exact — visibilité totale, écriture nulle.</li>
        <li><b>A — Build sur les modèles de production.</b> Donne le droit de créer des rapports à partir d'un modèle sémantique existant.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Rôle</th><th>Peut voir</th><th>Peut publier</th><th>Peut gérer les accès</th></tr>
        <tr><td class="m">Viewer</td><td>Oui</td><td>Non</td><td>Non</td></tr>
        <tr><td class="m">Contributor</td><td>Oui</td><td><b>Oui</b></td><td>Non</td></tr>
        <tr><td class="m">Member</td><td>Oui</td><td>Oui</td><td>Partiellement</td></tr>
        <tr><td class="m">Admin</td><td>Oui</td><td>Oui</td><td>Oui</td></tr>
      </table></div>
      <p class="why">Les deux options qui tombent sans discussion</p>
      <ul>
        <li><b>C — Viewer sur Dev et Test.</b> Insuffisant : les développeurs pourraient regarder sans jamais déployer.</li>
        <li><b>F — Contributor sur Production.</b> L'opposé exact de l'objectif. Distracteur symétrique de D : même workspace, mauvais niveau.</li>
      </ul>
      <p class="contested"><b>Question contestée — A ou B pour la troisième réponse.</b> Le corrigé retient A. L'argument contraire : <i>Build</i> est une permission de <b>consommation</b>, qui sert à créer des rapports à partir d'un modèle existant ; elle n'intervient à aucun moment dans un déploiement, et l'énoncé ne demande nulle part que les développeurs construisent des rapports sur les données de production — sous le moindre privilège, c'est même un privilège en trop. En faveur de <b>B</b> : sans accès au pipeline, les développeurs ne voient pas le pipeline du tout ; les rôles de workspace déterminent ce qu'on peut écrire dans chaque étape, mais ne donnent aucun accès à l'objet pipeline lui-même. Ce qui est certain dans les deux lectures : <b>D et E</b>.</p>`,
      en:`
      <p>Deploying through a pipeline needs <b>two rights at once, in two different places</b>: access to the pipeline itself, or the developer cannot even see it; and a sufficient role on the target workspace, which permits or blocks writing. That separation is the whole question — <b>blocking Production is not done on the pipeline, it is done on the workspace</b>.</p>
      <ul>
        <li><b>E — Contributor on Dev and Test.</b> Contributor is the minimum role that allows publishing content into a workspace. That is what authorises deployment to those two stages.</li>
        <li><b>D — Viewer on Production.</b> The most interesting answer, and the one people forget. Why grant any access to Production when the goal is to forbid it? Because with no access at all, the developer would not see the Production stage in the pipeline: they could neither compare their work against production nor understand the state of the chain. Viewer is the exact compromise — full visibility, zero write.</li>
        <li><b>A — Build on the production models.</b> Grants the right to create reports from an existing semantic model.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Role</th><th>Can view</th><th>Can publish</th><th>Can manage access</th></tr>
        <tr><td class="m">Viewer</td><td>Yes</td><td>No</td><td>No</td></tr>
        <tr><td class="m">Contributor</td><td>Yes</td><td><b>Yes</b></td><td>No</td></tr>
        <tr><td class="m">Member</td><td>Yes</td><td>Yes</td><td>Partly</td></tr>
        <tr><td class="m">Admin</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
      </table></div>
      <p class="why">The two options that fall without argument</p>
      <ul>
        <li><b>C — Viewer on Dev and Test.</b> Insufficient: developers could look but never deploy.</li>
        <li><b>F — Contributor on Production.</b> The exact opposite of the goal. The mirror distractor of D: same workspace, wrong level.</li>
      </ul>
