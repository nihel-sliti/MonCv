        <tr><td class="m">Warehouse</td><td>The engine itself <b>guarantees</b> the behaviour: every write is V-Ordered and compaction is applied, with no configuration possible or needed. Built in, not set.</td></tr>
      </table></div>
      <p>The second requirement — <i>support the use of dataflows to load and append</i> — does not separate them: Dataflow Gen2 writes to both.</p>
      <p class="why">The reasoning trap to avoid</p>
      <p>It is tempting to answer lakehouse on the grounds that it is the one exposing the V-Order and Auto Compaction properties. That is exactly backwards. <b>Exposing a setting is the opposite of automatic.</b> The more configurable a behaviour is, the less it is guaranteed. The stem does not ask which data store <i>allows</i> V-Order, but which <i>guarantees</i> it without intervention.</p>
      <ul>
        <li><b>B — Azure SQL.</b> Not a Fabric artifact, and no Delta format at all: neither V-Order nor compaction means anything here.</li>
        <li><b>D — KQL database.</b> Belongs to Real-Time Intelligence, designed for streaming telemetry. Its storage engine is not Delta.</li>
      </ul>
      <p class="note"><b>The pair to remember.</b> Two "which type of data store" questions with opposite answers: the Litware one answers <b>lakehouse</b> (unstructured data + Python), this one answers <b>warehouse</b> (guaranteed Delta optimisation). The lakehouse wins on flexibility, the warehouse on guarantees. A stem saying <i>automatically</i>, <i>without configuration</i> or <i>ensure that</i> is asking for a guarantee, not a possibility.</p>`}
  },
  {
    id:"q205", kind:"single", tag:"litware", type:T1,
    title:{fr:"Ingérer les données clients dans AnalyticsPOC",en:"Ingesting the customer data into AnalyticsPOC"},
    stem:{fr:`<p class="ask">Que devez-vous recommander pour ingérer les données clients dans le data store de l'espace de travail AnalyticsPOC ?</p>`,
          en:`<p class="ask">What should you recommend using to ingest the customer data into the data store in the AnalyticsPOC workspace?</p>`},
    options:[
      {k:"A", fr:"une procédure stockée", en:"a stored procedure"},
      {k:"B", fr:"un pipeline contenant une activité KQL", en:"a pipeline that contains a KQL activity"},
      {k:"C", fr:"un notebook Spark", en:"a Spark notebook"},
      {k:"D", fr:"un dataflow", en:"a dataflow"}
    ],
    answer:["D"],
    explain:{fr:`
      <p>La phrase qui décide : <i>« Whenever possible, the data engineers will use <b>low-code tools</b> for data ingestion. »</i> Un second élément conforte : dans le tableau des données disponibles, les customer data ne pèsent que <b>50 Mo</b>. Rien ne justifie un moteur distribué.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Mot-clé</th><th>Ce qu'il signale</th></tr>
        <tr><td class="m">ingest</td><td>L'entrée des données, pas leur transformation interne ni leur restitution</td></tr>
        <tr><td class="m">low-code tools</td><td><b>Dataflow Gen2</b> (interface Power Query) — c'est la définition même du low-code dans Fabric</td></tr>
        <tr><td class="m">50 MB, source CRM</td><td>Petit volume, source relationnelle. Aucun besoin de Spark</td></tr>
      </table></div>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — procédure stockée.</b> Du T-SQL qui s'exécute <i>à l'intérieur</i> du data store. Elle transforme des données déjà présentes, mais ne peut pas aller chercher des données dans un CRM externe. Mauvais outil pour la phase d'ingestion.</li>
        <li><b>B — pipeline avec activité KQL.</b> KQL appartient au Real-Time Intelligence : Eventhouse, KQL Database, télémétrie en flux. Les données CRM sont relationnelles et chargées quotidiennement. Le distracteur le plus facile à écarter.</li>
        <li><b>C — notebook Spark.</b> Techniquement ça fonctionnerait, mais c'est du <b>pro-code</b>, en contradiction directe avec <i>low-code tools</i>. Disproportionné pour 50 Mo.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>L'énoncé dit...</th><th>L'outil attendu</th></tr>
        <tr><td>low-code, no-code, citizen developer</td><td><b>Dataflow Gen2</b></td></tr>
        <tr><td>orchestration, planification, enchaînement</td><td><b>Pipeline</b></td></tr>
        <tr><td>gros volumes, non structuré, transformations complexes</td><td><b>Spark notebook</b></td></tr>
        <tr><td>streaming, télémétrie, temps réel</td><td><b>Eventstream / KQL</b></td></tr>
        <tr><td>transformation à l'intérieur du warehouse</td><td><b>Stored procedure</b></td></tr>
      </table></div>
      <p class="note"><b>Ne confondez pas pipeline et dataflow.</b> Le pipeline <b>orchestre</b> (il déclenche, planifie, enchaîne), le dataflow <b>transforme</b> (il applique la logique Power Query). Quand la question porte sur le <i>comment ingérer</i>, c'est le dataflow ; sur le <i>quand et dans quel ordre</i>, c'est le pipeline.</p>`,
      en:`
      <p>The deciding sentence: <i>"Whenever possible, the data engineers will use <b>low-code tools</b> for data ingestion."</i> A second element supports it: in the available-data table, the customer data is only <b>50 MB</b>. Nothing justifies a distributed engine.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Keyword</th><th>What it signals</th></tr>
        <tr><td class="m">ingest</td><td>Data coming in, not internal transformation or delivery</td></tr>
        <tr><td class="m">low-code tools</td><td><b>Dataflow Gen2</b> (the Power Query interface) — the very definition of low-code in Fabric</td></tr>
        <tr><td class="m">50 MB, CRM source</td><td>Small volume, relational source. No need for Spark</td></tr>
      </table></div>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — stored procedure.</b> T-SQL that runs <i>inside</i> the data store. It transforms data already present but cannot reach out to an external CRM. The wrong tool for the ingestion stage.</li>
        <li><b>B — pipeline with a KQL activity.</b> KQL belongs to Real-Time Intelligence: Eventhouse, KQL Database, streaming telemetry. The CRM data is relational and loaded daily. The easiest distractor to discard.</li>
        <li><b>C — Spark notebook.</b> Technically it would work, but it is <b>pro-code</b>, in direct contradiction with <i>low-code tools</i>. Disproportionate for 50 MB.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>If the stem says...</th><th>Expected tool</th></tr>
        <tr><td>low-code, no-code, citizen developer</td><td><b>Dataflow Gen2</b></td></tr>
        <tr><td>orchestration, scheduling, chaining</td><td><b>Pipeline</b></td></tr>
        <tr><td>large volumes, unstructured, complex transformations</td><td><b>Spark notebook</b></td></tr>
        <tr><td>streaming, telemetry, real time</td><td><b>Eventstream / KQL</b></td></tr>
        <tr><td>transformation inside the warehouse</td><td><b>Stored procedure</b></td></tr>
      </table></div>
      <p class="note"><b>Do not confuse pipeline and dataflow.</b> The pipeline <b>orchestrates</b> (it triggers, schedules, chains), the dataflow <b>transforms</b> (it applies Power Query logic). When the question is about <i>how to ingest</i>, it is the dataflow; about <i>when and in what order</i>, it is the pipeline.</p>`}
  },
  {
    id:"q206", kind:"single", tag:"litware", type:T1,
    title:{fr:"Séquencer les chargements",en:"Sequencing the data loads"},
    stem:{fr:`<p>Vous devez garantir que les <b>activités de chargement</b> de l'espace de travail AnalyticsPOC s'exécutent dans <b>l'ordre approprié</b>, en respectant les exigences techniques.</p><p class="ask">Que devez-vous faire ?</p>`,
          en:`<p>You need to ensure the <b>data loading activities</b> in the AnalyticsPOC workspace are executed in the <b>appropriate sequence</b>. The solution must meet the technical requirements.</p><p class="ask">What should you do?</p>`},
    options:[
      {k:"A", fr:"Créer un dataflow comportant plusieurs étapes et le planifier.", en:"Create a dataflow that has multiple steps and schedule the dataflow."},
      {k:"B", fr:"Créer et planifier un notebook Spark.", en:"Create and schedule a Spark notebook."},
      {k:"C", fr:"Créer et planifier une Spark job definition.", en:"Create and schedule a Spark job definition."},
      {k:"D", fr:"Créer un pipeline comportant des dépendances entre activités, et le planifier.", en:"Create a pipeline that has dependencies between activities and schedule the pipeline."}
    ],
    answer:["D"],
    explain:{fr:`
      <p>La phrase décisive : <i>« The data load process must ensure that the raw and cleansed data is <b>updated completely before</b> populating the dimensional model. »</i></p>
      <p>Le mot <b>before</b> impose un ordre, <b>completely</b> impose d'attendre la fin. Seul un pipeline avec dépendances exprime cela.</p>
      <pre class="code">[Charger données brutes]
        ↓ On Success
[Nettoyer et fusionner]
        ↓ On Success
[Peupler le modèle dimensionnel]</pre>
      <p>Chaque connecteur peut être <code class="inl">On Success</code>, <code class="inl">On Failure</code>, <code class="inl">On Completion</code> ou <code class="inl">On Skip</code>. C'est ce mécanisme qui garantit qu'une étape ne s'exécute pas si la précédente a échoué.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — dataflow à plusieurs étapes.</b> Le distracteur le plus tentant, parce que <i>multiple steps</i> évoque une séquence. Mais les étapes d'un dataflow sont des transformations Power Query <b>à l'intérieur d'une seule requête</b>, pas des tâches indépendantes ordonnançables. Un dataflow ne peut pas dire « attends que cette autre charge soit terminée ».</li>
        <li><b>B — notebook Spark.</b> Il exécute du code séquentiellement, donc l'ordre existe <i>à l'intérieur</i> du notebook. Mais l'énoncé parle des activités de chargement du workspace dans leur ensemble, et un notebook ne peut pas orchestrer un dataflow.</li>
        <li><b>C — Spark job definition.</b> Encore plus restreint : un travail packagé exécuté en batch. Aucune capacité d'orchestration entre artefacts différents.</li>
      </ul>
      <p class="note"><b>Même dossier, critère opposé.</b> La question sur l'ingestion répondait <i>dataflow</i> parce que le critère était <i>low-code</i> ; celle-ci répond <i>pipeline</i> parce que le critère est <i>sequence</i>. Un pipeline peut appeler les trois autres artefacts ; l'inverse n'est pas vrai.</p>`,
      en:`
      <p>The decisive sentence: <i>"The data load process must ensure that the raw and cleansed data is <b>updated completely before</b> populating the dimensional model."</i></p>
      <p><b>before</b> imposes an order, <b>completely</b> imposes waiting for completion. Only a pipeline with dependencies expresses that.</p>
      <pre class="code">[Load raw data]
        ↓ On Success
[Cleanse and merge]
        ↓ On Success
[Populate the dimensional model]</pre>
      <p>Each connector can be <code class="inl">On Success</code>, <code class="inl">On Failure</code>, <code class="inl">On Completion</code> or <code class="inl">On Skip</code>. That mechanism is what guarantees a step does not run if the previous one failed.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — dataflow with multiple steps.</b> The most tempting distractor, because <i>multiple steps</i> suggests a sequence. But a dataflow's steps are Power Query transformations <b>inside a single query</b>, not independent schedulable tasks. A dataflow cannot say "wait until that other load has finished".</li>
        <li><b>B — Spark notebook.</b> It runs code sequentially, so order exists <i>inside</i> the notebook. But the stem is about the workspace's loading activities as a whole, and a notebook cannot orchestrate a dataflow.</li>
        <li><b>C — Spark job definition.</b> Narrower still: a packaged job run in batch. No orchestration across different artifacts.</li>
      </ul>
      <p class="note"><b>Same dossier, opposite criterion.</b> The ingestion question answered <i>dataflow</i> because the criterion was <i>low-code</i>; this one answers <i>pipeline</i> because the criterion is <i>sequence</i>. A pipeline can call the other three artifacts; the reverse is not true.</p>`}
  },
  {
    id:"q207", kind:"single", type:T1,
    title:{fr:"T-SQL — WHERE contre HAVING",en:"T-SQL — WHERE versus HAVING"},
    stem:{fr:`<p>Vous avez un warehouse Fabric contenant une table <code class="inl">Staging.Sales</code> :</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Name</th><th>Data type</th><th>Nullable</th></tr>
      <tr><td class="m">ProductID</td><td class="m">Integer</td><td>No</td></tr>
      <tr><td class="m">ProductName</td><td class="m">Varchar(30)</td><td>No</td></tr>
      <tr><td class="m">SalesDate</td><td class="m">Datetime2(6)</td><td>No</td></tr>
      <tr><td class="m">WholesalePrice</td><td class="m">Decimal(18,2)</td><td>Yes</td></tr>
      <tr><td class="m">Amount</td><td class="m">Decimal(18,2)</td><td>Yes</td></tr>
    </table></div>
    <p>Vous devez écrire une requête T-SQL qui retourne les données de l'année <b>2023</b>, affiche ProductID et ProductName, et dont le <code class="inl">Amount</code> agrégé est supérieur à <b>10 000</b>.</p>
    <p class="ask">Quelle requête devez-vous utiliser ?</p>`,
          en:`<p>You have a Fabric warehouse that contains a table named <code class="inl">Staging.Sales</code>:</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Name</th><th>Data type</th><th>Nullable</th></tr>
      <tr><td class="m">ProductID</td><td class="m">Integer</td><td>No</td></tr>
      <tr><td class="m">ProductName</td><td class="m">Varchar(30)</td><td>No</td></tr>
      <tr><td class="m">SalesDate</td><td class="m">Datetime2(6)</td><td>No</td></tr>
      <tr><td class="m">WholesalePrice</td><td class="m">Decimal(18,2)</td><td>Yes</td></tr>
      <tr><td class="m">Amount</td><td class="m">Decimal(18,2)</td><td>Yes</td></tr>
    </table></div>
    <p>You need to write a T-SQL query that will return data for the year <b>2023</b> that displays ProductID and ProductName and has a summarized <code class="inl">Amount</code> that is higher than <b>10,000</b>.</p>
    <p class="ask">Which query should you use?</p>`},
    options:[
      {k:"A", fr:`<pre class="code">SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount
FROM Staging.Sales
WHERE DATEPART(YEAR, SaleDate) = '2023'
GROUP BY ProductID, ProductName
HAVING SUM(Amount) &gt; 10000</pre>`, en:`<pre class="code">SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount
FROM Staging.Sales
WHERE DATEPART(YEAR, SaleDate) = '2023'
GROUP BY ProductID, ProductName
HAVING SUM(Amount) &gt; 10000</pre>`},
      {k:"B", fr:`<pre class="code">SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount
FROM Staging.Sales
GROUP BY ProductID, ProductName
HAVING DATEPART(YEAR, SaleDate) = '2023' AND SUM(Amount) &gt; 10000</pre>`, en:`<pre class="code">SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount
FROM Staging.Sales
GROUP BY ProductID, ProductName
HAVING DATEPART(YEAR, SaleDate) = '2023' AND SUM(Amount) &gt; 10000</pre>`},
      {k:"C", fr:`<pre class="code">SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount
FROM Staging.Sales
WHERE DATEPART(YEAR, SaleDate) = '2023' AND SUM(Amount) &gt; 10000</pre>`, en:`<pre class="code">SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount
FROM Staging.Sales
WHERE DATEPART(YEAR, SaleDate) = '2023' AND SUM(Amount) &gt; 10000</pre>`},
      {k:"D", fr:`<pre class="code">SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount
FROM Staging.Sales
WHERE DATEPART(YEAR, SaleDate) = '2023'
GROUP BY ProductID, ProductName
HAVING TotalAmount &gt; 10000</pre>`, en:`<pre class="code">SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount
FROM Staging.Sales
WHERE DATEPART(YEAR, SaleDate) = '2023'
GROUP BY ProductID, ProductName
HAVING TotalAmount &gt; 10000</pre>`}
    ],
    answer:["A"],
    explain:{fr:`
      <p>Tout se résout avec l'<b>ordre logique d'exécution</b>, qui n'est pas l'ordre d'écriture :</p>
      <pre class="code">FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY</pre>
      <p>Trois conséquences, et chacune élimine une option :</p>
      <ul>
        <li>Le <code class="inl">WHERE</code> s'exécute <b>avant</b> l'agrégation : il filtre des lignes individuelles et ne peut pas contenir de fonction d'agrégation.</li>
        <li>Le <code class="inl">HAVING</code> s'exécute <b>après</b> : c'est le seul endroit où comparer un <code class="inl">SUM()</code>, mais il ne peut référencer que des colonnes du <code class="inl">GROUP BY</code> ou des agrégats.</li>
        <li>Le <code class="inl">SELECT</code> est évalué en <b>avant-dernier</b> : ses alias n'existent pas encore pour les clauses précédentes.</li>
      </ul>
      <p>Appliqué à l'énoncé : <i>data for the year 2023</i> est un filtre de ligne → WHERE ; <i>a summarized Amount higher than 10,000</i> est un filtre de groupe → HAVING. A place chacun au bon endroit.</p>
      <p class="why">Pourquoi les autres échouent</p>
      <ul>
        <li><b>B — le filtre de date dans le HAVING.</b> <code class="inl">SaleDate</code> n'est ni dans le GROUP BY, ni enveloppée dans un agrégat : après regroupement, cette colonne n'existe plus individuellement, le moteur ne sait pas quelle date choisir. Erreur de compilation.</li>
        <li><b>C — un agrégat dans le WHERE, et pas de GROUP BY.</b> Double faute.</li>
        <li><b>D — un alias dans le HAVING.</b> Le distracteur le plus subtil. <code class="inl">TotalAmount</code> est défini dans le SELECT, qui s'exécute <i>après</i> le HAVING. Il faut répéter <code class="inl">SUM(Amount)</code>.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Clause</th><th>Alias du SELECT utilisable ?</th></tr>
        <tr><td class="m">WHERE</td><td>NON</td></tr>
        <tr><td class="m">GROUP BY</td><td>NON</td></tr>
        <tr><td class="m">HAVING</td><td>NON</td></tr>
        <tr><td class="m">ORDER BY</td><td><b>OUI</b> — seule exception, il s'exécute après le SELECT</td></tr>
      </table></div>
      <p class="note"><b>Deux vérifications qui éliminent trois options sur quatre.</b> 1) Le filtre porte-t-il sur une ligne ou sur un groupe ? 2) Le HAVING utilise-t-il un alias ? Si oui, l'option est morte, sans exception. <i>(Le schéma dit </i><code class="inl">SalesDate</code><i> et les options </i><code class="inl">SaleDate</code><i> : coquille identique partout, non discriminante.)</i></p>`,
      en:`
      <p>Everything follows from the <b>logical order of execution</b>, which is not the order you write in:</p>
      <pre class="code">FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY</pre>
      <p>Three consequences, and each one eliminates an option:</p>
      <ul>
        <li><code class="inl">WHERE</code> runs <b>before</b> aggregation: it filters individual rows and cannot contain an aggregate function.</li>
        <li><code class="inl">HAVING</code> runs <b>after</b>: it is the only place to compare a <code class="inl">SUM()</code>, but it can only reference <code class="inl">GROUP BY</code> columns or aggregates.</li>
        <li><code class="inl">SELECT</code> is evaluated <b>second to last</b>: its aliases do not exist yet for the earlier clauses.</li>
      </ul>
      <p>Applied to the stem: <i>data for the year 2023</i> is a row filter → WHERE; <i>a summarized Amount higher than 10,000</i> is a group filter → HAVING. A puts each in the right place.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>B — the date filter in HAVING.</b> <code class="inl">SaleDate</code> is neither in the GROUP BY nor wrapped in an aggregate: after grouping, that column no longer exists individually, so the engine cannot know which date to pick. Compilation error.</li>
        <li><b>C — an aggregate in WHERE, and no GROUP BY.</b> Two faults at once.</li>
        <li><b>D — an alias in HAVING.</b> The subtlest distractor. <code class="inl">TotalAmount</code> is defined in the SELECT, which runs <i>after</i> HAVING. You must repeat <code class="inl">SUM(Amount)</code>.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Clause</th><th>Can it use a SELECT alias?</th></tr>
        <tr><td class="m">WHERE</td><td>NO</td></tr>
        <tr><td class="m">GROUP BY</td><td>NO</td></tr>
        <tr><td class="m">HAVING</td><td>NO</td></tr>
        <tr><td class="m">ORDER BY</td><td><b>YES</b> — the only exception, it runs after SELECT</td></tr>
      </table></div>
      <p class="note"><b>Two checks that eliminate three options out of four.</b> 1) Does the filter apply to a row or to a group? 2) Does the HAVING use an alias? If so, the option is dead, without exception. <i>(The schema says </i><code class="inl">SalesDate</code><i> while the options say </i><code class="inl">SaleDate</code><i>: the same typo everywhere, so it separates nothing.)</i></p>`}
  },
  {
    id:"q208", kind:"fields", type:TH,
    title:{fr:"T-SQL — déduplication par fonction de fenêtrage",en:"T-SQL — deduplication with a window function"},
    stem:{fr:`<p>Vous avez un entrepôt contenant une table <code class="inl">Stage.Customers</code>, qui reçoit toutes les mises à jour de fiches client d'un CRM. <b>Il peut y avoir plusieurs mises à jour par client.</b> Vous devez retourner l'ID client, le nom, le code postal et l'heure de dernière mise à jour <b>de la ligne la plus récente pour chaque ID client</b>.</p>
    <pre class="code">WITH CUSTOMERBASE AS (
    SELECT [CustomerID], [CustomerName], [PostalCode], [LastUpdated]
        , X = ❶ OVER (PARTITION BY CustomerID
                      ORDER BY LastUpdated DESC)
    FROM [LakehousePOC].[dbo].[CustomerChanges] )
SELECT CustomerID, CustomerName, PostalCode, LastUpdated
FROM CUSTOMERBASE
❷</pre>
    <p class="ask">Comment devez-vous compléter le code ?</p>`,
          en:`<p>You have a data warehouse that contains a table named <code class="inl">Stage.Customers</code>, which contains all the customer record updates from a CRM system. <b>There can be multiple updates per customer.</b> You need to return the customer ID, name, postal code and last updated time of the <b>most recent row for each customer ID</b>.</p>
    <pre class="code">WITH CUSTOMERBASE AS (
    SELECT [CustomerID], [CustomerName], [PostalCode], [LastUpdated]
        , X = ❶ OVER (PARTITION BY CustomerID
                      ORDER BY LastUpdated DESC)
    FROM [LakehousePOC].[dbo].[CustomerChanges] )
SELECT CustomerID, CustomerName, PostalCode, LastUpdated
FROM CUSTOMERBASE
❷</pre>
    <p class="ask">How should you complete the code?</p>`},
    fields:[
      {label:{fr:"❶ Fonction de fenêtrage",en:"❶ Window function"}, hint:{fr:"ligne X =",en:"the X = line"},
       opts:{fr:["LAST_VALUE()","NTILE()","ROW_NUMBER()"],en:["LAST_VALUE()","NTILE()","ROW_NUMBER()"]}, ans:2},
      {label:{fr:"❷ Filtre final",en:"❷ Final filter"}, hint:{fr:"après FROM CUSTOMERBASE",en:"after FROM CUSTOMERBASE"},
       opts:{fr:["Having Max(LastUpdated) = 1","WHERE LastUpdated = Max(LastUpdated)","WHERE X = 1"],en:["Having Max(LastUpdated) = 1","WHERE LastUpdated = Max(LastUpdated)","WHERE X = 1"]}, ans:2}
    ],
    explain:{fr:`
      <p>C'est le pattern de <b>déduplication par fonction de fenêtrage</b>, l'un des plus fréquents de l'examen. L'énoncé le décrit mot pour mot.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Formulation de l'énoncé</th><th>Élément SQL correspondant</th></tr>
        <tr><td><i>for each customer ID</i></td><td class="m">PARTITION BY CustomerID</td></tr>
        <tr><td><i>the most recent</i></td><td class="m">ORDER BY LastUpdated DESC</td></tr>
        <tr><td><i>one row per customer</i></td><td class="m">ROW_NUMBER() puis filtre = 1</td></tr>
      </table></div>
      <p>Le <code class="inl">OVER (PARTITION BY ... ORDER BY ... DESC)</code> est déjà imprimé : il vous dit que la réponse est forcément une fonction de classement.</p>
      <p class="why">❶ Pourquoi ROW_NUMBER()</p>
      <ul>
        <li><b>LAST_VALUE()</b> retourne une <i>valeur</i> de la fenêtre, pas un rang : rien à filtrer avec <code class="inl">= 1</code>. Piégeuse en plus — sans clause <code class="inl">ROWS BETWEEN</code> explicite, elle renvoie souvent la ligne courante et non la dernière.</li>
        <li><b>NTILE()</b> répartit les lignes en N paquets de taille égale. Elle exige un argument (<code class="inl">NTILE(4)</code>), absent ici, et n'identifie pas une ligne unique.</li>
        <li><b>ROW_NUMBER()</b> numérote 1, 2, 3… dans chaque partition selon l'ordre demandé. Le n° 1 est la ligne la plus récente.</li>
      </ul>
      <p class="why">❷ Pourquoi WHERE X = 1</p>
      <p>X est le nom donné à la colonne calculée dans la CTE. Une fois la CTE matérialisée, X est une colonne ordinaire qu'on filtre normalement.</p>
      <ul>
        <li><b>HAVING Max(LastUpdated) = 1</b> : aucun <code class="inl">GROUP BY</code>, donc HAVING n'a rien à filtrer — et comparer une date à 1 n'a aucun sens.</li>
        <li><b>WHERE LastUpdated = Max(LastUpdated)</b> : agrégat interdit dans un WHERE.</li>
      </ul>
      <p class="why">Pourquoi la CTE est indispensable</p>
      <p>Vous ne pouvez pas écrire directement <code class="inl">WHERE ROW_NUMBER() OVER (...) = 1</code> : les fonctions de fenêtrage sont évaluées <b>après</b> le WHERE. Il faut donc les isoler dans une CTE ou une sous-requête, puis filtrer par-dessus.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Fonction</th><th>En cas d'égalité</th><th>Usage typique</th></tr>
        <tr><td class="m">ROW_NUMBER()</td><td>Numéros uniques, départage arbitrairement</td><td><b>Déduplication</b></td></tr>
        <tr><td class="m">RANK()</td><td>Même rang, puis saut (1, 1, 3)</td><td>Classements</td></tr>
        <tr><td class="m">DENSE_RANK()</td><td>Même rang, sans saut (1, 1, 2)</td><td>Top N catégories</td></tr>
      </table></div>
      <p class="note"><b>Pour dédupliquer, c'est toujours ROW_NUMBER().</b> Seule elle garantit une ligne unique par partition, même quand deux enregistrements partagent la même date.</p>`,
      en:`
      <p>This is the <b>window-function deduplication</b> pattern, one of the most frequent on the exam. The stem describes it word for word.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Wording in the stem</th><th>Matching SQL element</th></tr>
        <tr><td><i>for each customer ID</i></td><td class="m">PARTITION BY CustomerID</td></tr>
        <tr><td><i>the most recent</i></td><td class="m">ORDER BY LastUpdated DESC</td></tr>
        <tr><td><i>one row per customer</i></td><td class="m">ROW_NUMBER() then filter = 1</td></tr>
      </table></div>
      <p>The <code class="inl">OVER (PARTITION BY ... ORDER BY ... DESC)</code> is already printed: it tells you the answer must be a ranking function.</p>
      <p class="why">❶ Why ROW_NUMBER()</p>
      <ul>
        <li><b>LAST_VALUE()</b> returns a <i>value</i> from the window, not a rank: nothing to filter with <code class="inl">= 1</code>. It is also treacherous — without an explicit <code class="inl">ROWS BETWEEN</code> clause it often returns the current row rather than the last.</li>
        <li><b>NTILE()</b> splits rows into N equally sized buckets. It requires an argument (<code class="inl">NTILE(4)</code>), absent here, and does not identify a single row.</li>
        <li><b>ROW_NUMBER()</b> numbers 1, 2, 3… within each partition in the requested order. Number 1 is the most recent row.</li>
      </ul>
      <p class="why">❷ Why WHERE X = 1</p>
      <p>X is the name given to the computed column in the CTE. Once the CTE is materialised, X is an ordinary column you filter normally.</p>
      <ul>
        <li><b>HAVING Max(LastUpdated) = 1</b>: there is no <code class="inl">GROUP BY</code>, so HAVING has nothing to filter — and comparing a date to 1 makes no sense.</li>
        <li><b>WHERE LastUpdated = Max(LastUpdated)</b>: an aggregate is forbidden in a WHERE.</li>
      </ul>
      <p class="why">Why the CTE is essential</p>
      <p>You cannot write <code class="inl">WHERE ROW_NUMBER() OVER (...) = 1</code> directly: window functions are evaluated <b>after</b> WHERE. They must be isolated in a CTE or subquery, then filtered on top.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Function</th><th>On ties</th><th>Typical use</th></tr>
        <tr><td class="m">ROW_NUMBER()</td><td>Unique numbers, breaks ties arbitrarily</td><td><b>Deduplication</b></td></tr>
        <tr><td class="m">RANK()</td><td>Same rank, then a gap (1, 1, 3)</td><td>Rankings</td></tr>
        <tr><td class="m">DENSE_RANK()</td><td>Same rank, no gap (1, 1, 2)</td><td>Top N categories</td></tr>
      </table></div>
      <p class="note"><b>For deduplication it is always ROW_NUMBER().</b> It alone guarantees a single row per partition, even when two records share the same timestamp.</p>`}
  },
  {
    id:"q209", kind:"single", type:T1,
    title:{fr:"Ce que voit le SQL analytics endpoint d'un lakehouse",en:"What a lakehouse SQL analytics endpoint sees"},
    stem:{fr:`<p>Vous administrez un espace de travail Fabric contenant un lakehouse nommé <b>Lakehouse1</b>, qui contient :</p>
    <ul>
      <li><b>Table1</b> : une table Delta créée à l'aide d'un raccourci</li>
      <li><b>Table2</b> : une table externe créée avec Spark</li>
      <li><b>Table3</b> : une table managée</li>
    </ul>
    <p>Vous prévoyez de vous connecter à Lakehouse1 via son <b>point de terminaison SQL</b>.</p>
    <p class="ask">Que pourrez-vous faire après vous être connecté ?</p>`,
          en:`<p>You are the administrator of a Fabric workspace that contains a lakehouse named <b>Lakehouse1</b>. Lakehouse1 contains the following tables:</p>
    <ul>
      <li><b>Table1</b>: a Delta table created by using a shortcut</li>
      <li><b>Table2</b>: an external table created by using Spark</li>
      <li><b>Table3</b>: a managed table</li>
    </ul>
    <p>You plan to connect to Lakehouse1 by using its <b>SQL endpoint</b>.</p>
    <p class="ask">What will you be able to do after connecting to Lakehouse1?</p>`},
    options:[
      {k:"A", fr:"Lire Table3.", en:"Read Table3."},
      {k:"B", fr:"Mettre à jour les données de Table3.", en:"Update the data in Table3."},
      {k:"C", fr:"Lire Table2.", en:"Read Table2."},
      {k:"D", fr:"Mettre à jour les données de Table1.", en:"Update the data in Table1."}
    ],
    answer:["A"],
    explain:{fr:`
      <p class="why">Règle 1 — le SQL analytics endpoint est en lecture seule</p>
      <p>Cela élimine immédiatement <b>B</b> et <b>D</b>, sans même regarder de quelles tables il s'agit. Par cet endpoint on peut faire des <code class="inl">SELECT</code>, créer des vues, des fonctions table, définir du RLS — mais jamais d'<code class="inl">INSERT</code>, <code class="inl">UPDATE</code> ou <code class="inl">DELETE</code>. Pour modifier des données dans un lakehouse, il faut passer par Spark, un dataflow ou un pipeline.</p>
      <p class="why">Règle 2 — l'endpoint n'expose que certaines tables</p>
      <p>Il reste A et C, deux lectures. Le discriminant est le <b>type de table</b> :</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Table</th><th>Type</th><th>Visible via SQL endpoint ?</th></tr>
        <tr><td class="m">Table1</td><td>Delta créée par raccourci</td><td>Oui — mais l'option propose un <i>update</i>, impossible</td></tr>
        <tr><td class="m">Table2</td><td>External table créée par Spark</td><td><b>Non</b></td></tr>
        <tr><td class="m">Table3</td><td>Managed table</td><td>Oui → <b>réponse A</b></td></tr>
      </table></div>
      <p>Une table externe créée en Spark (<code class="inl">CREATE TABLE ... LOCATION '...'</code>) n'enregistre qu'une <b>référence</b> vers un emplacement de stockage. Ses données vivent hors de la zone gérée du lakehouse, et le SQL analytics endpoint ne s'appuie que sur les tables Delta gérées de la section <code class="inl">Tables</code>. Table2 reste parfaitement accessible — mais depuis Spark uniquement.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Type d'objet dans un lakehouse</th><th>Spark</th><th>SQL endpoint</th></tr>
        <tr><td>Managed table (Delta, section Tables)</td><td>Lecture + écriture</td><td>Lecture seule</td></tr>
        <tr><td>Shortcut Delta dans Tables</td><td>Lecture + écriture</td><td>Lecture seule</td></tr>
        <tr><td>External table (Spark, LOCATION externe)</td><td>Lecture + écriture</td><td><b>Invisible</b></td></tr>
        <tr><td>Fichiers dans Files</td><td>Lecture + écriture</td><td><b>Invisible</b></td></tr>
      </table></div>
      <p class="note"><b>Filtre en deux temps.</b> 1) L'option contient-elle une écriture ? → morte. 2) La table est-elle gérée ou externe ? Gérée ou raccourci → visible ; externe ou fichier brut → invisible.</p>`,
      en:`
      <p class="why">Rule 1 — the SQL analytics endpoint is read-only</p>
      <p>That immediately eliminates <b>B</b> and <b>D</b>, without even looking at which tables are involved. Through this endpoint you can run <code class="inl">SELECT</code>, create views and table-valued functions, define RLS — but never <code class="inl">INSERT</code>, <code class="inl">UPDATE</code> or <code class="inl">DELETE</code>. To change data in a lakehouse you must go through Spark, a dataflow or a pipeline.</p>
      <p class="why">Rule 2 — the endpoint exposes only some tables</p>
      <p>A and C remain, both reads. The discriminator is the <b>table type</b>:</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Table</th><th>Type</th><th>Visible through the SQL endpoint?</th></tr>
        <tr><td class="m">Table1</td><td>Delta created by shortcut</td><td>Yes — but the option proposes an <i>update</i>, which is impossible</td></tr>
        <tr><td class="m">Table2</td><td>External table created with Spark</td><td><b>No</b></td></tr>
        <tr><td class="m">Table3</td><td>Managed table</td><td>Yes → <b>answer A</b></td></tr>
      </table></div>
      <p>An external table created in Spark (<code class="inl">CREATE TABLE ... LOCATION '...'</code>) registers only a <b>reference</b> to a storage location. Its data lives outside the lakehouse's managed area, and the SQL analytics endpoint relies solely on managed Delta tables in the <code class="inl">Tables</code> section. Table2 remains perfectly accessible — from Spark only.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Object type in a lakehouse</th><th>Spark</th><th>SQL endpoint</th></tr>
        <tr><td>Managed table (Delta, Tables section)</td><td>Read + write</td><td>Read only</td></tr>
        <tr><td>Delta shortcut in Tables</td><td>Read + write</td><td>Read only</td></tr>
        <tr><td>External table (Spark, external LOCATION)</td><td>Read + write</td><td><b>Invisible</b></td></tr>
        <tr><td>Files in Files</td><td>Read + write</td><td><b>Invisible</b></td></tr>
      </table></div>
      <p class="note"><b>A two-step filter.</b> 1) Does the option contain a write? → dead. 2) Is the table managed or external? Managed or shortcut → visible; external or raw file → invisible.</p>`}
  },
  {
    id:"q210", kind:"fields", tag:"litware", type:TH,
    title:{fr:"T-SQL — classification en groupes tarifaires",en:"T-SQL — pricing group classification"},
    stem:{fr:`<p>Vous devez résoudre le problème de classification en groupes tarifaires.</p>
    <pre class="code">CREATE  ❶  [dbo].[ProductsWithPricingGroup]
AS
SELECT ProductId, ProductName, ProductCategory, ListPrice,
     ❷
     WHEN ListPrice &lt;= 50 THEN 'low'
     ❸
     WHEN ListPrice &gt; 1000 THEN 'high'
     END AS PricingGroup
FROM dbo.Products</pre>
    <p class="ask">Comment devez-vous compléter l'instruction T-SQL ?</p>`,
          en:`<p>You need to resolve the issue with the pricing group classification.</p>
    <pre class="code">CREATE  ❶  [dbo].[ProductsWithPricingGroup]
AS
SELECT ProductId, ProductName, ProductCategory, ListPrice,
     ❷
     WHEN ListPrice &lt;= 50 THEN 'low'
     ❸
     WHEN ListPrice &gt; 1000 THEN 'high'
     END AS PricingGroup
FROM dbo.Products</pre>
    <p class="ask">How should you complete the T-SQL statement?</p>`},
    fields:[
      {label:{fr:"❶ Type d'objet",en:"❶ Object type"}, hint:{fr:"CREATE ...",en:"CREATE ..."},
       opts:{fr:["FUNCTION","PROCEDURE","TABLE","VIEW"],en:["FUNCTION","PROCEDURE","TABLE","VIEW"]}, ans:3},
      {label:{fr:"❷ Construction",en:"❷ Construct"}, hint:{fr:"début de l'expression",en:"start of the expression"},
       opts:{fr:["CASE","COALESCE","IIF","SET"],en:["CASE","COALESCE","IIF","SET"]}, ans:0},
      {label:{fr:"❸ Condition medium",en:"❸ Medium condition"}, hint:{fr:"la plage intermédiaire",en:"the middle range"},
       opts:{fr:["WHEN (ListPrice > 50 AND ListPrice < 1000) THEN 'medium'","WHEN (ListPrice >= 50 AND ListPrice < 1000) THEN 'medium'","WHEN ListPrice BETWEEN 50 AND 1000 THEN 'medium'"],en:["WHEN (ListPrice > 50 AND ListPrice < 1000) THEN 'medium'","WHEN (ListPrice >= 50 AND ListPrice < 1000) THEN 'medium'","WHEN ListPrice BETWEEN 50 AND 1000 THEN 'medium'"]}, ans:2}
    ],
    explain:{fr:`
      <p class="why">❶ VIEW</p>
      <p>La double exigence — <i>maintained in a <b>single location</b></i> et <i>available for T-SQL queries <b>and in the default semantic model</b></i> — ne laisse qu'un candidat.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>Verdict</th></tr>
        <tr><td class="m">FUNCTION</td><td>Syntaxe incompatible : <code class="inl">CREATE FUNCTION</code> exige des paramètres et une clause RETURNS. Et une fonction n'apparaît pas dans un modèle sémantique.</td></tr>
        <tr><td class="m">PROCEDURE</td><td>Une procédure s'exécute, elle ne s'interroge pas avec un SELECT. Invisible pour le modèle sémantique par défaut.</td></tr>
        <tr><td class="m">TABLE</td><td>Duplique les données. La logique devrait être ré-exécutée à chaque rafraîchissement : ce n'est plus une <i>single location</i>, c'est une copie à maintenir.</td></tr>
        <tr><td class="m">VIEW</td><td><b>Correct.</b> Interrogeable en T-SQL, exposée automatiquement dans le modèle sémantique par défaut, logique définie à un seul endroit.</td></tr>
      </table></div>
      <p>Second indice dans les exigences de sécurité : <i>« Both the default and custom semantic models must include only <b>tables or views</b> »</i>. L'énoncé vous dit lui-même quels objets sont admis.</p>
      <p class="why">❷ CASE — pure reconnaissance syntaxique</p>
      <p>Le code déjà imprimé contient <code class="inl">WHEN ... THEN ...</code> et se termine par <code class="inl">END AS PricingGroup</code>. Cette structure n'appartient qu'à <code class="inl">CASE</code>. <code class="inl">IIF</code> prend trois arguments entre parenthèses, sans WHEN ni END ; <code class="inl">COALESCE</code> retourne la première valeur non-NULL ; <code class="inl">SET</code> est une instruction d'affectation.</p>
      <p class="why">❸ Le vrai piège de la question</p>
      <p>La règle métier dit <i>greater than 50 and <b>less than or equal to</b> 1,000</i> : la borne haute est <b>inclusive</b>. Testez chaque option avec <code class="inl">ListPrice = 1000</code> :</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>Résultat pour ListPrice = 1000</th></tr>
        <tr><td class="m">&gt; 50 AND &lt; 1000</td><td>Faux. Puis <code class="inl">&gt; 1000</code> est faux aussi → <b>NULL</b>, le produit n'est classé nulle part</td></tr>
        <tr><td class="m">&gt;= 50 AND &lt; 1000</td><td>Même problème : 1000 est exclu → <b>NULL</b></td></tr>
        <tr><td class="m">BETWEEN 50 AND 1000</td><td>Vrai. BETWEEN est inclusif aux deux bornes → <b>'medium'</b></td></tr>
      </table></div>
      <p>La borne basse ne pose aucun problème : le <code class="inl">WHEN ListPrice &lt;= 50 THEN 'low'</code> précédent a déjà capturé cette valeur. CASE évalue dans l'ordre et s'arrête à la première condition vraie, donc la plage effective est bien (50, 1000].</p>
      <p class="note"><b>Testez toujours les bornes.</b> Dès qu'une question porte sur une classification par seuils, prenez chaque valeur limite de l'énoncé et faites-la passer dans chaque option. Et retenez : <code class="inl">BETWEEN a AND b</code> équivaut à <code class="inl">&gt;= a AND &lt;= b</code> — les deux bornes sont comprises, toujours.</p>`,
      en:`
      <p class="why">❶ VIEW</p>
      <p>The twin requirement — <i>maintained in a <b>single location</b></i> and <i>available for T-SQL queries <b>and in the default semantic model</b></i> — leaves only one candidate.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>Verdict</th></tr>
        <tr><td class="m">FUNCTION</td><td>Incompatible syntax: <code class="inl">CREATE FUNCTION</code> requires parameters and a RETURNS clause. And a function does not appear in a semantic model.</td></tr>
        <tr><td class="m">PROCEDURE</td><td>A procedure is executed, not queried with a SELECT. Invisible to the default semantic model.</td></tr>
        <tr><td class="m">TABLE</td><td>Duplicates the data. The logic would have to be re-run on every refresh: that is no longer a <i>single location</i>, it is a copy to maintain.</td></tr>
        <tr><td class="m">VIEW</td><td><b>Correct.</b> Queryable in T-SQL, exposed automatically in the default semantic model, logic defined in one place.</td></tr>
      </table></div>
      <p>A second clue sits in the security requirements: <i>"Both the default and custom semantic models must include only <b>tables or views</b>"</i>. The stem tells you which objects are admissible.</p>
      <p class="why">❷ CASE — pure syntax recognition</p>
      <p>The printed code contains <code class="inl">WHEN ... THEN ...</code> and ends with <code class="inl">END AS PricingGroup</code>. That structure belongs to <code class="inl">CASE</code> alone. <code class="inl">IIF</code> takes three arguments in parentheses, with no WHEN and no END; <code class="inl">COALESCE</code> returns the first non-NULL value; <code class="inl">SET</code> is an assignment statement.</p>
      <p class="why">❸ The question's real trap</p>
      <p>The business rule says <i>greater than 50 and <b>less than or equal to</b> 1,000</i>: the upper bound is <b>inclusive</b>. Test each option with <code class="inl">ListPrice = 1000</code>:</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>Result for ListPrice = 1000</th></tr>
        <tr><td class="m">&gt; 50 AND &lt; 1000</td><td>False. Then <code class="inl">&gt; 1000</code> is false too → <b>NULL</b>, the product is classified nowhere</td></tr>
        <tr><td class="m">&gt;= 50 AND &lt; 1000</td><td>Same problem: 1000 is excluded → <b>NULL</b></td></tr>
        <tr><td class="m">BETWEEN 50 AND 1000</td><td>True. BETWEEN is inclusive at both bounds → <b>'medium'</b></td></tr>
      </table></div>
      <p>The lower bound causes no trouble: the preceding <code class="inl">WHEN ListPrice &lt;= 50 THEN 'low'</code> has already captured that value. CASE evaluates in order and stops at the first true condition, so the effective range really is (50, 1000].</p>
      <p class="note"><b>Always test the bounds.</b> Whenever a question turns on threshold classification, take each limit value from the stem and run it through every option. And remember: <code class="inl">BETWEEN a AND b</code> is <code class="inl">&gt;= a AND &lt;= b</code> — both bounds included, always.</p>`}
  },
  {
    id:"q211", kind:"fields", contested:true, type:TH,
    title:{fr:"Modèle dimensionnel — clé composite et flocon",en:"Dimensional model — composite key and snowflake"},
    stem:{fr:`<p>Vous avez un modèle de données source dont les clés primaires sont : <b>Product</b> = CompanyID + ProductID · <b>Customer</b> = CompanyID + CustomerID · <b>Company</b> = CompanyID · <b>Date</b> = Date · <b>OrderItem</b> = OrderItemID (avec OrderDate, CompanyID, ProductID, CustomerID).</p>
    <p>Vous devez créer un <b>modèle dimensionnel</b> permettant l'analyse des lignes de commande par date, produit et client.</p>
    <p class="ask">Que devez-vous inclure dans la solution ?</p>`,
          en:`<p>You have a source data model whose primary keys are: <b>Product</b> = CompanyID + ProductID · <b>Customer</b> = CompanyID + CustomerID · <b>Company</b> = CompanyID · <b>Date</b> = Date · <b>OrderItem</b> = OrderItemID (with OrderDate, CompanyID, ProductID, CustomerID).</p>
    <p>You need to create a <b>dimensional data model</b> that will enable the analysis of order items by date, product and customer.</p>
    <p class="ask">What should you include in the solution?</p>`},
    fields:[
      {label:{fr:"❶ La relation entre OrderItem et Product doit reposer sur :",en:"❶ The relationship between OrderItem and Product must be based on:"}, hint:{fr:"base de la relation",en:"basis of the relationship"},
       opts:{fr:["La colonne ProductID","Les deux colonnes CompanyID et ProductID","Une nouvelle clé combinant CompanyID et ProductID"],en:["The ProductID column","Both the CompanyID and ProductID columns","A new key that combines the CompanyID and ProductID columns"]}, ans:1},
      {label:{fr:"❷ L'entité Company doit être :",en:"❷ The Company entity must be:"}, hint:{fr:"traitement de Company",en:"handling of Company"},
       opts:{fr:["Omise","Dénormalisée dans l'entité Product uniquement","Dénormalisée dans les entités Customer et Product"],en:["Omitted","Denormalized into the Product entity only","Denormalized into the Customer and Product entities"]}, ans:2}
    ],
    explain:{fr:`
      <p class="why">❶ Sur quoi la relation repose</p>
      <p>L'identité d'un produit dépend de <b>deux colonnes</b> : le même ProductID peut exister chez deux entreprises différentes et désigner deux produits distincts. Or OrderItem contient précisément CompanyID et ProductID.</p>
      <p>Un modèle dimensionnel se construit d'abord dans un entrepôt, en T-SQL — et une jointure T-SQL gère parfaitement plusieurs colonnes :</p>
      <pre class="code">JOIN Product p ON oi.CompanyID = p.CompanyID
               AND oi.ProductID = p.ProductID</pre>
      <ul>
        <li><b>La colonne ProductID seule</b> — ambiguë : deux entreprises peuvent partager le même ProductID, la relation associerait des lignes sans rapport.</li>
        <li><b>Une nouvelle clé combinée</b> — une technique d'implémentation possible, pas la définition de la relation. Ce serait la réponse si la question portait sur un <b>modèle sémantique Power BI</b>, ou si elle demandait <i>what should you create</i>.</li>
      </ul>
      <p class="contested"><b>Question contestée — les deux lectures du mot <i>model</i>.</b> L'autre corrigé répandu répond <b>« une nouvelle clé combinant CompanyID et ProductID »</b>, et son argument est solide : un <b>modèle tabulaire</b> (Power BI, Direct Lake) ne supporte pas les relations sur plusieurs colonnes — une relation relie exactement une colonne de chaque côté. La solution canonique consiste alors à créer une clé de substitution concaténée dans la dimension Product et dans la table de faits, puis à relier sur cette colonne unique.<br><br>Tout dépend donc de l'endroit où vit le modèle. <b>L'énoncé dit <i>dimensional data model</i></b>, ce qui désigne d'abord la couche entrepôt, où une jointure T-SQL multi-colonnes est parfaitement légitime — d'où la réponse retenue ici. Mais si la question mentionne <i>semantic model</i>, <i>relationship</i> dans Power BI Desktop, ou <i>Direct Lake</i>, la limite tabulaire s'applique et la clé combinée devient la bonne réponse.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Si l'énoncé dit...</th><th>Alors</th></tr>
        <tr><td><i>dimensional data model</i>, <i>warehouse</i></td><td>Jointure sur les deux colonnes</td></tr>
        <tr><td><i>semantic model</i>, <i>relationship</i> dans Power BI Desktop, <i>Direct Lake</i></td><td>Clé de substitution combinée</td></tr>
      </table></div>
      <p class="why">❷ Aplatir le flocon</p>
      <p>Company n'est reliée à rien d'autre que Product et Customer : dans le schéma source, elle forme un <b>snowflake</b> — Date/Product/Customer entourent OrderItem, et Company se greffe derrière deux d'entre elles. Or un modèle dimensionnel bien conçu vise un <b>star schema</b> : la table de faits au centre, les dimensions directement autour.</p>
      <ul>
        <li><b>Omise</b> → on perdrait l'information d'entreprise, alors qu'elle fait partie de l'identité des produits <i>et</i> des clients.</li>
        <li><b>Dans Product uniquement</b> → Customer possède aussi CompanyID dans sa clé. L'omettre casserait l'analyse par client et par entreprise.</li>
      </ul>
      <pre class="code">          Date
            |
Product — OrderItem — Customer</pre>
      <p class="note"><b>Snowflake en source → star en cible.</b> Une table qui ne se relie qu'à d'autres dimensions (jamais directement aux faits) doit être aplatie dans celles-ci — et si plusieurs dimensions la référencent, elle est dénormalisée dans <b>toutes</b>. Cela recoupe l'exigence de performance fréquente dans les énoncés : un star schema génère moins de jointures qu'un flocon.</p>`,
      en:`
      <p class="why">❶ What the relationship rests on</p>
      <p>A product's identity depends on <b>two columns</b>: the same ProductID can exist at two different companies and denote two distinct products. And OrderItem contains precisely CompanyID and ProductID.</p>
      <p>A dimensional model is built first in a warehouse, in T-SQL — and a T-SQL join handles multiple columns perfectly well:</p>
      <pre class="code">JOIN Product p ON oi.CompanyID = p.CompanyID
               AND oi.ProductID = p.ProductID</pre>
      <ul>
        <li><b>The ProductID column alone</b> — ambiguous: two companies can share the same ProductID, and the relationship would match unrelated rows.</li>
        <li><b>A new combined key</b> — one possible implementation technique, not the definition of the relationship. It would be the answer if the question concerned a <b>Power BI semantic model</b>, or if it asked <i>what should you create</i>.</li>
      </ul>
      <p class="contested"><b>Disputed question — two readings of the word <i>model</i>.</b> The other circulating key answers <b>"a new key that combines CompanyID and ProductID"</b>, and its argument is solid: a <b>tabular model</b> (Power BI, Direct Lake) does not support relationships across multiple columns — one relationship joins exactly one column on each side. The canonical fix is then to create a concatenated surrogate key in the Product dimension and in the fact table, and relate on that single column.<br><br>Everything therefore depends on where the model lives. <b>The stem says <i>dimensional data model</i></b>, which points first at the warehouse layer, where a multi-column T-SQL join is entirely legitimate — hence the answer retained here. But if the question mentions <i>semantic model</i>, <i>relationship</i> in Power BI Desktop, or <i>Direct Lake</i>, the tabular limit applies and the combined key becomes the right answer.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>If the stem says...</th><th>Then</th></tr>
        <tr><td><i>dimensional data model</i>, <i>warehouse</i></td><td>Join on both columns</td></tr>
        <tr><td><i>semantic model</i>, <i>relationship</i> in Power BI Desktop, <i>Direct Lake</i></td><td>Combined surrogate key</td></tr>
      </table></div>
      <p class="why">❷ Flattening the snowflake</p>
      <p>Company relates to nothing but Product and Customer: in the source schema it forms a <b>snowflake</b> — Date/Product/Customer surround OrderItem, and Company hangs off two of them. A well-designed dimensional model aims at a <b>star schema</b>: the fact table in the middle, dimensions directly around it.</p>
      <ul>
        <li><b>Omitted</b> → you would lose the company information, which is part of the identity of both products <i>and</i> customers.</li>
        <li><b>Into Product only</b> → Customer also carries CompanyID in its key. Leaving it out would break analysis by customer and company.</li>
      </ul>
      <pre class="code">          Date
            |
Product — OrderItem — Customer</pre>
      <p class="note"><b>Snowflake in the source → star in the target.</b> A table that relates only to other dimensions (never directly to facts) must be flattened into them — and when several dimensions reference it, it is denormalized into <b>all</b> of them. This ties back to the performance requirement common in these stems: a star schema generates fewer joins than a snowflake.</p>`}
  },
  {
    id:"q212", kind:"single", type:T1,
    title:{fr:"Quelle DMV pour une requête bloquée",en:"Which DMV for a blocked query"},
    stem:{fr:`<p>Vous avez un tenant Fabric contenant un warehouse. Un utilisateur découvre qu'un rapport qui met habituellement deux minutes à s'afficher <b>tourne depuis 45 minutes</b> sans résultat. Vous devez identifier <b>ce qui empêche</b> la requête d'aboutir.</p><p class="ask">Quelle vue de gestion dynamique devez-vous utiliser ?</p>`,
          en:`<p>You have a Fabric tenant that contains a warehouse. A user discovers that a report which usually takes two minutes to render <b>has been running for 45 minutes</b> and has still not rendered. You need to identify <b>what is preventing</b> the report query from completing.</p><p class="ask">Which dynamic management view should you use?</p>`},
    options:[
      {k:"A", fr:`<code class="inl">sys.dm_exec_requests</code>`, en:`<code class="inl">sys.dm_exec_requests</code>`},
      {k:"B", fr:`<code class="inl">sys.dm_exec_sessions</code>`, en:`<code class="inl">sys.dm_exec_sessions</code>`},
      {k:"C", fr:`<code class="inl">sys.dm_exec_connections</code>`, en:`<code class="inl">sys.dm_exec_connections</code>`},
      {k:"D", fr:`<code class="inl">sys.dm_pdw_exec_requests</code>`, en:`<code class="inl">sys.dm_pdw_exec_requests</code>`}
    ],
    answer:["A"],
    explain:{fr:`
      <p>Le mot qui décide est <b>preventing</b> : l'énoncé demande une information sur l'<b>état d'exécution</b>, et une seule des quatre vues la contient.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Colonne de dm_exec_requests</th><th>Ce qu'elle révèle</th></tr>
        <tr><td class="m">status</td><td>running, suspended, runnable</td></tr>
        <tr><td class="m">wait_type</td><td>Type d'attente : LCK_M_X (verrou), RESOURCE_SEMAPHORE (mémoire), PAGEIOLATCH (I/O)</td></tr>
        <tr><td class="m">blocking_session_id</td><td><b>La session qui bloque celle-ci</b></td></tr>
        <tr><td class="m">wait_time / total_elapsed_time</td><td>Durée d'attente, temps écoulé</td></tr>
      </table></div>
      <p class="why">Les trois vues de la même famille</p>
      <pre class="code">connections   →   sessions   →   requests
 (la prise)      (le login)    (ce qui s'exécute)</pre>
      <ul>
        <li><b>B — dm_exec_sessions.</b> Le distracteur le plus proche : elle dit <i>qui</i> est connecté et depuis quand, mais pas pourquoi une requête n'avance pas. Ni <code class="inl">wait_type</code> ni <code class="inl">blocking_session_id</code>.</li>
        <li><b>C — dm_exec_connections.</b> Décrit la connexion réseau : protocole, adresse IP, chiffrement. Aucun rapport avec l'exécution.</li>
        <li><b>D — dm_pdw_exec_requests.</b> Le distracteur technique. Cette vue appartient aux pools SQL dédiés Azure Synapse et à l'ancienne Parallel Data Warehouse (d'où <code class="inl">pdw</code>). <b>Elle n'existe pas dans un warehouse Fabric</b>, qui utilise le préfixe standard <code class="inl">sys.dm_exec_*</code>.</li>
      </ul>
      <pre class="code">SELECT session_id, status, wait_type, wait_time,
       blocking_session_id, total_elapsed_time, command
FROM sys.dm_exec_requests
WHERE status &lt;&gt; 'background';</pre>
      <p>Si <code class="inl">blocking_session_id</code> est différent de zéro, vous avez votre coupable : une autre session détient un verrou.</p>
      <p class="note"><b>Le périmètre du symptôme désigne l'outil.</b> Une requête bloquée alors que les autres sont normales → contention interne → DMV. Toutes les requêtes lentes, plusieurs fois par jour → throttling → Capacity Metrics app.</p>`,
      en:`
      <p>The deciding word is <b>preventing</b>: the stem asks for information about the <b>execution state</b>, and only one of the four views carries it.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>dm_exec_requests column</th><th>What it reveals</th></tr>
        <tr><td class="m">status</td><td>running, suspended, runnable</td></tr>
        <tr><td class="m">wait_type</td><td>Wait type: LCK_M_X (lock), RESOURCE_SEMAPHORE (memory), PAGEIOLATCH (I/O)</td></tr>
        <tr><td class="m">blocking_session_id</td><td><b>The session blocking this one</b></td></tr>
        <tr><td class="m">wait_time / total_elapsed_time</td><td>Wait duration, elapsed time</td></tr>
      </table></div>
      <p class="why">The three views in the same family</p>
      <pre class="code">connections   →   sessions   →   requests
 (the socket)    (the login)   (what is running)</pre>
      <ul>
        <li><b>B — dm_exec_sessions.</b> The nearest distractor: it tells you <i>who</i> is connected and since when, but not why a query is stuck. Neither <code class="inl">wait_type</code> nor <code class="inl">blocking_session_id</code>.</li>
        <li><b>C — dm_exec_connections.</b> Describes the network connection: protocol, IP address, encryption. Nothing to do with execution.</li>
        <li><b>D — dm_pdw_exec_requests.</b> The technical distractor. That view belongs to Azure Synapse dedicated SQL pools and the old Parallel Data Warehouse (hence <code class="inl">pdw</code>). <b>It does not exist in a Fabric warehouse</b>, which uses the standard <code class="inl">sys.dm_exec_*</code> prefix.</li>
      </ul>
      <pre class="code">SELECT session_id, status, wait_type, wait_time,
       blocking_session_id, total_elapsed_time, command
FROM sys.dm_exec_requests
WHERE status &lt;&gt; 'background';</pre>
      <p>If <code class="inl">blocking_session_id</code> is non-zero, you have your culprit: another session holds a lock.</p>
      <p class="note"><b>The scope of the symptom names the tool.</b> One query blocked while the rest are normal → internal contention → DMV. All queries slow, several times a day → throttling → Capacity Metrics app.</p>`}
  },
  {
    id:"q213", kind:"single", type:T1,
    title:{fr:"Requêter deux lakehouses de workspaces différents",en:"Querying two lakehouses in different workspaces"},
    stem:{fr:`<p>Vous avez deux espaces de travail Fabric. <b>Workspace1</b> contient <b>Lakehouse1</b> avec une table <code class="inl">dbo.Sales</code>. <b>Workspace2</b> contient <b>Lakehouse2</b> avec une table <code class="inl">dbo.Customers</code>. Vous devez pouvoir écrire des requêtes qui référencent <b>les deux tables dans la même requête SQL</b>, <b>sans faire de copies supplémentaires</b>.</p><p class="ask">Que devez-vous utiliser ?</p>`,
          en:`<p>You have a Fabric tenant with two workspaces. <b>Workspace1</b> contains <b>Lakehouse1</b> with a table named <code class="inl">dbo.Sales</code>. <b>Workspace2</b> contains <b>Lakehouse2</b> with a table named <code class="inl">dbo.Customers</code>. You need to ensure you can write queries that reference <b>both tables in the same SQL query</b> <b>without making additional copies of the tables</b>.</p><p class="ask">What should you use?</p>`},
    options:[
      {k:"A", fr:"un raccourci (shortcut)", en:"a shortcut"},
      {k:"B", fr:"un dataflow", en:"a dataflow"},
      {k:"C", fr:"une vue", en:"a view"},
      {k:"D", fr:"une table managée", en:"a managed table"}
    ],
    answer:["A"],
    explain:{fr:`
      <p>Deux contraintes qui se contredisent en apparence : réunir des données de deux workspaces différents, <b>sans les déplacer</b>. Le raccourci est précisément conçu pour ça.</p>
      <pre class="code">Workspace1 / Lakehouse1 / Tables / Sales       ← les données réelles
Workspace2 / Lakehouse2 / Tables / Sales       ← un pointeur
                        / Customers            ← les données réelles</pre>
      <p>Les deux tables apparaissent alors dans le même lakehouse, donc dans le même SQL analytics endpoint. La jointure devient triviale :</p>
      <pre class="code">SELECT c.CustomerName, SUM(s.Amount)
FROM dbo.Customers c
JOIN dbo.Sales s ON c.CustomerID = s.CustomerID
GROUP BY c.CustomerName</pre>
      <p>Aucun octet n'est dupliqué : le raccourci ne stocke qu'une référence vers les fichiers Delta d'origine, et reste toujours synchronisé avec eux.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>B — dataflow.</b> Il copierait les données de Lakehouse1 vers Lakehouse2. Contredit directement <i>without making additional copies</i>, et introduit un décalage de fraîcheur.</li>
        <li><b>D — table managée.</b> Créer une table gérée signifie écrire physiquement les données. Même problème que B, en pire : une duplication permanente à maintenir.</li>
        <li><b>C — vue.</b> Le distracteur sérieux, parce qu'une vue ne copie effectivement rien. Mais <b>une vue ne peut référencer que des objets accessibles depuis son propre endpoint</b>. Le SQL endpoint de Lakehouse2 ne voit pas les tables de Lakehouse1, qui vit dans un autre workspace. La vue échouerait à la création. D'ailleurs, si vous vouliez créer une vue de jointure, il vous faudrait <i>d'abord</i> le raccourci.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Besoin</th><th>Solution</th></tr>
        <tr><td>Réunir des sources ou workspaces différents, sans copie</td><td><b>Shortcut</b></td></tr>
        <tr><td>Réunir avec transformation</td><td>Dataflow ou pipeline</td></tr>
        <tr><td>Simplifier une requête sur des objets déjà accessibles</td><td>Vue</td></tr>
        <tr><td>Figer un état à un instant donné</td><td>Clone</td></tr>
      </table></div>
      <p class="note"><b>Le mot-signal.</b> <i>without making copies</i> ou <i>without duplicating</i> est la définition même du raccourci, et cela élimine d'office tout ce qui écrit des données.</p>`,
      en:`
      <p>Two constraints that appear to contradict each other: bring together data from two different workspaces <b>without moving it</b>. The shortcut is designed for exactly this.</p>
      <pre class="code">Workspace1 / Lakehouse1 / Tables / Sales       ← the real data
Workspace2 / Lakehouse2 / Tables / Sales       ← a pointer
                        / Customers            ← the real data</pre>
      <p>Both tables then appear in the same lakehouse, and therefore in the same SQL analytics endpoint. The join becomes trivial:</p>
      <pre class="code">SELECT c.CustomerName, SUM(s.Amount)
FROM dbo.Customers c
JOIN dbo.Sales s ON c.CustomerID = s.CustomerID
GROUP BY c.CustomerName</pre>
      <p>Not a byte is duplicated: the shortcut stores only a reference to the original Delta files, and stays in sync with them.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>B — dataflow.</b> It would copy data from Lakehouse1 into Lakehouse2. That directly contradicts <i>without making additional copies</i>, and introduces a freshness lag.</li>
        <li><b>D — managed table.</b> Creating a managed table means physically writing the data. Same problem as B, worse: a permanent duplicate to maintain.</li>
        <li><b>C — view.</b> The serious distractor, because a view genuinely copies nothing. But <b>a view can only reference objects reachable from its own endpoint</b>. Lakehouse2's SQL endpoint cannot see Lakehouse1's tables, which live in another workspace. The view would fail at creation. In fact, to create a join view you would need the shortcut <i>first</i>.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Need</th><th>Solution</th></tr>
        <tr><td>Bring together different sources or workspaces, without copying</td><td><b>Shortcut</b></td></tr>
        <tr><td>Bring together with transformation</td><td>Dataflow or pipeline</td></tr>
        <tr><td>Simplify a query over already-reachable objects</td><td>View</td></tr>
        <tr><td>Freeze a state at a point in time</td><td>Clone</td></tr>
      </table></div>
      <p class="note"><b>The signal phrase.</b> <i>without making copies</i> or <i>without duplicating</i> is the very definition of a shortcut, and it rules out anything that writes data.</p>`}
  },
  {
    id:"q214", kind:"single", type:T1,
    title:{fr:"Copy data — remplacer schéma et données",en:"Copy data — replacing schema and data"},
    stem:{fr:`<p>Vous avez un lakehouse nommé <b>Lakehouse1</b> avec une table <b>Table1</b>. Vous créez un pipeline et prévoyez de copier des données externes vers Table1. <b>Le schéma des données externes change régulièrement.</b> L'opération de copie doit : <b>remplacer Table1 par le schéma des données externes</b> et <b>remplacer toutes les données de Table1</b>. Vous ajoutez une activité Copy data.</p><p class="ask">Que devez-vous faire ?</p>`,
          en:`<p>You have a lakehouse named <b>Lakehouse1</b> with a table named <b>Table1</b>. You are creating a new data pipeline and plan to copy external data to Table1. <b>The schema of the external data changes regularly.</b> The copy operation must: <b>replace Table1 with the schema of the external data</b> and <b>replace all the data in Table1</b> with the rows in the external data. You add a Copy data activity.</p><p class="ask">What should you do?</p>`},
    options:[
      {k:"A", fr:"Onglet <i>Source</i> : ajouter des colonnes supplémentaires.", en:"From the <i>Source</i> tab, add additional columns."},
      {k:"B", fr:"Onglet <i>Destination</i> : régler <i>Table action</i> sur <b>Overwrite</b>.", en:"From the <i>Destination</i> tab, set <i>Table action</i> to <b>Overwrite</b>."},
      {k:"C", fr:"Onglet <i>Settings</i> : sélectionner <i>Enable staging</i>.", en:"From the <i>Settings</i> tab, select <i>Enable staging</i>."},
      {k:"D", fr:"Onglet <i>Source</i> : sélectionner <i>Enable partition discovery</i>.", en:"From the <i>Source</i> tab, select <i>Enable partition discovery</i>."},
      {k:"E", fr:"Onglet <i>Source</i> : sélectionner <i>Recursively</i>.", en:"From the <i>Source</i> tab, select <i>Recursively</i>."}
    ],
    answer:["B"],
    explain:{fr:`
      <p>Remplacer le schéma <b>et</b> les données : c'est exactement la définition de l'action <b>Overwrite</b> dans l'onglet Destination.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Table action</th><th>Effet sur le schéma</th><th>Effet sur les données</th></tr>
        <tr><td class="m">Append</td><td>Conserve — la table existante impose sa structure</td><td>Les nouvelles lignes s'ajoutent aux anciennes</td></tr>
        <tr><td class="m">Overwrite</td><td><b>Remplace par celui de la source</b></td><td><b>Toutes les lignes existantes sont supprimées puis remplacées</b></td></tr>
      </table></div>
      <p>Le premier critère est décisif. L'énoncé précise que <i>the schema of the external data changes regularly</i> — avec Append, un changement de schéma provoquerait une erreur ou une perte de colonnes. Overwrite recrée la table à chaque exécution, ce qui absorbe naturellement les évolutions de structure.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — Add additional columns (Source).</b> Ajoute des colonnes calculées au flux (horodatage, nom de fichier source). Elle enrichit les données, elle ne remplace rien.</li>
        <li><b>C — Enable staging (Settings).</b> Fait transiter les données par un stockage intermédiaire. Option de performance et de compatibilité, sans effet sur le comportement de la table cible.</li>
        <li><b>D — Enable partition discovery (Source).</b> Concerne la lecture de fichiers organisés en dossiers partitionnés (<code class="inl">year=2024/month=01/</code>). Paramètre de lecture, alors que la question porte sur l'écriture.</li>
        <li><b>E — Recursively (Source).</b> Parcourt les sous-dossiers lors de la lecture. Encore un paramètre de source.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>L'énoncé parle de...</th><th>Onglet concerné</th></tr>
        <tr><td>Ce qu'on lit — fichiers, dossiers, filtres, colonnes ajoutées</td><td><b>Source</b></td></tr>
        <tr><td>Ce qu'on écrit — table cible, action de table, mapping</td><td><b>Destination</b></td></tr>
        <tr><td>Comment ça s'exécute — staging, parallélisme, tolérance aux pannes</td><td><b>Settings</b></td></tr>
      </table></div>
      <p class="note"><b>Identifiez l'onglet avant de lire les options.</b> Ici, <i>replace Table1</i> décrit une opération sur la cible : trois options sur cinq sont dans l'onglet Source, donc éliminables d'emblée. Et retenez le couple : <b>Append = ajouter, Overwrite = remplacer schéma et données</b>.</p>`,
      en:`
      <p>Replacing the schema <b>and</b> the data is exactly the definition of the <b>Overwrite</b> table action on the Destination tab.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Table action</th><th>Effect on schema</th><th>Effect on data</th></tr>
        <tr><td class="m">Append</td><td>Keeps it — the existing table imposes its structure</td><td>New rows are added to the old ones</td></tr>
        <tr><td class="m">Overwrite</td><td><b>Replaced by the source's</b></td><td><b>All existing rows are dropped and replaced</b></td></tr>
      </table></div>
      <p>The first criterion decides it. The stem states that <i>the schema of the external data changes regularly</i> — with Append, a schema change would raise an error or lose columns. Overwrite recreates the table on every run, which absorbs structural change naturally.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — Add additional columns (Source).</b> Adds computed columns to the flow (a timestamp, the source file name). It enriches the data; it replaces nothing.</li>
        <li><b>C — Enable staging (Settings).</b> Routes the data through intermediate storage. A performance and compatibility option, with no effect on target table behaviour.</li>
        <li><b>D — Enable partition discovery (Source).</b> Concerns reading files organised into partitioned folders (<code class="inl">year=2024/month=01/</code>). A read setting, whereas the question is about writing.</li>
        <li><b>E — Recursively (Source).</b> Walks subfolders when reading. Another source setting.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>If the stem is about...</th><th>Tab concerned</th></tr>
        <tr><td>What is read — files, folders, filters, added columns</td><td><b>Source</b></td></tr>
        <tr><td>What is written — target table, table action, mapping</td><td><b>Destination</b></td></tr>
        <tr><td>How it runs — staging, parallelism, fault tolerance</td><td><b>Settings</b></td></tr>
      </table></div>
      <p class="note"><b>Identify the tab before reading the options.</b> Here <i>replace Table1</i> describes an operation on the target: three options out of five sit on the Source tab and can be dropped straight away. And remember the pair: <b>Append = add, Overwrite = replace schema and data</b>.</p>`}
  },
  {
    id:"q215", kind:"single", type:T1,
    title:{fr:"Prérequis au partitionnement dans une activité Copy",en:"Prerequisite for partitioning in a Copy activity"},
    stem:{fr:`<p>Vous avez un lakehouse contenant une table <b>non partitionnée</b> nommée Table1. Vous prévoyez de copier des données vers Table1 et de <b>partitionner la table</b> sur une colonne de date. Vous créez une activité Copy et devez spécifier la colonne de partition dans les paramètres <b>Destination</b>.</p><p class="ask">Que devez-vous faire <b>en premier</b> ?</p>`,
          en:`<p>You have a lakehouse with an <b>unpartitioned</b> table named Table1. You plan to copy data to Table1 and <b>partition the table</b> based on a date column in the source data. You create a Copy activity and need to specify the partition column in the <b>Destination</b> settings.</p><p class="ask">What should you do <b>first</b>?</p>`},
    options:[
      {k:"A", fr:"Onglet Destination : régler <i>Mode</i> sur <b>Append</b>.", en:"From the Destination tab, set <i>Mode</i> to <b>Append</b>."},
      {k:"B", fr:"Onglet Destination : sélectionner la colonne de partition.", en:"From the Destination tab, select the partition column."},
      {k:"C", fr:"Onglet Source : sélectionner <i>Enable partition discovery</i>.", en:"From the Source tab, select <i>Enable partition discovery</i>."},
      {k:"D", fr:"Onglet Destination : régler <i>Mode</i> sur <b>Overwrite</b>.", en:"From the Destination tab, set <i>Mode</i> to <b>Overwrite</b>."}
    ],
    answer:["D"],
    explain:{fr:`
      <p>Le mot qui décide est <b>first</b>. L'énoncé ne demande pas <i>comment</i> spécifier la colonne de partition, mais ce qu'il faut faire <b>avant de pouvoir le faire</b>. C'est une question de prérequis.</p>
      <p>Dans les paramètres Destination d'une activité Copy, l'option de colonne de partition <b>n'apparaît qu'en mode Overwrite</b>. Tant que le mode est sur Append, le champ reste masqué.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Mode</th><th>Ce qui se passe</th><th>Partitionnement modifiable ?</th></tr>
        <tr><td class="m">Append</td><td>Ajoute des lignes en conservant la structure existante</td><td>Non — la structure est figée</td></tr>
        <tr><td class="m">Overwrite</td><td>Recrée la table entièrement</td><td><b>Oui</b> — schéma et partitionnement redéfinissables</td></tr>
      </table></div>
      <p>Table1 est décrite comme <i>unpartitioned</i>. Pour lui donner un partitionnement, il faut donc la recréer.</p>
      <p class="why">Pourquoi B n'est pas la réponse</p>
      <p>Le piège de la question. B est bien l'action finale, celle qui accomplit l'objectif — mais elle est <b>impossible tant que D n'a pas été faite</b> : le champ n'existe pas dans l'interface.</p>
      <pre class="code">1. Destination → Mode = Overwrite        ← ce que demande "first"
2. Destination → sélectionner la colonne de partition</pre>
      <ul>
        <li><b>A — Mode = Append.</b> L'inverse exact : ce mode verrouille la structure et masque l'option de partition.</li>
        <li><b>C — Enable partition discovery (Source).</b> Le distracteur lexical : le mot <i>partition</i> apparaît, mais dans le mauvais onglet. Cette option sert à lire des fichiers déjà organisés en dossiers partitionnés à la source, alors que l'énoncé précise <i>in the Destination settings</i>.</li>
      </ul>
      <p class="note"><b>Deux règles.</b> Le mot <i>first</i> signale une dépendance : cherchez l'option qui débloque l'autre, pas celle qui décrit le résultat — demandez-vous ce qui est grisé tant que vous n'avez pas fait X. Et retenez qu'<b>Overwrite débloque tout ce qui touche à la structure</b> : schéma, partitions, types.</p>`,
      en:`
      <p>The deciding word is <b>first</b>. The stem does not ask <i>how</i> to specify the partition column, but what must be done <b>before you can do so</b>. It is a prerequisite question.</p>
      <p>In a Copy activity's Destination settings, the partition column option <b>only appears in Overwrite mode</b>. While the mode is Append, the field stays hidden.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Mode</th><th>What happens</th><th>Partitioning changeable?</th></tr>
        <tr><td class="m">Append</td><td>Adds rows while keeping the existing structure</td><td>No — the structure is fixed</td></tr>
        <tr><td class="m">Overwrite</td><td>Recreates the table entirely</td><td><b>Yes</b> — schema and partitioning are redefinable</td></tr>
      </table></div>
      <p>Table1 is described as <i>unpartitioned</i>. To give it a partitioning scheme, it must be recreated.</p>
      <p class="why">Why B is not the answer</p>
      <p>The question's trap. B is indeed the final action, the one that achieves the goal — but it is <b>impossible until D has been done</b>: the field does not exist in the interface.</p>
      <pre class="code">1. Destination → Mode = Overwrite        ← what "first" asks for
2. Destination → select the partition column</pre>
      <ul>
        <li><b>A — Mode = Append.</b> The exact opposite: that mode locks the existing structure and hides the partition option.</li>
        <li><b>C — Enable partition discovery (Source).</b> The lexical distractor: the word <i>partition</i> appears, but on the wrong tab. That option reads files already organised into partitioned folders at the source, whereas the stem says <i>in the Destination settings</i>.</li>
      </ul>
      <p class="note"><b>Two rules.</b> The word <i>first</i> signals a dependency: look for the option that unlocks the other, not the one describing the outcome — ask yourself what stays greyed out until you have done X. And remember that <b>Overwrite unlocks everything structural</b>: schema, partitions, types.</p>`}
  },
  {
    id:"q216", kind:"multi", type:TM,
    title:{fr:"Raccourci S3 — quel format, quelle section",en:"S3 shortcut — which format, which section"},
    stem:{fr:`<p>Vous avez un lakehouse. Vous prévoyez de <b>requêter des fichiers de données de ventes via le SQL endpoint</b>. Les fichiers seront dans un bucket de stockage <b>Amazon S3</b>. Vous devez recommander quel format de fichier utiliser et où créer un raccourci.</p><p class="ask">Quelles <b>deux</b> actions devez-vous inclure ?</p>`,
          en:`<p>You have a Fabric tenant that contains a lakehouse. You plan to <b>query sales data files by using the SQL endpoint</b>. The files will be in an <b>Amazon S3</b> storage bucket. You need to recommend which file format to use and where to create a shortcut.</p><p class="ask">Which <b>two</b> actions should you include?</p>`},
    options:[
      {k:"A", fr:"Créer un raccourci dans la section <b>Files</b>.", en:"Create a shortcut in the <b>Files</b> section."},
      {k:"B", fr:"Utiliser le format <b>Parquet</b>.", en:"Use the <b>Parquet</b> format."},
      {k:"C", fr:"Utiliser le format <b>CSV</b>.", en:"Use the <b>CSV</b> format."},
      {k:"D", fr:"Créer un raccourci dans la section <b>Tables</b>.", en:"Create a shortcut in the <b>Tables</b> section."},
      {k:"E", fr:"Utiliser le format <b>delta</b>.", en:"Use the <b>delta</b> format."}
    ],
    answer:["D","E"],
    explain:{fr:`
      <p>Une seule contrainte de l'énoncé détermine les deux réponses : <i>query sales data files <b>by using the SQL endpoint</b></i>.</p>
      <pre class="code">SQL endpoint  →  section Tables  →  format delta</pre>
      <p class="why">D — la section Tables</p>
      <p>Le SQL analytics endpoint ne voit que les tables gérées et les raccourcis de la section <code class="inl">Tables</code>. Tout ce qui vit dans <code class="inl">Files/</code> lui est invisible.</p>
      <p class="why">E — le format delta</p>
