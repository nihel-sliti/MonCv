    title:{fr:"Filtrer dans un CASE plutôt que dans le WHERE",en:"Filtering inside a CASE rather than the WHERE"},
    stem:{fr:`<pre class="code">SELECT
  ProductCategory,
  Region,
  SUM(CASE WHEN RefundStatus &lt;&gt; 'Refunded'
           THEN SalesAmount ELSE 0 END) AS TotalRevenue
FROM Sales
WHERE YEAR(TransactionDate) = YEAR(GETDATE())
GROUP BY ProductCategory, Region;</pre>
    <p class="ask">Pour chacune des affirmations suivantes, indiquez si elle est vraie.</p>`,
          en:`<pre class="code">SELECT
  ProductCategory,
  Region,
  SUM(CASE WHEN RefundStatus &lt;&gt; 'Refunded'
           THEN SalesAmount ELSE 0 END) AS TotalRevenue
FROM Sales
WHERE YEAR(TransactionDate) = YEAR(GETDATE())
GROUP BY ProductCategory, Region;</pre>
    <p class="ask">For each statement, select Yes if it is true. Otherwise, select No.</p>`},
    fields:[
      {label:{fr:"L'instruction retourne des valeurs Region lorsqu'un article Sales a un RefundStatus égal à Refunded.",en:"The statement returns Region values when a Sales item has a RefundStatus of Refunded."}, hint:{fr:"où est le filtre ?",en:"where is the filter?"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0},
      {label:{fr:"L'instruction ne retourne que des valeurs TransactionDate survenues pendant l'année en cours.",en:"The statement returns only TransactionDate values that occurred during the current year."}, hint:{fr:"le mot « que »",en:"the word \"only\""},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0},
      {label:{fr:"Le calcul TotalRevenue agrège les valeurs SalesAmount dont le RefundStatus est Refunded.",en:"The TotalRevenue calculation aggregates SalesAmount values whose RefundStatus is Refunded."}, hint:{fr:"lire l'opérateur",en:"read the operator"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1}
    ],
    explain:{fr:`
      <p class="why">1 — Region retournée pour un article remboursé → <b>Yes</b></p>
      <p>Point subtil, et cœur de la question : le filtre sur <code class="inl">RefundStatus</code> se trouve <b>à l'intérieur du CASE</b>, pas dans le <code class="inl">WHERE</code>. Les lignes remboursées ne sont donc <b>jamais éliminées</b> — elles sont lues, regroupées, et leur <code class="inl">Region</code> apparaît dans le résultat. Si une région ne contient que des ventes remboursées cette année, elle figure quand même au résultat, avec <code class="inl">TotalRevenue = 0</code>.</p>
      <p class="why">2 — Uniquement l'année en cours → <b>Yes</b></p>
      <p><code class="inl">GETDATE()</code> renvoie la date du jour, <code class="inl">YEAR()</code> en extrait l'année, et seules les lignes de cette année passent le filtre. Le mot <b>« que »</b> est l'objet du test : il s'agit de reconnaître un filtre restrictif sur l'année courante, ce qui est exactement ce que fait ce <code class="inl">WHERE</code>.</p>
      <p class="why">3 — TotalRevenue agrège les montants remboursés → <b>No</b></p>
      <p>C'est l'inverse. L'opérateur <code class="inl">&lt;&gt;</code> signifie « <b>différent de</b> » : le montant n'est pris en compte que si le statut n'est <b>pas</b> <code class="inl">'Refunded'</code> ; sinon il est remplacé par <code class="inl">0</code>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Approche</th><th>Effet sur les lignes</th><th>Effet sur le total</th></tr>
        <tr><td class="m">WHERE RefundStatus &lt;&gt; 'Refunded'</td><td>Lignes supprimées</td><td>Exclues</td></tr>
        <tr><td class="m">SUM(CASE WHEN … ELSE 0 END)</td><td>Lignes conservées</td><td>Contribuent 0</td></tr>
      </table></div>
      <p class="note"><b>Le réflexe.</b> Un filtre dans un <code class="inl">CASE</code> <b>neutralise sans éliminer</b> — c'est précisément ce qu'on veut quand tous les groupes doivent apparaître, même à zéro.</p>`,
      en:`
      <p class="why">1 — Region returned for a refunded item → <b>Yes</b></p>
      <p>The subtle point, and the heart of the question: the filter on <code class="inl">RefundStatus</code> sits <b>inside the CASE</b>, not in the <code class="inl">WHERE</code>. Refunded rows are therefore <b>never eliminated</b> — they are read, grouped, and their <code class="inl">Region</code> appears in the result. If a region contains only refunded sales this year, it still shows up, with <code class="inl">TotalRevenue = 0</code>.</p>
      <p class="why">2 — Only the current year → <b>Yes</b></p>
      <p><code class="inl">GETDATE()</code> returns today's date, <code class="inl">YEAR()</code> extracts the year, and only rows from that year pass the filter. The word <b>"only"</b> is what is being tested: recognizing a restrictive filter on the current year, which is exactly what this <code class="inl">WHERE</code> does.</p>
      <p class="why">3 — TotalRevenue aggregates refunded amounts → <b>No</b></p>
      <p>It is the opposite. The <code class="inl">&lt;&gt;</code> operator means "<b>not equal to</b>": the amount counts only if the status is <b>not</b> <code class="inl">'Refunded'</code>; otherwise it is replaced by <code class="inl">0</code>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Approach</th><th>Effect on rows</th><th>Effect on the total</th></tr>
        <tr><td class="m">WHERE RefundStatus &lt;&gt; 'Refunded'</td><td>Rows removed</td><td>Excluded</td></tr>
        <tr><td class="m">SUM(CASE WHEN … ELSE 0 END)</td><td>Rows kept</td><td>Contribute 0</td></tr>
      </table></div>
      <p class="note"><b>The reflex.</b> A filter inside a <code class="inl">CASE</code> <b>neutralizes without eliminating</b> — exactly what you want when every group must appear, even at zero.</p>`}
  },
  {
    id:"q244", kind:"fields", type:TY,
    title:{fr:"OUTER APPLY et fonction table",en:"OUTER APPLY and table-valued function"},
    stem:{fr:`<p>Vous avez une requête qui joint <code class="inl">Dimension.Employee</code> à une fonction <code class="inl">Dimension.GetDirectReports</code> :</p>
    <pre class="code">SELECT e.[Employee Key], e.Employee,
       gdr.[WWI Employee ID], gdr.Employee AS DirectReport
FROM Dimension.Employee AS e
OUTER APPLY Dimension.GetDirectReports(e.[Employee Key]) AS gdr;</pre>
    <p class="ask">Pour chacune des affirmations suivantes, indiquez si elle est vraie.</p>`,
          en:`<p>You have a query that joins <code class="inl">Dimension.Employee</code> to a function named <code class="inl">Dimension.GetDirectReports</code>:</p>
    <pre class="code">SELECT e.[Employee Key], e.Employee,
       gdr.[WWI Employee ID], gdr.Employee AS DirectReport
FROM Dimension.Employee AS e
OUTER APPLY Dimension.GetDirectReports(e.[Employee Key]) AS gdr;</pre>
    <p class="ask">For each statement, select Yes if it is true. Otherwise, select No.</p>`},
    fields:[
      {label:{fr:"Dimension.GetDirectReports est une fonction T-SQL scalaire.",en:"Dimension.GetDirectReports is a scalar T-SQL function."}, hint:{fr:"que peut recevoir APPLY ?",en:"what can APPLY take?"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1},
      {label:{fr:"La fonction ne s'exécutera qu'une seule fois lors de l'exécution de la requête.",en:"The function will run only once when the query runs."}, hint:{fr:"argument corrélé",en:"correlated argument"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1},
      {label:{fr:"Les lignes de sortie incluront au moins une ligne pour chaque ligne de Dimension.Employee.",en:"The output rows will include at least one row for each row in Dimension.Employee."}, hint:{fr:"OUTER, pas CROSS",en:"OUTER, not CROSS"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0}
    ],
    explain:{fr:`
      <p class="why">1 — Fonction scalaire → <b>No</b></p>
      <p><code class="inl">APPLY</code> — qu'il soit <code class="inl">CROSS</code> ou <code class="inl">OUTER</code> — ne s'utilise <b>qu'avec une expression retournant une table</b> : une fonction table (TVF) ou une sous-requête dérivée. Une fonction scalaire renvoie une valeur unique et s'appelle directement dans le <code class="inl">SELECT</code>, sans alias de table. Ici l'alias <code class="inl">gdr</code> est déréférencé sur <b>deux colonnes</b>, ce qui confirme un résultat tabulaire.</p>
      <p class="why">2 — Exécutée une seule fois → <b>No</b></p>
      <p>C'est le principe même d'<code class="inl">APPLY</code> : la fonction reçoit <code class="inl">e.[Employee Key]</code>, une valeur <b>corrélée à la ligne de gauche en cours de traitement</b>. Elle est donc invoquée <b>pour chaque ligne</b> de Dimension.Employee. Une exécution unique impliquerait une jointure classique avec un argument constant — ce que <code class="inl">JOIN</code> ne permet pas avec une TVF paramétrée, d'où l'usage d'<code class="inl">APPLY</code>.</p>
      <p class="why">3 — Au moins une ligne par employé → <b>Yes</b></p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Opérateur</th><th>Quand la TVF ne retourne rien</th></tr>
        <tr><td class="m">CROSS APPLY</td><td>La ligne de gauche est <b>éliminée</b> (équivalent INNER JOIN)</td></tr>
        <tr><td class="m">OUTER APPLY</td><td>La ligne de gauche est <b>conservée</b>, colonnes de droite à NULL (équivalent LEFT JOIN)</td></tr>
      </table></div>
      <p>Avec <code class="inl">OUTER APPLY</code>, un employé sans subordonné direct apparaît quand même, avec les colonnes de droite à NULL ; un manager avec trois subordonnés génère trois lignes. Dans les deux cas : <b>au moins une ligne</b>.</p>
      <p class="note"><b>Le réflexe.</b> <code class="inl">APPLY</code> = jointure <b>corrélée</b> avec une fonction table, réévaluée à chaque ligne. <code class="inl">CROSS</code> ≈ INNER, <code class="inl">OUTER</code> ≈ LEFT.</p>`,
      en:`
      <p class="why">1 — Scalar function → <b>No</b></p>
      <p><code class="inl">APPLY</code> — whether <code class="inl">CROSS</code> or <code class="inl">OUTER</code> — can only be used with an expression that <b>returns a table</b>: a table-valued function (TVF) or a derived subquery. A scalar function returns a single value and is called directly in the <code class="inl">SELECT</code>, with no table alias. Here the alias <code class="inl">gdr</code> is dereferenced on <b>two columns</b>, which confirms a tabular result.</p>
      <p class="why">2 — Runs only once → <b>No</b></p>
      <p>That is the very principle of <code class="inl">APPLY</code>: the function receives <code class="inl">e.[Employee Key]</code>, a value <b>correlated with the left row currently being processed</b>. It is therefore invoked <b>for every row</b> of Dimension.Employee. A single execution would imply a classic join with a constant argument — which <code class="inl">JOIN</code> does not allow with a parameterized TVF, hence <code class="inl">APPLY</code>.</p>
      <p class="why">3 — At least one row per employee → <b>Yes</b></p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Operator</th><th>When the TVF returns nothing</th></tr>
        <tr><td class="m">CROSS APPLY</td><td>The left row is <b>dropped</b> (INNER JOIN equivalent)</td></tr>
        <tr><td class="m">OUTER APPLY</td><td>The left row is <b>kept</b>, right columns NULL (LEFT JOIN equivalent)</td></tr>
      </table></div>
      <p>With <code class="inl">OUTER APPLY</code>, an employee with no direct report still appears, right columns NULL; a manager with three reports produces three rows. Either way: <b>at least one row</b>.</p>
      <p class="note"><b>The reflex.</b> <code class="inl">APPLY</code> = <b>correlated</b> join with a table-valued function, re-evaluated per row. <code class="inl">CROSS</code> ≈ INNER, <code class="inl">OUTER</code> ≈ LEFT.</p>`}
  },
  {
    id:"q245", kind:"single", type:T1,
    title:{fr:"Activité qui retourne des valeurs au pipeline — variante 1",en:"Activity that returns values to the pipeline — variant 1"},
    stem:{fr:`<p>Vous avez un locataire Fabric et créez un pipeline Data Factory. Vous avez une <b>procédure stockée</b> qui retourne le nombre de clients actifs et leurs ventes moyennes pour le mois en cours. Vous devez ajouter une activité qui exécutera la procédure stockée dans un entrepôt. <b>Les valeurs retournées doivent être disponibles pour les activités en aval</b> du pipeline.</p><p class="ask">Quel type d'activité devez-vous ajouter ?</p>`,
          en:`<p>You have a Fabric tenant and you create a Data Factory pipeline. You have a <b>stored procedure</b> that returns the number of active customers and their average sales for the current month. You need to add an activity that will execute the stored procedure in a warehouse. <b>The returned values must be available to the downstream activities</b> of the pipeline.</p><p class="ask">Which type of activity should you add?</p>`},
    options:[
      {k:"A", fr:"Switch", en:"Switch"},
      {k:"B", fr:"Copy data", en:"Copy data"},
      {k:"C", fr:"Append variable", en:"Append variable"},
      {k:"D", fr:"Lookup", en:"Lookup"}
    ],
    answer:["D"],
    explain:{fr:`
      <p>L'activité <b>Lookup</b> exécute une requête <b>ou une procédure stockée</b> contre une source de données et <b>renvoie le résultat dans la sortie de l'activité</b>. Ces valeurs sont ensuite référençables par les activités suivantes :</p>
      <pre class="code">@activity('LookupActivityName').output.firstRow.ActiveCustomers</pre>
      <p>Pour plusieurs lignes, on utilise <code class="inl">.output.value</code> (avec <code class="inl">firstRowOnly</code> désactivé). C'est le <b>seul</b> type d'activité qui satisfait les <b>deux</b> exigences : exécuter la procédure <i>et</i> exposer ses valeurs de retour au pipeline.</p>
      <p class="why">Le vrai piège de cette question</p>
      <p>L'activité <b>Stored procedure</b> existe aussi dans Data Factory et exécute bien une procédure — mais elle <b>ne retourne aucune valeur au pipeline</b>. Elle sert aux opérations « fire and forget » : journalisation, transformation, mise à jour. Elle <b>ne figure pas dans les choix</b> précisément parce qu'elle échouerait sur la seconde exigence.</p>
      <p class="why">Les trois autres</p>
      <ul>
        <li><b>A — Switch.</b> Activité de flux de contrôle qui aiguille vers différentes branches selon une valeur. Elle <b>consomme</b> un résultat, elle n'en produit pas.</li>
        <li><b>B — Copy data.</b> Déplace des données vers un sink et ne renvoie que des <b>métriques</b> (lignes copiées, durée), pas les valeurs métier.</li>
        <li><b>C — Append variable.</b> Ajoute un élément à une variable de type tableau du pipeline, sans accéder à aucune source externe.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> « Les valeurs doivent être disponibles en aval » = <b>Lookup</b>. <code class="inl">Stored procedure</code> exécute sans jamais retourner.</p>`,
      en:`
      <p>The <b>Lookup</b> activity runs a query <b>or a stored procedure</b> against a data source and <b>returns the result in the activity's output</b>. Those values can then be referenced by downstream activities:</p>
      <pre class="code">@activity('LookupActivityName').output.firstRow.ActiveCustomers</pre>
      <p>For multiple rows you use <code class="inl">.output.value</code> (with <code class="inl">firstRowOnly</code> disabled). It is the <b>only</b> activity type that satisfies <b>both</b> requirements: executing the procedure <i>and</i> exposing its return values to the pipeline.</p>
      <p class="why">The question's real trap</p>
      <p>The <b>Stored procedure</b> activity also exists in Data Factory and does execute a procedure — but it <b>returns no value to the pipeline</b>. It is for "fire and forget" operations: logging, transformation, updates. It is <b>absent from the choices</b> precisely because it would fail the second requirement.</p>
      <p class="why">The other three</p>
      <ul>
        <li><b>A — Switch.</b> A control-flow activity that branches on a value. It <b>consumes</b> a result, it does not produce one.</li>
        <li><b>B — Copy data.</b> Moves data to a sink and returns only <b>metrics</b> (rows copied, duration), not business values.</li>
        <li><b>C — Append variable.</b> Adds an item to an array variable of the pipeline, without touching any external source.</li>
      </ul>
      <p class="note"><b>The reflex.</b> "Values must be available downstream" = <b>Lookup</b>. <code class="inl">Stored procedure</code> executes but never returns.</p>`}
  },
  {
    id:"q246", kind:"single", type:T1,
    title:{fr:"Même énoncé — variante 2",en:"Same scenario — variant 2"},
    stem:{fr:`<p><b>Énoncé identique à la question précédente</b> : une procédure stockée retourne le nombre de clients actifs et leurs ventes moyennes ; l'activité doit l'exécuter dans un entrepôt et <b>rendre les valeurs disponibles aux activités en aval</b>.</p><p class="ask">Quel type d'activité devez-vous ajouter ?</p>`,
          en:`<p><b>Identical scenario to the previous question</b>: a stored procedure returns the number of active customers and their average sales; the activity must execute it in a warehouse and <b>make the values available to downstream activities</b>.</p><p class="ask">Which type of activity should you add?</p>`},
    options:[
      {k:"A", fr:"Get metadata", en:"Get metadata"},
      {k:"B", fr:"Switch", en:"Switch"},
      {k:"C", fr:"Lookup", en:"Lookup"},
      {k:"D", fr:"Append variable", en:"Append variable"}
    ],
    answer:["C"],
    explain:{fr:`
      <p>Seul le <b>distracteur change</b> : « Get metadata » remplace « Copy data ». La réponse reste <b>Lookup</b>, pour les raisons exposées à la question précédente.</p>
      <p><b>Get metadata</b> récupère des <b>métadonnées</b> sur un fichier ou un dossier — nom, taille, date de dernière modification, structure, existence. Elle <b>ne se connecte pas à une base de données pour exécuter du code SQL</b> : elle interroge un système de fichiers ou un stockage, pas un moteur relationnel.</p>
      <p class="why">Pourquoi cette série de variantes existe</p>
      <p>L'examen présente trois fois le <b>même énoncé</b> avec des jeux d'options différents. C'est un test de <b>méthode</b>, pas de mémoire : la bonne réponse se déduit en confrontant chaque option aux deux exigences de l'énoncé (exécuter la procédure, retourner les valeurs), et non en reconnaissant une réponse apprise par cœur.</p>
      <p class="note"><b>Le réflexe.</b> Sur une variante, ne récitez pas la réponse précédente — <b>relisez les options</b>. Si <code class="inl">Lookup</code> est présent, c'est lui.</p>`,
      en:`
      <p>Only the <b>distractor changes</b>: "Get metadata" replaces "Copy data". The answer is still <b>Lookup</b>, for the reasons set out in the previous question.</p>
      <p><b>Get metadata</b> retrieves <b>metadata</b> about a file or folder — name, size, last-modified date, structure, existence. It <b>does not connect to a database to run SQL code</b>: it queries a file system or storage, not a relational engine.</p>
      <p class="why">Why this series of variants exists</p>
      <p>The exam presents the <b>same scenario</b> three times with different option sets. It tests <b>method</b>, not memory: the right answer is derived by checking each option against the two requirements in the stem (execute the procedure, return the values), not by recognizing a memorized answer.</p>
      <p class="note"><b>The reflex.</b> On a variant, don't recite the previous answer — <b>re-read the options</b>. If <code class="inl">Lookup</code> is there, it's Lookup.</p>`}
  },
  {

    title:{fr:"Même énoncé — variante 3 : Lookup absent",en:"Same scenario — variant 3: Lookup absent"},
    stem:{fr:`<p><b>Énoncé identique aux deux questions précédentes</b> : la procédure stockée doit être exécutée dans un entrepôt et ses valeurs de retour rendues disponibles aux activités en aval.</p><p class="ask">Quel type d'activité devez-vous ajouter ?</p>`,
          en:`<p><b>Identical scenario to the two previous questions</b>: the stored procedure must be executed in a warehouse and its return values made available to downstream activities.</p><p class="ask">Which type of activity should you add?</p>`},

    answer:["B"],
    explain:{fr:`
      <p>La réponse <b>bascule</b> car <code class="inl">Lookup</code> est absent du jeu d'options.</p>
      <p>L'activité <b>Script</b> exécute une ou plusieurs instructions T-SQL — y compris <code class="inl">EXEC MaProcedure</code> — et <b>capture les jeux de résultats dans sa sortie</b> :</p>
      <pre class="code">@activity('ScriptActivity').output.resultSets[0].rows[0].ActiveCustomers</pre>
      <p>C'est cette capacité à retourner les <code class="inl">resultSets</code> qui la distingue de l'activité <b>Stored procedure</b>.</p>
      <p class="why">C — le distracteur évident, et le piège récurrent de la série</p>
      <p><b>Stored procedure</b> exécute bien la procédure, mais elle est de type « <b>fire and forget</b> » et ne retourne <b>aucune valeur</b>. On l'utilise pour des opérations à effet de bord, jamais quand le résultat doit alimenter la suite du flux.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Options disponibles</th><th>Bonne réponse</th></tr>
        <tr><td>Switch · Copy data · Append variable · <b>Lookup</b></td><td>Lookup</td></tr>
        <tr><td>Get metadata · Switch · <b>Lookup</b> · Append variable</td><td>Lookup</td></tr>
        <tr><td>Append variable · <b>Script</b> · Stored procedure · Get metadata</td><td>Script</td></tr>

      <p class="note"><b>La règle des trois variantes.</b> Valeurs retournées : <code class="inl">Lookup</code> si disponible, sinon <code class="inl">Script</code>. <code class="inl">Stored procedure</code> exécute sans jamais retourner.</p>`,
      en:`
      <p>The answer <b>switches</b> because <code class="inl">Lookup</code> is absent from this option set.</p>
      <p>The <b>Script</b> activity executes one or more T-SQL statements — including <code class="inl">EXEC MyProcedure</code> — and <b>captures the result sets in its output</b>:</p>
      <pre class="code">@activity('ScriptActivity').output.resultSets[0].rows[0].ActiveCustomers</pre>
      <p>That ability to return <code class="inl">resultSets</code> is what distinguishes it from the <b>Stored procedure</b> activity.</p>
      <p class="why">C — the obvious distractor, and this series' recurring trap</p>
      <p><b>Stored procedure</b> does execute the procedure, but it is "<b>fire and forget</b>" and returns <b>no value</b>. Use it for side-effect operations, never when the result must feed the rest of the flow.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Options offered</th><th>Correct answer</th></tr>
        <tr><td>Switch · Copy data · Append variable · <b>Lookup</b></td><td>Lookup</td></tr>
        <tr><td>Get metadata · Switch · <b>Lookup</b> · Append variable</td><td>Lookup</td></tr>
        <tr><td>Append variable · <b>Script</b> · Stored procedure · Get metadata</td><td>Script</td></tr>
      </table></div>
      <p class="note"><b>The three-variant rule.</b> Returned values: <code class="inl">Lookup</code> if available, otherwise <code class="inl">Script</code>. <code class="inl">Stored procedure</code> executes but never returns.</p>`}

  {
    id:"q248", kind:"fields", type:TD,
    title:{fr:"Dernière version de chaque enregistrement (Power Query)",en:"Latest version of each record (Power Query)"},
    stem:{fr:`<p>Vous avez un espace de travail Fabric contenant une requête Dataflow Gen2 qui retourne trois colonnes : <code class="inl">CustomerID</code> (Whole number), <code class="inl">CustomerName</code> (Text) et <code class="inl">VersionDate</code> (Date/Time, horodatage de l'enregistrement). Vous devez filtrer les résultats pour ne conserver que <b>la dernière version de l'enregistrement de chaque client</b>. La solution doit garantir qu'<b>aucune nouvelle colonne</b> n'est chargée dans le modèle sémantique.</p><p class="ask">Quelles quatre actions effectuer, et dans quel ordre, dans l'éditeur Power Query ?</p>`,
          en:`<p>You have a Fabric workspace that contains a Dataflow Gen2 query returning three columns: <code class="inl">CustomerID</code> (Whole number), <code class="inl">CustomerName</code> (Text) and <code class="inl">VersionDate</code> (Date/Time, the record timestamp). You need to filter the results to keep only <b>the latest version of each customer's record</b>. The solution must ensure that <b>no new column</b> is loaded into the semantic model.</p><p class="ask">Which four actions should you perform in sequence in the Power Query editor?</p>`},
    fields:[
      {label:{fr:"Étape 1",en:"Step 1"}, hint:{fr:"produire le repère",en:"produce the marker"},
       opts:{fr:["Filter the query where the version date value equals the max version date value","Remove the max version date column","Expand the All Rows detail column","Group by CustomerID and calculate the max version date per customer ID","Remove duplicates based on CustomerID"],en:["Filter the query where the version date value equals the max version date value","Remove the max version date column","Expand the All Rows detail column","Group by CustomerID and calculate the max version date per customer ID","Remove duplicates based on CustomerID"]}, ans:3},
      {label:{fr:"Étape 2",en:"Step 2"}, hint:{fr:"ne garder que la dernière",en:"keep only the latest"},
       opts:{fr:["Filter the query where the version date value equals the max version date value","Remove the max version date column","Expand the All Rows detail column","Group by CustomerID and calculate the max version date per customer ID","Remove duplicates based on CustomerID"],en:["Filter the query where the version date value equals the max version date value","Remove the max version date column","Expand the All Rows detail column","Group by CustomerID and calculate the max version date per customer ID","Remove duplicates based on CustomerID"]}, ans:0},
      {label:{fr:"Étape 3",en:"Step 3"}, hint:{fr:"traiter les ex æquo",en:"handle ties"},
       opts:{fr:["Filter the query where the version date value equals the max version date value","Remove the max version date column","Expand the All Rows detail column","Group by CustomerID and calculate the max version date per customer ID","Remove duplicates based on CustomerID"],en:["Filter the query where the version date value equals the max version date value","Remove the max version date column","Expand the All Rows detail column","Group by CustomerID and calculate the max version date per customer ID","Remove duplicates based on CustomerID"]}, ans:4},
      {label:{fr:"Étape 4",en:"Step 4"}, hint:{fr:"aucune nouvelle colonne chargée",en:"no new column loaded"},
       opts:{fr:["Filter the query where the version date value equals the max version date value","Remove the max version date column","Expand the All Rows detail column","Group by CustomerID and calculate the max version date per customer ID","Remove duplicates based on CustomerID"],en:["Filter the query where the version date value equals the max version date value","Remove the max version date column","Expand the All Rows detail column","Group by CustomerID and calculate the max version date per customer ID","Remove duplicates based on CustomerID"]}, ans:1}
    ],
    explain:{fr:`
      <p>La logique est celle du « dernier enregistrement par entité » : <b>calculer le maximum par client</b>, <b>filtrer sur ce maximum</b>, <b>dédupliquer</b>, puis <b>nettoyer</b>.</p>
      <p class="why">Pourquoi le Remove duplicates en troisième position</p>
      <p>Il traite les <b>ex æquo</b> : si un même client possède deux enregistrements portant exactement la même <code class="inl">VersionDate</code> maximale, le filtre de l'étape 2 en conserve <b>deux</b>. La déduplication garantit alors <b>une ligne unique par client</b>.</p>
      <p class="why">Pourquoi la colonne technique se supprime en dernier</p>
      <p>C'est ce qui satisfait l'exigence « <b>aucune nouvelle colonne chargée dans le modèle sémantique</b> ». L'ordre est <b>contraint</b> : supprimer la colonne <i>avant</i> le filtre rendrait le filtrage impossible.</p>
      <p class="note"><b>Les options All Rows sont des distracteurs.</b> La correction officielle retient bien la séquence ci-dessus, et écarte les combinaisons bâties sur « use the All Rows operation » + « Expand the All Rows detail column ». Techniquement, un <code class="inl">Group By</code> sans All Rows ne renvoie que <code class="inl">CustomerID</code> et <code class="inl">MaxVersionDate</code> — dans un vrai classeur il faudrait donc All Rows + Expand, ou une fusion avec la table d'origine. L'examen raisonne ici au niveau de la <b>logique métier</b>, pas de l'implémentation exacte : agréger, filtrer, dédupliquer, nettoyer. <b>Ne basculez pas sur les options All Rows</b> en croyant bien faire.</p>
      <p class="why">Pourquoi Remove duplicates seul serait faux</p>
      <p>Sans le <code class="inl">Group By</code> préalable, cette opération conserve <b>la première ligne rencontrée dans l'ordre courant</b> — ce qui est <b>non déterministe</b> dans un moteur de requête. Rien ne garantit qu'il s'agisse de la version la plus récente.</p>
      <p class="note"><b>Le réflexe.</b> Dernière version par entité = <b>agrégat max → filtre d'égalité → déduplication → suppression de la colonne technique</b>.</p>`,
      en:`
      <p>The logic is the classic "latest record per entity": <b>compute the max per customer</b>, <b>filter on that max</b>, <b>deduplicate</b>, then <b>clean up</b>.</p>
      <p class="why">Why Remove duplicates comes third</p>
      <p>It handles <b>ties</b>: if one customer has two records carrying exactly the same maximum <code class="inl">VersionDate</code>, the step-2 filter keeps <b>both</b>. Deduplication then guarantees <b>one row per customer</b>.</p>
      <p class="why">Why the technical column is removed last</p>
      <p>That is what satisfies the "<b>no new column loaded into the semantic model</b>" requirement. The order is <b>constrained</b>: removing the column <i>before</i> the filter would make filtering impossible.</p>
      <p class="note"><b>The All Rows options are distractors.</b> The official key retains the sequence above and rejects the combinations built on "use the All Rows operation" + "Expand the All Rows detail column". Technically, a <code class="inl">Group By</code> without All Rows returns only <code class="inl">CustomerID</code> and <code class="inl">MaxVersionDate</code> — in a real workbook you would need All Rows + Expand, or a merge back onto the original table. The exam is reasoning at the level of <b>business logic</b> here, not exact implementation: aggregate, filter, deduplicate, clean up. <b>Do not switch to the All Rows options</b> thinking you are being clever.</p>
      <p class="why">Why Remove duplicates alone would be wrong</p>
      <p>Without the preceding <code class="inl">Group By</code>, that operation keeps <b>the first row encountered in the current order</b> — which is <b>non-deterministic</b> in a query engine. Nothing guarantees it is the most recent version.</p>
      <p class="note"><b>The reflex.</b> Latest version per entity = <b>max aggregate → equality filter → deduplicate → drop the technical column</b>.</p>`}
  },
  {
    id:"q249", kind:"multi", type:TM, contested:true,
    title:{fr:"Total par catégorie sur le dernier trimestre",en:"Total per category over the last quarter"},
    stem:{fr:`<p>Vous avez un entrepôt Fabric contenant une table <code class="inl">Table1</code> avec trois colonnes : <code class="inl">SalesAmount</code>, <code class="inl">ProductCategory</code> et <code class="inl">TransactionDate</code>. Vous devez créer une requête Power BI qui calculera le <b>montant total des ventes de chaque catégorie de produit</b> pour les transactions survenues durant le <b>dernier trimestre</b>.</p><p class="ask">Quelles <b>deux</b> actions devez-vous effectuer dans l'éditeur de requête visuel ?</p>`,
          en:`<p>You have a Fabric warehouse that contains a table named <code class="inl">Table1</code> with three columns: <code class="inl">SalesAmount</code>, <code class="inl">ProductCategory</code> and <code class="inl">TransactionDate</code>. You need to create a Power BI query that will calculate the <b>total sales amount of each product category</b> for transactions that occurred during the <b>last quarter</b>.</p><p class="ask">Which <b>two</b> actions should you perform in the visual query editor?</p>`},
    options:[
      {k:"A", fr:"Pour la colonne TransactionDate, sélectionner Remove duplicates.", en:"For the TransactionDate column, select Remove duplicates."},
      {k:"B", fr:"Pour la colonne TransactionDate, sélectionner Keep top rows et définir Number of rows à 90.", en:"For the TransactionDate column, select Keep top rows and set Number of rows to 90."},
      {k:"C", fr:"Pour la colonne TransactionDate, sélectionner Filter rows et définir la valeur à « last quarter ».", en:"For the TransactionDate column, select Filter rows and set the value to \"last quarter\"."},
      {k:"D", fr:"Pour la colonne ProductCategory, sélectionner Group by et sommer la colonne SalesAmount.", en:"For the ProductCategory column, select Group by and sum the SalesAmount column."},
      {k:"E", fr:"Pour la colonne SalesAmount, sélectionner Transformation number column – Standard, choisir Add, puis définir la valeur à 90.", en:"For the SalesAmount column, select Transformation number column – Standard, choose Add, then set the value to 90."}
    ],
    answer:["C","D"],
    explain:{fr:`
      <p class="contested"><b>Réponse contestée.</b> La correction officielle elle-même marque <b>B</b>, ce qui est incohérent : les deux actions demandées forment <b>ensemble</b> la solution — un <b>filtre temporel</b> puis une <b>agrégation</b>. Un « top 90 lignes » ne filtre aucune période et ne produit aucun total par catégorie. Retenez <b>C et D</b>.</p>
      <p class="why">C — filtrer les lignes</p>
      <p>Dans l'éditeur de requête visuel, la colonne <code class="inl">TransactionDate</code> propose des <b>filtres de date relatifs prédéfinis</b> : Last quarter, Last month, Last year. Le filtre se <b>recalcule dynamiquement à chaque actualisation</b>, sans date codée en dur — ce qui est exactement le comportement attendu d'une requête récurrente.</p>
      <p class="why">D — regrouper et sommer</p>
      <p><code class="inl">Group by</code> sur <code class="inl">ProductCategory</code> avec l'opération <b>Sum</b> appliquée à <code class="inl">SalesAmount</code> produit exactement <b>une ligne par catégorie</b> avec son total.</p>
      <p class="why">Pourquoi les trois autres échouent</p>
      <ul>
        <li><b>A — Remove duplicates</b> supprimerait toutes les transactions partageant une même date : perte massive de données, et aucun rapport avec un filtre trimestriel.</li>
        <li><b>B — Keep top rows = 90</b> conserve les <b>90 premières lignes</b>, pas 90 jours. Le nombre de lignes n'a aucun lien avec une période.</li>
        <li><b>E — Add = 90</b> ajouterait 90 à chaque montant de vente, <b>faussant</b> les données au lieu de les filtrer.</li>
      </ul>
      <p>Le piège de B et E repose entièrement sur le chiffre <b>90</b>, qui évoque approximativement un trimestre en jours. C'est une association trompeuse : aucune de ces deux opérations n'agit sur des dates.</p>
      <p class="note"><b>Le réflexe.</b> Période relative = <b>filtre de date natif</b> sur la colonne. Un « top N lignes » n'est <b>jamais</b> un filtre temporel.</p>`,
      en:`
      <p class="contested"><b>Contested answer.</b> The official correction itself marks <b>B</b>, which is incoherent: the two required actions <b>together</b> form the solution — a <b>time filter</b> then an <b>aggregation</b>. A "top 90 rows" filters no period and produces no per-category total. Go with <b>C and D</b>.</p>
      <p class="why">C — filter the rows</p>
      <p>In the visual query editor, the <code class="inl">TransactionDate</code> column offers <b>predefined relative date filters</b>: Last quarter, Last month, Last year. The filter <b>recomputes dynamically on every refresh</b>, with no hard-coded date — exactly the behaviour a recurring query needs.</p>
      <p class="why">D — group and sum</p>
      <p><code class="inl">Group by</code> on <code class="inl">ProductCategory</code> with the <b>Sum</b> operation applied to <code class="inl">SalesAmount</code> produces exactly <b>one row per category</b> with its total.</p>
      <p class="why">Why the other three fail</p>
      <ul>
        <li><b>A — Remove duplicates</b> would delete every transaction sharing a date: massive data loss, and nothing to do with a quarterly filter.</li>
        <li><b>B — Keep top rows = 90</b> keeps the <b>first 90 rows</b>, not 90 days. A row count has no relationship to a time period.</li>
        <li><b>E — Add = 90</b> would add 90 to every sales amount, <b>corrupting</b> the data instead of filtering it.</li>
      </ul>
      <p>The trap in B and E rests entirely on the number <b>90</b>, which loosely evokes a quarter in days. It is a misleading association: neither operation touches dates.</p>
      <p class="note"><b>The reflex.</b> Relative period = <b>native date filter</b> on the column. A "top N rows" is <b>never</b> a time filter.</p>`}
  },
  {
    id:"q250", kind:"single", type:T1,
    title:{fr:"Outil pour transformer et visualiser un milliard d'éléments",en:"Tool to transform and visualize a billion items"},
    stem:{fr:`<p>Vous avez un locataire Fabric contenant des fichiers <b>JSON</b> dans OneLake. Les fichiers comportent <b>un milliard d'éléments</b>. Vous prévoyez une analyse de séries temporelles. Vous devez <b>transformer</b> les données, les <b>visualiser</b> pour en dégager des enseignements, effectuer une <b>détection d'anomalies</b> et <b>partager</b> les résultats avec d'autres utilisateurs métier.</p>
    <p>La solution doit répondre aux exigences suivantes :</p>
    <ul><li>utiliser le <b>traitement parallèle</b> ;</li><li><b>minimiser la duplication</b> des données ;</li><li><b>minimiser le temps de chargement</b>.</li></ul>
    <p class="ask">Qu'utiliserez-vous pour transformer et visualiser les données ?</p>`,
          en:`<p>You have a Fabric tenant that contains <b>JSON</b> files in OneLake. The files contain <b>one billion items</b>. You plan to perform time series analysis. You need to <b>transform</b> the data, <b>visualize</b> it to identify insights, perform <b>anomaly detection</b>, and <b>share</b> the results with other business users.</p>
    <p>The solution must meet the following requirements:</p>
    <ul><li>use <b>parallel processing</b>;</li><li><b>minimize data duplication</b>;</li><li><b>minimize load time</b>.</li></ul>
    <p class="ask">What should you use to transform and visualize the data?</p>`},
    options:[
      {k:"A", fr:"la bibliothèque PySpark dans un notebook Fabric", en:"the PySpark library in a Fabric notebook"},
      {k:"B", fr:"la bibliothèque pandas dans un notebook Fabric", en:"the pandas library in a Fabric notebook"},
      {k:"C", fr:"un rapport Microsoft Power BI utilisant les visuels standard", en:"a Microsoft Power BI report that uses core visuals"}
    ],
    answer:["A"],
    explain:{fr:`
      <p>Un notebook Fabric exécute <b>Apache Spark</b> sur un pool distribué. <code class="inl">spark.read.json()</code> lit les fichiers <b>directement depuis OneLake</b> : les données restent à leur emplacement d'origine (<b>aucune copie</b>) et le chargement est <b>parallélisé</b> sur l'ensemble des nœuds. C'est la seule option qui satisfait <b>simultanément les trois contraintes</b>.</p>
      <p class="why">Le notebook couvre aussi tout le cycle demandé</p>
      <ul>
        <li><b>Transformation</b> : DataFrame API / Spark SQL.</li>
        <li><b>Visualisation</b> : <code class="inl">display()</code> natif, matplotlib, seaborn, Plotly.</li>
        <li><b>Détection d'anomalies</b> : MLlib ou bibliothèques de séries temporelles.</li>
        <li><b>Partage</b> : le notebook est un élément d'espace de travail partageable, et les résultats peuvent être écrits en <b>table Delta</b>.</li>
      </ul>
      <p class="why">B — pandas</p>
      <p>pandas fonctionne <b>en mémoire, sur un seul nœud, en monothread</b> : un milliard de lignes provoquerait un dépassement mémoire. C'est l'outil adapté à <b>quelques millions de lignes au maximum</b> — parfaitement légitime dans un notebook Fabric, mais pas à cette échelle.</p>
      <p class="why">C — Power BI</p>
      <p>Power BI est un outil de <b>restitution</b>, pas de traitement : le moteur Power Query est <b>monothread</b> (pas de parallélisme), le mode Import <b>duplique</b> les données dans le modèle, l'actualisation initiale serait extrêmement longue, et il n'offre pas de détection d'anomalies programmable sur ce volume.</p>
      <p>Il garde toute sa place <b>en aval</b> — une fois les données agrégées en tables Delta, un rapport en <b>Direct Lake</b> devient idéal — mais ce n'est pas ce que la question demande.</p>
      <p class="note"><b>Le réflexe.</b> Volume massif + parallélisme + pas de copie = <b>notebook Spark / PySpark</b>. pandas = un seul nœud. Power BI = restitution, pas transformation.</p>`,
      en:`
      <p>A Fabric notebook runs <b>Apache Spark</b> on a distributed pool. <code class="inl">spark.read.json()</code> reads the files <b>directly from OneLake</b>: the data stays where it is (<b>no copy</b>) and loading is <b>parallelized</b> across all nodes. It is the only option that satisfies <b>all three constraints at once</b>.</p>
      <p class="why">The notebook also covers the whole requested cycle</p>
      <ul>
        <li><b>Transformation</b>: DataFrame API / Spark SQL.</li>
        <li><b>Visualization</b>: native <code class="inl">display()</code>, matplotlib, seaborn, Plotly.</li>
        <li><b>Anomaly detection</b>: MLlib or time-series libraries.</li>
        <li><b>Sharing</b>: the notebook is a shareable workspace item, and results can be written as a <b>Delta table</b>.</li>
      </ul>
      <p class="why">B — pandas</p>
      <p>pandas works <b>in memory, on a single node, single-threaded</b>: a billion rows would blow up memory. It is the right tool for <b>a few million rows at most</b> — perfectly legitimate in a Fabric notebook, but not at this scale.</p>
      <p class="why">C — Power BI</p>
      <p>Power BI is a <b>presentation</b> tool, not a processing engine: the Power Query engine is <b>single-threaded</b> (no parallelism), Import mode <b>duplicates</b> the data into the model, the initial refresh would be extremely long, and it offers no programmable anomaly detection at this volume.</p>
      <p>It keeps its place <b>downstream</b> — once the data is aggregated into Delta tables, a <b>Direct Lake</b> report becomes ideal — but that is not what the question asks.</p>
      <p class="note"><b>The reflex.</b> Massive volume + parallelism + no copy = <b>Spark / PySpark notebook</b>. pandas = one node. Power BI = presentation, not transformation.</p>`}
  },
  {
    id:"q251", kind:"multi", type:TM,
    title:{fr:"Colonnes à ajouter pour une SCD Type 2",en:"Columns to add for a Type 2 SCD"},
    stem:{fr:`<p>Vous avez un entrepôt Fabric. Vous concevez un <b>modèle en étoile</b> qui contiendra une dimension client. La table de dimension client sera une <b>dimension à variation lente de type 2</b> (SCD Type 2). Vous devez recommander les colonnes à ajouter à la table. Ces colonnes <b>ne doivent PAS exister déjà</b> dans la source.</p><p class="ask">Quels <b>trois</b> types de colonnes devez-vous recommander ?</p>`,
          en:`<p>You have a Fabric warehouse. You are designing a <b>star schema</b> that will contain a customer dimension. The customer dimension table will be a <b>Type 2 slowly changing dimension</b> (SCD). You need to recommend which columns to add to the table. The columns <b>must NOT already exist</b> in the source.</p><p class="ask">Which <b>three</b> types of columns should you recommend?</p>`},
    options:[
      {k:"A", fr:"une clé étrangère (foreign key)", en:"a foreign key"},
      {k:"B", fr:"une clé naturelle (natural key)", en:"a natural key"},
      {k:"C", fr:"une date et heure de fin d'effet (effective end date and time)", en:"an effective end date and time"},
      {k:"D", fr:"une clé de substitution (surrogate key)", en:"a surrogate key"},
      {k:"E", fr:"une date et heure de début d'effet (effective start date and time)", en:"an effective start date and time"}
    ],
    answer:["C","D","E"],
    explain:{fr:`
      <p>En <b>SCD Type 2</b>, chaque modification d'un attribut suivi <b>crée une nouvelle ligne</b> au lieu d'écraser l'ancienne. Cela impose trois colonnes techniques <b>absentes de la source</b> :</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Colonne</th><th>Rôle</th></tr>
        <tr><td><b>Surrogate key</b></td><td>Clé primaire artificielle (entier incrémental). <b>Indispensable</b> car la clé naturelle se répète désormais sur plusieurs lignes et ne peut plus servir de PK. La table de faits pointe vers cette clé, <b>figeant la version du client en vigueur au moment de l'événement</b>.</td></tr>
        <tr><td><b>Effective start date/time</b></td><td>Début de validité de la version de l'enregistrement.</td></tr>
        <tr><td><b>Effective end date/time</b></td><td>Fin de validité (souvent <code class="inl">9999-12-31</code> ou NULL pour la version courante).</td></tr>
      </table></div>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>CustomerKey (SK)</th><th>CustomerID (NK)</th><th>City</th><th>StartDate</th><th>EndDate</th></tr>
        <tr><td>1001</td><td>C-42</td><td>Lyon</td><td>2022-01-01</td><td>2024-06-30</td></tr>
        <tr><td>1002</td><td>C-42</td><td>Paris</td><td>2024-07-01</td><td>9999-12-31</td></tr>
      </table></div>
      <p class="why">Les deux options écartées</p>
      <ul>
        <li><b>B — Natural key.</b> Le <code class="inl">CustomerID</code> métier <b>existe déjà dans la source</b>, ce que l'énoncé exclut explicitement. Il est certes conservé dans la dimension pour rapprocher les versions d'un même client, mais ce n'est <b>pas une colonne ajoutée</b>.</li>
        <li><b>A — Foreign key.</b> Dans un schéma en étoile, les clés étrangères se trouvent dans la <b>table de faits</b>, qui référence les dimensions. Une dimension terminale n'en contient pas.</li>
      </ul>
      <p><b>Colonne bonus fréquente</b>, non proposée ici : un indicateur <code class="inl">IsCurrent</code> (booléen) qui simplifie la sélection de la version active.</p>
      <p class="note"><b>Le réflexe.</b> SCD2 = <b>surrogate key + date de début + date de fin</b>. La clé naturelle vient de la source ; la clé étrangère vit dans la table de faits.</p>`,
      en:`
      <p>In a <b>Type 2 SCD</b>, every change to a tracked attribute <b>creates a new row</b> instead of overwriting the old one. That requires three technical columns <b>absent from the source</b>:</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Column</th><th>Role</th></tr>
        <tr><td><b>Surrogate key</b></td><td>Artificial primary key (incrementing integer). <b>Essential</b>, because the natural key now repeats across several rows and can no longer serve as the PK. The fact table points at this key, <b>freezing the customer version in force at the time of the event</b>.</td></tr>
        <tr><td><b>Effective start date/time</b></td><td>Start of validity for that version of the record.</td></tr>
        <tr><td><b>Effective end date/time</b></td><td>End of validity (often <code class="inl">9999-12-31</code> or NULL for the current version).</td></tr>
      </table></div>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>CustomerKey (SK)</th><th>CustomerID (NK)</th><th>City</th><th>StartDate</th><th>EndDate</th></tr>
        <tr><td>1001</td><td>C-42</td><td>Lyon</td><td>2022-01-01</td><td>2024-06-30</td></tr>
        <tr><td>1002</td><td>C-42</td><td>Paris</td><td>2024-07-01</td><td>9999-12-31</td></tr>
      </table></div>
      <p class="why">The two rejected options</p>
      <ul>
        <li><b>B — Natural key.</b> The business <code class="inl">CustomerID</code> <b>already exists in the source</b>, which the stem explicitly excludes. It is indeed kept in the dimension to tie a customer's versions together, but it is <b>not an added column</b>.</li>
        <li><b>A — Foreign key.</b> In a star schema, foreign keys live in the <b>fact table</b>, which references the dimensions. A terminal dimension holds none.</li>
      </ul>
      <p><b>A frequent bonus column</b>, not offered here: an <code class="inl">IsCurrent</code> boolean flag that simplifies selecting the active version.</p>
      <p class="note"><b>The reflex.</b> SCD2 = <b>surrogate key + start date + end date</b>. The natural key comes from the source; the foreign key lives in the fact table.</p>`}
  },
  {
    id:"q252", kind:"fields", type:TH,
    title:{fr:"Procédure stockée de déduplication",en:"Deduplication stored procedure"},
    stem:{fr:`<p>Vous avez un espace de travail <b>Workspace1</b> contenant un lakehouse <b>LH1</b> et un entrepôt <b>DW1</b>. LH1 contient une table <code class="inl">signindata</code> dans le schéma <code class="inl">dbo</code>.</p>
    <p>Vous devez créer dans <b>DW1</b> une procédure stockée qui <b>déduplique</b> les données de la table signindata.</p>
    <pre class="code">CREATE PROCEDURE dbo.DedupSignins
AS
❶
    SELECT ❷ *
    FROM LH1.dbo.signindata;
END</pre>
    <p class="ask">Comment devez-vous compléter l'instruction T-SQL ?</p>`,
          en:`<p>You have a workspace named <b>Workspace1</b> that contains a lakehouse named <b>LH1</b> and a warehouse named <b>DW1</b>. LH1 contains a table named <code class="inl">signindata</code> in the <code class="inl">dbo</code> schema.</p>
    <p>You need to create a stored procedure in <b>DW1</b> that <b>deduplicates</b> the data in the signindata table.</p>
    <pre class="code">CREATE PROCEDURE dbo.DedupSignins
AS
❶
    SELECT ❷ *
    FROM LH1.dbo.signindata;
END</pre>
    <p class="ask">How should you complete the T-SQL statement?</p>`},
    fields:[
      {label:{fr:"❶ ouverture du corps",en:"❶ opening the body"}, hint:{fr:"après AS",en:"after AS"},
       opts:{fr:["BEGIN","SET","BEGIN DISTRIBUTED TRANSACTION"],en:["BEGIN","SET","BEGIN DISTRIBUTED TRANSACTION"]}, ans:0},
      {label:{fr:"❷ déduplication",en:"❷ deduplication"}, hint:{fr:"supprimer les doublons",en:"remove duplicates"},
       opts:{fr:["DISTINCT","TOP (100) PERCENT WITH TIES","GROUP BY"],en:["DISTINCT","TOP (100) PERCENT WITH TIES","GROUP BY"]}, ans:0}
    ],
    explain:{fr:`
      <p class="why">❶ BEGIN — la structure d'une procédure</p>
      <p>Le corps d'une procédure stockée contenant plusieurs instructions s'encadre par <code class="inl">BEGIN … END</code>. Le <code class="inl">END</code> déjà imprimé à la dernière ligne réclame son <code class="inl">BEGIN</code> : c'est un indice purement structurel, indépendant de la logique métier.</p>
      <ul>
        <li><b>SET</b> sert à affecter une variable (<code class="inl">SET @x = 1</code>) ou à modifier une option de session. Elle n'ouvre aucun bloc.</li>
        <li><b>BEGIN DISTRIBUTED TRANSACTION</b> ouvre une transaction distribuée entre plusieurs serveurs via MS DTC. Cette syntaxe n'a pas sa place ici — et les transactions distribuées ne sont pas prises en charge par l'entrepôt Fabric.</li>
      </ul>
      <p class="why">❷ DISTINCT — lire le verbe de l'énoncé</p>
      <p><i>Deduplicates</i> veut dire : supprimer les lignes en double. <code class="inl">SELECT DISTINCT *</code> ne conserve qu'un exemplaire de chaque combinaison de valeurs — exactement l'opération demandée, en un mot-clé.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>Ce qu'elle fait réellement</th></tr>
        <tr><td class="m">DISTINCT</td><td>Élimine les lignes identiques. <b>Correct.</b></td></tr>
        <tr><td class="m">TOP (100) PERCENT WITH TIES</td><td>Retourne <b>100 % des lignes</b> — donc rien n'est filtré. <code class="inl">WITH TIES</code> exige en outre un <code class="inl">ORDER BY</code>, absent ici.</td></tr>
        <tr><td class="m">GROUP BY</td><td>Regroupe, mais c'est une <b>clause</b> qui se place après le FROM et exige la liste des colonnes — incompatible avec la position ❷ et avec <code class="inl">*</code>.</td></tr>
      </table></div>
      <p class="why">Le détail à ne pas manquer dans le FROM</p>
      <p>La procédure vit dans <b>DW1</b> mais lit <code class="inl">LH1.dbo.signindata</code> : une <b>requête cross-database</b>. C'est possible parce que l'entrepôt et le point de terminaison SQL du lakehouse partagent le même moteur T-SQL au sein de l'espace de travail. L'inverse ne l'est pas : on ne crée pas de procédure stockée <i>dans</i> un lakehouse, son endpoint étant en lecture seule.</p>
      <p class="note"><b>Deux réflexes.</b> Un <code class="inl">END</code> imprimé réclame toujours un <code class="inl">BEGIN</code> — cherchez d'abord les indices de structure, ils ne demandent aucune réflexion métier. Et méfiez-vous de <code class="inl">TOP (100) PERCENT</code> : c'est une opération <b>neutre</b> déguisée en filtre.</p>`,
      en:`
      <p class="why">❶ BEGIN — the structure of a procedure</p>
      <p>The body of a multi-statement stored procedure is wrapped in <code class="inl">BEGIN … END</code>. The <code class="inl">END</code> already printed on the last line demands its <code class="inl">BEGIN</code>: a purely structural clue, independent of the business logic.</p>
      <ul>
        <li><b>SET</b> assigns a variable (<code class="inl">SET @x = 1</code>) or changes a session option. It opens no block.</li>
        <li><b>BEGIN DISTRIBUTED TRANSACTION</b> opens a distributed transaction across servers via MS DTC. It has no place here — and distributed transactions are not supported by the Fabric warehouse.</li>
      </ul>
      <p class="why">❷ DISTINCT — read the stem's verb</p>
      <p><i>Deduplicates</i> means: remove duplicate rows. <code class="inl">SELECT DISTINCT *</code> keeps one copy of each combination of values — exactly the requested operation, in one keyword.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>What it actually does</th></tr>
        <tr><td class="m">DISTINCT</td><td>Removes identical rows. <b>Correct.</b></td></tr>
        <tr><td class="m">TOP (100) PERCENT WITH TIES</td><td>Returns <b>100% of the rows</b> — so nothing is filtered. <code class="inl">WITH TIES</code> additionally requires an <code class="inl">ORDER BY</code>, absent here.</td></tr>
        <tr><td class="m">GROUP BY</td><td>Groups, but it is a <b>clause</b> placed after the FROM and requiring a column list — incompatible with position ❷ and with <code class="inl">*</code>.</td></tr>
      </table></div>
      <p class="why">The detail not to miss in the FROM</p>
      <p>The procedure lives in <b>DW1</b> but reads <code class="inl">LH1.dbo.signindata</code>: a <b>cross-database query</b>. It works because the warehouse and the lakehouse's SQL endpoint share the same T-SQL engine within the workspace. The reverse does not: you cannot create a stored procedure <i>inside</i> a lakehouse, its endpoint being read-only.</p>
      <p class="note"><b>Two reflexes.</b> A printed <code class="inl">END</code> always demands a <code class="inl">BEGIN</code> — look for structural clues first, they need no business reasoning. And beware <code class="inl">TOP (100) PERCENT</code>: it is a <b>no-op</b> dressed up as a filter.</p>`}
  },
  {
    id:"q253", kind:"fields", type:TH,
    title:{fr:"Dénormaliser une dimension client",en:"Denormalizing a customer dimension"},
    stem:{fr:`<p>Un entrepôt Fabric contient les tables suivantes :</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Table</th><th>Clé primaire</th><th>Clé étrangère</th></tr>
      <tr><td class="m">Customer</td><td class="m">CustomerID</td><td class="m">SalesRegion.SalesRegionID</td></tr>
      <tr><td class="m">CustomerAddress</td><td class="m">CustomerID, AddressID</td><td class="m">Customer.CustomerID, Address.AddressID</td></tr>
      <tr><td class="m">Address</td><td class="m">AddressID</td><td><i>None</i></td></tr>
      <tr><td class="m">SalesRegion</td><td class="m">SalesRegionID</td><td><i>None</i></td></tr>
    </table></div>
    <p>Chaque client a un <b>SalesRegion</b> unique et un <b>CustomerAddress</b> unique ; Customer contient <b>5 millions de lignes</b> ; toutes les clés étrangères sont <b>non nulles</b>.</p>
    <p>Vous devez créer une vue dénormalisant les données en une dimension client contenant <b>une ligne par CustomerID distinct</b>, en <b>minimisant le temps de traitement</b>.</p>
    <pre class="code">CREATE VIEW DimCustomer AS
SELECT C.CustomerID, C.CustomerName, C.CompanyName,
       SR.SalesRegion, A.City, A.StateProvince,
       A.CountryRegion, A.PostalCode
FROM SalesLT.Customer C
❶ SalesLT.SalesRegion SR ON C.SalesRegionID = SR.SalesRegionID
INNER JOIN [SalesLT].[CustomerAddress] CA ON CA.customerid = C.customerid
INNER JOIN [SalesLT].[Address] A ON ❷
WHERE CA.AddressType = 'Main Office'</pre>
    <p class="ask">Comment devez-vous compléter l'instruction ?</p>`,
          en:`<p>A Fabric warehouse contains the following tables:</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Table</th><th>Primary key</th><th>Foreign key</th></tr>
      <tr><td class="m">Customer</td><td class="m">CustomerID</td><td class="m">SalesRegion.SalesRegionID</td></tr>
      <tr><td class="m">CustomerAddress</td><td class="m">CustomerID, AddressID</td><td class="m">Customer.CustomerID, Address.AddressID</td></tr>
      <tr><td class="m">Address</td><td class="m">AddressID</td><td><i>None</i></td></tr>
      <tr><td class="m">SalesRegion</td><td class="m">SalesRegionID</td><td><i>None</i></td></tr>
    </table></div>
    <p>Each customer has a single <b>SalesRegion</b> and a single <b>CustomerAddress</b>; Customer holds <b>5 million rows</b>; all foreign key values are <b>non-null</b>.</p>
    <p>You need to create a view denormalizing the data into a customer dimension with <b>one row per distinct CustomerID</b>, while <b>minimizing query processing time</b>.</p>
    <pre class="code">CREATE VIEW DimCustomer AS
SELECT C.CustomerID, C.CustomerName, C.CompanyName,
       SR.SalesRegion, A.City, A.StateProvince,
       A.CountryRegion, A.PostalCode
FROM SalesLT.Customer C
❶ SalesLT.SalesRegion SR ON C.SalesRegionID = SR.SalesRegionID
INNER JOIN [SalesLT].[CustomerAddress] CA ON CA.customerid = C.customerid
INNER JOIN [SalesLT].[Address] A ON ❷
WHERE CA.AddressType = 'Main Office'</pre>
    <p class="ask">How should you complete the statement?</p>`},
    fields:[
      {label:{fr:"❶ jointure vers SalesRegion",en:"❶ join to SalesRegion"}, hint:{fr:"clés étrangères non nulles",en:"non-null foreign keys"},
       opts:{fr:["full outer join","inner join","left outer join"],en:["full outer join","inner join","left outer join"]}, ans:1},
      {label:{fr:"❷ condition vers Address",en:"❷ condition to Address"}, hint:{fr:"par quelle table passe-t-on ?",en:"which table bridges them?"},
       opts:{fr:["A.AddressID = CA.AddressID","C.AddressID = CA.AddressID","C.CustomerID = A.CustomerID"],en:["A.AddressID = CA.AddressID","C.AddressID = CA.AddressID","C.CustomerID = A.CustomerID"]}, ans:0}
    ],
    explain:{fr:`
      <p class="why">❶ INNER JOIN — la phrase qui décide est dans les caractéristiques</p>
      <p><i>All foreign key values are <b>non-null</b>.</i> Chaque client a donc forcément une SalesRegion : un INNER JOIN ne perdra aucune ligne. Et <i>minimize query processing time</i> tranche entre les jointures équivalentes en résultat.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Jointure</th><th>Résultat ici</th><th>Coût</th></tr>
        <tr><td class="m">INNER JOIN</td><td>Identique — aucune ligne perdue</td><td><b>Le plus faible</b> : l'optimiseur peut réordonner et filtrer librement</td></tr>
        <tr><td class="m">LEFT OUTER JOIN</td><td>Identique</td><td>Plus élevé : le moteur doit préserver les lignes de gauche sans correspondance, ce qui contraint le plan</td></tr>
        <tr><td class="m">FULL OUTER JOIN</td><td><b>Différent</b> : ajouterait les régions sans client, avec CustomerID NULL</td><td>Le plus élevé — et il casse « une ligne par CustomerID »</td></tr>
      </table></div>
      <p>Sur 5 millions de lignes, la différence n'est pas théorique : un OUTER JOIN bloque des optimisations que l'INNER autorise.</p>
      <p class="why">❷ A.AddressID = CA.AddressID — suivre le chemin des clés</p>
      <p><code class="inl">Customer</code> et <code class="inl">Address</code> <b>ne se touchent pas directement</b>. Le lien passe par la table de liaison <code class="inl">CustomerAddress</code>, dont la clé primaire composite est <code class="inl">(CustomerID, AddressID)</code> :</p>
      <pre class="code">Customer.CustomerID → CustomerAddress.CustomerID   (déjà écrit)
CustomerAddress.AddressID → Address.AddressID       (❷)</pre>
      <ul>
        <li><b>C.AddressID = CA.AddressID</b> — <code class="inl">Customer</code> ne possède <b>aucune colonne AddressID</b> : la requête ne compilerait pas. Distracteur bâti sur une colonne inexistante.</li>
        <li><b>C.CustomerID = A.CustomerID</b> — <code class="inl">Address</code> ne possède aucune colonne CustomerID non plus, et cette jointure court-circuiterait la table de liaison.</li>
      </ul>
      <p class="why">Ce qui garantit « une ligne par CustomerID »</p>
      <p>Un client peut avoir plusieurs adresses dans <code class="inl">CustomerAddress</code>. C'est le <code class="inl">WHERE CA.AddressType = 'Main Office'</code>, déjà imprimé, qui ramène à une adresse unique — sans lui, la vue dupliquerait les clients.</p>
      <p class="note"><b>Le réflexe.</b> Avant de choisir une condition de jointure, <b>tracez le chemin des clés</b> dans le tableau du schéma. Une table de liaison impose toujours deux sauts, et les distracteurs inventent des colonnes qui n'existent pas. Quant au type : clés non nulles + minimiser le temps = <b>INNER JOIN</b>.</p>`,
      en:`
      <p class="why">❶ INNER JOIN — the deciding sentence is in the characteristics</p>
      <p><i>All foreign key values are <b>non-null</b>.</i> Every customer therefore has a SalesRegion: an INNER JOIN loses no rows. And <i>minimize query processing time</i> decides between joins that are equivalent in result.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Join</th><th>Result here</th><th>Cost</th></tr>
        <tr><td class="m">INNER JOIN</td><td>Identical — no rows lost</td><td><b>Lowest</b>: the optimiser can reorder and filter freely</td></tr>
        <tr><td class="m">LEFT OUTER JOIN</td><td>Identical</td><td>Higher: the engine must preserve unmatched left rows, which constrains the plan</td></tr>
        <tr><td class="m">FULL OUTER JOIN</td><td><b>Different</b>: would add regions with no customer, with a NULL CustomerID</td><td>Highest — and it breaks "one row per CustomerID"</td></tr>
      </table></div>
      <p>Over 5 million rows the difference is not theoretical: an OUTER JOIN blocks optimisations the INNER allows.</p>
      <p class="why">❷ A.AddressID = CA.AddressID — follow the key path</p>
      <p><code class="inl">Customer</code> and <code class="inl">Address</code> <b>do not touch directly</b>. The link runs through the bridging table <code class="inl">CustomerAddress</code>, whose composite primary key is <code class="inl">(CustomerID, AddressID)</code>:</p>
      <pre class="code">Customer.CustomerID → CustomerAddress.CustomerID   (already written)
CustomerAddress.AddressID → Address.AddressID       (❷)</pre>
      <ul>
        <li><b>C.AddressID = CA.AddressID</b> — <code class="inl">Customer</code> has <b>no AddressID column</b>: the query would not compile. A distractor built on a non-existent column.</li>
        <li><b>C.CustomerID = A.CustomerID</b> — <code class="inl">Address</code> has no CustomerID column either, and this join would short-circuit the bridging table.</li>
      </ul>
      <p class="why">What guarantees "one row per CustomerID"</p>
      <p>A customer may have several addresses in <code class="inl">CustomerAddress</code>. It is the already-printed <code class="inl">WHERE CA.AddressType = 'Main Office'</code> that narrows this to one address — without it, the view would duplicate customers.</p>
      <p class="note"><b>The reflex.</b> Before choosing a join condition, <b>trace the key path</b> in the schema table. A bridging table always means two hops, and the distractors invent columns that do not exist. As for the type: non-null keys + minimize time = <b>INNER JOIN</b>.</p>`}
  },
  {
    id:"q254", kind:"fields", type:TH,
    title:{fr:"Préserver toutes les lignes et filtrer un agrégat",en:"Preserving all rows and filtering an aggregate"},
    stem:{fr:`<p>Un entrepôt contient les tables <code class="inl">Employee</code> et <code class="inl">Contract</code>. Vous devez créer une instruction T-SQL qui dénormalise les tables et inclut les attributs <code class="inl">ContractType</code> et <code class="inl">StartDate</code>, en respectant :</p>
    <ul>
      <li>inclure les attributs des lignes correspondantes de <code class="inl">Contract</code> ;</li>
      <li><b>préserver toutes les lignes</b> de la table <code class="inl">Employee</code> ;</li>
      <li>retourner le nombre total d'employés par type de contrat, <b>pour les seuls types ayant plus de deux employés</b>.</li>
    </ul>
    <pre class="code">WITH result AS (
  SELECT e.EmployeeID, e.EmployeeName,
         e.EmployeePosition, c.ContractType
  FROM Employee AS e
  ❶ Contract AS c ON c.EmployeeID = e.EmployeeID )
SELECT COUNT(DISTINCT EmployeeID) AS TotalEmployees, ContractType
FROM result
GROUP BY ContractType
❷ COUNT(DISTINCT EmployeeID) &gt; 2</pre>
    <p class="ask">Comment devez-vous compléter l'instruction ?</p>`,
          en:`<p>A warehouse contains the tables <code class="inl">Employee</code> and <code class="inl">Contract</code>. You need to create a T-SQL statement that denormalizes the tables and includes the <code class="inl">ContractType</code> and <code class="inl">StartDate</code> attributes, meeting these requirements:</p>
    <ul>
      <li>include attributes from matching rows in <code class="inl">Contract</code>;</li>
      <li><b>preserve all rows</b> from the <code class="inl">Employee</code> table;</li>
      <li>return the total number of employees per contract type, <b>for contract types with more than two employees only</b>.</li>
    </ul>
    <pre class="code">WITH result AS (
  SELECT e.EmployeeID, e.EmployeeName,
         e.EmployeePosition, c.ContractType
  FROM Employee AS e
  ❶ Contract AS c ON c.EmployeeID = e.EmployeeID )
SELECT COUNT(DISTINCT EmployeeID) AS TotalEmployees, ContractType
FROM result
GROUP BY ContractType
❷ COUNT(DISTINCT EmployeeID) &gt; 2</pre>
    <p class="ask">How should you complete the statement?</p>`},
    fields:[
      {label:{fr:"❶ type de jointure",en:"❶ join type"}, hint:{fr:"« préserver toutes les lignes de Employee »",en:"\"preserve all rows from Employee\""},
       opts:{fr:["CROSS JOIN","INNER JOIN","LEFT OUTER JOIN","RIGHT OUTER JOIN"],en:["CROSS JOIN","INNER JOIN","LEFT OUTER JOIN","RIGHT OUTER JOIN"]}, ans:2},
      {label:{fr:"❷ filtre sur l'agrégat",en:"❷ filter on the aggregate"}, hint:{fr:"après GROUP BY",en:"after GROUP BY"},
       opts:{fr:["CONTAINS","HAVING","LIMIT","WHERE"],en:["CONTAINS","HAVING","LIMIT","WHERE"]}, ans:1}
    ],
    explain:{fr:`
      <p>Chaque exigence de l'énoncé se traduit mot pour mot en un élément de syntaxe. C'est une question de <b>lecture</b> plus que de SQL.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Exigence</th><th>Traduction</th></tr>
        <tr><td><i>include attributes from <b>matching</b> rows in Contract</i></td><td>Il faut une jointure sur <code class="inl">EmployeeID</code></td></tr>
        <tr><td><i><b>preserve all</b> the rows from the Employee table</i></td><td><b>LEFT OUTER JOIN</b> — Employee est à gauche</td></tr>
        <tr><td><i>contract types that have <b>more than two</b> employees</i></td><td><b>HAVING</b> — filtre sur un agrégat</td></tr>
      </table></div>
      <p class="why">❶ Pourquoi LEFT OUTER JOIN</p>
      <p><i>Preserve all the rows from the Employee table</i> est la définition littérale du LEFT OUTER JOIN : toutes les lignes de la table de gauche sont conservées, et les colonnes de droite passent à NULL quand aucun contrat ne correspond.</p>
      <ul>
        <li><b>INNER JOIN</b> — le distracteur principal. Il satisferait la première exigence (<i>matching rows</i>) mais <b>élimine</b> les employés sans contrat : il viole directement la deuxième.</li>
        <li><b>RIGHT OUTER JOIN</b> — préserverait <code class="inl">Contract</code>, pas <code class="inl">Employee</code>. Le bon opérateur, le mauvais côté.</li>
        <li><b>CROSS JOIN</b> — produit cartésien, et il n'accepte pas de clause <code class="inl">ON</code> : incompatible avec le code imprimé.</li>
      </ul>
      <p class="why">❷ Pourquoi HAVING, et jamais WHERE</p>
      <p>Le filtre porte sur <code class="inl">COUNT(DISTINCT EmployeeID)</code> — une valeur qui <b>n'existe qu'après le regroupement</b>. L'ordre logique d'exécution l'impose :</p>
      <pre class="code">FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY</pre>
      <p><code class="inl">WHERE</code> s'exécute <b>avant</b> le GROUP BY et ne peut donc contenir aucune fonction d'agrégation. <code class="inl">LIMIT</code> n'existe pas en T-SQL (c'est <code class="inl">TOP</code>), et <code class="inl">CONTAINS</code> est un prédicat de recherche plein texte.</p>
      <p class="why">La cohérence à vérifier</p>
      <p>Attention : avec un LEFT OUTER JOIN, les employés sans contrat produisent un <code class="inl">ContractType</code> à NULL, qui formera son propre groupe. Le <code class="inl">HAVING … &gt; 2</code> l'écartera s'il compte deux employés ou moins — le filtre nettoie naturellement ce groupe résiduel.</p>
      <p class="note"><b>Le réflexe.</b> <i>Preserve all rows from X</i> → OUTER JOIN du côté de X. Filtre portant sur un <code class="inl">COUNT</code>, <code class="inl">SUM</code> ou <code class="inl">AVG</code> → <b>HAVING</b>, toujours. Ces deux formulations reviennent à chaque session.</p>`,
      en:`
      <p>Each requirement in the stem translates word for word into a piece of syntax. This is a question about <b>reading</b> more than about SQL.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Requirement</th><th>Translation</th></tr>
        <tr><td><i>include attributes from <b>matching</b> rows in Contract</i></td><td>A join on <code class="inl">EmployeeID</code> is needed</td></tr>
        <tr><td><i><b>preserve all</b> the rows from the Employee table</i></td><td><b>LEFT OUTER JOIN</b> — Employee is on the left</td></tr>
        <tr><td><i>contract types that have <b>more than two</b> employees</i></td><td><b>HAVING</b> — a filter on an aggregate</td></tr>
      </table></div>
      <p class="why">❶ Why LEFT OUTER JOIN</p>
      <p><i>Preserve all the rows from the Employee table</i> is the literal definition of a LEFT OUTER JOIN: every left-hand row is kept, and the right-hand columns become NULL when no contract matches.</p>
      <ul>
        <li><b>INNER JOIN</b> — the main distractor. It satisfies the first requirement (<i>matching rows</i>) but <b>drops</b> employees with no contract: it directly violates the second.</li>
        <li><b>RIGHT OUTER JOIN</b> — would preserve <code class="inl">Contract</code>, not <code class="inl">Employee</code>. Right operator, wrong side.</li>
        <li><b>CROSS JOIN</b> — a cartesian product, and it accepts no <code class="inl">ON</code> clause: incompatible with the printed code.</li>
      </ul>
      <p class="why">❷ Why HAVING, and never WHERE</p>
      <p>The filter is on <code class="inl">COUNT(DISTINCT EmployeeID)</code> — a value that <b>only exists after grouping</b>. The logical execution order forces it:</p>
      <pre class="code">FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY</pre>
      <p><code class="inl">WHERE</code> runs <b>before</b> GROUP BY and therefore cannot contain an aggregate function. <code class="inl">LIMIT</code> does not exist in T-SQL (it is <code class="inl">TOP</code>), and <code class="inl">CONTAINS</code> is a full-text search predicate.</p>
      <p class="why">A consistency check</p>
      <p>Note that with a LEFT OUTER JOIN, employees with no contract produce a NULL <code class="inl">ContractType</code>, which forms its own group. The <code class="inl">HAVING … &gt; 2</code> will drop it if it holds two employees or fewer — the filter naturally cleans up that residual group.</p>
      <p class="note"><b>The reflex.</b> <i>Preserve all rows from X</i> → OUTER JOIN on X's side. A filter on a <code class="inl">COUNT</code>, <code class="inl">SUM</code> or <code class="inl">AVG</code> → <b>HAVING</b>, always. These two phrasings come back every sitting.</p>`}
  },
  {
    id:"q255", kind:"fields", type:TD,
    title:{fr:"Choisir l'outil d'ingestion par source",en:"Choosing the ingestion tool per source"},
    stem:{fr:`<p>Vous avez un lakehouse Fabric nommé <b>Lakehouse1</b> et les deux sources suivantes :</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Source</th><th>Description</th></tr>
      <tr><td class="m">Datasource1</td><td>Données d'une <b>instance managée Azure SQL</b> avec <b>change data capture (CDC)</b> activé sur toutes les tables. Chargement quotidien de <b>plus de 500 000 lignes et 20 Go</b>.</td></tr>
      <tr><td class="m">Datasource2</td><td>Données d'une <b>machine de production</b> (nombre, poids et volume d'articles), <b>diffusées en flux vers un Azure event hub</b>.</td></tr>
    </table></div>
    <p>Vous devez ingérer les données des deux sources dans Lakehouse1, en <b>minimisant la maintenance et le temps de développement</b>.</p>
    <p class="ask">Que devez-vous utiliser pour chaque source ?</p>`,
          en:`<p>You have a Fabric lakehouse named <b>Lakehouse1</b> and the following two data sources:</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Source</th><th>Description</th></tr>
      <tr><td class="m">Datasource1</td><td>Data from an <b>Azure SQL managed instance</b> with <b>change data capture (CDC)</b> enabled for all tables. Daily load of <b>more than 500,000 rows and 20 GB</b>.</td></tr>
      <tr><td class="m">Datasource2</td><td>Data from a <b>manufacturing machine</b> (item count, weight and volume), <b>streamed to an Azure event hub</b>.</td></tr>
    </table></div>
    <p>You need to ingest data from both sources into Lakehouse1, <b>minimizing maintenance and development time</b>.</p>
    <p class="ask">What should you use to ingest the data from each source?</p>`},
    fields:[
      {label:{fr:"Datasource1 — Azure SQL MI avec CDC, 20 Go/jour",en:"Datasource1 — Azure SQL MI with CDC, 20 GB/day"}, hint:{fr:"batch volumineux",en:"large batch"},
       opts:{fr:["A Dataflow Gen1","A Dataflow Gen2","A notebook","A pipeline with a Copy activity","An eventstream"],en:["A Dataflow Gen1","A Dataflow Gen2","A notebook","A pipeline with a Copy activity","An eventstream"]}, ans:3},
      {label:{fr:"Datasource2 — flux vers un event hub",en:"Datasource2 — streamed to an event hub"}, hint:{fr:"temps réel",en:"real time"},
       opts:{fr:["A Dataflow Gen1","A Dataflow Gen2","A notebook","A pipeline with a Copy activity","An eventstream"],en:["A Dataflow Gen1","A Dataflow Gen2","A notebook","A pipeline with a Copy activity","An eventstream"]}, ans:4}
    ],
    explain:{fr:`
      <p>Chaque source porte un mot-signal qui désigne un outil, et un seul.</p>
      <p class="why">Datasource1 → pipeline avec activité Copy</p>
      <p>Trois indices convergent : une <b>base relationnelle</b>, un volume <b>massif</b> (20 Go / jour) et du <b>CDC</b>. L'activité <i>Copy data</i> d'un pipeline est conçue pour ce profil : connecteur natif Azure SQL MI, copie parallélisée à grande échelle, et prise en charge du chargement incrémentiel qui exploite le CDC.</p>
      <ul>
        <li><b>Dataflow Gen2</b> serait le choix low-code naturel sur un <i>petit</i> volume, mais le moteur Power Query n'est pas dimensionné pour 20 Go quotidiens — la maintenance en pâtirait, ce que l'énoncé interdit.</li>
        <li><b>Un notebook</b> fonctionnerait techniquement, mais c'est du pro-code : effort de développement maximal, exactement le critère à minimiser.</li>
        <li><b>Dataflow Gen1</b> est la génération héritée, sans destination lakehouse.</li>
      </ul>
      <p class="why">Datasource2 → eventstream</p>
      <p><i>Streamed to an Azure event hub</i> ferme le débat. L'<b>eventstream</b> est le composant Real-Time Intelligence conçu pour cela : connecteur natif Event Hubs, configuration sans code, destination lakehouse en quelques clics et ingestion continue.</p>
      <p>Tous les autres outils sont <b>orientés batch</b> : ils s'exécutent sur déclenchement ou planification. Les brancher sur un flux continu supposerait de les faire tourner en boucle — l'inverse de « minimiser la maintenance ».</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Le mot de l'énoncé</th><th>L'outil</th></tr>
        <tr><td>streamed, event hub, temps réel, télémétrie</td><td><b>Eventstream</b></td></tr>
        <tr><td>gros volume, base relationnelle, CDC, chargement quotidien</td><td><b>Pipeline + Copy activity</b></td></tr>
        <tr><td>low-code, petit volume, transformation Power Query</td><td><b>Dataflow Gen2</b></td></tr>
        <tr><td>transformations complexes, non structuré, ML</td><td><b>Notebook</b></td></tr>
      </table></div>
      <p class="note"><b>Le réflexe.</b> Sur les glisser-déposer « un outil par source », traitez chaque source <b>indépendamment</b> et cherchez son mot-signal. Ici, <i>event hub</i> et <i>20 Go par jour</i> suffisent à eux seuls : aucune des deux réponses ne dépend de l'autre.</p>`,
      en:`
      <p>Each source carries a signal word pointing at one tool, and only one.</p>
      <p class="why">Datasource1 → pipeline with a Copy activity</p>
      <p>Three clues converge: a <b>relational database</b>, a <b>massive</b> volume (20 GB / day) and <b>CDC</b>. A pipeline's <i>Copy data</i> activity is built for that profile: native Azure SQL MI connector, parallelised copy at scale, and support for incremental loading that exploits CDC.</p>
      <ul>
        <li><b>Dataflow Gen2</b> would be the natural low-code choice on a <i>small</i> volume, but the Power Query engine is not sized for 20 GB a day — maintenance would suffer, which the stem forbids.</li>
        <li><b>A notebook</b> would work technically, but it is pro-code: maximum development effort, exactly the criterion to minimize.</li>
        <li><b>Dataflow Gen1</b> is the legacy generation, with no lakehouse destination.</li>
      </ul>
      <p class="why">Datasource2 → eventstream</p>
      <p><i>Streamed to an Azure event hub</i> closes the debate. The <b>eventstream</b> is the Real-Time Intelligence component built for this: native Event Hubs connector, no-code configuration, lakehouse destination in a few clicks and continuous ingestion.</p>
