      <p>Son avantage décisif sur <code class="inl">USERNAME()</code> est la <b>cohérence entre environnements</b>. Dans Power BI Desktop, <code class="inl">USERNAME()</code> renvoie <code class="inl">DOMAINE\\utilisateur</code> ; dans le service, elle renvoie le UPN. Une expression RLS qui compare à une colonne d'e-mails fonctionne donc en ligne mais pas en local, ou l'inverse — d'où des résultats vides. <code class="inl">USERPRINCIPALNAME()</code> retourne le UPN <b>partout</b>.</p>
      <pre class="code">-- Filtre RLS typique sur une table de sécurité
[Email] = USERPRINCIPALNAME()</pre>
      <p class="why">Le contexte AD DS de l'énoncé n'est pas décoratif</p>
      <p>Le domaine on-premises synchronisé par Entra Connect explique pourquoi les deux formes d'identité coexistent : l'utilisateur possède un identifiant <code class="inl">DOMAINE\\utilisateur</code> hérité de l'AD et un UPN dans Entra. C'est précisément la situation où <code class="inl">USERNAME()</code> devient ambiguë.</p>
      <p class="note"><b>Le réflexe.</b> Pour du RLS dynamique, <code class="inl">USERPRINCIPALNAME()</code> est le choix par défaut — <code class="inl">USERNAME()</code> ne s'utilise que si vous maîtrisez l'environnement d'exécution. Et retenez la troisième variante de la série : <i>créer un rôle dans le modèle</i> ne change <b>rien</b> à ce que retourne une fonction DAX.</p>`,
      en:`
      <p><code class="inl">USERPRINCIPALNAME()</code> is the DAX function whose definition <b>is</b> the stem's goal: it returns the authenticated user's principal name, in the form <code class="inl">alice@contoso.com</code>.</p>
      <p class="why">Why it fixes the problem</p>
      <p>Its decisive advantage over <code class="inl">USERNAME()</code> is <b>consistency across environments</b>. In Power BI Desktop, <code class="inl">USERNAME()</code> returns <code class="inl">DOMAIN\\user</code>; in the service it returns the UPN. An RLS expression comparing against a column of e-mails therefore works online but not locally, or the reverse — hence blank results. <code class="inl">USERPRINCIPALNAME()</code> returns the UPN <b>everywhere</b>.</p>
      <pre class="code">-- Typical RLS filter on a security table
[Email] = USERPRINCIPALNAME()</pre>
      <p class="why">The stem's AD DS context is not decorative</p>
      <p>The on-premises domain synced by Entra Connect explains why the two identity forms coexist: the user has a <code class="inl">DOMAIN\\user</code> identifier inherited from AD and a UPN in Entra. That is precisely the situation in which <code class="inl">USERNAME()</code> becomes ambiguous.</p>
      <p class="note"><b>The reflex.</b> For dynamic RLS, <code class="inl">USERPRINCIPALNAME()</code> is the default choice — <code class="inl">USERNAME()</code> only when you control the execution environment. And remember the series' third variant: <i>creating a role in the model</i> changes <b>nothing</b> about what a DAX function returns.</p>`}
  },
  {
    id:"q126", kind:"single", type:T1,
    title:{fr:"RLS dynamique — créer un rôle",en:"Dynamic RLS — create a role"},
    stem:{fr:`<p><b>Énoncé identique aux deux questions précédentes</b> : la mesure utilisant <code class="inl">USERNAME()</code> retourne un résultat vide, et vous devez garantir qu'elle retourne le <b>UPN</b> de l'utilisateur.</p>
    <p><b>Solution :</b> vous créez un rôle dans le modèle.</p>
    <p class="ask">Cette solution atteint-elle l'objectif ?</p>`,
          en:`<p><b>Identical scenario to the two previous questions</b>: the measure using <code class="inl">USERNAME()</code> returns a blank result, and you need to ensure it returns the user's <b>UPN</b>.</p>
    <p><b>Solution:</b> You create a role in the model.</p>
    <p class="ask">Does this meet the goal?</p>`},
    options:[
      {k:"A", fr:"Oui", en:"Yes"},
      {k:"B", fr:"Non", en:"No"}
    ],
    answer:["B"],
    explain:{fr:`
      <p>Créer un rôle et obtenir le UPN sont <b>deux opérations sans rapport</b>. Un rôle est un conteneur de <b>filtres de table</b> : il définit <i>quelles lignes</i> un utilisateur peut voir. Il ne modifie en rien la <b>valeur retournée par une fonction DAX</b> appelée dans une mesure.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Élément</th><th>Son rôle réel</th></tr>
        <tr><td><b>Rôle RLS</b></td><td>Porte les expressions de filtre appliquées aux tables, et la liste des membres</td></tr>
        <tr><td><b>Fonction d'identité DAX</b></td><td>Retourne l'identité de l'utilisateur courant — indépendamment de tout rôle</td></tr>
      </table></div>
      <p class="why">La nuance qui peut faire hésiter</p>
      <p>Il est vrai qu'<b>un rôle est nécessaire pour que la RLS s'applique</b> : sans rôle, aucun filtre n'est évalué. On peut donc se dire que « créer un rôle » débloque quelque chose. Mais l'objectif de l'énoncé n'est pas de faire fonctionner la RLS — il est de faire <b>retourner le UPN par la mesure</b>. Une mesure appelant <code class="inl">USERNAME()</code> retournera exactement la même chose avec ou sans rôle.</p>
      <p class="why">La série entière, en un coup d'œil</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Solution proposée</th><th>Verdict</th><th>Pourquoi</th></tr>
        <tr><td class="m">USEROBJECTID()</td><td><b>No</b></td><td>Retourne un GUID, pas le UPN</td></tr>
        <tr><td class="m">USERPRINCIPALNAME()</td><td><b>Yes</b></td><td>C'est la définition même de la fonction</td></tr>
        <tr><td>Créer un rôle</td><td><b>No</b></td><td>Agit sur les filtres, pas sur l'identité retournée</td></tr>
      </table></div>
      <p class="note"><b>Le réflexe.</b> Dans ces séries, la même erreur revient : confondre <b>le mécanisme</b> (le rôle, qui filtre) et <b>son effet</b> (la valeur d'identité, que retourne une fonction). Demandez-vous toujours : l'action proposée touche-t-elle réellement l'objet nommé dans l'objectif ?</p>`,
      en:`
      <p>Creating a role and obtaining the UPN are <b>two unrelated operations</b>. A role is a container of <b>table filters</b>: it defines <i>which rows</i> a user can see. It does nothing to the <b>value returned by a DAX function</b> called inside a measure.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Element</th><th>Its actual job</th></tr>
        <tr><td><b>RLS role</b></td><td>Carries the filter expressions applied to tables, and the membership list</td></tr>
        <tr><td><b>DAX identity function</b></td><td>Returns the current user's identity — independently of any role</td></tr>
      </table></div>
      <p class="why">The nuance that may give you pause</p>
      <p>It is true that <b>a role is required for RLS to apply at all</b>: with no role, no filter is evaluated. So one might think "create a role" unblocks something. But the stem's goal is not to make RLS work — it is to make <b>the measure return the UPN</b>. A measure calling <code class="inl">USERNAME()</code> will return exactly the same thing with or without a role.</p>
      <p class="why">The whole series at a glance</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Proposed solution</th><th>Verdict</th><th>Why</th></tr>
        <tr><td class="m">USEROBJECTID()</td><td><b>No</b></td><td>Returns a GUID, not the UPN</td></tr>
        <tr><td class="m">USERPRINCIPALNAME()</td><td><b>Yes</b></td><td>That is the function's very definition</td></tr>
        <tr><td>Create a role</td><td><b>No</b></td><td>Acts on filters, not on the returned identity</td></tr>
      </table></div>
      <p class="note"><b>The reflex.</b> In these series the same error recurs: confusing <b>the mechanism</b> (the role, which filters) with <b>its effect</b> (the identity value, which a function returns). Always ask: does the proposed action actually touch the object named in the goal?</p>`}
  },
  {
    id:"q127", kind:"single", type:T1,
    title:{fr:"Rôle pour créer un domaine et ses sous-domaines",en:"Role to create a domain and its subdomains"},
    stem:{fr:`<p>Vous avez un locataire Fabric contenant deux espaces de travail <b>Workspace1</b> et <b>Workspace2</b>, et un utilisateur nommé <b>User1</b>. Vous devez permettre à User1 d'effectuer les tâches suivantes :</p>
    <ul>
      <li>Créer un <b>nouveau domaine</b>.</li>
      <li>Créer deux sous-domaines nommés <b>subdomain1</b> et <b>subdomain2</b>.</li>
      <li>Assigner Workspace1 à subdomain1 et Workspace2 à subdomain2.</li>
    </ul>
    <p>La solution doit suivre le principe du <b>moindre privilège</b>.</p>
    <p class="ask">Quel rôle devez-vous assigner à User1 ?</p>`,
          en:`<p>You have a Fabric tenant that contains two workspaces named <b>Workspace1</b> and <b>Workspace2</b>, and a user named <b>User1</b>. You need to ensure that User1 can perform the following tasks:</p>
    <ul>
      <li>Create a <b>new domain</b>.</li>
      <li>Create two subdomains named <b>subdomain1</b> and <b>subdomain2</b>.</li>
      <li>Assign Workspace1 to subdomain1 and Workspace2 to subdomain2.</li>
    </ul>
    <p>The solution must follow the principle of <b>least privilege</b>.</p>
    <p class="ask">Which role should you assign to User1?</p>`},
    options:[
      {k:"A", fr:"domain admin", en:"domain admin"},
      {k:"B", fr:"domain contributor", en:"domain contributor"},
      {k:"C", fr:"Fabric admin", en:"Fabric admin"},
      {k:"D", fr:"workspace Admin", en:"workspace Admin"}
    ],
    answer:["C"],
    explain:{fr:`
      <p>La première tâche décide de tout : <b>créer un nouveau domaine</b>. C'est une opération de niveau locataire, et <b>seul un administrateur Fabric peut créer un domaine de premier niveau</b>. Aucun rôle délégué ne le permet.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Rôle</th><th>Créer un domaine</th><th>Créer un sous-domaine</th><th>Assigner des espaces de travail</th></tr>
        <tr><td class="m">Fabric admin</td><td><b>Oui</b></td><td>Oui</td><td>Oui</td></tr>
        <tr><td class="m">Domain admin</td><td>Non</td><td>Oui — dans <i>son</i> domaine</td><td>Oui</td></tr>
        <tr><td class="m">Domain contributor</td><td>Non</td><td>Non</td><td>Oui — vers un domaine où il est contributeur</td></tr>
        <tr><td class="m">Workspace admin</td><td>Non</td><td>Non</td><td>Non — le domaine n'est pas un objet d'espace de travail</td></tr>
      </table></div>
      <p class="why">Le piège du moindre privilège</p>
      <p><i>Least privilege</i> pousse instinctivement vers le rôle le plus bas — et <b>domain admin</b> est le distracteur conçu pour cela : il couvre les deux dernières tâches sur trois. Mais le moindre privilège ne veut pas dire « le rôle le plus faible » : il veut dire <b>le rôle le plus faible qui suffit</b>. Si aucun rôle délégué ne couvre la tâche bloquante, il faut monter, et c'est <b>correct</b> de répondre Fabric admin.</p>
      <p class="why">La logique de délégation des domaines</p>
      <p>Fabric distingue la <b>création</b> de la structure et son <b>administration</b>. L'admin Fabric crée le domaine et en désigne les administrateurs ; ceux-ci gèrent ensuite leur périmètre — sous-domaines, assignation d'espaces de travail, contributeurs — sans jamais pouvoir créer un domaine frère.</p>
      <p class="note"><b>Le réflexe.</b> Listez les tâches et cherchez <b>la plus élevée</b> : c'est elle qui fixe le rôle. Et souvenez-vous que <i>least privilege</i> n'interdit jamais de choisir un rôle élevé quand rien d'autre ne fait le travail.</p>`,
      en:`
      <p>The first task settles everything: <b>create a new domain</b>. That is a tenant-level operation, and <b>only a Fabric administrator can create a top-level domain</b>. No delegated role allows it.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Role</th><th>Create a domain</th><th>Create a subdomain</th><th>Assign workspaces</th></tr>
        <tr><td class="m">Fabric admin</td><td><b>Yes</b></td><td>Yes</td><td>Yes</td></tr>
        <tr><td class="m">Domain admin</td><td>No</td><td>Yes — within <i>their</i> domain</td><td>Yes</td></tr>
        <tr><td class="m">Domain contributor</td><td>No</td><td>No</td><td>Yes — into a domain where they contribute</td></tr>
        <tr><td class="m">Workspace admin</td><td>No</td><td>No</td><td>No — a domain is not a workspace object</td></tr>
      </table></div>
      <p class="why">The least-privilege trap</p>
      <p><i>Least privilege</i> instinctively pushes toward the lowest role — and <b>domain admin</b> is the distractor built for that: it covers the last two tasks out of three. But least privilege does not mean "the weakest role": it means <b>the weakest role that suffices</b>. If no delegated role covers the blocking task, you must go up, and answering Fabric admin is <b>correct</b>.</p>
      <p class="why">How domain delegation works</p>
      <p>Fabric separates <b>creating</b> the structure from <b>administering</b> it. The Fabric admin creates the domain and names its administrators; those then manage their own perimeter — subdomains, workspace assignment, contributors — without ever being able to create a sibling domain.</p>
      <p class="note"><b>The reflex.</b> List the tasks and find <b>the highest one</b>: it sets the role. And remember that <i>least privilege</i> never forbids picking a high role when nothing else does the job.</p>`}
  },
  {
    id:"q128", kind:"single", type:T1,
    title:{fr:"Mode de licence Pro et connexions XMLA",en:"Pro license mode and XMLA connections"},
    stem:{fr:`<p>Vous avez un locataire Fabric contenant un espace de travail nommé <b>Workspace1</b>. Workspace1 utilise le <b>mode de licence Pro</b> et contient un modèle sémantique nommé <b>Model1</b>.</p>
    <p>Vous devez garantir que Model1 <b>prend en charge les connexions XMLA</b>.</p>
    <p class="ask">Quel paramètre devez-vous modifier ?</p>`,
          en:`<p>You have a Fabric tenant that contains a workspace named <b>Workspace1</b>. Workspace1 uses <b>Pro license mode</b> and contains a semantic model named <b>Model1</b>.</p>
    <p>You need to ensure that Model1 <b>supports XMLA connections</b>.</p>
    <p class="ask">Which setting should you modify?</p>`},
    options:[
      {k:"A", fr:"Users can edit data models in the Power BI service", en:"Users can edit data models in the Power BI service"},
      {k:"B", fr:"Enforce strict access control for all data connection types", en:"Enforce strict access control for all data connection types"},
      {k:"C", fr:"Enable Cache for Shortcuts", en:"Enable Cache for Shortcuts"},
      {k:"D", fr:"License mode", en:"License mode"}
    ],
    answer:["D"],
    explain:{fr:`
      <p>Le mot décisif est <b>Pro</b>. Le point de terminaison XMLA n'est <b>pas disponible en mode de licence Pro</b> : c'est une fonctionnalité réservée aux capacités <b>Premium (P)</b>, <b>Premium Per User (PPU)</b> et <b>Fabric (F)</b>.</p>
      <p>Aucun réglage fin ne peut contourner cela. Tant que l'espace de travail reste en Pro, le paramètre <i>XMLA Endpoint</i> n'existe même pas à son niveau — il se règle sur la <b>capacité</b>, et un espace de travail Pro n'est assigné à aucune capacité dédiée.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Mode de licence de l'espace de travail</th><th>XMLA disponible ?</th></tr>
        <tr><td class="m">Pro</td><td><b>Non</b></td></tr>
        <tr><td class="m">Premium per user (PPU)</td><td>Oui</td></tr>
        <tr><td class="m">Premium par capacité (P)</td><td>Oui</td></tr>
        <tr><td class="m">Fabric capacity (F)</td><td>Oui</td></tr>
      </table></div>
      <p class="why">Pourquoi les trois autres tombent</p>
      <ul>
        <li><b>A — Users can edit data models in the Power BI service.</b> Le distracteur sérieux, car il parle bien de modification de modèles. Mais il concerne l'édition <b>dans le navigateur</b>, un canal totalement différent de XMLA, et il ne débloquerait rien en mode Pro.</li>
        <li><b>B — Enforce strict access control.</b> Paramètre de sécurité sur les types de connexion aux données. Il <b>restreint</b>, il n'active rien.</li>
        <li><b>C — Enable Cache for Shortcuts.</b> Concerne la mise en cache des raccourcis OneLake. Aucun rapport avec les modèles sémantiques.</li>
      </ul>
      <p class="why">Recoupement avec les autres questions XMLA</p>
      <p>Trois questions du recueil portent sur XMLA et chacune vise un <b>niveau différent</b> : le mode de licence de l'espace de travail (ici), le réglage <i>Read Write</i> sur la <b>capacité</b>, et l'activation globale au niveau du <b>tenant</b>. Les trois sont des prérequis en cascade.</p>
      <p class="note"><b>Le réflexe.</b> Quand une fonctionnalité est <b>structurellement absente</b> d'un niveau de licence, la réponse n'est jamais un paramètre fin : c'est le changement de licence ou de capacité. Cherchez d'abord si la fonctionnalité <i>existe</i> dans le contexte décrit.</p>`,
      en:`
      <p>The deciding word is <b>Pro</b>. The XMLA endpoint is <b>not available in Pro license mode</b>: it is reserved for <b>Premium (P)</b>, <b>Premium Per User (PPU)</b> and <b>Fabric (F)</b> capacities.</p>
      <p>No fine-grained setting can work around that. While the workspace stays on Pro, the <i>XMLA Endpoint</i> setting does not even exist for it — it lives on the <b>capacity</b>, and a Pro workspace is assigned to no dedicated capacity.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Workspace license mode</th><th>XMLA available?</th></tr>
        <tr><td class="m">Pro</td><td><b>No</b></td></tr>
        <tr><td class="m">Premium per user (PPU)</td><td>Yes</td></tr>
        <tr><td class="m">Premium per capacity (P)</td><td>Yes</td></tr>
        <tr><td class="m">Fabric capacity (F)</td><td>Yes</td></tr>
      </table></div>
      <p class="why">Why the other three fail</p>
      <ul>
        <li><b>A — Users can edit data models in the Power BI service.</b> The serious distractor, since it does mention editing models. But it concerns editing <b>in the browser</b>, a completely different channel from XMLA, and it would unblock nothing in Pro mode.</li>
        <li><b>B — Enforce strict access control.</b> A security setting over data connection types. It <b>restricts</b>; it enables nothing.</li>
        <li><b>C — Enable Cache for Shortcuts.</b> Concerns caching of OneLake shortcuts. Nothing to do with semantic models.</li>
      </ul>
      <p class="why">How it ties to the other XMLA questions</p>
      <p>Three questions in this collection deal with XMLA, each aimed at a <b>different level</b>: the workspace's license mode (here), the <i>Read Write</i> setting on the <b>capacity</b>, and the global switch at <b>tenant</b> level. All three are cascading prerequisites.</p>
      <p class="note"><b>The reflex.</b> When a feature is <b>structurally absent</b> from a licence tier, the answer is never a fine setting: it is the licence or capacity change. First check whether the feature <i>exists</i> in the context described.</p>`}
  },
  {
    id:"q129", kind:"multi", type:TM,
    title:{fr:"Paramètres pour committer vers Azure DevOps",en:"Settings to commit to Azure DevOps"},
    stem:{fr:`<p>Vous avez un locataire Fabric contenant un espace de travail nommé <b>Workspace1</b> et un utilisateur nommé <b>User1</b>. User1 a le rôle <b>Contributor</b> sur Workspace1.</p>
    <p>Vous prévoyez de configurer Workspace1 pour utiliser un dépôt <b>Azure DevOps</b> pour le contrôle de version. Vous devez garantir que User1 puisse <b>committer des éléments</b> vers le dépôt.</p>
    <p class="ask">Quels <b>deux</b> paramètres devez-vous activer pour User1 ?</p>`,
          en:`<p>You have a Fabric tenant that contains a workspace named <b>Workspace1</b> and a user named <b>User1</b>. User1 is assigned the <b>Contributor</b> role for Workspace1.</p>
    <p>You plan to configure Workspace1 to use an <b>Azure DevOps</b> repository for version control. You need to ensure that User1 can <b>commit items</b> to the repository.</p>
    <p class="ask">Which <b>two</b> settings should you enable for User1?</p>`},
    options:[
      {k:"A", fr:"Users can sync workspace items with GitHub repositories", en:"Users can sync workspace items with GitHub repositories"},
      {k:"B", fr:"Users can create and use Data workflows", en:"Users can create and use Data workflows"},
      {k:"C", fr:"Users can create Fabric items", en:"Users can create Fabric items"},
      {k:"D", fr:"Users can synchronize workspace items with their Git repositories", en:"Users can synchronize workspace items with their Git repositories"}
    ],
    answer:["C","D"],
    explain:{fr:`
      <p>Committer depuis Fabric exige deux autorisations de <b>niveau tenant</b> qui agissent sur deux plans différents : pouvoir <b>manipuler des éléments Fabric</b>, et pouvoir <b>les synchroniser avec Git</b>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Paramètre</th><th>Ce qu'il débloque</th></tr>
        <tr><td><b>D — Users can synchronize workspace items with their Git repositories</b></td><td>L'intégration Git elle-même : connexion, commit, update. C'est le paramètre central.</td></tr>
        <tr><td><b>C — Users can create Fabric items</b></td><td>Le droit de créer et modifier des éléments Fabric. Sans lui, un commit n'a rien à écrire et un <i>update</i> depuis le dépôt ne peut rien recréer.</td></tr>
      </table></div>
      <p class="why">Le rôle Contributor ne suffit pas — et c'est tout le sujet</p>
      <p>L'énoncé précise que User1 est déjà <b>Contributor</b> sur l'espace de travail. On pourrait croire le problème réglé : Contributor permet bien de publier du contenu. Mais les rôles d'espace de travail et les paramètres de tenant sont <b>deux couches indépendantes</b>. Le rôle dit ce que vous pouvez faire <i>dans</i> l'espace de travail ; le paramètre de tenant dit si la <i>fonctionnalité existe</i> pour vous dans l'organisation.</p>
      <p class="why">Pourquoi A et B tombent</p>
      <ul>
        <li><b>A — GitHub repositories.</b> Le distracteur le plus soigné : c'est bien de la synchronisation Git, mais le paramètre est <b>spécifique à GitHub</b> alors que l'énoncé nomme <b>Azure DevOps</b>. Un seul mot invalide l'option.</li>
        <li><b>B — Data workflows.</b> Concerne les workflows de données (Apache Airflow). Aucun rapport avec le contrôle de version.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> Sur les questions « deux paramètres », cherchez <b>deux couches différentes</b> — ici la fonctionnalité Git et le droit de créer des éléments. Et lisez le nom du fournisseur au mot près : GitHub et Azure DevOps ont des paramètres de tenant distincts.</p>`,
      en:`
      <p>Committing from Fabric requires two <b>tenant-level</b> settings acting on two different planes: being able to <b>handle Fabric items</b>, and being able to <b>synchronize them with Git</b>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Setting</th><th>What it unlocks</th></tr>
        <tr><td><b>D — Users can synchronize workspace items with their Git repositories</b></td><td>Git integration itself: connect, commit, update. The central setting.</td></tr>
        <tr><td><b>C — Users can create Fabric items</b></td><td>The right to create and modify Fabric items. Without it a commit has nothing to write, and an <i>update</i> from the repo cannot recreate anything.</td></tr>
      </table></div>
      <p class="why">The Contributor role is not enough — and that is the whole point</p>
      <p>The stem states User1 is already <b>Contributor</b> on the workspace. One might think the problem is solved: Contributor does allow publishing content. But workspace roles and tenant settings are <b>two independent layers</b>. The role says what you can do <i>inside</i> the workspace; the tenant setting says whether the <i>feature exists</i> for you across the organisation.</p>
      <p class="why">Why A and B fail</p>
      <ul>
        <li><b>A — GitHub repositories.</b> The most carefully built distractor: it is Git synchronization, but the setting is <b>GitHub-specific</b> while the stem names <b>Azure DevOps</b>. One word invalidates the option.</li>
        <li><b>B — Data workflows.</b> Concerns data workflows (Apache Airflow). Nothing to do with version control.</li>
      </ul>
      <p class="note"><b>The reflex.</b> On "two settings" questions, look for <b>two different layers</b> — here the Git feature and the right to create items. And read the provider name word for word: GitHub and Azure DevOps have separate tenant settings.</p>`}
  },
  {
    id:"q130", kind:"multi", type:TM,
    title:{fr:"Créer un espace de travail pour le service financier",en:"Creating a workspace for the finance department"},
    stem:{fr:`<p>Votre entreprise a un service financier. Vous avez un locataire Fabric, un compte de stockage Azure nommé <b>storage1</b>, et un groupe Microsoft Entra nommé <b>Group1</b> contenant les utilisateurs du service financier.</p>
    <p>Vous devez créer un espace de travail nommé <b>Workspace1</b>, en respectant les exigences suivantes :</p>
    <ul>
      <li>Les utilisateurs du service financier peuvent <b>créer et modifier</b> des éléments dans Workspace1.</li>
      <li>Workspace1 peut accéder <b>de façon sécurisée</b> à storage1 en lecture et en écriture.</li>
      <li>Vous êtes le <b>seul administrateur</b> de Workspace1.</li>
      <li><b>Minimiser l'effort administratif.</b></li>
    </ul>
    <p>Vous créez Workspace1.</p>
    <p class="ask">Quelles <b>deux</b> actions devez-vous effectuer ensuite ?</p>`,
          en:`<p>Your company has a finance department. You have a Fabric tenant, an Azure Storage account named <b>storage1</b>, and a Microsoft Entra group named <b>Group1</b> that contains the finance department users.</p>
    <p>You need to create a workspace named <b>Workspace1</b> that meets the following requirements:</p>
    <ul>
      <li>Finance department users can <b>create and edit</b> items in Workspace1.</li>
      <li>Workspace1 can <b>securely access</b> storage1 to read and write data.</li>
      <li>You are the <b>only admin</b> of Workspace1.</li>
      <li><b>Minimize administrative effort.</b></li>
    </ul>
    <p>You create Workspace1.</p>
    <p class="ask">Which <b>two</b> actions should you perform next?</p>`},
    options:[
      {k:"A", fr:"Assigner le rôle <b>Contributor</b> à Group1.", en:"Assign the <b>Contributor</b> role to Group1."},
      {k:"B", fr:"Créer une <b>identité d'espace de travail</b> (workspace identity).", en:"Create a <b>workspace identity</b>."},
      {k:"C", fr:"S'assigner à soi-même le rôle <b>Admin</b>.", en:"Assign the <b>Admin</b> role to yourself."},
      {k:"D", fr:"Assigner le rôle Contributor à <b>chaque</b> utilisateur du service financier.", en:"Assign the Contributor role to <b>each</b> finance department user."}
    ],
    answer:["A","B"],
    explain:{fr:`
      <p>Chaque exigence pointe une action — sauf une, qui est déjà satisfaite. C'est ce qui rend la question intéressante.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Exigence</th><th>Action</th></tr>
        <tr><td>Créer et modifier des éléments</td><td><b>A</b> — Contributor sur <b>Group1</b></td></tr>
        <tr><td>Accès sécurisé à storage1 en lecture-écriture</td><td><b>B</b> — identité d'espace de travail</td></tr>
        <tr><td>Être le seul admin</td><td><i>Déjà vrai</i> — le créateur est automatiquement Admin</td></tr>
        <tr><td>Minimiser l'effort</td><td>Départage A et D</td></tr>
      </table></div>
      <p class="why">B — l'identité d'espace de travail, la bonne réponse « sécurité »</p>
      <p>C'est une <b>identité managée</b> attachée à l'espace de travail. Vous lui accordez ensuite un rôle RBAC sur storage1 (<i>Storage Blob Data Contributor</i>), et Fabric s'authentifie sans jamais manipuler de clé de compte ni de jeton SAS — rien à stocker, rien à faire tourner. C'est le mécanisme conçu exactement pour « accéder de façon sécurisée à un stockage Azure ».</p>
      <p class="why">Pourquoi C est un piège, et non une réponse</p>
      <p>« Être le seul administrateur » est une exigence <b>déjà remplie</b> : en créant l'espace de travail, vous en devenez automatiquement Admin. S'assigner le rôle Admin est donc une action <b>redondante</b>, qui ne change rien. Et elle ne rend personne « seul » admin — pour cela, il faudrait au contraire <i>retirer</i> d'autres administrateurs.</p>
      <p class="why">Pourquoi D perd contre A</p>
      <p>Assigner le rôle utilisateur par utilisateur <b>fonctionnerait</b>, mais contredit frontalement <i>minimize administrative effort</i> : chaque arrivée ou départ dans le service imposerait une intervention manuelle. Assigner le rôle au <b>groupe</b> fait que l'appartenance à Group1 suffit désormais.</p>
      <p class="note"><b>Deux réflexes.</b> Vérifiez toujours si une exigence est <b>déjà satisfaite</b> par le contexte — l'option qui la « réalise » est alors un distracteur. Et dès qu'un groupe existe dans l'énoncé, assigner les droits <b>au groupe</b> est presque toujours la réponse « effort minimal ».</p>`,
      en:`
      <p>Each requirement points at one action — except one, which is already satisfied. That is what makes the question interesting.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Requirement</th><th>Action</th></tr>
        <tr><td>Create and edit items</td><td><b>A</b> — Contributor on <b>Group1</b></td></tr>
        <tr><td>Secure read-write access to storage1</td><td><b>B</b> — workspace identity</td></tr>
        <tr><td>Be the only admin</td><td><i>Already true</i> — the creator is automatically Admin</td></tr>
        <tr><td>Minimize effort</td><td>Decides between A and D</td></tr>
      </table></div>
      <p class="why">B — the workspace identity, the "security" answer</p>
      <p>It is a <b>managed identity</b> attached to the workspace. You then grant it an RBAC role on storage1 (<i>Storage Blob Data Contributor</i>), and Fabric authenticates without ever handling an account key or a SAS token — nothing to store, nothing to rotate. It is the mechanism built precisely for "securely access an Azure storage account".</p>
      <p class="why">Why C is a trap, not an answer</p>
      <p>"Being the only admin" is a requirement that is <b>already met</b>: by creating the workspace you automatically become its Admin. Assigning yourself the Admin role is therefore a <b>redundant</b> action that changes nothing. And it does not make anyone the "only" admin — for that you would have to <i>remove</i> other admins.</p>
      <p class="why">Why D loses to A</p>
      <p>Assigning the role user by user <b>would work</b>, but it flatly contradicts <i>minimize administrative effort</i>: every joiner or leaver would require manual work. Assigning the role to the <b>group</b> means membership of Group1 is now enough.</p>
      <p class="note"><b>Two reflexes.</b> Always check whether a requirement is <b>already satisfied</b> by the context — the option that "achieves" it is then a distractor. And whenever a group appears in the stem, granting rights <b>to the group</b> is almost always the "minimal effort" answer.</p>`}
  },
  {
    id:"q131", kind:"fields", type:TD,
    title:{fr:"Attribuer un rôle d'espace de travail à trois groupes",en:"Assigning a workspace role to three groups"},
    stem:{fr:`<p>Vous avez un espace de travail Fabric nommé <b>Workspace1</b> et trois groupes nommés <b>Group1</b>, <b>Group2</b> et <b>Group3</b>. Vous devez attribuer un rôle d'espace de travail à chaque groupe, en suivant le principe du <b>moindre privilège</b> :</p>
    <ul>
      <li><b>Group1</b> doit pouvoir <b>écrire des données</b> dans Workspace1, mais <b>ne pas pouvoir ajouter de membres</b>.</li>
      <li><b>Group2</b> doit pouvoir <b>configurer et maintenir les paramètres</b> de Workspace1.</li>
      <li><b>Group3</b> doit pouvoir <b>écrire des données et ajouter des membres</b>, mais <b>ne pas pouvoir supprimer</b> Workspace1.</li>
    </ul>
    <p class="ask">Quel rôle devez-vous attribuer à chaque groupe ?</p>`,
          en:`<p>You have a Fabric workspace named <b>Workspace1</b> and three groups named <b>Group1</b>, <b>Group2</b> and <b>Group3</b>. You need to assign a workspace role to each group, following the principle of <b>least privilege</b>:</p>
    <ul>
      <li><b>Group1</b> must be able to <b>write data</b> to Workspace1, but be <b>unable to add members</b>.</li>
      <li><b>Group2</b> must be able to <b>configure and maintain the settings</b> of Workspace1.</li>
      <li><b>Group3</b> must be able to <b>write data and add members</b>, but be <b>unable to delete</b> Workspace1.</li>
    </ul>
    <p class="ask">Which workspace role should you assign to each group?</p>`},
    fields:[
      {label:{fr:"Group1",en:"Group1"}, hint:{fr:"écrire, sans gérer les accès",en:"write, without managing access"},
       opts:{fr:["Viewer","Contributor","Member","Admin"],en:["Viewer","Contributor","Member","Admin"]}, ans:1},
      {label:{fr:"Group2",en:"Group2"}, hint:{fr:"configurer l'espace de travail",en:"configure the workspace"},
       opts:{fr:["Viewer","Contributor","Member","Admin"],en:["Viewer","Contributor","Member","Admin"]}, ans:3},
      {label:{fr:"Group3",en:"Group3"}, hint:{fr:"écrire et ajouter des membres, sans supprimer",en:"write and add members, without deleting"},
       opts:{fr:["Viewer","Contributor","Member","Admin"],en:["Viewer","Contributor","Member","Admin"]}, ans:2}
    ],
    explain:{fr:`
      <p>Les quatre rôles d'espace de travail forment une échelle, et chaque exigence de l'énoncé se lit comme une <b>borne haute</b> autant qu'une borne basse.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Rôle</th><th>Lire</th><th>Écrire</th><th>Ajouter des membres</th><th>Paramètres / supprimer</th></tr>
        <tr><td class="m">Viewer</td><td>Oui</td><td>Non</td><td>Non</td><td>Non</td></tr>
        <tr><td class="m">Contributor</td><td>Oui</td><td><b>Oui</b></td><td>Non</td><td>Non</td></tr>
        <tr><td class="m">Member</td><td>Oui</td><td>Oui</td><td><b>Oui</b></td><td>Non</td></tr>
        <tr><td class="m">Admin</td><td>Oui</td><td>Oui</td><td>Oui</td><td><b>Oui</b></td></tr>
      </table></div>
      <p class="why">Group1 → Contributor</p>
      <p>« Écrire des données » exige au minimum Contributor. « Ne pas pouvoir ajouter de membres » <b>plafonne</b> à Contributor, puisque Member introduit précisément cette capacité. Les deux contraintes se rejoignent sur un seul rôle.</p>
      <p class="why">Group2 → Admin</p>
      <p>« Configurer et maintenir les paramètres de l'espace de travail » est la définition du rôle Admin : nom, description, licence, intégration Git, suppression. Aucun autre rôle n'accède aux paramètres.</p>
      <p class="why">Group3 → Member</p>
      <p>C'est le cas le plus instructif. « Ajouter des membres » élimine Contributor par le bas ; « ne pas pouvoir supprimer l'espace de travail » élimine Admin par le haut. <b>Member est le seul rôle qui tient entre les deux</b> — et c'est exactement ce que le moindre privilège demande.</p>
      <p class="note"><b>Le réflexe.</b> Sur les questions de rôles, traduisez chaque exigence en <b>borne</b> : un verbe autorisé donne un plancher, un verbe interdit donne un plafond. Quand l'énoncé formule les deux, la réponse est le seul rôle qui tombe dans l'intervalle — pas besoin d'hésiter.</p>`,
      en:`
      <p>The four workspace roles form a ladder, and each requirement in the stem reads as an <b>upper bound</b> as much as a lower one.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Role</th><th>Read</th><th>Write</th><th>Add members</th><th>Settings / delete</th></tr>
        <tr><td class="m">Viewer</td><td>Yes</td><td>No</td><td>No</td><td>No</td></tr>
        <tr><td class="m">Contributor</td><td>Yes</td><td><b>Yes</b></td><td>No</td><td>No</td></tr>
        <tr><td class="m">Member</td><td>Yes</td><td>Yes</td><td><b>Yes</b></td><td>No</td></tr>
        <tr><td class="m">Admin</td><td>Yes</td><td>Yes</td><td>Yes</td><td><b>Yes</b></td></tr>
      </table></div>
      <p class="why">Group1 → Contributor</p>
      <p>"Write data" requires at least Contributor. "Unable to add members" <b>caps</b> it at Contributor, since Member is precisely what introduces that capability. Both constraints meet on a single role.</p>
      <p class="why">Group2 → Admin</p>
      <p>"Configure and maintain the settings of the workspace" is the definition of the Admin role: name, description, licence, Git integration, deletion. No other role reaches the settings.</p>
      <p class="why">Group3 → Member</p>
      <p>The most instructive case. "Add members" rules out Contributor from below; "unable to delete the workspace" rules out Admin from above. <b>Member is the only role that fits between them</b> — and that is exactly what least privilege asks for.</p>
      <p class="note"><b>The reflex.</b> On role questions, translate each requirement into a <b>bound</b>: a permitted verb gives a floor, a forbidden verb gives a ceiling. When the stem states both, the answer is the single role inside the interval — no hesitation needed.</p>`}
  },
  {
    id:"q132", kind:"fields", type:TH,
    title:{fr:"Ce que débloque « Read all Apache Spark »",en:"What \"Read all Apache Spark\" unlocks"},
    stem:{fr:`<p>Vous avez un espace de travail <b>Workspace1</b> contenant un lakehouse <b>Lakehouse1</b>, et un utilisateur nommé <b>DBUser</b>. <b>DBUser n'a PAS accès au locataire.</b></p>
    <p>Vous accordez à DBUser l'accès à Lakehouse1 via <i>Grant people access</i>. Dans les <b>permissions supplémentaires</b>, <b>seule</b> la case <b>Read all Apache Spark</b> est cochée — <i>Read all SQL endpoint data</i> et <i>Build reports on the default semantic model</i> restent décochées.</p>
    <p class="ask">Complétez les deux affirmations.</p>`,
          en:`<p>You have a workspace named <b>Workspace1</b> that contains a lakehouse named <b>Lakehouse1</b>, and a user named <b>DBUser</b>. <b>DBUser does NOT have access to the tenant.</b></p>
    <p>You grant DBUser access to Lakehouse1 through <i>Grant people access</i>. Under <b>Additional permissions</b>, <b>only</b> <b>Read all Apache Spark</b> is selected — <i>Read all SQL endpoint data</i> and <i>Build reports on the default semantic model</i> are left cleared.</p>
    <p class="ask">Complete the two statements.</p>`},
    fields:[
      {label:{fr:"DBUser peut <b>lire</b> les données de Lakehouse1 en utilisant le…",en:"DBUser can <b>read</b> the data in Lakehouse1 by using the…"}, hint:{fr:"quel point de terminaison",en:"which endpoint"},
       opts:{fr:["default semantic model","OneLake endpoint","Tabular Data Stream (TDS) endpoint"],en:["default semantic model","OneLake endpoint","Tabular Data Stream (TDS) endpoint"]}, ans:1},
      {label:{fr:"DBUser peut <b>interroger</b> les données de Lakehouse1 en utilisant…",en:"DBUser can <b>query</b> the data in Lakehouse1 by using…"}, hint:{fr:"quel outil",en:"which tool"},
       opts:{fr:["a KQL queryset","OneLake file explorer","Microsoft SQL Server Management Studio (SSMS)"],en:["a KQL queryset","OneLake file explorer","Microsoft SQL Server Management Studio (SSMS)"]}, ans:1}
    ],
    explain:{fr:`
      <p>Tout se déduit de la <b>seule case cochée</b>. Chaque permission supplémentaire ouvre un <b>canal d'accès distinct</b>, et celles qui restent décochées ferment le leur.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Permission</th><th>État</th><th>Canal correspondant</th></tr>
        <tr><td>Read all SQL endpoint data</td><td><b>Décochée</b></td><td>T-SQL / TDS → SSMS, endpoint SQL : <b>fermé</b></td></tr>
        <tr><td>Read all Apache Spark</td><td><b>Cochée</b></td><td>Accès direct aux fichiers OneLake : <b>ouvert</b></td></tr>
        <tr><td>Build reports on the default semantic model</td><td><b>Décochée</b></td><td>Modèle sémantique par défaut : <b>fermé</b></td></tr>
      </table></div>
      <p class="why">❶ Le OneLake endpoint</p>
      <p><i>Read all Apache Spark</i> (permission <code class="inl">ReadAll</code>) donne l'accès <b>direct aux fichiers</b> du lakehouse dans OneLake. La lecture passe donc par le <b>OneLake endpoint</b>, compatible ADLS Gen2.</p>
      <p>Les deux autres options sont écartées par les cases décochées : le <b>TDS endpoint</b> exigerait <i>Read all SQL endpoint data</i>, et le <b>default semantic model</b> exigerait <i>Build reports</i>.</p>
      <p class="why">❷ OneLake file explorer</p>
      <p>Même logique côté outil. <b>SSMS</b> se connecte en TDS — canal fermé. Un <b>KQL queryset</b> s'adresse à une base KQL, pas à un lakehouse. Reste <b>OneLake file explorer</b>, qui monte OneLake comme un dossier Windows et lit directement les fichiers : c'est le seul outil cohérent avec le canal ouvert.</p>
      <p class="why">Le détail qui n'est pas là par hasard</p>
      <p><i>DBUser n'a pas accès au locataire.</i> Cette phrase ferme la porte à tout ce qui passerait par l'espace de travail ou par un élément Fabric ; il ne reste que l'accès accordé <b>explicitement sur l'objet</b>.</p>
      <p class="note"><b>Le réflexe.</b> Sur une question à exhibit de permissions, ne lisez pas ce qui est coché comme une simple confirmation : <b>ce qui est décoché élimine des options</b>. Chaque case ferme un canal, et la bonne réponse est le seul canal resté ouvert.</p>`,
      en:`
      <p>Everything follows from the <b>single checked box</b>. Each additional permission opens a <b>separate access channel</b>, and the ones left cleared close theirs.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Permission</th><th>State</th><th>Matching channel</th></tr>
        <tr><td>Read all SQL endpoint data</td><td><b>Cleared</b></td><td>T-SQL / TDS → SSMS, SQL endpoint: <b>closed</b></td></tr>
        <tr><td>Read all Apache Spark</td><td><b>Checked</b></td><td>Direct access to OneLake files: <b>open</b></td></tr>
        <tr><td>Build reports on the default semantic model</td><td><b>Cleared</b></td><td>Default semantic model: <b>closed</b></td></tr>
      </table></div>
      <p class="why">❶ The OneLake endpoint</p>
      <p><i>Read all Apache Spark</i> (the <code class="inl">ReadAll</code> permission) grants <b>direct access to the files</b> of the lakehouse in OneLake. Reading therefore goes through the <b>OneLake endpoint</b>, which is ADLS Gen2-compatible.</p>
      <p>The other two options are ruled out by the cleared boxes: the <b>TDS endpoint</b> would need <i>Read all SQL endpoint data</i>, and the <b>default semantic model</b> would need <i>Build reports</i>.</p>
      <p class="why">❷ OneLake file explorer</p>
      <p>Same logic on the tool side. <b>SSMS</b> connects over TDS — a closed channel. A <b>KQL queryset</b> addresses a KQL database, not a lakehouse. That leaves <b>OneLake file explorer</b>, which mounts OneLake as a Windows folder and reads the files directly: the only tool consistent with the open channel.</p>
      <p class="why">The detail that is not there by accident</p>
      <p><i>DBUser does not have access to the tenant.</i> That sentence shuts the door on anything routed through the workspace or a Fabric item; all that remains is the access granted <b>explicitly on the object</b>.</p>
      <p class="note"><b>The reflex.</b> On a permissions-exhibit question, do not read the checked box as mere confirmation: <b>what is cleared eliminates options</b>. Each box closes a channel, and the answer is the one channel left open.</p>`}
  },
  {
    id:"q133", kind:"multi", type:TM,
    title:{fr:"Versionner un modèle et le publier depuis Desktop",en:"Versioning a model and publishing from Desktop"},
    stem:{fr:`<p>Vous avez un espace de travail Fabric nommé <b>Workspace1</b>. Vous devez créer un modèle sémantique nommé <b>Model1</b> et le publier dans Workspace1. La solution doit :</p>
    <ul>
      <li>pouvoir <b>revenir à des versions antérieures</b> de Model1 ;</li>
      <li><b>identifier les différences</b> entre versions enregistrées ;</li>
      <li>utiliser <b>Power BI Desktop</b> pour publier vers Workspace1 ;</li>
      <li>pouvoir <b>éditer les fichiers de définition</b> avec Visual Studio Code.</li>
    </ul>
    <p class="ask">Quelles <b>deux</b> actions devez-vous effectuer ?</p>`,
          en:`<p>You have a Fabric workspace named <b>Workspace1</b>. You need to create a semantic model named <b>Model1</b> and publish it to Workspace1. The solution must:</p>
    <ul>
      <li>be able to <b>revert to previous versions</b> of Model1;</li>
      <li><b>identify differences</b> between saved versions;</li>
      <li>use <b>Power BI Desktop</b> to publish to Workspace1;</li>
      <li>be able to <b>edit item definition files</b> with Visual Studio Code.</li>
    </ul>
    <p class="ask">Which <b>two</b> actions should you perform?</p>`},
    options:[
      {k:"A", fr:"Activer l'intégration Git pour Workspace1.", en:"Enable Git integration for Workspace1."},
      {k:"B", fr:"Enregistrer Model1 dans Power BI Desktop au format <b>PBIT</b>.", en:"Save Model1 in Power BI Desktop as a <b>PBIT</b> file."},
      {k:"C", fr:"Autoriser les utilisateurs à éditer les modèles de données dans le service Power BI.", en:"Enable users to edit data models in the Power BI service."},
      {k:"D", fr:"Enregistrer Model1 dans Power BI Desktop au format <b>PBIP</b>.", en:"Save Model1 in Power BI Desktop as a <b>PBIP</b> file."}
    ],
    answer:["A","D"],
    explain:{fr:`
      <p>Les quatre exigences se répartissent en deux blocs, et chaque bloc appelle une action.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Exigences</th><th>Action</th></tr>
        <tr><td>Revenir à une version antérieure · identifier les différences</td><td><b>A — intégration Git</b> : l'historique, les diffs et le <i>revert</i> vivent dans le dépôt</td></tr>
        <tr><td>Publier depuis Desktop · éditer les fichiers de définition dans VS Code</td><td><b>D — format PBIP</b> : un dossier de fichiers texte, éditable et diffable</td></tr>
      </table></div>
      <p class="why">Pourquoi PBIP et non PBIT — le cœur de la question</p>
      <p>Les deux formats se ressemblent par le nom, et c'est exactement le piège.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Format</th><th>Nature</th><th>Éditable dans VS Code ?</th><th>Diff lisible ?</th></tr>
        <tr><td class="m">PBIT</td><td>Gabarit <b>binaire</b> : structure et requêtes, sans les données</td><td><b>Non</b></td><td>Non</td></tr>
        <tr><td class="m">PBIP</td><td><b>Dossier de fichiers texte</b> : modèle en TMDL, rapport en JSON</td><td><b>Oui</b></td><td>Oui</td></tr>
      </table></div>
      <p>Seul PBIP produit des fichiers que Git peut comparer ligne à ligne. Un PBIT versionné dans Git ne donnerait qu'un blob binaire : on saurait qu'il a changé, jamais <b>en quoi</b> — ce qui fait échouer l'exigence « identifier les différences ».</p>
      <p class="why">Pourquoi les deux actions sont indissociables</p>
      <p>Git sans PBIP versionne un binaire opaque ; PBIP sans Git donne des fichiers lisibles mais aucun historique. <b>Chacune ne vaut qu'avec l'autre</b> — d'où la formulation « chaque bonne réponse présente une partie de la solution ».</p>
      <p class="why">Pourquoi C tombe</p>
      <p><i>Users can edit data models in the Power BI service</i> concerne l'édition <b>dans le navigateur</b>. L'énoncé impose explicitement Power BI Desktop pour publier et VS Code pour éditer : ce paramètre ne répond à aucune des quatre exigences.</p>
      <p class="note"><b>Le réflexe.</b> <i>Revert</i>, <i>differences between versions</i>, <i>branching</i> → Git. <i>Edit definition files</i>, <i>VS Code</i>, <i>TMDL</i> → PBIP. Les deux vont toujours ensemble, et PBIT est le distracteur systématique de PBIP.</p>`,
      en:`
      <p>The four requirements split into two blocks, and each block calls for one action.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Requirements</th><th>Action</th></tr>
        <tr><td>Revert to a previous version · identify differences</td><td><b>A — Git integration</b>: history, diffs and revert live in the repository</td></tr>
        <tr><td>Publish from Desktop · edit definition files in VS Code</td><td><b>D — PBIP format</b>: a folder of text files, editable and diffable</td></tr>
      </table></div>
      <p class="why">Why PBIP and not PBIT — the heart of the question</p>
      <p>The two formats look alike by name, and that is exactly the trap.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Format</th><th>Nature</th><th>Editable in VS Code?</th><th>Readable diff?</th></tr>
        <tr><td class="m">PBIT</td><td><b>Binary</b> template: structure and queries, no data</td><td><b>No</b></td><td>No</td></tr>
        <tr><td class="m">PBIP</td><td><b>Folder of text files</b>: model in TMDL, report in JSON</td><td><b>Yes</b></td><td>Yes</td></tr>
      </table></div>
      <p>Only PBIP produces files Git can compare line by line. A PBIT versioned in Git would be an opaque blob: you would know it changed, never <b>how</b> — which fails the "identify differences" requirement.</p>
      <p class="why">Why the two actions are inseparable</p>
      <p>Git without PBIP versions an opaque binary; PBIP without Git gives readable files but no history. <b>Each is worth nothing without the other</b> — hence "each correct answer presents part of the solution".</p>
      <p class="why">Why C fails</p>
      <p><i>Users can edit data models in the Power BI service</i> concerns editing <b>in the browser</b>. The stem explicitly requires Power BI Desktop to publish and VS Code to edit: that setting answers none of the four requirements.</p>
      <p class="note"><b>The reflex.</b> <i>Revert</i>, <i>differences between versions</i>, <i>branching</i> → Git. <i>Edit definition files</i>, <i>VS Code</i>, <i>TMDL</i> → PBIP. The two always go together, and PBIT is PBIP's standing distractor.</p>`}
  },
  {
    id:"q134", kind:"single", type:T1,
    title:{fr:"Publier depuis Tabular Editor",en:"Publishing from Tabular Editor"},
    stem:{fr:`<p>Vous avez un espace de travail Fabric nommé <b>Workspace1</b>, assigné à une capacité Fabric <b>nouvellement créée</b> nommée <b>Capacity1</b>. Vous créez un modèle sémantique nommé <b>Model1</b> et le déployez dans Workspace1.</p>
    <p>Vous devez pouvoir <b>publier des modifications de Model1 directement depuis Tabular Editor</b>.</p>
    <p class="ask">Que devez-vous faire ?</p>`,
          en:`<p>You have a Fabric workspace named <b>Workspace1</b> that is assigned to a <b>newly created</b> Fabric capacity named <b>Capacity1</b>. You create a semantic model named <b>Model1</b> and deploy it to Workspace1.</p>
    <p>You need to publish changes to Model1 <b>directly from Tabular Editor</b>.</p>
    <p class="ask">What should you do?</p>`},
    options:[
      {k:"A", fr:"Pour Workspace1, activer l'intégration Git.", en:"For Workspace1, enable Git integration."},
      {k:"B", fr:"Pour Model1, activer le partage externe.", en:"For Model1, enable external sharing."},
      {k:"C", fr:"Pour Workspace1, créer un point de terminaison privé managé.", en:"For Workspace1, create a managed private endpoint."},
      {k:"D", fr:"Pour Capacity1, régler le <i>XMLA Endpoint</i> sur <b>Read Write</b>.", en:"For Capacity1, set the <i>XMLA Endpoint</i> to <b>Read Write</b>."}
    ],
    answer:["D"],
    explain:{fr:`
      <p>Tabular Editor se connecte à un modèle sémantique <b>via le point de terminaison XMLA</b>. Deux mots de l'énoncé fixent la réponse : <i>publier</i> (donc écrire) et <i>nouvellement créée</i>.</p>
      <p class="why">Pourquoi le mot « nouvellement créée » compte</p>
      <p>Sur une capacité fraîche, le XMLA Endpoint est positionné sur <b>Read</b> par défaut. La lecture fonctionne — vous pouvez ouvrir Model1 dans Tabular Editor et l'explorer — mais toute tentative d'enregistrement échoue. Le passage en <b>Read Write</b> est donc l'action bloquante, et c'est elle que la question vise.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Valeur du XMLA Endpoint</th><th>Ce qui est possible</th></tr>
        <tr><td class="m">Off</td><td>Aucune connexion par outil externe</td></tr>
        <tr><td class="m">Read (défaut)</td><td>Se connecter, explorer, exécuter des requêtes DAX</td></tr>
        <tr><td class="m">Read Write</td><td><b>Publier des modifications</b> — TMSL, TMDL, déploiement</td></tr>
      </table></div>
      <p class="why">Et surtout : c'est un réglage de <b>capacité</b></p>
      <p>Le paramètre se trouve dans <i>Admin portal → Capacity settings → Power BI workloads</i>. L'option D le dit explicitement — « pour Capacity1 » — alors que les trois autres visent Workspace1 ou Model1, des niveaux où le XMLA ne se règle pas.</p>
      <p class="why">Les trois distracteurs</p>
      <ul>
        <li><b>A — intégration Git.</b> Versionne les éléments de l'espace de travail. Utile, mais elle ne crée aucun canal de publication pour un outil externe.</li>
        <li><b>B — partage externe.</b> Concerne le partage de contenu avec des utilisateurs <b>hors de l'organisation</b>. Sans rapport.</li>
        <li><b>C — point de terminaison privé managé.</b> Sécurise le trafic réseau vers des sources de données privées. C'est de la connectivité réseau, pas un droit d'écriture.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> <i>Outils externes</i> (Tabular Editor, SSMS, DAX Studio) = XMLA. Et dès qu'il faut <b>écrire</b>, c'est <code class="inl">Read Write</code> sur la <b>capacité</b> — jamais sur l'espace de travail ni sur le modèle.</p>`,
      en:`
      <p>Tabular Editor connects to a semantic model <b>through the XMLA endpoint</b>. Two words in the stem fix the answer: <i>publish</i> (so, write) and <i>newly created</i>.</p>
      <p class="why">Why "newly created" matters</p>
      <p>On a fresh capacity the XMLA Endpoint defaults to <b>Read</b>. Reading works — you can open Model1 in Tabular Editor and explore it — but any save fails. Switching to <b>Read Write</b> is therefore the blocking action, and it is what the question targets.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>XMLA Endpoint value</th><th>What is possible</th></tr>
        <tr><td class="m">Off</td><td>No external-tool connection at all</td></tr>
        <tr><td class="m">Read (default)</td><td>Connect, explore, run DAX queries</td></tr>
        <tr><td class="m">Read Write</td><td><b>Publish changes</b> — TMSL, TMDL, deployment</td></tr>
      </table></div>
      <p class="why">And above all: it is a <b>capacity</b> setting</p>
      <p>The setting lives in <i>Admin portal → Capacity settings → Power BI workloads</i>. Option D says so explicitly — "for Capacity1" — while the other three target Workspace1 or Model1, levels where XMLA is not configured.</p>
      <p class="why">The three distractors</p>
      <ul>
        <li><b>A — Git integration.</b> Versions the workspace items. Useful, but it creates no publishing channel for an external tool.</li>
        <li><b>B — external sharing.</b> Concerns sharing content with users <b>outside the organisation</b>. Unrelated.</li>
        <li><b>C — managed private endpoint.</b> Secures network traffic to private data sources. That is network connectivity, not a write permission.</li>
      </ul>
      <p class="note"><b>The reflex.</b> <i>External tools</i> (Tabular Editor, SSMS, DAX Studio) = XMLA. And as soon as you must <b>write</b>, it is <code class="inl">Read Write</code> on the <b>capacity</b> — never on the workspace or the model.</p>`}
  }]
},
{
  id:"d2", n:2, short:{fr:"Préparer & servir",en:"Prepare & serve"}, weight:{fr:"40–45 % de l'examen",en:"40–45 % of the exam"},
  title:{fr:"Préparer et servir les données",en:"Prepare and serve data"},
  note:{fr:"Le domaine le plus lourd de l'examen : ingestion, raccourcis, copie, transformations, notebooks Spark, T-SQL et points de terminaison SQL. Les pièges portent presque toujours sur ce qu'un type d'artefact sait ou ne sait pas faire — et sur l'emplacement exact d'un objet.",
        en:"The heaviest domain on the exam: ingestion, shortcuts, copying, transformations, Spark notebooks, T-SQL and SQL endpoints. The traps nearly always hinge on what an artifact type can or cannot do — and on exactly where an object lives."},
  cases:["contoso","litware"],
  questions:[
  {
    id:"q201", kind:"single", tag:"contoso", type:T1,
    title:{fr:"Syntaxe notebook pour Productline1",en:"Notebook syntax for Productline1 data"},
    stem:{fr:`<p class="ask">Quelle syntaxe devez-vous utiliser dans un notebook pour accéder aux données de la division Research pour Productline1 ?</p>`,
          en:`<p class="ask">Which syntax should you use in a notebook to access the Research division data for Productline1?</p>`},
    options:[
      {k:"A", fr:`<code class="inl">spark.read.format("delta").load("Tables/ResearchProduct")</code>`, en:`<code class="inl">spark.read.format("delta").load("Tables/ResearchProduct")</code>`},
      {k:"B", fr:`<code class="inl">spark.read.format("delta").load("Files/ResearchProduct")</code>`, en:`<code class="inl">spark.read.format("delta").load("Files/ResearchProduct")</code>`},
      {k:"C", fr:`<code class="inl">spark.sql("SELECT * FROM Lakehouse1.productline1.ResearchProduct")</code>`, en:`<code class="inl">spark.sql("SELECT * FROM Lakehouse1.productline1.ResearchProduct")</code>`},
      {k:"D", fr:`<code class="inl">spark.read.format("delta").load("Tables/productline1/ResearchProduct")</code>`, en:`<code class="inl">spark.read.format("delta").load("Tables/productline1/ResearchProduct")</code>`}
    ],
    answer:["A"],
    explain:{fr:`
      <p>Deux phrases du dossier portent la réponse : <i>« storage1 contains Research division data for a product line named Productline1. <b>The data is in the delta format.</b> »</i> et <i>« In Lakehouse1, create a shortcut to storage1 named ResearchProduct. »</i></p>
      <p class="why">Deux décisions à prendre : le format et le chemin</p>
      <p><b>Le format</b> est donné par l'énoncé — <i>the data is in the delta format</i> — d'où <code class="inl">.format("delta")</code>. Une information technique posée dans un case study est rarement décorative.</p>
      <p><b>Le chemin</b> est là où la question se joue vraiment. Le raccourci s'appelle <code class="inl">ResearchProduct</code> et il est créé <b>dans Lakehouse1</b>. Comme les données doivent apparaître en <i>managed tables</i>, il vit dans la section <code class="inl">Tables</code>. Son chemin est donc exactement <code class="inl">Tables/ResearchProduct</code> — <b>deux segments</b>.</p>
      <p class="why">Le piège central : le segment productline1 en trop</p>
      <p><code class="inl">Tables/productline1/ResearchProduct</code> (option D) est le distracteur le plus séduisant, parce que <i>Productline1</i> est partout dans le dossier. Mais c'est le nom de la <b>ligne de produits</b> et de l'espace de travail (<code class="inl">Productline1ws</code>), <b>pas un schéma dans le lakehouse</b>. Rien dans l'énoncé ne crée un niveau intermédiaire de ce nom. Le raccourci a été créé à la racine de <code class="inl">Tables</code>, donc le chemin n'a pas de troisième segment.</p>
      <p class="why">Les deux autres</p>
      <ul>
        <li><b>B — <code class="inl">Files/ResearchProduct</code>.</b> Bon format, mauvaise section. L'exigence de préparation impose des <b>managed tables</b> dans Lakehouse explorer : le raccourci est dans <code class="inl">Tables</code>, pas dans <code class="inl">Files</code>. Charger depuis <code class="inl">Files/</code> ne trouverait rien.</li>
        <li><b>C — <code class="inl">spark.sql("… Lakehouse1.productline1.ResearchProduct")</code>.</b> Cumule deux erreurs : la même invention du niveau <code class="inl">productline1</code>, et une forme à trois parties (<code class="inl">lakehouse.schema.table</code>) qui n'a de sens que si les schémas sont activés.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Situation</th><th>Syntaxe attendue</th></tr>
        <tr><td>Lakehouse par défaut attaché, table enregistrée</td><td class="m">spark.sql("SELECT * FROM Table")</td></tr>
        <tr><td>Accès direct, format connu, chemin donné</td><td class="m">spark.read.format("delta").load("Tables/...")</td></tr>
        <tr><td>Fichiers bruts non enregistrés (CSV, JSON)</td><td class="m">spark.read.format("csv").load("Files/...")</td></tr>
      </table></div>
      <p class="note"><b>Attention, variante piégeuse.</b> La question suivante reprend exactement le même énoncé avec <b>une seule option modifiée</b> — et la réponse bascule sur B. Ne reconnaissez jamais une question à son énoncé seul.</p>`,
      en:`
      <p>Two sentences from the dossier carry the answer: <i>"storage1 contains Research division data for a product line named Productline1. <b>The data is in the delta format.</b>"</i> and <i>"In Lakehouse1, create a shortcut to storage1 named ResearchProduct."</i></p>
      <p class="why">Two decisions: the format and the path</p>
      <p><b>The format</b> is handed to you by the stem — <i>the data is in the delta format</i> — hence <code class="inl">.format("delta")</code>. A technical detail placed in a case study is rarely decorative.</p>
      <p><b>The path</b> is where the question is really decided. The shortcut is named <code class="inl">ResearchProduct</code> and is created <b>in Lakehouse1</b>. Since the data must appear as <i>managed tables</i>, it lives in the <code class="inl">Tables</code> section. Its path is therefore exactly <code class="inl">Tables/ResearchProduct</code> — <b>two segments</b>.</p>
      <p class="why">The central trap: the extra productline1 segment</p>
      <p><code class="inl">Tables/productline1/ResearchProduct</code> (option D) is the most seductive distractor, because <i>Productline1</i> is everywhere in the dossier. But it is the name of the <b>product line</b> and of the workspace (<code class="inl">Productline1ws</code>), <b>not a schema inside the lakehouse</b>. Nothing in the stem creates an intermediate level by that name. The shortcut was created at the root of <code class="inl">Tables</code>, so the path has no third segment.</p>
      <p class="why">The other two</p>
      <ul>
        <li><b>B — <code class="inl">Files/ResearchProduct</code>.</b> Right format, wrong section. The preparation requirement calls for <b>managed tables</b> in Lakehouse explorer: the shortcut sits in <code class="inl">Tables</code>, not in <code class="inl">Files</code>. Loading from <code class="inl">Files/</code> would find nothing.</li>
        <li><b>C — <code class="inl">spark.sql("… Lakehouse1.productline1.ResearchProduct")</code>.</b> Two errors at once: the same invented <code class="inl">productline1</code> level, and a three-part form (<code class="inl">lakehouse.schema.table</code>) that only makes sense when schemas are enabled.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Situation</th><th>Expected syntax</th></tr>
        <tr><td>Default lakehouse attached, table registered</td><td class="m">spark.sql("SELECT * FROM Table")</td></tr>
        <tr><td>Direct access, known format, path given</td><td class="m">spark.read.format("delta").load("Tables/...")</td></tr>
        <tr><td>Raw unregistered files (CSV, JSON)</td><td class="m">spark.read.format("csv").load("Files/...")</td></tr>
      </table></div>
      <p class="note"><b>Careful — there is a trap variant.</b> The next question repeats this exact stem with <b>one option changed</b>, and the answer flips to B. Never recognise a question by its stem alone.</p>`}
  },
  {
    id:"q202", kind:"single", tag:"contoso", type:T1,
    title:{fr:"Syntaxe notebook — variante Files/",en:"Notebook syntax — the Files/ variant"},
    stem:{fr:`<p><b>Même énoncé que la question précédente</b>, mais les options ont changé.</p><p class="ask">Quelle syntaxe devez-vous utiliser dans un notebook pour accéder aux données de la division Research pour Productline1 ?</p>`,
          en:`<p><b>Same stem as the previous question</b>, but the options have changed.</p><p class="ask">Which syntax should you use in a notebook to access the Research division data for Productline1?</p>`},
    options:[
      {k:"A", fr:`<code class="inl">spark.read.format("delta").load("Files/ResearchProduct")</code>`, en:`<code class="inl">spark.read.format("delta").load("Files/ResearchProduct")</code>`},
      {k:"B", fr:`<code class="inl">spark.sql("SELECT * FROM Lakehouse1.ResearchProduct")</code>`, en:`<code class="inl">spark.sql("SELECT * FROM Lakehouse1.ResearchProduct")</code>`},
      {k:"C", fr:`<code class="inl">spark.sql("SELECT * FROM Lakehouse1.Tables.ResearchProduct")</code>`, en:`<code class="inl">spark.sql("SELECT * FROM Lakehouse1.Tables.ResearchProduct")</code>`},
      {k:"D", fr:`<code class="inl">external_table(ResearchProduct)</code>`, en:`<code class="inl">external_table(ResearchProduct)</code>`}
    ],
    answer:["B"],
    explain:{fr:`
      <p>Un seul mot a changé dans l'option A — <code class="inl">Tables/</code> est devenu <code class="inl">Files/</code> — et la bonne réponse n'est plus la même.</p>
      <pre class="code">Question précédente → A = ...load("Tables/ResearchProduct")     → réponse A
Cette question      → A = ...load("Files/ResearchProduct")               → réponse B</pre>
      <p class="why">Pourquoi A tombe ici</p>
      <p>L'exigence de préparation dit : <i>« All the Research division data in the lakehouses must be presented as <b>managed tables</b> in Lakehouse explorer. »</i> Le raccourci ResearchProduct vit donc dans la section <code class="inl">Tables/</code>, pas dans <code class="inl">Files/</code>. Charger depuis <code class="inl">Files/ResearchProduct</code> ne trouverait rien.</p>
      <p class="why">Pourquoi B devient correct</p>
      <p>Fabric enregistre chaque lakehouse comme une <b>base de données dans le metastore Spark</b>. La notation en deux parties <code class="inl">lakehouse.table</code> est donc valide dans un notebook, et fonctionne même si Lakehouse1 n'est pas le lakehouse attaché par défaut — c'est d'ailleurs son intérêt principal. A étant éliminée par le chemin, B est la seule syntaxe viable restante.</p>
      <p class="why">Pourquoi C et D tombent</p>
      <ul>
        <li><b>C</b> — <code class="inl">Lakehouse1.Tables.ResearchProduct</code> : trois segments, mais <code class="inl">Tables</code> n'est pas un schéma, c'est un dossier physique dans OneLake. Le metastore ne le reconnaît pas comme niveau de nommage. La forme à trois parties serait <code class="inl">lakehouse.schema.table</code>, et seulement si les schémas sont activés.</li>
        <li><b>D</b> — <code class="inl">external_table(...)</code> n'existe pas en Spark.</li>
      </ul>
      <pre class="code">spark.sql("SELECT * FROM MaTable")             # lakehouse par défaut attaché
spark.sql("SELECT * FROM Lakehouse1.MaTable")  # lakehouse nommé</pre>
      <p>Les deux fonctionnent. Ce qui ne fonctionne pas, c'est d'insérer <code class="inl">Tables</code> ou <code class="inl">dbo</code> entre les deux dans un contexte Spark — ces formes appartiennent au SQL analytics endpoint.</p>
      <p class="note"><b>Le réflexe.</b> Vérifiez toujours le <b>chemin</b>, pas seulement la fonction. Sur cette famille de questions, deux options peuvent utiliser la bonne syntaxe et se distinguer uniquement par l'emplacement.</p>`,
      en:`
      <p>One word changed in option A — <code class="inl">Tables/</code> became <code class="inl">Files/</code> — and the right answer is no longer the same.</p>
      <pre class="code">Previous question → A = ...load("Tables/ResearchProduct")     → answer A
This question     → A = ...load("Files/ResearchProduct")               → answer B</pre>
      <p class="why">Why A fails here</p>
      <p>The preparation requirement says: <i>"All the Research division data in the lakehouses must be presented as <b>managed tables</b> in Lakehouse explorer."</i> The ResearchProduct shortcut therefore lives in the <code class="inl">Tables/</code> section, not in <code class="inl">Files/</code>. Loading from <code class="inl">Files/ResearchProduct</code> would find nothing.</p>
      <p class="why">Why B becomes correct</p>
      <p>Fabric registers each lakehouse as a <b>database in the Spark metastore</b>. The two-part notation <code class="inl">lakehouse.table</code> is therefore valid in a notebook, and works even when Lakehouse1 is not the default attached lakehouse — which is its main benefit. With A ruled out by the path, B is the only viable syntax left.</p>
      <p class="why">Why C and D fail</p>
      <ul>
        <li><b>C</b> — <code class="inl">Lakehouse1.Tables.ResearchProduct</code>: three segments, but <code class="inl">Tables</code> is not a schema, it is a physical folder in OneLake. The metastore does not recognise it as a naming level. The three-part form would be <code class="inl">lakehouse.schema.table</code>, and only with schemas enabled.</li>
        <li><b>D</b> — <code class="inl">external_table(...)</code> does not exist in Spark.</li>
      </ul>
      <pre class="code">spark.sql("SELECT * FROM MyTable")             # default lakehouse attached
spark.sql("SELECT * FROM Lakehouse1.MyTable")  # named lakehouse</pre>
      <p>Both work. What does not work is inserting <code class="inl">Tables</code> or <code class="inl">dbo</code> between them in a Spark context — those forms belong to the SQL analytics endpoint.</p>
      <p class="note"><b>The reflex.</b> Always check the <b>path</b>, not just the function. In this family of questions, two options can use the right syntax and differ only in location.</p>`}
  },
  {
    id:"q203", kind:"single", tag:"litware", type:T1,
    title:{fr:"Quel type de data store pour AnalyticsPOC",en:"Which type of data store for AnalyticsPOC"},
    stem:{fr:`<p class="ask">Quel type de data store devez-vous recommander dans l'espace de travail AnalyticsPOC ?</p>`,
          en:`<p class="ask">Which type of data store should you recommend in the AnalyticsPOC workspace?</p>`},
    options:[
      {k:"A", fr:"un data lake", en:"a data lake"},
      {k:"B", fr:"un warehouse", en:"a warehouse"},
      {k:"C", fr:"un lakehouse", en:"a lakehouse"},
      {k:"D", fr:"un metastore Hive externe", en:"an external Hive metastore"}
    ],
    answer:["C"],
    explain:{fr:`
      <p>Les exigences techniques donnent trois contraintes : <i>« Read access by using <b>T-SQL or Python</b>. <b>Semi-structured and unstructured data</b>. <b>Row-level security</b> for users executing T-SQL queries. »</i> Et la sécurité ajoute : <i>« The data scientists... will access the data by using a <b>Spark notebook</b>. »</i></p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Mot-clé</th><th>Ce qu'il élimine</th></tr>
        <tr><td class="m">T-SQL or Python</td><td>Le <i>ou</i> est en réalité un <i>et</i> : seul le lakehouse offre nativement Spark/Python <b>et</b> un SQL analytics endpoint</td></tr>
        <tr><td class="m">semi-structured / unstructured</td><td>Un warehouse ne stocke que des tables relationnelles. Il faut une zone <code class="inl">Files</code></td></tr>
        <tr><td class="m">RLS for T-SQL queries</td><td>Impose un vrai endpoint SQL, ce qui élimine le stockage brut</td></tr>
        <tr><td class="m">Spark notebook</td><td>Un warehouse Fabric ne se lit pas en Spark</td></tr>
      </table></div>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — data lake.</b> Ce n'est pas un type d'artefact Fabric. Du stockage brut ne fournit ni endpoint T-SQL, ni RLS, ni modèle sémantique par défaut. Il ne coche aucune des trois exigences.</li>
        <li><b>B — warehouse.</b> Le distracteur sérieux : il gère parfaitement le T-SQL, le RLS, le modèle dimensionnel et les procédures stockées. Mais il échoue sur deux points structurels — pas de données non structurées, pas d'accès Python natif.</li>
        <li><b>D — metastore Hive externe.</b> Fabric utilise son propre metastore intégré à OneLake. Du remplissage.</li>
      </ul>
      <p class="why">Le point de vigilance</p>
      <p>Ce dossier contient aussi des exigences très « warehouse » : modèle dimensionnel, T-SQL, RLS. Il est tentant de basculer vers B en les voyant s'accumuler. Mais le lakehouse les couvre toutes — son SQL analytics endpoint gère le T-SQL en lecture, le RLS et les vues, et rien n'empêche d'y bâtir un modèle dimensionnel en tables delta. À l'inverse, le warehouse ne peut pas rattraper les deux exigences qu'il rate : c'est une limite structurelle, pas une question de configuration.</p>
      <p class="note"><b>Règle générale.</b> Comptez les exigences qu'une option rend <b>impossibles</b>, pas celles qu'elle satisfait. Et retenez l'asymétrie : le lakehouse fait du T-SQL en lecture, mais le warehouse ne fait pas de Python ni de non-structuré.</p>`,
      en:`
      <p>The technical requirements set three constraints: <i>"Read access by using <b>T-SQL or Python</b>. <b>Semi-structured and unstructured data</b>. <b>Row-level security</b> for users executing T-SQL queries."</i> And security adds: <i>"The data scientists... will access the data by using a <b>Spark notebook</b>."</i></p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Keyword</th><th>What it eliminates</th></tr>
        <tr><td class="m">T-SQL or Python</td><td>The <i>or</i> is really an <i>and</i>: only the lakehouse natively offers Spark/Python <b>and</b> a SQL analytics endpoint</td></tr>
        <tr><td class="m">semi-structured / unstructured</td><td>A warehouse stores relational tables only. You need a <code class="inl">Files</code> area</td></tr>
        <tr><td class="m">RLS for T-SQL queries</td><td>Requires a real SQL endpoint, which rules out raw storage</td></tr>
        <tr><td class="m">Spark notebook</td><td>A Fabric warehouse cannot be read from Spark</td></tr>
      </table></div>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — data lake.</b> Not a Fabric artifact type. Raw storage provides no T-SQL endpoint, no RLS and no default semantic model. It meets none of the three requirements.</li>
        <li><b>B — warehouse.</b> The serious distractor: it handles T-SQL, RLS, the dimensional model and stored procedures perfectly well. But it fails on two structural points — no unstructured data, no native Python access.</li>
        <li><b>D — external Hive metastore.</b> Fabric uses its own metastore integrated with OneLake. Filler.</li>
      </ul>
      <p class="why">The thing to watch</p>
      <p>This dossier also contains very "warehouse" requirements: dimensional model, T-SQL, RLS. It is tempting to swing to B as they pile up. But the lakehouse covers them all — its SQL analytics endpoint handles read T-SQL, RLS and views, and nothing stops you building a dimensional model there in delta tables. Conversely, the warehouse cannot make up the two requirements it misses: that is a structural limit, not a configuration question.</p>
      <p class="note"><b>General rule.</b> Count the requirements an option makes <b>impossible</b>, not the ones it satisfies. And remember the asymmetry: a lakehouse does read T-SQL, but a warehouse does neither Python nor unstructured data.</p>`}
  },
  {
    id:"q204", kind:"single", type:T1,
    title:{fr:"Quel data store pour V-Order et compaction automatiques",en:"Which data store for automatic V-Order and compaction"},
    stem:{fr:`<p>Vous avez des données sources dans un dossier sur un ordinateur local. Vous devez créer une solution utilisant Fabric pour peupler un data store. Exigences : supporter l'usage de <b>dataflows</b> pour charger et ajouter des données ; garantir que les tables Delta sont <b>V-Order optimisées et compactées automatiquement</b>.</p><p class="ask">Quel type de data store devez-vous utiliser ?</p>`,
          en:`<p>You have source data in a folder on a local computer. You need to create a solution that will use Fabric to populate a data store. Requirements: support the use of <b>dataflows</b> to load and append data; ensure that Delta tables are <b>V-Order optimized and compacted automatically</b>.</p><p class="ask">Which type of data store should you use?</p>`},
    options:[
      {k:"A", fr:"un lakehouse", en:"a lakehouse"},
      {k:"B", fr:"une base de données Azure SQL", en:"an Azure SQL database"},
      {k:"C", fr:"un warehouse", en:"a warehouse"},
      {k:"D", fr:"une base de données KQL", en:"a KQL database"}
    ],
    answer:["C"],
    explain:{fr:`
      <p>Les deux exigences sont satisfaites par le lakehouse comme par le warehouse... sauf sur un point. C'est le mot <b>automatically</b> qui décide.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Data store</th><th>V-Order et compaction</th></tr>
        <tr><td class="m">Lakehouse</td><td>Paramètres de session Spark (<code class="inl">spark.sql.parquet.vorder.enabled</code>, <code class="inl">optimizeWrite</code>). Activés par défaut, mais <b>configurables donc désactivables</b>, et dépendants du moteur qui écrit.</td></tr>
        <tr><td class="m">Warehouse</td><td>Le moteur lui-même <b>garantit</b> le comportement : toutes les écritures sont V-Ordered et la compaction est appliquée, sans configuration possible ni nécessaire. Intégré, pas paramétré.</td></tr>
      </table></div>
      <p>La seconde exigence — <i>support the use of dataflows to load and append</i> — ne départage pas : Dataflow Gen2 écrit vers les deux.</p>
      <p class="why">Le piège de raisonnement à éviter</p>
      <p>Il est tentant de répondre lakehouse en se disant : c'est lui qui expose les propriétés V-Order et Auto Compaction, donc c'est lui. C'est exactement l'inverse du bon raisonnement. <b>Exposer un réglage, c'est le contraire d'automatique.</b> Plus un comportement est paramétrable, moins il est garanti. L'énoncé ne demande pas quel data store <i>permet</i> V-Order, mais lequel le <i>garantit sans intervention</i>.</p>
      <ul>
        <li><b>B — Azure SQL.</b> Pas un artefact Fabric, et surtout pas de format Delta : ni V-Order ni compaction n'ont de sens ici.</li>
        <li><b>D — base KQL.</b> Appartient au Real-Time Intelligence, conçue pour la télémétrie en flux. Son moteur de stockage n'est pas Delta.</li>
      </ul>
      <p class="note"><b>La paire à retenir.</b> Deux questions « quel type de data store » avec des réponses opposées : celle de Litware répond <b>lakehouse</b> (données non structurées + Python), celle-ci répond <b>warehouse</b> (optimisation Delta garantie). Le lakehouse gagne sur la souplesse, le warehouse sur les garanties. Un énoncé qui dit <i>automatically</i>, <i>without configuration</i> ou <i>ensure that</i> demande une garantie, pas une possibilité.</p>`,
      en:`
      <p>Both requirements are met by the lakehouse as well as the warehouse... except on one point. The deciding word is <b>automatically</b>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Data store</th><th>V-Order and compaction</th></tr>
        <tr><td class="m">Lakehouse</td><td>Spark session settings (<code class="inl">spark.sql.parquet.vorder.enabled</code>, <code class="inl">optimizeWrite</code>). On by default, but <b>configurable and therefore disableable</b>, and dependent on whichever engine writes.</td></tr>
