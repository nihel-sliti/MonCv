      <p class="why">❶ Le point de connaissance le plus contre-intuitif du sujet</p>
      <p>On voit une chaîne de format dynamique à l'écran, et l'on est tenté de répondre <i>dynamic format string</i>. Mais l'affirmation dit : « un [ … ] <b>a été ajouté au modèle</b> ». Or, lorsque vous appliquez une chaîne de format dynamique à une mesure dans Power BI Desktop, <b>Power BI crée automatiquement un groupe de calcul masqué</b> pour la porter.</p>
      <p>La chaîne de format dynamique est donc ce que vous <b>écrivez</b> ; le <b>calculation group</b> est ce qui est <b>ajouté au modèle</b>. C'est visible dans Tabular Editor ou dans le volet Model explorer, où apparaît un groupe de calcul que vous n'avez jamais créé vous-même.</p>
      <p>Conséquence pratique à connaître : puisqu'un groupe de calcul entre dans le modèle, <code class="inl">DiscourageImplicitMeasures</code> bascule à <b>true</b> — les mesures implicites cessent de fonctionner dans tout le modèle.</p>
      <ul>
        <li><b>data category</b> indique qu'une colonne contient une ville, une URL d'image, un code postal. Sans rapport avec le format.</li>
        <li><b>synonym</b> enrichit le vocabulaire de Q&amp;A.</li>
      </ul>
      <p class="why">❷ Lire les chaînes de format, une par une</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Branche du SWITCH</th><th>Chaîne</th><th>Ce qu'elle produit</th></tr>
        <tr><td># of Customers</td><td class="m">"#"</td><td>Un <b>entier</b> — 1234</td></tr>
        <tr><td>Gross Margin %</td><td class="m">"0.00%"</td><td>Un <b>pourcentage</b> — 12,34 %</td></tr>
        <tr><td><i>par défaut</i></td><td class="m">"#,###"</td><td>Un nombre avec séparateur de milliers</td></tr>
      </table></div>
      <p>La mesure peut donc retourner des <b>pourcentages</b> (<code class="inl">0.00%</code>) ou des valeurs <b>décimales</b> (<code class="inl">0.00</code> dans la partie décimale du format) — d'où <b>percentages or decimals</b>.</p>
      <p>Les trois autres options échouent chacune par exclusion : <i>percentages only</i> et <i>whole numbers only</i> ignorent la moitié des branches, et <i>percentages or whole numbers</i> écarte la précision décimale que <code class="inl">0.00%</code> introduit.</p>
      <p class="note"><b>Le réflexe.</b> Distinguez ce que vous <b>écrivez</b> de ce qui est <b>ajouté</b> au modèle : chaîne de format dynamique sur une mesure ⇒ groupe de calcul masqué. Et sur les affirmations à trous, relisez chaque chaîne de format littéralement — le <code class="inl">%</code> et les décimales sont la réponse.</p>`,
      en:`
      <p class="why">❶ The most counter-intuitive knowledge point in this area</p>
      <p>You see a dynamic format string on screen, and it is tempting to answer <i>dynamic format string</i>. But the statement says: a [ … ] <b>was added to the model</b>. And when you apply a dynamic format string to a measure in Power BI Desktop, <b>Power BI automatically creates a hidden calculation group</b> to carry it.</p>
      <p>The dynamic format string is therefore what you <b>write</b>; the <b>calculation group</b> is what is <b>added to the model</b>. You can see it in Tabular Editor or in the Model explorer pane, where a calculation group appears that you never created yourself.</p>
      <p>A practical consequence worth knowing: because a calculation group enters the model, <code class="inl">DiscourageImplicitMeasures</code> flips to <b>true</b> — implicit measures stop working across the whole model.</p>
      <ul>
        <li><b>data category</b> declares that a column holds a city, an image URL, a postcode. Unrelated to formatting.</li>
        <li><b>synonym</b> enriches the Q&amp;A vocabulary.</li>
      </ul>
      <p class="why">❷ Read the format strings, one by one</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>SWITCH branch</th><th>String</th><th>What it produces</th></tr>
        <tr><td># of Customers</td><td class="m">"#"</td><td>An <b>integer</b> — 1234</td></tr>
        <tr><td>Gross Margin %</td><td class="m">"0.00%"</td><td>A <b>percentage</b> — 12.34%</td></tr>
        <tr><td><i>default</i></td><td class="m">"#,###"</td><td>A number with thousands separators</td></tr>
      </table></div>
      <p>The measure can therefore return <b>percentages</b> (<code class="inl">0.00%</code>) or <b>decimal</b> values (the <code class="inl">0.00</code> decimal part of the format) — hence <b>percentages or decimals</b>.</p>
      <p>The other three options each fail by exclusion: <i>percentages only</i> and <i>whole numbers only</i> ignore half the branches, and <i>percentages or whole numbers</i> discards the decimal precision that <code class="inl">0.00%</code> introduces.</p>
      <p class="note"><b>The reflex.</b> Separate what you <b>write</b> from what is <b>added</b> to the model: a dynamic format string on a measure ⇒ a hidden calculation group. And on fill-in-the-blank statements, re-read every format string literally — the <code class="inl">%</code> and the decimals are the answer.</p>`}
  }]
},

  {
    id:"q401", kind:"fields", type:TY,
    title:{fr:"powerbiclient — QuickVisualize dans un notebook",en:"powerbiclient — QuickVisualize in a notebook"},
    stem:{fr:`<p>Vous prévoyez de créer un notebook Fabric qui utilisera des DataFrames Spark pour générer des visuels Power BI. Vous exécutez le code suivant :</p>
    <pre class="code">from powerbiclient import QuickVisualize, get_dataset_config, Report

PBI_visualize = QuickVisualize(get_dataset_config(df))
PBI_visualize</pre>
    <p class="ask">Pour chacune des affirmations suivantes, indiquez si elle est vraie.</p>`,
          en:`<p>You plan to create a Fabric notebook that will use Spark DataFrames to generate Microsoft Power BI visuals. You run the following code:</p>
    <pre class="code">from powerbiclient import QuickVisualize, get_dataset_config, Report

PBI_visualize = QuickVisualize(get_dataset_config(df))
PBI_visualize</pre>
    <p class="ask">For each of the following statements, select Yes if the statement is true. Otherwise, select No.</p>`},
    fields:[
      {label:{fr:"Le code incorpore un rapport Power BI existant.",en:"The code embeds an existing Power BI report."}, hint:{fr:"embeds an existing report",en:"embeds an existing report"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1},
      {label:{fr:"Le code crée un rapport Power BI.",en:"The code creates a Power BI report."}, hint:{fr:"creates a report",en:"creates a report"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0},
      {label:{fr:"Le code affiche un résumé du DataFrame.",en:"The code displays a summary of the DataFrame."}, hint:{fr:"displays a summary",en:"displays a summary"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0}
    ],
    explain:{fr:`
      <p class="why">La clé : lire la ligne d'import</p>
      <p>La ligne d'import charge <b>trois</b> objets, mais le code n'en utilise que <b>deux</b>. C'est le piège de la question : <code class="inl">Report</code> est importé sans jamais être appelé. Sa seule présence sert à vous faire cocher <i>embeds an existing report</i>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Objet</th><th>Rôle</th><th>Utilisé ici ?</th></tr>
        <tr><td class="m">QuickVisualize</td><td>Génère automatiquement un nouveau rapport à partir de données</td><td>Oui</td></tr>
        <tr><td class="m">get_dataset_config</td><td>Convertit un DataFrame Spark en configuration exploitable</td><td>Oui</td></tr>
        <tr><td class="m">Report</td><td>Intègre un rapport existant (nécessite group_id et report_id)</td><td><b>Non — importé mais jamais instancié</b></td></tr>
      </table></div>
      <p class="why">1 — embeds an existing report : No</p>
      <p>Pour intégrer un rapport existant, il faudrait écrire <code class="inl">report = Report(group_id=..., report_id=...)</code>. Le code n'appelle jamais Report, et surtout <b>il ne fournit aucun identifiant</b>. On ne peut pas incorporer un rapport existant sans savoir lequel. L'entrée est <code class="inl">df</code>, un DataFrame, pas une référence à un artefact Power BI.</p>
      <p class="why">2 — creates a report : Yes</p>
      <p>C'est exactement la fonction de <code class="inl">QuickVisualize</code>. Elle prend les données du DataFrame et produit un <b>rapport autogénéré</b> : Power BI analyse les colonnes et propose des visuels adaptés. La seconde ligne affiche ce rapport dans la sortie de la cellule.</p>
      <p class="why">3 — displays a summary of the DataFrame : Yes</p>
      <p>La documentation Microsoft décrit <code class="inl">QuickVisualize</code> précisément dans ces termes : elle autogénère un rapport <b>pour résumer rapidement les données</b>. Le rapport produit est une synthèse du DataFrame — Power BI parcourt les colonnes, détecte les types et les cardinalités, et propose des visuels agrégés qui donnent une vue d'ensemble.</p>
      <p>Les affirmations 2 et 3 sont donc <b>toutes deux vraies</b>, et ce n'est pas contradictoire : le même appel crée un rapport, et ce rapport affiche une synthèse des données. Deux descriptions du même résultat, à deux niveaux différents.</p>
      <p class="contested"><b>L'erreur à ne pas commettre ici.</b> Il est tentant de lire <i>summary</i> comme un résumé <b>statistique</b>, c'est-à-dire <code class="inl">df.describe()</code>, et de répondre No. C'est plaquer une définition technique restrictive sur un mot du langage courant. Dans les questions Yes/No, les affirmations sont écrites en langage naturel, pas en jargon d'API : <i>summary</i> veut dire vue d'ensemble. Ce qui rendrait l'affirmation fausse serait une formulation du type <i>displays the schema</i> ou <i>displays descriptive statistics</i>.</p>
      <p class="note"><b>Trois réflexes sur les Yes/No portant sur du code.</b> 1) Lisez les imports — les objets importés mais non utilisés sont souvent la base des distracteurs. 2) Vérifiez ce qui est <b>réellement appelé</b>. 3) Vérifiez les arguments : ici l'entrée est <code class="inl">df</code> (des données brutes), pas un <code class="inl">report_id</code> (une référence à un artefact existant). Retenez le couple : <b>QuickVisualize = créer du neuf depuis des données ; Report = afficher de l'existant depuis un identifiant.</b></p>`,
      en:`
      <p class="why">The key: read the import line</p>
      <p>The import line loads <b>three</b> objects, but the code uses only <b>two</b>. That is the question's trap: <code class="inl">Report</code> is imported and never called. Its presence alone exists to make you tick <i>embeds an existing report</i>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Object</th><th>Role</th><th>Used here?</th></tr>
        <tr><td class="m">QuickVisualize</td><td>Auto-generates a new report from data</td><td>Yes</td></tr>
        <tr><td class="m">get_dataset_config</td><td>Converts a Spark DataFrame into a usable configuration</td><td>Yes</td></tr>
        <tr><td class="m">Report</td><td>Embeds an existing report (needs group_id and report_id)</td><td><b>No — imported but never instantiated</b></td></tr>
      </table></div>
      <p class="why">1 — embeds an existing report: No</p>
      <p>To embed an existing report you would write <code class="inl">report = Report(group_id=..., report_id=...)</code>. The code never calls Report, and above all <b>supplies no identifier</b>. You cannot embed an existing report without knowing which one. The input is <code class="inl">df</code>, a DataFrame, not a reference to a Power BI artifact.</p>
      <p class="why">2 — creates a report: Yes</p>
      <p>That is exactly what <code class="inl">QuickVisualize</code> does. It takes the DataFrame's data and produces an <b>auto-generated report</b>: Power BI analyses the columns and proposes suitable visuals. The second line renders that report in the cell output.</p>
      <p class="why">3 — displays a summary of the DataFrame: Yes</p>
      <p>Microsoft's documentation describes <code class="inl">QuickVisualize</code> in precisely these terms: it auto-generates a report <b>to quickly summarize the data</b>. The report produced is a synthesis of the DataFrame — Power BI walks the columns, detects types and cardinalities, and proposes aggregated visuals that give an overview.</p>
      <p>Statements 2 and 3 are therefore <b>both true</b>, and that is not contradictory: the same call creates a report, and that report displays a summary of the data. Two descriptions of the same result, at two different levels.</p>
      <p class="contested"><b>The mistake to avoid here.</b> It is tempting to read <i>summary</i> as a <b>statistical</b> summary, i.e. <code class="inl">df.describe()</code>, and answer No. That imposes a narrow technical definition on an everyday word. In Yes/No questions the statements are written in natural language, not API jargon: <i>summary</i> means overview. What would make the statement false is wording such as <i>displays the schema</i> or <i>displays descriptive statistics</i>.</p>
      <p class="note"><b>Three reflexes for Yes/No questions about code.</b> 1) Read the imports — objects imported but unused are often the basis of the distractors. 2) Check what is <b>actually called</b>. 3) Check the arguments: here the input is <code class="inl">df</code> (raw data), not a <code class="inl">report_id</code> (a reference to an existing artifact). Remember the pair: <b>QuickVisualize = create something new from data; Report = display something existing from an identifier.</b></p>`}
  },
  {
    id:"q402", kind:"single", type:T1,
    title:{fr:"Power Query — profilage des colonnes numériques",en:"Power Query — profiling numeric columns"},
    stem:{fr:`<p>Vous avez un warehouse Fabric. Vous utilisez un dataflow pour charger un nouveau jeu de données depuis OneLake vers le warehouse. Vous devez ajouter une étape Power Query pour identifier <b>les valeurs maximales des colonnes numériques</b>.</p><p class="ask">Quelle fonction devez-vous inclure dans l'étape ?</p>`,
          en:`<p>You have a Fabric tenant that contains a warehouse. You use a dataflow to load a new dataset from OneLake to the warehouse. You need to add a PowerQuery step to identify the <b>maximum values for the numeric columns</b>.</p><p class="ask">Which function should you include in the step?</p>`},
    options:[
      {k:"A", fr:`<code class="inl">Table.MaxN</code>`, en:`<code class="inl">Table.MaxN</code>`},
      {k:"B", fr:`<code class="inl">Table.Max</code>`, en:`<code class="inl">Table.Max</code>`},
      {k:"C", fr:`<code class="inl">Table.Range</code>`, en:`<code class="inl">Table.Range</code>`},
      {k:"D", fr:`<code class="inl">Table.Profile</code>`, en:`<code class="inl">Table.Profile</code>`}
    ],
    answer:["D"],
    explain:{fr:`
      <p>Le mot qui décide est le <b>pluriel</b> : <i>« identify the maximum <b>values</b> for the numeric <b>columns</b> »</i>. On ne cherche pas une valeur maximale, mais le maximum de <b>chaque</b> colonne numérique, en une seule opération.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Fonction</th><th>Ce qu'elle retourne</th><th>Adapté ?</th></tr>
        <tr><td class="m">Table.Max</td><td>Une seule ligne — celle qui a la valeur maximale selon un critère de tri</td><td>Non</td></tr>
        <tr><td class="m">Table.MaxN</td><td>Les N premières lignes selon ce critère</td><td>Non</td></tr>
        <tr><td class="m">Table.Range</td><td>Un sous-ensemble de lignes à partir d'un décalage, comme une tranche</td><td>Non</td></tr>
        <tr><td class="m">Table.Profile</td><td>Une table de statistiques <b>par colonne</b> : Min, Max, Average, StandardDeviation, Count, NullCount, DistinctCount</td><td><b>Oui</b></td></tr>
      </table></div>
      <p class="why">Pourquoi Table.Max ne convient pas</p>
      <p>C'est le distracteur qui piège, parce que son nom colle au mot <i>maximum</i> de l'énoncé. <code class="inl">Table.Max(table, comparisonCriteria)</code> retourne <b>la ligne entière</b> qui maximise un critère. Si vous écrivez <code class="inl">Table.Max(Source, "Amount")</code>, vous récupérez l'enregistrement dont Amount est le plus élevé, avec toutes ses autres colonnes — dont les valeurs n'ont aucune raison d'être maximales. Pour obtenir le max de dix colonnes numériques, il faudrait dix appels distincts.</p>
      <p class="why">Ce que produit Table.Profile</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Column</th><th>Min</th><th>Max</th><th>Average</th><th>NullCount</th><th>DistinctCount</th></tr>
        <tr><td class="m">ProductID</td><td class="m">1</td><td class="m">4892</td><td class="m">2431.5</td><td class="m">0</td><td class="m">4892</td></tr>
        <tr><td class="m">ListPrice</td><td class="m">4.99</td><td class="m">1899.00</td><td class="m">214.30</td><td class="m">12</td><td class="m">340</td></tr>
      </table></div>
      <p>Les statistiques numériques ne sont calculées que pour les colonnes de type numérique — les colonnes texte reçoivent <code class="inl">null</code> sur ces champs. Cela correspond littéralement à <i>for the numeric columns</i>.</p>
      <p class="note"><b>Logique de nommage Power Query, valable pour toute la bibliothèque.</b> Le préfixe <code class="inl">Table.</code> signale une fonction qui opère sur une table entière et renvoie généralement une table ou une ligne ; le préfixe <code class="inl">List.</code> signale une fonction qui opère sur une colonne unique et renvoie un scalaire. Quand on vous demande un agrégat sur une seule colonne, cherchez du côté de <code class="inl">List.Max</code>.</p>`,
      en:`
      <p>The deciding feature is the <b>plural</b>: <i>"identify the maximum <b>values</b> for the numeric <b>columns</b>"</i>. You are not after one maximum value, but the maximum of <b>each</b> numeric column, in a single operation.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Function</th><th>What it returns</th><th>Fit?</th></tr>
        <tr><td class="m">Table.Max</td><td>A single row — the one with the maximum value by a sort criterion</td><td>No</td></tr>
        <tr><td class="m">Table.MaxN</td><td>The top N rows by that criterion</td><td>No</td></tr>
        <tr><td class="m">Table.Range</td><td>A subset of rows from an offset, like a slice</td><td>No</td></tr>
        <tr><td class="m">Table.Profile</td><td>A table of statistics <b>per column</b>: Min, Max, Average, StandardDeviation, Count, NullCount, DistinctCount</td><td><b>Yes</b></td></tr>
      </table></div>
      <p class="why">Why Table.Max does not fit</p>
      <p>It is the distractor that catches people, because its name matches the stem's word <i>maximum</i>. <code class="inl">Table.Max(table, comparisonCriteria)</code> returns <b>the whole row</b> that maximises a criterion. Write <code class="inl">Table.Max(Source, "Amount")</code> and you get the record with the highest Amount, along with all its other columns — whose values have no reason to be maximal. To get the max of ten numeric columns you would need ten separate calls.</p>
      <p class="why">What Table.Profile produces</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Column</th><th>Min</th><th>Max</th><th>Average</th><th>NullCount</th><th>DistinctCount</th></tr>
        <tr><td class="m">ProductID</td><td class="m">1</td><td class="m">4892</td><td class="m">2431.5</td><td class="m">0</td><td class="m">4892</td></tr>
        <tr><td class="m">ListPrice</td><td class="m">4.99</td><td class="m">1899.00</td><td class="m">214.30</td><td class="m">12</td><td class="m">340</td></tr>
      </table></div>
      <p>The numeric statistics are computed only for numeric columns — text columns get <code class="inl">null</code> in those fields. That matches <i>for the numeric columns</i> literally.</p>
      <p class="note"><b>Power Query naming logic, valid across the library.</b> The <code class="inl">Table.</code> prefix signals a function operating on a whole table and generally returning a table or a row; the <code class="inl">List.</code> prefix signals a function operating on a single column and returning a scalar. When asked for an aggregate over one column, look to <code class="inl">List.Max</code>.</p>`}
  },
  {
    id:"q403", kind:"multi", type:TM,
    title:{fr:"PREDICT dans un notebook Fabric",en:"PREDICT in a Fabric notebook"},
    stem:{fr:`<p>Vous avez un modèle de machine learning enregistré dans un espace de travail Fabric. Vous devez l'utiliser pour générer des prédictions avec la fonction <b>PREDICT dans un notebook Fabric</b>.</p><p class="ask">Quels <b>deux</b> langages pouvez-vous utiliser pour le scoring ? Chaque bonne réponse constitue une solution complète.</p>`,
          en:`<p>You have a Fabric tenant that contains a machine learning model registered in a Fabric workspace. You need to use the model to generate predictions by using the <b>PREDICT function in a Fabric notebook</b>.</p><p class="ask">Which <b>two</b> languages can you use to perform model scoring? Each correct answer presents a complete solution.</p>`},
    options:[{k:"A",fr:"T-SQL",en:"T-SQL"},{k:"B",fr:"DAX",en:"DAX"},{k:"C",fr:"Spark SQL",en:"Spark SQL"},{k:"D",fr:"PySpark",en:"PySpark"}],
    answer:["C","D"],
    explain:{fr:`
      <p>La contrainte tient en deux mots : <i>« by using the PREDICT function <b>in a Fabric notebook</b> »</i>. Un notebook Fabric s'exécute sur <b>Spark</b>. Les langages disponibles dans ses cellules sont PySpark, Spark SQL, Scala et SparkR, via les magic commands. Cela seul suffit à trancher.</p>
      <p>PREDICT applique un modèle MLflow enregistré à un DataFrame Spark. Deux points d'entrée, et deux seulement — d'où le <i>two languages</i> de l'énoncé.</p>
      <pre class="code"># API PySpark (Transformer)
from synapse.ml.predict import MLFlowTransformer
model = MLFlowTransformer(inputCols=[...], outputCol="prediction",
                          modelName="mon_modele", modelVersion=1)
predictions = model.transform(df)</pre>
      <pre class="code">-- API Spark SQL
SELECT PREDICT('mon_modele', *) FROM ma_table</pre>
      <p class="why">Pourquoi A et B tombent</p>
      <ul>
        <li><b>A — T-SQL.</b> Une fonction <code class="inl">PREDICT</code> existe bien en T-SQL, mais dans un contexte totalement différent : SQL Server et les pools SQL dédiés d'Azure Synapse, avec des modèles ONNX sérialisés. Or un notebook Fabric n'exécute pas de T-SQL (il n'y a pas de magic <code class="inl">%%tsql</code>), et le SQL analytics endpoint ne prend pas en charge cette fonction. <b>C'est le distracteur intelligent : le nom existe ailleurs, mais pas dans l'environnement décrit.</b></li>
        <li><b>B — DAX.</b> Langage des modèles sémantiques Power BI. Il calcule des mesures sur un modèle tabulaire déjà chargé. Aucun accès au registre MLflow, aucune exécution dans un notebook.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Environnement</th><th>Langages disponibles</th></tr>
        <tr><td class="m">Notebook</td><td>PySpark, Spark SQL, Scala, SparkR</td></tr>
        <tr><td class="m">SQL analytics endpoint / Warehouse</td><td>T-SQL</td></tr>
        <tr><td class="m">Modèle sémantique</td><td>DAX</td></tr>
        <tr><td class="m">Dataflow Gen2</td><td>M (Power Query)</td></tr>
        <tr><td class="m">KQL Database</td><td>KQL</td></tr>
      </table></div>
      <p class="note"><b>Identifiez d'abord le moteur d'exécution.</b> Ces environnements ne se mélangent pas : dès qu'un énoncé nomme explicitement le lieu d'exécution — <i>notebook</i>, <i>warehouse</i>, <i>semantic model</i> — la moitié des options tombe avant même que vous ayez lu ce qu'elles proposent.</p>`,
      en:`
      <p>The constraint sits in two words: <i>"by using the PREDICT function <b>in a Fabric notebook</b>"</i>. A Fabric notebook runs on <b>Spark</b>. The languages available in its cells are PySpark, Spark SQL, Scala and SparkR, via magic commands. That alone settles it.</p>
      <p>PREDICT applies a registered MLflow model to a Spark DataFrame. Two entry points, and only two — hence the stem's <i>two languages</i>.</p>
      <pre class="code"># PySpark API (Transformer)
from synapse.ml.predict import MLFlowTransformer
model = MLFlowTransformer(inputCols=[...], outputCol="prediction",
                          modelName="my_model", modelVersion=1)
predictions = model.transform(df)</pre>
      <pre class="code">-- Spark SQL API
SELECT PREDICT('my_model', *) FROM my_table</pre>
      <p class="why">Why A and B fail</p>
      <ul>
        <li><b>A — T-SQL.</b> A <code class="inl">PREDICT</code> function does exist in T-SQL, but in an entirely different context: SQL Server and Azure Synapse dedicated SQL pools, with serialised ONNX models. A Fabric notebook does not execute T-SQL (there is no <code class="inl">%%tsql</code> magic), and the SQL analytics endpoint does not support that scoring function. <b>This is the clever distractor: the name exists elsewhere, just not in the environment described.</b></li>
        <li><b>B — DAX.</b> The language of Power BI semantic models. It computes measures over an already-loaded tabular model. No access to the MLflow registry, no execution in a notebook.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Environment</th><th>Languages available</th></tr>
        <tr><td class="m">Notebook</td><td>PySpark, Spark SQL, Scala, SparkR</td></tr>
        <tr><td class="m">SQL analytics endpoint / Warehouse</td><td>T-SQL</td></tr>
        <tr><td class="m">Semantic model</td><td>DAX</td></tr>
        <tr><td class="m">Dataflow Gen2</td><td>M (Power Query)</td></tr>
        <tr><td class="m">KQL Database</td><td>KQL</td></tr>
      </table></div>
      <p class="note"><b>Identify the execution engine first.</b> These environments do not mix: as soon as a stem names the place of execution explicitly — <i>notebook</i>, <i>warehouse</i>, <i>semantic model</i> — half the options fall before you have even read what they propose.</p>`}
  },
  {
    id:"q404", kind:"single", type:T1,
    title:{fr:"Afficher un DataFrame en Chart view",en:"Showing a DataFrame in Chart view"},
    stem:{fr:`<p>Vous analysez des données dans un notebook Fabric. Vous disposez d'un DataFrame Spark affecté à une variable <code class="inl">df</code>. Vous devez utiliser la <b>Chart view</b> du notebook pour explorer les données <b>manuellement</b>.</p><p class="ask">Quelle fonction devez-vous exécuter pour rendre les données disponibles dans la Chart view ?</p>`,
          en:`<p>You are analyzing the data in a Fabric notebook. You have a Spark DataFrame assigned to a variable named <code class="inl">df</code>. You need to use the <b>Chart view</b> in the notebook to explore the data <b>manually</b>.</p><p class="ask">Which function should you run to make the data available in the Chart view?</p>`},
    options:[
      {k:"A", fr:`<code class="inl">displayHTML</code>`, en:`<code class="inl">displayHTML</code>`},
      {k:"B", fr:`<code class="inl">show</code>`, en:`<code class="inl">show</code>`},
      {k:"C", fr:`<code class="inl">write</code>`, en:`<code class="inl">write</code>`},
      {k:"D", fr:`<code class="inl">display</code>`, en:`<code class="inl">display</code>`}
    ],
    answer:["D"],
    explain:{fr:`
      <p>La Chart view est une fonctionnalité de la <b>sortie riche</b> des notebooks Fabric. Elle n'apparaît que si le DataFrame est rendu par <code class="inl">display()</code>, qui produit un widget interactif — pas du texte brut.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Fonction</th><th>Sortie produite</th><th>Chart view ?</th></tr>
        <tr><td class="m">display(df)</td><td>Table interactive riche, avec bascule Table / Chart, tri, filtres, profilage</td><td><b>Oui</b></td></tr>
        <tr><td class="m">df.show()</td><td>Table en texte brut dans la console, alignée avec des <code class="inl">+---+</code></td><td>Non</td></tr>
        <tr><td class="m">displayHTML(...)</td><td>Rend une chaîne HTML que vous fournissez. N'accepte pas un DataFrame</td><td>Non</td></tr>
        <tr><td class="m">df.write</td><td>Point d'entrée du DataFrameWriter. Ne renvoie rien à l'écran</td><td>Non</td></tr>
      </table></div>
      <p class="why">Pourquoi <code class="inl">show</code> est le distracteur principal</p>
      <p><code class="inl">df.show()</code> est le réflexe de tout développeur Spark, et il affiche bien les données. Mais sa sortie est une <b>chaîne de caractères formatée</b> :</p>
      <pre class="code">+---------+-----------+---------+
|ProductID|ProductName|ListPrice|
+---------+-----------+---------+</pre>
      <p>Aucun composant interactif, donc aucune bascule vers un graphique. <code class="inl">display()</code> en revanche renvoie un rendu HTML interactif : choix du type de visuel, des axes, de l'agrégation, le tout à la souris — ce qui correspond exactement au <b>manually</b> de l'énoncé.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>L'énoncé demande</th><th>La fonction</th></tr>
        <tr><td>Explorer visuellement, Chart view, profilage, interactif</td><td class="m">display(df)</td></tr>
        <tr><td>Vérifier rapidement le contenu, sortie texte, débogage</td><td class="m">df.show()</td></tr>
        <tr><td>Afficher du HTML personnalisé</td><td class="m">displayHTML(html_string)</td></tr>
        <tr><td>Enregistrer vers un lakehouse ou un fichier</td><td class="m">df.write</td></tr>
      </table></div>
      <p class="note"><b>Règle courte.</b> Dès que l'énoncé parle d'interactivité, d'exploration ou de visuels, c'est <code class="inl">display()</code> ; s'il s'agit d'un simple aperçu textuel, c'est <code class="inl">show()</code>. À ne pas confondre avec QuickVisualize : <code class="inl">display()</code> ouvre une exploration à la volée dans la cellule, QuickVisualize génère un vrai rapport Power BI enregistrable dans un workspace.</p>`,
      en:`
      <p>Chart view is a feature of the <b>rich output</b> in Fabric notebooks. It appears only when the DataFrame is rendered by <code class="inl">display()</code>, which produces an interactive widget — not plain text.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Function</th><th>Output produced</th><th>Chart view?</th></tr>
        <tr><td class="m">display(df)</td><td>Rich interactive table, with Table / Chart toggle, sorting, filters, profiling</td><td><b>Yes</b></td></tr>
        <tr><td class="m">df.show()</td><td>Plain-text table in the console, aligned with <code class="inl">+---+</code></td><td>No</td></tr>
        <tr><td class="m">displayHTML(...)</td><td>Renders an HTML string you supply. Does not accept a DataFrame</td><td>No</td></tr>
        <tr><td class="m">df.write</td><td>Entry point to the DataFrameWriter. Returns nothing to the screen</td><td>No</td></tr>
      </table></div>
      <p class="why">Why <code class="inl">show</code> is the main distractor</p>
      <p><code class="inl">df.show()</code> is every Spark developer's reflex, and it does display the data. But its output is a <b>formatted string</b>:</p>
      <pre class="code">+---------+-----------+---------+
|ProductID|ProductName|ListPrice|
+---------+-----------+---------+</pre>
      <p>No interactive component, therefore no switch to a chart. <code class="inl">display()</code>, by contrast, returns an interactive HTML rendering: choice of visual type, axes and aggregation, all by mouse — matching the stem's <b>manually</b> precisely.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>If the stem asks for</th><th>The function</th></tr>
        <tr><td>Visual exploration, Chart view, profiling, interactivity</td><td class="m">display(df)</td></tr>
        <tr><td>A quick content check, text output, debugging</td><td class="m">df.show()</td></tr>
        <tr><td>Displaying custom HTML</td><td class="m">displayHTML(html_string)</td></tr>
        <tr><td>Saving to a lakehouse or a file</td><td class="m">df.write</td></tr>
      </table></div>
      <p class="note"><b>Short rule.</b> Whenever the stem speaks of interactivity, exploration or visuals, it is <code class="inl">display()</code>; for a plain textual preview, it is <code class="inl">show()</code>. Not to be confused with QuickVisualize: <code class="inl">display()</code> opens an ad-hoc exploration inside the cell, QuickVisualize generates a real Power BI report you can save to a workspace.</p>`}
  },
  {
    id:"q405", kind:"single", contested:true, type:T1,
    title:{fr:"Lignes dupliquées dans un visuel Python",en:"Duplicate rows in a Python visual"},
    stem:{fr:`<p>Vous avez un rapport Power BI nommé <b>Report1</b> incluant un <b>visuel Python</b>. Les données affichées par le visuel sont regroupées automatiquement et <b>les lignes en double ne sont pas affichées</b>. Vous avez besoin que <b>toutes les lignes</b> apparaissent.</p><p class="ask">Que devez-vous faire ?</p>`,
          en:`<p>You have a Fabric tenant that contains a Power BI report named <b>Report1</b>. Report1 includes a <b>Python visual</b>. Data displayed by the visual is grouped automatically and <b>duplicate rows are NOT displayed</b>. You need <b>all rows</b> to appear in the visual.</p><p class="ask">What should you do?</p>`},
    options:[
      {k:"A", fr:"Référencer les colonnes dans le code Python par index.", en:"Reference the columns in the Python code by index."},
      {k:"B", fr:"Modifier la propriété <i>Sort Column By</i> pour toutes les colonnes.", en:"Modify the <i>Sort Column By</i> property for all columns."},
      {k:"C", fr:"Ajouter un champ unique à chaque ligne.", en:"Add a unique field to each row."},
      {k:"D", fr:"Modifier la propriété <i>Summarize By</i> pour toutes les colonnes.", en:"Modify the <i>Summarize By</i> property for all columns."}
    ],
    answer:["D"],
    explain:{fr:`
      <p class="why">Le comportement à comprendre</p>
      <p>Quand vous construisez un visuel Python (ou R) dans Power BI, le moteur <b>ne transmet pas les lignes brutes au script</b>. Il applique d'abord un regroupement automatique : les lignes strictement identiques sur toutes les colonnes sélectionnées sont fusionnées en une seule. Ce n'est pas un bug, c'est le comportement documenté.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Ce que contient la table</th><th>Ce que reçoit le script Python</th></tr>
        <tr><td>Produit A — 25 €<br>Produit A — 25 €<br>Produit B — 40 €</td><td>Produit A — 25 €<br><i>(fusionnée)</i><br>Produit B — 40 €</td></tr>
      </table></div>
      <p class="why">Le raisonnement du corrigé</p>
      <p><i>Summarize By = None</i> (ou <i>Don't summarize</i>) désactive l'agrégation automatique des colonnes numériques. Si Power BI additionnait vos montants, il cesse de le faire, et chaque colonne est traitée comme un <b>attribut de regroupement</b> plutôt que comme une mesure.</p>
      <p class="why">Pourquoi A et B tombent sans discussion</p>
      <ul>
        <li><b>A — référencer les colonnes par index.</b> Cela ne change que la manière dont votre script accède aux données. Le regroupement a déjà eu lieu <b>en amont</b>, avant que le DataFrame n'atteigne votre code. Vous ne pouvez pas récupérer des lignes qui ne vous ont jamais été envoyées.</li>
        <li><b>B — Sort Column By.</b> Cette propriété définit l'ordre d'affichage d'une colonne. Aucun effet sur le nombre de lignes transmises.</li>
      </ul>
      <p class="contested"><b>Question contestée — connaissez les deux raisonnements.</b> Le regroupement des visuels Python n'est pas une agrégation de <i>mesures</i>, c'est une <b>déduplication de lignes</b> : Power BI envoie au script l'équivalent d'un <code class="inl">SELECT DISTINCT</code> sur les champs du visuel. Passer une colonne en <i>Don't summarize</i> la fait entrer dans les colonnes de regroupement, mais deux lignes strictement identiques restent identiques et fusionnent quand même. La documentation Microsoft sur les visuels Python et R indique que les lignes dupliquées sont supprimées et <b>recommande d'ajouter un champ index ou unique (option C)</b> — c'est la contre-mesure documentée.<br><br><b>Comment trancher le jour J :</b> si l'énoncé insiste sur <i>duplicate rows are NOT displayed</i>, le vocabulaire pointe vers les <b>lignes</b> → champ unique (C). S'il parle de valeurs additionnées ou de totaux inattendus, c'est <i>Summarize By</i> (D).</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Réponse</th><th>Mécanisme visé</th><th>Quand elle marche</th></tr>
        <tr><td class="m">C — champ unique</td><td>Casse la déduplication de lignes</td><td><b>Toujours</b></td></tr>
        <tr><td class="m">D — Summarize By = None</td><td>Désactive l'agrégation de colonnes</td><td>Si le problème vient d'un SUM implicite</td></tr>
      </table></div>
      <p class="note"><b>Gardez en tête l'ordre des opérations :</b> Power BI prépare les données, <i>puis</i> le script s'exécute. Aucune modification du code Python ne peut compenser une perte de données survenue avant son exécution. Quand le problème est en amont, cherchez la solution en amont — c'est ce qui élimine l'option A immédiatement.</p>`,
      en:`
      <p class="why">The behaviour to understand</p>
      <p>When you build a Python (or R) visual in Power BI, the engine <b>does not pass raw rows to the script</b>. It first applies automatic grouping: rows identical across every selected column are merged into one. This is not a bug, it is documented behaviour.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>What the table contains</th><th>What the Python script receives</th></tr>
        <tr><td>Product A — €25<br>Product A — €25<br>Product B — €40</td><td>Product A — €25<br><i>(merged)</i><br>Product B — €40</td></tr>
      </table></div>
      <p class="why">The answer key's reasoning</p>
      <p><i>Summarize By = None</i> (or <i>Don't summarize</i>) disables automatic aggregation of numeric columns. If Power BI was summing your amounts, it stops, and each column is treated as a <b>grouping attribute</b> rather than a measure.</p>
      <p class="why">Why A and B fail without argument</p>
      <ul>
        <li><b>A — referencing columns by index.</b> That only changes how your script reaches the data. The grouping has already happened <b>upstream</b>, before the DataFrame reaches your code. You cannot recover rows that were never sent to you.</li>
        <li><b>B — Sort Column By.</b> That property defines a column's display order. No effect on the number of rows passed through.</li>
      </ul>
      <p class="contested"><b>Disputed question — know both lines of reasoning.</b> The grouping in Python visuals is not an aggregation of <i>measures</i>, it is a <b>row deduplication</b>: Power BI sends the script the equivalent of a <code class="inl">SELECT DISTINCT</code> over the visual's fields. Setting a column to <i>Don't summarize</i> moves it into the grouping columns, but two strictly identical rows remain identical and merge anyway. Microsoft's documentation on Python and R visuals states that duplicate rows are removed and <b>recommends adding an index or unique field (option C)</b> — that is the documented countermeasure.<br><br><b>How to decide on the day:</b> if the stem insists on <i>duplicate rows are NOT displayed</i>, the vocabulary points at <b>rows</b> → unique field (C). If it speaks of summed values or unexpected totals, it is <i>Summarize By</i> (D).</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Answer</th><th>Mechanism targeted</th><th>When it works</th></tr>
        <tr><td class="m">C — unique field</td><td>Breaks row deduplication</td><td><b>Always</b></td></tr>
        <tr><td class="m">D — Summarize By = None</td><td>Disables column aggregation</td><td>If the problem comes from an implicit SUM</td></tr>
      </table></div>
      <p class="note"><b>Keep the order of operations in mind:</b> Power BI prepares the data, <i>then</i> the script runs. No change to the Python code can make up for data lost before it executes. When the problem is upstream, look for the fix upstream — that is what eliminates option A at once.</p>`}
  },
  {
    id:"q406", kind:"single", type:T1,
    title:{fr:"Lire le profil d'une colonne dans Power Query",en:"Reading a column profile in Power Query"},
    stem:{fr:`<p>Vous avez un dataflow dont une requête <b>retourne 2 000 lignes</b>. Vous visualisez la requête dans Power Query. Le profil de la colonne <code class="inl">pickupLongitude</code> affiche :</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Count</th><th>Error count</th><th>Null count</th><th>Distinct count</th><th>Unique count</th><th>NaN count</th></tr>
      <tr><td class="m">1000</td><td class="m">0</td><td class="m">0</td><td class="m">935</td><td class="m">871</td><td class="m">0</td></tr>
    </table></div>
    <p class="ask">Que pouvez-vous identifier à propos de la colonne pickupLongitude ?</p>`,
          en:`<p>You have a workspace named Workspace1 that contains a dataflow named Dataflow1. Dataflow1 has a query that <b>returns 2,000 rows</b>. You view the query in Power Query. The column profile for <code class="inl">pickupLongitude</code> shows:</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Count</th><th>Error count</th><th>Null count</th><th>Distinct count</th><th>Unique count</th><th>NaN count</th></tr>
      <tr><td class="m">1000</td><td class="m">0</td><td class="m">0</td><td class="m">935</td><td class="m">871</td><td class="m">0</td></tr>
    </table></div>
    <p class="ask">What can you identify about the pickupLongitude column?</p>`},
    options:[
      {k:"A", fr:"La colonne contient des valeurs en double.", en:"The column has duplicate values."},
      {k:"B", fr:"Toutes les lignes de la table sont profilées.", en:"All the table rows are profiled."},
      {k:"C", fr:"La colonne contient des valeurs manquantes.", en:"The column has missing values."},
      {k:"D", fr:"Il y a 935 valeurs qui n'apparaissent qu'une seule fois.", en:"There are 935 values that occur only once."}
    ],
    answer:["A"],
    explain:{fr:`
      <p><b>1 000 valeurs analysées mais seulement 935 valeurs différentes</b> → 65 valeurs sont des répétitions. Il y a donc bien des doublons.</p>
      <p class="why">La distinction qui fait la question : <i>distinct</i> n'est pas <i>unique</i></p>
      <ul>
        <li><b>Distinct</b> = combien de valeurs <b>différentes</b> existent, chaque valeur comptée une fois quel que soit son nombre d'occurrences.</li>
        <li><b>Unique</b> = combien de valeurs n'apparaissent <b>qu'une seule fois</b>.</li>
      </ul>
      <p>Sur un mini-exemple <code class="inl">[A, A, B, C]</code> : Count = 4, Distinct = 3 (A, B, C), Unique = 2 (B et C seulement — A est répété).</p>
      <p>Appliqué au profil : <b>935 − 871 = 64 valeurs distinctes apparaissent plus d'une fois.</b></p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>B — All the table rows are profiled.</b> Le piège le plus intéressant. La requête retourne <b>2 000 lignes</b>, mais Count affiche <b>1 000</b>. Par défaut, Power Query profile uniquement les 1 000 premières lignes pour rester réactif. Un sélecteur en bas de la fenêtre permet de basculer sur <i>Column profiling based on entire data set</i> — ici il ne l'est pas.</li>
        <li><b>C — missing values.</b> <code class="inl">Null count = 0</code>. Aucune valeur manquante. Contredit directement par le profil.</li>
        <li><b>D — 935 valeurs n'apparaissant qu'une fois.</b> Le distracteur central : il attribue à <i>Distinct count</i> la définition d'<i>Unique count</i>. Le bon chiffre serait <b>871</b>. Si l'option avait dit 871, elle aurait été vraie.</li>
      </ul>
      <p class="note"><b>Trois vérifications sur un panneau de profilage.</b> 1) Comparez <i>Count</i> au nombre de lignes annoncé → s'ils diffèrent, le profilage est limité à 1 000 lignes. 2) Comparez <i>Count</i> et <i>Distinct</i> → s'ils diffèrent, il y a des doublons. 3) Vérifiez <i>Null count</i> → c'est la seule statistique qui parle de valeurs manquantes. Formule à retenir : <b>Distinct − Unique = nombre de valeurs qui se répètent.</b></p>`,
      en:`
      <p><b>1,000 values analysed but only 935 different values</b> → 65 values are repeats. So there are indeed duplicates.</p>
      <p class="why">The distinction that makes the question: <i>distinct</i> is not <i>unique</i></p>
      <ul>
        <li><b>Distinct</b> = how many <b>different</b> values exist, each counted once regardless of how often it occurs.</li>
        <li><b>Unique</b> = how many values occur <b>exactly once</b>.</li>
      </ul>
      <p>On the mini-example <code class="inl">[A, A, B, C]</code>: Count = 4, Distinct = 3 (A, B, C), Unique = 2 (B and C only — A is repeated).</p>
      <p>Applied to the profile: <b>935 − 871 = 64 distinct values occur more than once.</b></p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>B — All the table rows are profiled.</b> The most interesting trap. The query returns <b>2,000 rows</b>, but Count shows <b>1,000</b>. By default, Power Query profiles only the first 1,000 rows to stay responsive. A selector at the bottom of the window switches to <i>Column profiling based on entire data set</i> — here it is not set.</li>
        <li><b>C — missing values.</b> <code class="inl">Null count = 0</code>. No missing values. Directly contradicted by the profile.</li>
        <li><b>D — 935 values occurring only once.</b> The central distractor: it assigns <i>Unique count</i>'s definition to <i>Distinct count</i>. The right figure would be <b>871</b>. Had the option said 871, it would have been true.</li>
      </ul>
      <p class="note"><b>Three checks on a profiling pane.</b> 1) Compare <i>Count</i> with the stated row count → if they differ, profiling is limited to 1,000 rows. 2) Compare <i>Count</i> and <i>Distinct</i> → if they differ, there are duplicates. 3) Check <i>Null count</i> → it is the only statistic about missing values. Formula to remember: <b>Distinct − Unique = the number of repeating values.</b></p>`}
  },
  {
    id:"q407", kind:"multi", type:TM,
    title:{fr:"Data view — identifier min et max par colonne",en:"Data view — identifying min and max per column"},
    stem:{fr:`<p>Vous avez un dataflow <b>Dataflow1</b> qui retourne <b>500 lignes</b> de données. Vous devez identifier les valeurs <b>min et max pour chaque colonne</b> des résultats de la requête.</p><p class="ask">Quelles <b>trois</b> options de la vue Data devez-vous sélectionner ? Chaque bonne réponse constitue <b>une partie</b> de la solution.</p>`,
          en:`<p>You have a workspace named Workspace1 that contains a dataflow named <b>Dataflow1</b>. Dataflow1 returns <b>500 rows</b> of data. You need to identify the <b>min and max values for each column</b> in the query results.</p><p class="ask">Which <b>three</b> Data view options should you select? Each correct answer presents <b>part of</b> the solution.</p>`},
    options:[
      {k:"A", fr:"Show column value distribution", en:"Show column value distribution"},
      {k:"B", fr:"Enable column profile", en:"Enable column profile"},
      {k:"C", fr:"Show column profile in details pane", en:"Show column profile in details pane"},
      {k:"D", fr:"Show column quality details", en:"Show column quality details"},
      {k:"E", fr:"Enable details pane", en:"Enable details pane"}
    ],
    answer:["B","C","E"],
    explain:{fr:`
      <p class="why">Une chaîne de dépendances, pas trois solutions parallèles</p>
      <pre class="code">E. Enable details pane      → ouvrir le volet
        ↓
B. Enable column profile    → calculer les statistiques
        ↓
C. Show column profile      → les afficher dans le volet</pre>
      <p>Sans le volet, rien ne s'affiche. Sans le profilage, il n'y a rien à afficher. Sans la troisième option, le profil est calculé mais reste invisible. C'est ce qui justifie le <i>Each correct answer presents <b>part of</b> the solution</i> — contrairement à <i>complete solution</i>, chaque élément est <b>nécessaire mais insuffisant seul</b>.</p>
      <p class="why">Où se trouvent min et max</p>
      <p>Le <i>column profile</i> est la seule option qui produit des statistiques numériques. Il affiche dans le volet de détails : Count, Error / Empty, Distinct / Unique, <b>Min / Max</b>, Average et Standard deviation.</p>
      <p class="why">Pourquoi A et D tombent</p>
      <ul>
        <li><b>A — Show column value distribution.</b> Affiche un histogramme sous l'en-tête de chaque colonne : la répartition visuelle des valeurs. Un aperçu graphique, <b>sans valeurs chiffrées</b> de min et max.</li>
        <li><b>D — Show column quality details.</b> Affiche les trois barres Valid / Error / Empty avec leurs pourcentages. C'est du contrôle qualité, pas de la statistique descriptive.</li>
      </ul>
      <p>Les deux sont des options d'affichage <b>dans l'en-tête de colonne</b>, pas dans le volet de détails.</p>
      <p class="note"><b>Le détail qui n'est pas piégeux ici.</b> L'énoncé précise <b>500 lignes</b>, en dessous du seuil de 1 000 du profilage par défaut : les statistiques porteront sur la totalité des données. Dans la question précédente c'était l'inverse — 2 000 lignes et un Count à 1 000, ce qui révélait un échantillonnage. Ici le chiffre est là pour vous rassurer, pas pour vous piéger.<br><br>Réflexe général : <b>quand des options forment une chaîne d'activation, la question demande souvent toute la chaîne.</b> Si vous voyez <i>Enable X</i> et <i>Show X</i>, les deux sont probablement nécessaires — activer ne suffit pas à afficher.</p>`,
      en:`
      <p class="why">A dependency chain, not three parallel solutions</p>
      <pre class="code">E. Enable details pane      → open the pane
        ↓
B. Enable column profile    → compute the statistics
        ↓
C. Show column profile      → display them in the pane</pre>
      <p>Without the pane, nothing shows. Without profiling, there is nothing to show. Without the third option, the profile is computed but stays invisible. That is what justifies <i>Each correct answer presents <b>part of</b> the solution</i> — unlike <i>complete solution</i>, each element is <b>necessary but not sufficient alone</b>.</p>
      <p class="why">Where min and max live</p>
      <p>The <i>column profile</i> is the only option that produces numeric statistics. In the details pane it shows: Count, Error / Empty, Distinct / Unique, <b>Min / Max</b>, Average and Standard deviation.</p>
      <p class="why">Why A and D fail</p>
      <ul>
        <li><b>A — Show column value distribution.</b> Displays a histogram under each column header: the visual spread of values. A graphical overview, <b>with no numeric figures</b> for min and max.</li>
        <li><b>D — Show column quality details.</b> Displays the three Valid / Error / Empty bars with percentages. That is quality control, not descriptive statistics.</li>
      </ul>
      <p>Both are display options <b>in the column header</b>, not in the details pane.</p>
      <p class="note"><b>The detail that is not a trap here.</b> The stem specifies <b>500 rows</b>, below the default 1,000-row profiling threshold: the statistics will cover the whole dataset. In the previous question it was the reverse — 2,000 rows and a Count of 1,000, which revealed sampling. Here the figure is there to reassure you, not to trip you up.<br><br>General reflex: <b>when options form an activation chain, the question often wants the whole chain.</b> If you see <i>Enable X</i> and <i>Show X</i>, both are probably needed — enabling is not the same as displaying.</p>`}
  },
  {
    id:"q408", kind:"fields", type:TY,
    title:{fr:"Lire un pipeline KQL",en:"Reading a KQL pipeline"},
    stem:{fr:`<pre class="code">Sales
| where Status != "Cancelled"
| where OrderDate &gt;= ago(30d)
| summarize TotalSales = sum(SalesAmount) by ProductCategory
| where TotalSales &gt; 0</pre>
    <p class="ask">Pour chacune des affirmations suivantes, indiquez si elle est vraie.</p>`,
          en:`<pre class="code">Sales
| where Status != "Cancelled"
| where OrderDate &gt;= ago(30d)
| summarize TotalSales = sum(SalesAmount) by ProductCategory
| where TotalSales &gt; 0</pre>
    <p class="ask">For each statement, select Yes if it is true. Otherwise, select No.</p>`},
    fields:[
      {label:{fr:"La requête exclut les ventes dont le Status est Cancelled.",en:"The query excludes sales whose Status is Cancelled."}, hint:{fr:"l'opérateur !=",en:"the != operator"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0},
      {label:{fr:"La requête calcule le total des ventes de chaque catégorie de produit pour les 30 derniers jours.",en:"The query calculates the total sales of each product category for the last 30 days."}, hint:{fr:"summarize … by + ago(30d)",en:"summarize … by + ago(30d)"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0},
      {label:{fr:"La requête inclut les catégories de produit n'ayant eu aucune vente durant les 30 derniers jours.",en:"The query includes product categories that had no sales during the last 30 days."}, hint:{fr:"que produit summarize ?",en:"what does summarize produce?"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1}
    ],
    explain:{fr:`
      <p class="why">1 — Exclusion des commandes annulées → <b>Yes</b></p>
      <p><code class="inl">!=</code> est l'opérateur d'inégalité en KQL ; la première clause <code class="inl">where</code> ne conserve que les lignes dont le statut diffère de « Cancelled ».</p>
      <p><b>Nuance technique :</b> <code class="inl">!=</code> est <b>sensible à la casse</b> en KQL — une valeur « cancelled » en minuscules passerait le filtre ; la version insensible serait <code class="inl">!~</code>. L'affirmation reste vraie telle qu'écrite.</p>
      <p class="why">2 — Total par catégorie sur 30 jours → <b>Yes</b></p>
      <p>Le pipeline combine exactement ces deux éléments : <code class="inl">summarize … by ProductCategory</code> pour la somme groupée, et <code class="inl">where OrderDate &gt;= ago(30d)</code> pour la fenêtre temporelle. <code class="inl">ago(30d)</code> retourne l'horodatage d'il y a 30 jours, et le filtre s'applique <b>avant</b> l'agrégation.</p>
      <p class="why">3 — Catégories à zéro vente incluses → <b>No</b></p>
      <p>Deux mécanismes distincts les éliminent :</p>
      <ul>
        <li><b>D'abord</b>, <code class="inl">summarize</code> ne produit une ligne que pour les <b>groupes existant dans les données filtrées</b> : une catégorie sans aucune vente dans la fenêtre n'apparaît tout simplement pas — il n'y a rien à regrouper.</li>
        <li><b>Ensuite</b>, <code class="inl">where TotalSales &gt; 0</code> agit comme un <b>second filet</b> : appliqué <i>après</i> l'agrégation (l'ordre dans le pipeline compte), il écarte explicitement tout total nul ou négatif.</li>
      </ul>
      <p>Pour faire apparaître les catégories à zéro, il faudrait une <b>jointure externe</b> avec une liste de référence des catégories.</p>
      <p class="note"><b>Le réflexe.</b> L'<b>ordre du pipeline KQL détermine tout</b> : un <code class="inl">where</code> <b>avant</b> <code class="inl">summarize</code> filtre les lignes sources, un <code class="inl">where</code> <b>après</b> filtre les résultats agrégés.</p>`,
      en:`
      <p class="why">1 — Cancelled orders excluded → <b>Yes</b></p>
      <p><code class="inl">!=</code> is KQL's inequality operator; the first <code class="inl">where</code> clause keeps only rows whose status differs from "Cancelled".</p>
      <p><b>Technical nuance:</b> <code class="inl">!=</code> is <b>case-sensitive</b> in KQL — a lowercase "cancelled" value would pass the filter; the case-insensitive version is <code class="inl">!~</code>. The statement remains true as written.</p>
      <p class="why">2 — Total per category over 30 days → <b>Yes</b></p>
      <p>The pipeline combines exactly those two elements: <code class="inl">summarize … by ProductCategory</code> for the grouped sum, and <code class="inl">where OrderDate &gt;= ago(30d)</code> for the time window. <code class="inl">ago(30d)</code> returns the timestamp 30 days ago, and the filter applies <b>before</b> the aggregation.</p>
      <p class="why">3 — Zero-sales categories included → <b>No</b></p>
      <p>Two distinct mechanisms eliminate them:</p>
      <ul>
        <li><b>First</b>, <code class="inl">summarize</code> produces a row only for <b>groups present in the filtered data</b>: a category with no sales in the window simply does not appear — there is nothing to group.</li>
        <li><b>Second</b>, <code class="inl">where TotalSales &gt; 0</code> acts as a <b>safety net</b>: applied <i>after</i> the aggregation (pipeline order matters), it explicitly discards any zero or negative total.</li>
      </ul>
      <p>To surface zero categories you would need an <b>outer join</b> against a reference list of categories.</p>
      <p class="note"><b>The reflex.</b> <b>KQL pipeline order determines everything</b>: a <code class="inl">where</code> <b>before</b> <code class="inl">summarize</code> filters source rows, a <code class="inl">where</code> <b>after</b> filters aggregated results.</p>`}
  },
  {
    id:"q409", kind:"single", type:T1,
    title:{fr:"Calcul de percentile sur un eventstream",en:"Percentile calculation on an eventstream"},
    stem:{fr:`<p>Vous avez un espace de travail Fabric nommé <b>Workspace1</b> contenant un eventstream nommé <b>Eventstream1</b>. Eventstream1 lit les données depuis un Azure event hub nommé <b>Eventhub1</b>, qui contient les colonnes <code class="inl">MachineId</code> (Int), <code class="inl">Payload</code> (Dynamic), <code class="inl">Datetime</code> (Datetime) et <code class="inl">Location</code> (String). Vous devez ajouter un <b>calcul de percentile continu</b> sur la colonne Payload. La solution doit <b>minimiser l'effort de développement</b>.</p><p class="ask">Que devez-vous faire ?</p>`,
          en:`<p>You have a Fabric workspace named <b>Workspace1</b> that contains an eventstream named <b>Eventstream1</b>. Eventstream1 reads data from an Azure event hub named <b>Eventhub1</b>, which contains the columns <code class="inl">MachineId</code> (Int), <code class="inl">Payload</code> (Dynamic), <code class="inl">Datetime</code> (Datetime) and <code class="inl">Location</code> (String). You need to add a <b>continuous percentile calculation</b> on the Payload column. The solution must <b>minimize development effort</b>.</p><p class="ask">What should you do?</p>`},
    options:[
      {k:"A", fr:"Ajouter un KQL queryset à Workspace1.", en:"Add a KQL queryset to Workspace1."},
      {k:"B", fr:"Ajouter une transformation Group by à Eventstream1.", en:"Add a Group by transformation to Eventstream1."},
      {k:"C", fr:"Ajouter une transformation Manage fields à Eventstream1.", en:"Add a Manage fields transformation to Eventstream1."},
      {k:"D", fr:"Ajouter une transformation Aggregate à Eventstream1.", en:"Add an Aggregate transformation to Eventstream1."}
    ],
    answer:["A"],
    explain:{fr:`
      <p>Les transformations disponibles dans un eventstream Fabric sont <b>limitées</b> : Filter, Manage fields, Aggregate, Group by, Union, Expand, Join. <b>Aucune ne calcule de percentile</b> — l'agrégation intégrée se restreint à <code class="inl">SUM</code>, <code class="inl">AVG</code>, <code class="inl">MIN</code>, <code class="inl">MAX</code> et <code class="inl">COUNT</code>.</p>
      <p>Le <b>KQL queryset</b> est la solution adaptée. Une fois les données de l'eventstream routées vers une base KQL, une requête calcule le percentile en une ligne :</p>
      <pre class="code">Eventhub1
| summarize percentile(todouble(Payload.value), 95)
    by bin(Datetime, 1m), MachineId</pre>
      <p class="why">Trois avantages décisifs de KQL ici</p>
      <ul>
        <li>Les fonctions <code class="inl">percentile()</code>, <code class="inl">percentiles()</code> et <code class="inl">percentile_array()</code> sont <b>natives</b>.</li>
        <li>L'accès aux colonnes de type <code class="inl">dynamic</code> se fait par <b>notation pointée</b> (<code class="inl">Payload.metric</code>), sans parsing manuel.</li>
        <li>Les <b>fenêtres temporelles</b> (<code class="inl">bin()</code>) permettent un calcul réellement <b>continu</b> sur le flux.</li>
      </ul>
      <p class="why">D — le distracteur le plus crédible, et le cœur de la question</p>
      <p><b>Aggregate</b> agrège bien, mais son <b>catalogue de fonctions</b> se limite à SUM / AVG / MIN / MAX / COUNT. Le piège consiste à s'arrêter au verbe « agréger » sans vérifier <b>quelles</b> fonctions sont réellement disponibles.</p>
      <ul>
        <li><b>B — Group by</b> regroupe les événements sur une fenêtre temporelle avec des agrégats simples, sans percentile.</li>
        <li><b>C — Manage fields</b> sélectionne, renomme, retype ou supprime des colonnes : <b>aucune capacité de calcul statistique</b>.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> Transformations eventstream = <b>filtrage, remodelage, agrégats basiques</b>. Calcul statistique avancé = <b>KQL queryset</b> sur une base Eventhouse.</p>`,
      en:`
      <p>The transformations available in a Fabric eventstream are <b>limited</b>: Filter, Manage fields, Aggregate, Group by, Union, Expand, Join. <b>None computes a percentile</b> — the built-in aggregation is restricted to <code class="inl">SUM</code>, <code class="inl">AVG</code>, <code class="inl">MIN</code>, <code class="inl">MAX</code> and <code class="inl">COUNT</code>.</p>
      <p>The <b>KQL queryset</b> is the right solution. Once the eventstream data is routed to a KQL database, a query computes the percentile in one line:</p>
      <pre class="code">Eventhub1
| summarize percentile(todouble(Payload.value), 95)
    by bin(Datetime, 1m), MachineId</pre>
      <p class="why">Three decisive advantages of KQL here</p>
      <ul>
        <li>The functions <code class="inl">percentile()</code>, <code class="inl">percentiles()</code> and <code class="inl">percentile_array()</code> are <b>native</b>.</li>
        <li>Access to <code class="inl">dynamic</code> columns uses <b>dot notation</b> (<code class="inl">Payload.metric</code>), with no manual parsing.</li>
        <li><b>Time windows</b> (<code class="inl">bin()</code>) enable a genuinely <b>continuous</b> calculation over the stream.</li>
      </ul>
      <p class="why">D — the most credible distractor, and the heart of the question</p>
      <p><b>Aggregate</b> does aggregate, but its <b>function catalogue</b> is limited to SUM / AVG / MIN / MAX / COUNT. The trap is stopping at the verb "aggregate" without checking <b>which</b> functions are actually available.</p>
      <ul>
        <li><b>B — Group by</b> groups events over a time window with simple aggregates, no percentile.</li>
        <li><b>C — Manage fields</b> selects, renames, retypes or drops columns: <b>no statistical calculation capability</b>.</li>
      </ul>
      <p class="note"><b>The reflex.</b> Eventstream transformations = <b>filtering, reshaping, basic aggregates</b>. Advanced statistical computation = <b>KQL queryset</b> on an Eventhouse database.</p>`}
  },
  {
    id:"q410", kind:"fields", type:TH,
    title:{fr:"KQL — ajouter des colonnes puis sélectionner",en:"KQL — adding columns then selecting"},
    stem:{fr:`<p>Vous avez une base KQL contenant une table nommée <code class="inl">Readings</code>. Vous devez l'interroger pour produire un résultat contenant les colonnes <b>City, Area, MeterReading, Datetime, PrevMeterReading, PrevDatetime</b> — où les deux dernières reprennent les valeurs de la ligne précédente.</p>
    <pre class="code">Readings
| filter City == "Copenhagen"
| sort by Datetime
| ❶ PrevMeterReading = prev(MeterReading),
     PrevTimestamp = prev(Datetime)
| ❷ City, Area, MeterReading, Datetime,
     PrevMeterReading, PrevDatetime</pre>
    <p class="ask">Comment devez-vous compléter la requête ?</p>`,
          en:`<p>You have a KQL database that contains a table named <code class="inl">Readings</code>. You need to query it to produce a result containing the columns <b>City, Area, MeterReading, Datetime, PrevMeterReading, PrevDatetime</b> — where the last two carry the previous row's values.</p>
    <pre class="code">Readings
| filter City == "Copenhagen"
| sort by Datetime
| ❶ PrevMeterReading = prev(MeterReading),
     PrevTimestamp = prev(Datetime)
| ❷ City, Area, MeterReading, Datetime,
     PrevMeterReading, PrevDatetime</pre>
    <p class="ask">How should you complete the query?</p>`},
    fields:[
      {label:{fr:"❶ créer les colonnes calculées",en:"❶ create the computed columns"}, hint:{fr:"ajouter sans agréger",en:"add without aggregating"},
       opts:{fr:["evaluate","extend","lookup","project","summarize"],en:["evaluate","extend","lookup","project","summarize"]}, ans:1},
      {label:{fr:"❷ choisir les colonnes de sortie",en:"❷ choose the output columns"}, hint:{fr:"une liste de colonnes existantes",en:"a list of existing columns"},
       opts:{fr:["evaluate","extend","lookup","project","summarize"],en:["evaluate","extend","lookup","project","summarize"]}, ans:3}
    ],
    explain:{fr:`
      <p>Deux opérateurs, deux rôles bien distincts — et la structure du code les désigne sans ambiguïté.</p>
      <p class="why">❶ extend — créer des colonnes</p>
      <p><code class="inl">extend</code> ajoute des colonnes calculées à chaque ligne, <b>sans rien regrouper ni supprimer</b>. La syntaxe imprimée le confirme : <code class="inl">NouveauNom = expression</code>, c'est la forme d'une affectation, pas d'une agrégation.</p>
      <p>La fonction <code class="inl">prev()</code> renvoie la valeur d'une colonne à la ligne précédente. Elle n'a de sens que sur un flux <b>déjà ordonné</b>, d'où le <code class="inl">sort by Datetime</code> qui la précède : sans tri, « la ligne précédente » ne veut rien dire.</p>
      <p class="why">❷ project — choisir les colonnes</p>
      <p><code class="inl">project</code> sélectionne les colonnes à conserver et fixe leur ordre — l'équivalent du <code class="inl">SELECT</code> en SQL. L'indice est visuel : la ligne ❷ contient une <b>simple liste de colonnes existantes</b>, sans aucune affectation ni fonction d'agrégation.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Opérateur KQL</th><th>Ce qu'il fait</th><th>Équivalent SQL</th></tr>
        <tr><td class="m">extend</td><td>Ajoute des colonnes calculées</td><td>Colonne calculée dans le SELECT</td></tr>
        <tr><td class="m">project</td><td>Sélectionne et ordonne les colonnes</td><td class="m">SELECT col1, col2</td></tr>
        <tr><td class="m">summarize</td><td><b>Agrège</b> et réduit le nombre de lignes</td><td class="m">GROUP BY</td></tr>
        <tr><td class="m">lookup</td><td>Enrichit depuis une table de dimension</td><td class="m">LEFT JOIN</td></tr>
        <tr><td class="m">evaluate</td><td>Appelle un plugin (pivot, bag_unpack…)</td><td>Sans équivalent direct</td></tr>
      </table></div>
      <p class="why">Pourquoi summarize est le piège</p>
      <p>C'est le distracteur le plus tentant en ❶, parce qu'on associe spontanément KQL à <code class="inl">summarize</code>. Mais <code class="inl">summarize</code> <b>agrège</b> : il réduit le jeu de résultats à une ligne par groupe. Or le résultat attendu conserve <b>toutes les lignes</b>, chacune enrichie de la valeur précédente. Utiliser summarize détruirait précisément ce qu'on cherche à produire.</p>
      <p class="why">Le test qui tranche en deux secondes</p>
      <p>Le nombre de lignes change-t-il ? Non → <code class="inl">extend</code> ou <code class="inl">project</code>. Oui → <code class="inl">summarize</code>. Puis : y a-t-il un <code class="inl">=</code> ? Oui → <code class="inl">extend</code>. Non, juste des noms → <code class="inl">project</code>.</p>
      <p class="note"><b>Le réflexe.</b> En KQL, <b>l'ordre du pipeline fait tout</b> : <code class="inl">sort</code> avant <code class="inl">prev()</code>, <code class="inl">extend</code> avant le <code class="inl">project</code> qui affiche les colonnes créées. Une étape déplacée et la requête ne renvoie plus la même chose.</p>`,
      en:`
      <p>Two operators, two clearly distinct jobs — and the code's structure points at them unambiguously.</p>
      <p class="why">❶ extend — creating columns</p>
      <p><code class="inl">extend</code> adds computed columns to each row, <b>grouping and removing nothing</b>. The printed syntax confirms it: <code class="inl">NewName = expression</code> is the shape of an assignment, not of an aggregation.</p>
      <p>The <code class="inl">prev()</code> function returns a column's value on the preceding row. It only makes sense on an <b>already ordered</b> stream, hence the <code class="inl">sort by Datetime</code> before it: without a sort, "the previous row" means nothing.</p>
      <p class="why">❷ project — choosing the columns</p>
      <p><code class="inl">project</code> selects the columns to keep and fixes their order — the equivalent of SQL's <code class="inl">SELECT</code>. The clue is visual: line ❷ holds a <b>plain list of existing columns</b>, with no assignment and no aggregate function.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>KQL operator</th><th>What it does</th><th>SQL equivalent</th></tr>
        <tr><td class="m">extend</td><td>Adds computed columns</td><td>A computed column in the SELECT</td></tr>
        <tr><td class="m">project</td><td>Selects and orders columns</td><td class="m">SELECT col1, col2</td></tr>
        <tr><td class="m">summarize</td><td><b>Aggregates</b> and reduces the row count</td><td class="m">GROUP BY</td></tr>
        <tr><td class="m">lookup</td><td>Enriches from a dimension table</td><td class="m">LEFT JOIN</td></tr>
        <tr><td class="m">evaluate</td><td>Calls a plugin (pivot, bag_unpack…)</td><td>No direct equivalent</td></tr>
      </table></div>
      <p class="why">Why summarize is the trap</p>
      <p>It is the most tempting distractor at ❶, because one instinctively associates KQL with <code class="inl">summarize</code>. But <code class="inl">summarize</code> <b>aggregates</b>: it reduces the result set to one row per group. The expected result keeps <b>every row</b>, each enriched with the previous value. Using summarize would destroy precisely what you are trying to produce.</p>
      <p class="why">The two-second test</p>
      <p>Does the row count change? No → <code class="inl">extend</code> or <code class="inl">project</code>. Yes → <code class="inl">summarize</code>. Then: is there an <code class="inl">=</code>? Yes → <code class="inl">extend</code>. No, just names → <code class="inl">project</code>.</p>
      <p class="note"><b>The reflex.</b> In KQL, <b>pipeline order is everything</b>: <code class="inl">sort</code> before <code class="inl">prev()</code>, <code class="inl">extend</code> before the <code class="inl">project</code> that displays the created columns. Move one step and the query no longer returns the same thing.</p>`}
  },
  {
    id:"q411", kind:"fields", type:TH,
    title:{fr:"KQL — première valeur de chaque heure par partition",en:"KQL — first value of each hour per partition"},
    stem:{fr:`<p>Vous avez un eventhouse Fabric contenant une base KQL. La base contient une table <code class="inl">TaxiData</code> avec les colonnes <code class="inl">VendorID</code>, <code class="inl">tpep_pickup_datetime</code>, <code class="inl">payment_type</code> et <code class="inl">total_amount</code>.</p>
    <p>Vous devez créer une colonne nommée <b>FirstPickupDateTime</b> contenant la <b>première valeur de chaque heure</b> de <code class="inl">tpep_pickup_datetime</code>, <b>partitionnée par</b> <code class="inl">payment_type</code>.</p>
    <pre class="code">TaxiData
| sort by tpep_pickup_datetime asc, payment_type asc
| extend FirstPickupDateTime = ❶ (tpep_pickup_datetime,
      1h, 0m, payment_type ❷ prev(payment_type))</pre>
    <p class="ask">Comment devez-vous compléter la requête ?</p>`,
          en:`<p>You have a Fabric eventhouse that contains a KQL database. The database contains a table named <code class="inl">TaxiData</code> with the columns <code class="inl">VendorID</code>, <code class="inl">tpep_pickup_datetime</code>, <code class="inl">payment_type</code> and <code class="inl">total_amount</code>.</p>
    <p>You need to create a column named <b>FirstPickupDateTime</b> that contains the <b>first value of each hour</b> from <code class="inl">tpep_pickup_datetime</code>, <b>partitioned by</b> <code class="inl">payment_type</code>.</p>
    <pre class="code">TaxiData
| sort by tpep_pickup_datetime asc, payment_type asc
| extend FirstPickupDateTime = ❶ (tpep_pickup_datetime,
      1h, 0m, payment_type ❷ prev(payment_type))</pre>
    <p class="ask">How should you complete the query?</p>`},
    fields:[
      {label:{fr:"❶ fonction de fenêtrage",en:"❶ window function"}, hint:{fr:"des sessions d'une heure",en:"one-hour sessions"},
       opts:{fr:["row_cumsum","row_rank_dense","row_rank_min","row_window_session"],en:["row_cumsum","row_rank_dense","row_rank_min","row_window_session"]}, ans:3},
      {label:{fr:"❷ condition de redémarrage",en:"❷ restart condition"}, hint:{fr:"quand la partition change",en:"when the partition changes"},
       opts:{fr:["!=","<=","==",">="],en:["!=","<=","==",">="]}, ans:0}
    ],
    explain:{fr:`
      <p class="why">❶ row_window_session — la seule fonction qui découpe en fenêtres temporelles</p>
      <p><code class="inl">row_window_session()</code> regroupe les lignes consécutives en <b>sessions</b> et retourne, pour chaque ligne, la valeur qui a <b>ouvert</b> sa session. Sa signature colle exactement au code imprimé :</p>
      <pre class="code">row_window_session(Expr, MaxDistanceFromFirst,
                   MaxDistanceBetweenNeighbors, Restart)</pre>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Argument</th><th>Ici</th><th>Effet</th></tr>
        <tr><td class="m">Expr</td><td class="m">tpep_pickup_datetime</td><td>La valeur suivie</td></tr>
        <tr><td class="m">MaxDistanceFromFirst</td><td class="m">1h</td><td>Une session dure au plus <b>une heure</b></td></tr>
        <tr><td class="m">MaxDistanceBetweenNeighbors</td><td class="m">0m</td><td>Aucune contrainte d'écart entre voisins</td></tr>
        <tr><td class="m">Restart</td><td class="m">payment_type != prev(payment_type)</td><td>Force une nouvelle session à chaque changement de partition</td></tr>
      </table></div>
      <p>Les trois autres fonctions ne produisent pas une valeur de départ de fenêtre :</p>
      <ul>
        <li><b>row_cumsum</b> calcule une <b>somme cumulée</b> — un nombre, pas un datetime.</li>
        <li><b>row_rank_dense</b> et <b>row_rank_min</b> retournent un <b>rang</b> (1, 2, 3…), et leur signature ne prend ni durée ni condition de redémarrage.</li>
      </ul>
      <p class="why">❷ != — comment on « partitionne » en KQL</p>
      <p>C'est le point le plus instructif de la question. KQL n'a <b>pas de clause PARTITION BY</b> comme le T-SQL. Le partitionnement s'obtient par une <b>condition de redémarrage</b> : la fenêtre repart dès que la valeur de partition <b>diffère</b> de celle de la ligne précédente.</p>
      <pre class="code">payment_type != prev(payment_type)   → nouvelle session</pre>
      <p>Cette condition est vraie exactement au moment où l'on change de <code class="inl">payment_type</code>. C'est ce qui rend indispensable le <code class="inl">sort by … payment_type asc</code> de la ligne précédente : sans tri, les valeurs d'une même partition ne seraient pas contiguës et la fenêtre repartirait sans arrêt.</p>
      <p><code class="inl">==</code> produirait l'inverse — un redémarrage tant que la valeur ne change <i>pas</i> — et les comparaisons <code class="inl">&lt;=</code> ou <code class="inl">&gt;=</code> n'ont aucun sens sur un critère d'appartenance à une partition.</p>
      <p class="note"><b>Le réflexe.</b> En T-SQL, partitionner s'écrit <code class="inl">PARTITION BY col</code>. En KQL, cela s'écrit <code class="inl">sort by col</code> <b>puis</b> <code class="inl">col != prev(col)</code> comme condition de redémarrage. Le tri n'est jamais décoratif dans un pipeline KQL : il conditionne le sens de <code class="inl">prev()</code> et de toutes les fonctions <code class="inl">row_*</code>.</p>`,
      en:`
      <p class="why">❶ row_window_session — the only function that cuts time windows</p>
      <p><code class="inl">row_window_session()</code> groups consecutive rows into <b>sessions</b> and returns, for each row, the value that <b>opened</b> its session. Its signature matches the printed code exactly:</p>
      <pre class="code">row_window_session(Expr, MaxDistanceFromFirst,
                   MaxDistanceBetweenNeighbors, Restart)</pre>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Argument</th><th>Here</th><th>Effect</th></tr>
        <tr><td class="m">Expr</td><td class="m">tpep_pickup_datetime</td><td>The tracked value</td></tr>
        <tr><td class="m">MaxDistanceFromFirst</td><td class="m">1h</td><td>A session lasts at most <b>one hour</b></td></tr>
        <tr><td class="m">MaxDistanceBetweenNeighbors</td><td class="m">0m</td><td>No constraint on the gap between neighbours</td></tr>
        <tr><td class="m">Restart</td><td class="m">payment_type != prev(payment_type)</td><td>Forces a new session at every partition change</td></tr>
      </table></div>
      <p>The other three functions do not produce a window-start value:</p>
      <ul>
        <li><b>row_cumsum</b> computes a <b>running total</b> — a number, not a datetime.</li>
        <li><b>row_rank_dense</b> and <b>row_rank_min</b> return a <b>rank</b> (1, 2, 3…), and their signature takes neither a duration nor a restart condition.</li>
      </ul>
      <p class="why">❷ != — how you "partition" in KQL</p>
      <p>This is the most instructive point in the question. KQL has <b>no PARTITION BY clause</b> as T-SQL does. Partitioning is achieved with a <b>restart condition</b>: the window restarts as soon as the partition value <b>differs</b> from the previous row's.</p>
      <pre class="code">payment_type != prev(payment_type)   → new session</pre>
      <p>That condition is true exactly when <code class="inl">payment_type</code> changes. It is what makes the preceding <code class="inl">sort by … payment_type asc</code> indispensable: without the sort, values of one partition would not be contiguous and the window would restart constantly.</p>
      <p><code class="inl">==</code> would do the opposite — restart while the value does <i>not</i> change — and the <code class="inl">&lt;=</code> or <code class="inl">&gt;=</code> comparisons make no sense as a partition-membership test.</p>
      <p class="note"><b>The reflex.</b> In T-SQL, partitioning is written <code class="inl">PARTITION BY col</code>. In KQL it is written <code class="inl">sort by col</code> <b>then</b> <code class="inl">col != prev(col)</code> as the restart condition. The sort is never decorative in a KQL pipeline: it determines the meaning of <code class="inl">prev()</code> and of every <code class="inl">row_*</code> function.</p>`}
  }]
}
];

let LANG = "fr";
try { LANG = localStorage.getItem("site-lang") === "en" ? "en" : "fr"; } catch(e){}
const L = o => (o && typeof o === "object" && !Array.isArray(o) && ("fr" in o)) ? o[LANG] : o;
const t = () => UI[LANG];
