const CASES = {
  contoso:{ label:{fr:"Étude de cas — Contoso, Ltd.",en:"Case study — Contoso, Ltd."}, html:CASE_CONTOSO },
  litware:{ label:{fr:"Étude de cas — Litware, Inc.",en:"Case study — Litware, Inc."}, html:CASE_LITWARE }
};

/* ---- Vue transversale : les questions regroupées par dossier ---- */
const DOMAIN_OF = {};
TESTS.forEach(x => x.questions.forEach(q => { DOMAIN_OF[q.id] = x.n; }));

const CASE_VIEW = {
  id:"cas", n:"★", isCases:true,
  short:{fr:"Études de cas",en:"Case studies"},
  weight:{fr:"deux dossiers",en:"two dossiers"},
  title:{fr:"Les questions d'étude de cas",
         en:"The case study questions"},
  note:{fr:"Les mêmes questions que dans les tests par domaine, mais regroupées par dossier — c'est ainsi qu'elles tombent le jour de l'examen : un dossier, puis une série de questions qui s'appuient toutes dessus. Votre progression est partagée entre les deux vues.",
        en:"The same questions as in the per-domain tests, but grouped by dossier — which is how they appear on exam day: one dossier, then a run of questions all resting on it. Your progress is shared between the two views."},
  groups:[
    {tag:"contoso",
     name:{fr:"Contoso, Ltd.",en:"Contoso, Ltd."},
     lead:{fr:"Compléments alimentaires · divisions Sales et Research · Power BI Premium existant, Fabric à activer.",
           en:"Health supplements · Sales and Research divisions · existing Power BI Premium, Fabric to enable."}},
    {tag:"litware",
     name:{fr:"Litware, Inc.",en:"Litware, Inc."},
     lead:{fr:"Industriel nord-américain · équipe analytics à quatre métiers · aucune capacité Fabric encore activée.",
           en:"North American manufacturer · four-role analytics team · no Fabric capacity enabled yet."}}
  ],
  questions:[]
};
CASE_VIEW.groups.forEach(g => {
  g.questions = [];
  TESTS.forEach(x => x.questions.forEach(q => { if (q.tag === g.tag) g.questions.push(q); }));
  CASE_VIEW.questions = CASE_VIEW.questions.concat(g.questions);
});

const VIEWS = TESTS.concat([CASE_VIEW]);

const KEY = "dp600-revision-v3";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ state = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function st(qid){ if(!state[qid]) state[qid] = {sel:[], fields:{}, done:false}; return state[qid]; }

const allQ = {};
TESTS.forEach(x => x.questions.forEach(q => { allQ[q.id] = q; }));

const tabsEl = document.getElementById("tabs");
const panelsEl = document.getElementById("panels");
let current = VIEWS[0].id;

function renderChrome(){
  document.documentElement.lang = LANG;
  document.getElementById("h1").textContent = t().h1;
  document.getElementById("dek").textContent = t().dek;
  document.getElementById("meta").innerHTML = t().meta.map(m => `<span>${m}</span>`).join("");
  document.getElementById("sidelink").innerHTML =
    `<span class="arw">→</span><span>${t().sidelink}</span>`;
  document.getElementById("foot").innerHTML = t().foot;
  document.querySelectorAll(".langsw button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
}

function renderAll(){
  tabsEl.innerHTML = "";
  panelsEl.innerHTML = "";

  VIEWS.forEach(x => {
    const b = document.createElement("button");
    b.className = "tab" + (x.isCases ? " tab-cases" : ""); b.type = "button";
    b.setAttribute("role", "tab");
    b.id = "tab-" + x.id;
    b.setAttribute("aria-controls", "panel-" + x.id);
    b.setAttribute("aria-selected", String(x.id === current));
    b.innerHTML = `<span class="n">${x.n}</span>${L(x.short)}<span class="n">${x.questions.length}q</span>`;
    b.addEventListener("click", () => selectTab(x.id));
    tabsEl.appendChild(b);

    const p = document.createElement("section");
    p.className = "panel"; p.id = "panel-" + x.id;
    p.setAttribute("role", "tabpanel");
    p.setAttribute("aria-labelledby", "tab-" + x.id);
    p.hidden = x.id !== current;

    const eyebrow = x.isCases ? t().casEyebrow : `${t().test} ${x.n} · ${L(x.weight)}`;
    const caseHtml = (!x.isCases && (x.cases||[]).length)
      ? `<div class="cases">` + x.cases.map(c =>
          `<details class="case"><summary>${L(CASES[c].label)}</summary>${L(CASES[c].html)}</details>`).join("") + `</div>`
      : ``;

    p.innerHTML = `
      <div class="domain-head">
        <p class="eyebrow">${eyebrow}</p>
        <h2>${L(x.title)}</h2>
        <p class="domain-note">${L(x.note)}</p>
        <div class="scorebar">
          <span class="score-txt" data-score="${x.id}"></span>
          <span class="spacer"></span>
          <button class="act" type="button" data-all="${x.id}">${t().checkAll}</button>
          <button class="act" type="button" data-reset="${x.id}">${t().reset}</button>
        </div>
      </div>
      ${caseHtml}
      <div class="qlist" data-qlist="${x.id}"></div>`;
    panelsEl.appendChild(p);

    const list = p.querySelector("[data-qlist]");

    if (x.isCases){
      x.groups.forEach(g => {
        const head = document.createElement("div");
        head.className = "grp";
        head.innerHTML = `
          <h3>${L(g.name)}</h3>
          <p class="grp-lead">${L(g.lead)}</p>
          <p class="grp-count">${t().casCount(g.questions.length)}</p>
          <details class="case" open><summary>${L(CASES[g.tag].label)}</summary>${L(CASES[g.tag].html)}</details>`;
        list.appendChild(head);
        g.questions.forEach((q, qi) => list.appendChild(buildQ(q, qi + 1, x, "cas-")));
      });
    } else {
      x.questions.forEach((q, qi) => { list.appendChild(buildQ(q, qi + 1, x)); });
    }
  });

  VIEWS.forEach(x => {
    x.questions.forEach(q => {
      const s0 = st(q.id);
      instances(q.id).forEach(el => {
        if (q.kind === "fields"){
          el.querySelectorAll("select").forEach((s, i) => {
            if (s0.fields[i] !== undefined && s0.fields[i] !== "") s.value = s0.fields[i];
          });
        } else {
          el.querySelectorAll("input").forEach(inp => {
            if (s0.sel.includes(inp.value)){ inp.checked = true; inp.closest(".opt").classList.add("sel"); }
          });
        }
      });
      if (s0.done) grade(q.id, false);
    });
  });
  updateAllScores();
}

function instances(qid){ return [...document.querySelectorAll(`[data-qid="${qid}"]`)]; }

function buildQ(q, idx, x, prefix){
  prefix = prefix || "";
  const el = document.createElement("article");
  el.className = "q"; el.id = prefix + q.id;
  el.dataset.qid = q.id;
  const nameAttr = prefix + q.id;

  let body = "";
  if (q.kind === "fields"){
    body = `<div class="fields">` + q.fields.map((f, fi) => `
      <div class="fld" data-f="${fi}">
        <span class="fl">${L(f.label)}<span class="hint">${L(f.hint)}</span></span>
        <select data-sel="${fi}" aria-label="${L(f.hint)}">
          <option value="">${t().choose}</option>
          ${L(f.opts).map((o, oi) => `<option value="${oi}">${o}</option>`).join("")}
        </select>
        <span class="verdict"></span>
      </div>`).join("") + `</div>`;
  } else {
    const inputType = q.kind === "multi" ? "checkbox" : "radio";
    body = `<div class="opts">` + q.options.map(o => `
      <label class="opt" data-k="${o.k}">
        <input type="${inputType}" name="${nameAttr}" value="${o.k}" id="${nameAttr}-${o.k}">
        <span class="lbl"><span class="key">${o.k}.</span>${L(o)}</span>
        <span class="mark"></span>
      </label>`).join("") + `</div>`;
  }

  const chip = x.isCases
    ? `<span class="chip case">${t().test} ${DOMAIN_OF[q.id]}</span>`
    : (q.tag ? `<span class="chip case">${q.tag === "contoso" ? "Contoso" : "Litware"}</span>` : ``);
  const hotChip = q.contested ? `<span class="chip hot">${LANG === "fr" ? "Contestée" : "Disputed"}</span>` : ``;

  el.innerHTML = `
    <div class="q-head">
      <span class="qnum">Q${idx}</span>
      <span class="chip">${L(q.type)}</span>
      ${chip}${hotChip}
      <div class="qtitle">${L(q.title)}</div>
    </div>
    <div class="q-stem">${L(q.stem)}</div>
    ${body}
    <div class="q-foot">
      <button class="check" type="button">${t().check}</button>
      <span class="verdict-line" hidden></span>
    </div>
    <div class="explain" hidden>
      <h5>${t().correction}</h5>
      <p class="sol"></p>
      <div class="exp-body">${L(q.explain)}</div>
    </div>`;

  if (q.kind === "fields"){
    el.querySelectorAll("select").forEach(s => s.addEventListener("change", e => {
      const s0 = st(q.id), i = e.target.dataset.sel, v = e.target.value;
      s0.fields[i] = v; save();
      instances(q.id).forEach(other => {
        if (other === el) return;
        const sel = other.querySelector(`select[data-sel="${i}"]`);
        if (sel) sel.value = v;
      });
    }));
  } else {
    el.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => {
      const s0 = st(q.id);
      s0.sel = [...el.querySelectorAll("input:checked")].map(i => i.value);
      save();
      instances(q.id).forEach(other => {
        other.querySelectorAll("input").forEach(i2 => { i2.checked = s0.sel.includes(i2.value); });
        other.querySelectorAll(".opt").forEach(o =>
          o.classList.toggle("sel", s0.sel.includes(o.dataset.k)));
      });
    }));
  }
  el.querySelector("button.check").addEventListener("click", () => { grade(q.id, true); updateAllScores(); });
  return el;
}

function isCorrect(q){
  const s0 = st(q.id);
  if (q.kind === "fields") return q.fields.every((f, i) => String(s0.fields[i]) === String(f.ans));
  const a = [...q.answer].sort().join("|");
  const b = [...s0.sel].sort().join("|");
  return a === b && b !== "";
}
function answered(q){
  const s0 = st(q.id);
  return q.kind === "fields"
    ? q.fields.every((f, i) => s0.fields[i] !== undefined && s0.fields[i] !== "")
    : s0.sel.length > 0;
}

function grade(qid, mark){
  const q = allQ[qid], s0 = st(qid);
  if (mark) { s0.done = true; save(); }
  if (!s0.done) return;
  const ok = isCorrect(q);

  instances(qid).forEach(el => {
    el.classList.add("done");

    if (q.kind === "fields"){
      el.querySelectorAll(".fld").forEach((fld, i) => {
        const f = q.fields[i], good = String(s0.fields[i]) === String(f.ans);
        fld.classList.toggle("good", good);
        fld.classList.toggle("bad", !good);
        fld.querySelector(".verdict").innerHTML = good
          ? "✓" : `✗ <span class="sol">→ ${L(f.opts)[f.ans]}</span>`;
        const sel = fld.querySelector("select");
        if (s0.fields[i] !== undefined && s0.fields[i] !== "") sel.value = s0.fields[i];
        sel.disabled = true;
      });
    } else {
      el.querySelectorAll(".opt").forEach(o => {
        const k = o.dataset.k, chosen = s0.sel.includes(k), correct = q.answer.includes(k);
        o.classList.remove("sel");
        const inp = o.querySelector("input");
        inp.checked = chosen; inp.disabled = true;
        if (correct){ o.classList.add("good"); o.querySelector(".mark").textContent = chosen ? "✓" : t().theAnswer; }
        else if (chosen){ o.classList.add("bad"); o.querySelector(".mark").textContent = "✗"; }
      });
    }

    const v = el.querySelector(".verdict-line");
    v.hidden = false;
    v.className = "verdict-line " + (ok ? "ok" : "ko");
    v.textContent = ok ? t().correct : (answered(q) ? t().incorrect : t().unanswered);

    el.querySelector(".explain .sol").textContent = q.kind === "fields"
      ? q.fields.map(f => L(f.opts)[f.ans]).join("  ·  ")
      : t().answerIs + " " + q.answer.join(t().and);
    el.querySelector(".explain").hidden = false;
    const btn = el.querySelector("button.check");
    btn.textContent = t().checked; btn.disabled = true; btn.style.opacity = ".5";
  });
}

function updateScore(tid){
  const x = VIEWS.find(z => z.id === tid);
  const done = x.questions.filter(q => st(q.id).done);
  const hits = done.filter(q => isCorrect(q)).length;
  const el = document.querySelector(`[data-score="${tid}"]`);
  if (!el) return;
  el.innerHTML = done.length === 0
    ? t().noneChecked(x.questions.length)
    : t().scored(done.length, x.questions.length, hits);
}
function updateAllScores(){ VIEWS.forEach(x => updateScore(x.id)); }

function selectTab(id){
  current = id;
  VIEWS.forEach(x => {
    document.getElementById("tab-" + x.id).setAttribute("aria-selected", String(x.id === id));
    document.getElementById("panel-" + x.id).hidden = x.id !== id;
  });
  const tb = document.getElementById("tab-" + id);
  if (tb) tb.scrollIntoView({block:"nearest", inline:"nearest"});
  if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  window.scrollTo({top:0, behavior:"instant"});
}

document.addEventListener("click", e => {
  const all = e.target.closest("[data-all]");
  if (all){
    const x = VIEWS.find(z => z.id === all.dataset.all);
    x.questions.forEach(q => grade(q.id, true));
    updateAllScores();
  }
  const rs = e.target.closest("[data-reset]");
  if (rs){
    const x = VIEWS.find(z => z.id === rs.dataset.reset);
    x.questions.forEach(q => { state[q.id] = {sel:[], fields:{}, done:false}; });
    save();
    renderAll();
    const panel = document.getElementById("panel-" + current);
    if (panel) panel.scrollIntoView({behavior:"smooth", block:"start"});
  }
});

document.querySelectorAll(".langsw button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === LANG) return;
  LANG = b.dataset.lang;
  try { localStorage.setItem("site-lang", LANG); } catch(e){}
  renderChrome();
  renderAll();
}));

const h = location.hash.slice(1);
if (VIEWS.some(x => x.id === h)) current = h;
renderChrome();
renderAll();
</script>

<script>
document.getElementById("themeBtn").addEventListener("click", () => {
  const l = document.documentElement.classList.toggle("light");
  try { localStorage.setItem("theme", l ? "light" : "dark"); } catch(e){}
});
</script>
</body>
</html>
