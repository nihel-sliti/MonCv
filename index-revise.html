        <li><b>A — le même réglage sur Off.</b> L'inverse exact du prérequis. Distracteur miroir de C : même réglage, mauvaise valeur.</li>
        <li><b>B — Create and use Metrics.</b> Paramètre de tenant concernant les <i>goals</i> et <i>scorecards</i> de Power BI. Aucun lien avec le stockage ou la scalabilité.</li>
        <li><b>D — Data Activator.</b> Le module Fabric de détection d'événements et de déclenchement d'alertes (Reflex). Sans rapport avec le scale-out.</li>
      </ul>
      <p>Notez que B et D sont tous deux <b>au niveau tenant</b>, alors que le scale-out et son prérequis se règlent au niveau du <b>modèle sémantique</b>. C'est un indice de niveau, comme pour le XMLA endpoint.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Fonctionnalité</th><th>Prérequis à activer d'abord</th></tr>
        <tr><td>Scale-out d'un modèle sémantique</td><td>Large dataset storage format = On</td></tr>
        <tr><td>XMLA read-write</td><td>Capacity settings → XMLA = Read Write</td></tr>
        <tr><td>Colonne de partition dans Copy activity</td><td>Mode = Overwrite</td></tr>
        <tr><td>Publier des modèles par outils externes</td><td>Tenant XMLA + Capacité Read Write + Create Fabric items</td></tr>
      </table></div>
      <p class="note"><b>Le mot <i>first</i> signale toujours une dépendance à débloquer</b> — c'est la troisième fois que ce motif apparaît dans ce recueil. Et retenez que le <i>Large dataset storage format</i> conditionne plusieurs fonctionnalités avancées, pas seulement le scale-out.</p>`,
      en:`
      <p><b>Scale-out</b> lets Power BI create <b>read-only replicas</b> of the model, spreading query load across several instances. Useful when many users query the same model at once.</p>
      <p>But the feature first requires the <b>Large semantic model storage format</b>, which moves the model from the standard format to the <i>Premium Files</i> format. That format is what makes replicas possible. Without it, the scale-out option <b>does not even appear</b> in the settings.</p>
      <pre class="code">1. Semantic model settings → Large dataset storage format = On   ← "first"
2. Semantic model settings → Scale out queries = On</pre>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — the same setting on Off.</b> The exact inverse of the prerequisite. C's mirror distractor: same setting, wrong value.</li>
        <li><b>B — Create and use Metrics.</b> A tenant setting about Power BI <i>goals</i> and <i>scorecards</i>. Nothing to do with storage or scalability.</li>
        <li><b>D — Data Activator.</b> Fabric's event-detection and alerting module (Reflex). Unrelated to scale-out.</li>
      </ul>
      <p>Note that B and D are both <b>tenant level</b>, whereas scale-out and its prerequisite are set at the <b>semantic model</b> level. That is a level clue, as with the XMLA endpoint.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Feature</th><th>Prerequisite to enable first</th></tr>
        <tr><td>Semantic model scale-out</td><td>Large dataset storage format = On</td></tr>
        <tr><td>XMLA read-write</td><td>Capacity settings → XMLA = Read Write</td></tr>
        <tr><td>Partition column in a Copy activity</td><td>Mode = Overwrite</td></tr>
        <tr><td>Publishing models via external tools</td><td>Tenant XMLA + Capacity Read Write + Create Fabric items</td></tr>
      </table></div>
      <p class="note"><b>The word <i>first</i> always signals a dependency to unlock</b> — the third time this pattern appears in this collection. And remember that <i>Large dataset storage format</i> gates several advanced features, not just scale-out.</p>`}
  },
  {
    id:"q311", kind:"single", type:T1,
    title:{fr:"Direct Lake et le fallback DirectQuery",en:"Direct Lake and the DirectQuery fallback"},
    stem:{fr:`<p>Vous avez un warehouse qui utilise la <b>sécurité au niveau ligne (RLS)</b>. Vous créez un modèle sémantique <b>Direct Lake</b> qui utilise les tables Delta <b>et le RLS</b> du warehouse. Quand les utilisateurs interagissent avec un rapport bâti sur ce modèle…</p><p class="ask">…quel mode sera utilisé par les requêtes DAX ?</p>`,
          en:`<p>You have a Fabric warehouse that uses <b>row-level security (RLS)</b>. You create a <b>Direct Lake</b> semantic model that uses the Delta tables <b>and the RLS</b> of the warehouse. When users interact with a report built from the model…</p><p class="ask">…which mode will be used by the DAX queries?</p>`},
    options:[{k:"A",fr:"DirectQuery",en:"DirectQuery"},{k:"B",fr:"Dual",en:"Dual"},{k:"C",fr:"Direct Lake",en:"Direct Lake"},{k:"D",fr:"Import",en:"Import"}],
    answer:["A"],
    explain:{fr:`
      <p>Un modèle Direct Lake lit normalement les fichiers Delta directement en mémoire, sans passer par un moteur SQL — c'est ce qui lui donne des performances proches de l'Import. Mais dans certaines situations, Direct Lake ne peut pas fonctionner et <b>bascule automatiquement en DirectQuery</b> : c'est le <i>DirectQuery fallback</i>. La RLS définie dans le warehouse est précisément l'un de ces déclencheurs.</p>
      <p class="why">Pourquoi la RLS force le fallback</p>
      <p>Direct Lake lit les fichiers Parquet <b>en contournant le moteur SQL</b>. Or la RLS du warehouse est implémentée comme une politique de sécurité T-SQL (<code class="inl">CREATE SECURITY POLICY</code> avec une fonction de prédicat) : elle vit <b>dans</b> le moteur SQL. Contourner le moteur, ce serait contourner la sécurité. Fabric ne peut pas le permettre.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Mode</th><th>Lecture</th><th>RLS du warehouse appliquée ?</th></tr>
        <tr><td class="m">Direct Lake pur</td><td>Fichiers Delta en mémoire</td><td><b>Non</b> — contournée, inacceptable</td></tr>
        <tr><td class="m">DirectQuery (fallback)</td><td>Requêtes T-SQL vers le SQL endpoint</td><td><b>Oui</b> — appliquée par le moteur</td></tr>
      </table></div>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>C — Direct Lake.</b> C'est le mode <i>configuré</i> du modèle, mais la question demande quel mode sera <b>effectivement utilisé</b> par les requêtes DAX. Le distracteur qui teste si vous connaissez le fallback ou si vous répétez simplement le mode déclaré.</li>
        <li><b>D — Import.</b> Un modèle Direct Lake ne bascule jamais en Import. L'Import exige un rafraîchissement planifié qui copie les données : c'est un mode de stockage distinct, pas un mode de secours.</li>
        <li><b>B — Dual.</b> Une propriété qu'on assigne à une <i>table</i> dans un modèle composite : elle peut se comporter en Import ou en DirectQuery selon le contexte. Ce n'est pas un comportement de fallback de Direct Lake.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Situation</th><th>Conséquence</th></tr>
        <tr><td>RLS définie dans le warehouse ou le lakehouse</td><td>Fallback DirectQuery</td></tr>
        <tr><td>Vues SQL dans la source (au lieu de tables)</td><td>Fallback DirectQuery</td></tr>
        <tr><td>Dépassement des limites de lignes du SKU</td><td>Fallback DirectQuery</td></tr>
        <tr><td>Types de données non supportés par Direct Lake</td><td>Fallback DirectQuery</td></tr>
      </table></div>
      <p class="note"><b>Distinguez le mode configuré du mode effectif.</b> Sur les questions Direct Lake, la réponse est souvent DirectQuery, parce que l'examen teste la connaissance du fallback. Le signal à repérer : dès que vous voyez <i>RLS</i>, <i>vues SQL</i> ou une limite de capacité à côté d'un modèle Direct Lake, pensez fallback.</p>`,
      en:`
      <p>A Direct Lake model normally reads the Delta files straight into memory, bypassing any SQL engine — which is what gives it near-Import performance. But in certain situations Direct Lake cannot operate and <b>switches automatically to DirectQuery</b>: the <i>DirectQuery fallback</i>. RLS defined in the warehouse is precisely one of those triggers.</p>
      <p class="why">Why RLS forces the fallback</p>
      <p>Direct Lake reads the Parquet files <b>bypassing the SQL engine</b>. But the warehouse's RLS is implemented as a T-SQL security policy (<code class="inl">CREATE SECURITY POLICY</code> with a predicate function): it lives <b>inside</b> the SQL engine. Bypassing the engine would mean bypassing the security. Fabric cannot allow that.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Mode</th><th>Read path</th><th>Warehouse RLS applied?</th></tr>
        <tr><td class="m">Pure Direct Lake</td><td>Delta files in memory</td><td><b>No</b> — bypassed, unacceptable</td></tr>
        <tr><td class="m">DirectQuery (fallback)</td><td>T-SQL queries to the SQL endpoint</td><td><b>Yes</b> — applied by the engine</td></tr>
      </table></div>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>C — Direct Lake.</b> That is the model's <i>configured</i> mode, but the question asks which mode will <b>actually be used</b> by the DAX queries. The distractor that tests whether you know the fallback or are simply repeating the declared mode.</li>
        <li><b>D — Import.</b> A Direct Lake model never falls back to Import. Import requires a scheduled refresh that copies the data: a distinct storage mode, not a backup mode.</li>
        <li><b>B — Dual.</b> A property assigned to a <i>table</i> in a composite model: it can behave as Import or DirectQuery depending on context. It is not a Direct Lake fallback behaviour.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Situation</th><th>Consequence</th></tr>
        <tr><td>RLS defined in the warehouse or lakehouse</td><td>DirectQuery fallback</td></tr>
        <tr><td>SQL views in the source (instead of tables)</td><td>DirectQuery fallback</td></tr>
        <tr><td>Exceeding the SKU's row limits</td><td>DirectQuery fallback</td></tr>
        <tr><td>Data types unsupported by Direct Lake</td><td>DirectQuery fallback</td></tr>
      </table></div>
      <p class="note"><b>Distinguish the configured mode from the effective one.</b> On Direct Lake questions the answer is often DirectQuery, because the exam tests knowledge of the fallback. The signal to spot: whenever you see <i>RLS</i>, <i>SQL views</i> or a capacity limit beside a Direct Lake model, think fallback.</p>`}
  },
  {
    id:"q312", kind:"single", type:T1,
    title:{fr:"Forcer le mode Direct Lake",en:"Forcing Direct Lake mode"},
    stem:{fr:`<p>Vous avez un modèle sémantique Direct Lake personnalisé <b>Model1</b> de <b>un milliard de lignes</b>. Vous utilisez <b>Tabular Editor</b> pour vous connecter à Model1 via le XMLA endpoint. Vous devez garantir que, lorsque les utilisateurs interagissent avec les rapports, leurs requêtes utilisent <b>toujours</b> le mode Direct Lake.</p><p class="ask">Que devez-vous faire ?</p>`,
          en:`<p>You have a custom Direct Lake semantic model named <b>Model1</b> that has <b>one billion rows</b> of data. You use <b>Tabular Editor</b> to connect to Model1 through the XMLA endpoint. You need to ensure that when users interact with reports based on Model1, their queries <b>always</b> use Direct Lake mode.</p><p class="ask">What should you do?</p>`},
    options:[
      {k:"A", fr:"Depuis <i>Model</i>, configurer l'option <i>Default Mode</i>.", en:"From <i>Model</i>, configure the <i>Default Mode</i> option."},
      {k:"B", fr:"Depuis <i>Partitions</i>, configurer l'option <i>Mode</i>.", en:"From <i>Partitions</i>, configure the <i>Mode</i> option."},
      {k:"C", fr:"Depuis <i>Model</i>, configurer l'option <i>Storage Location</i>.", en:"From <i>Model</i>, configure the <i>Storage Location</i> option."},
      {k:"D", fr:"Depuis <i>Model</i>, configurer l'option <i>Direct Lake Behavior</i>.", en:"From <i>Model</i>, configure the <i>Direct Lake Behavior</i> option."}
    ],
    answer:["D"],
    explain:{fr:`
      <p><code class="inl">DirectLakeBehavior</code> est une <b>propriété du modèle</b>, accessible dans Tabular Editor via le XMLA endpoint. Elle contrôle ce qui se passe quand Direct Lake ne peut pas répondre à une requête :</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Valeur</th><th>Comportement</th></tr>
        <tr><td class="m">Automatic (défaut)</td><td>Direct Lake si possible, sinon bascule silencieusement en DirectQuery</td></tr>
        <tr><td class="m">DirectLakeOnly</td><td>Direct Lake uniquement — <b>la requête échoue plutôt que de basculer</b></td></tr>
        <tr><td class="m">DirectQueryOnly</td><td>Force DirectQuery en permanence, utile pour tester</td></tr>
      </table></div>
      <p>L'énoncé demande que les requêtes utilisent <b>toujours</b> Direct Lake : il faut donc passer sur <b>DirectLakeOnly</b>.</p>
      <p class="why">Pourquoi « toujours » implique un échec</p>
      <p>C'est le point contre-intuitif. En mode Automatic, une requête qui dépasse les limites du SKU ou rencontre une vue SQL bascule en DirectQuery : l'utilisateur obtient un résultat, mais plus lentement, <b>sans le savoir</b>. DirectLakeOnly rend ce comportement visible — la requête retourne une erreur au lieu de dégrader silencieusement les performances. C'est un choix assumé, particulièrement pertinent sur un milliard de lignes, où un fallback serait catastrophique.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — Default Mode.</b> Définit le mode de stockage par défaut appliqué aux <i>nouvelles tables</i> ajoutées au modèle. Ne contrôle pas le comportement d'exécution des requêtes.</li>
        <li><b>B — Mode sur les partitions.</b> Chaque partition a effectivement un mode, mais le régler ne dit rien sur ce qu'il faut faire <b>en cas d'échec</b>. Le fallback resterait actif.</li>
        <li><b>C — Storage Location.</b> Concerne l'emplacement de stockage du modèle, pas son comportement de requêtage.</li>
      </ul>
      <p class="note"><b>Un mot absolu signale un réglage de comportement.</b> <i>always</i>, <i>never</i>, <i>must not fall back</i> — aucune option de mode ou d'emplacement ne peut garantir un « toujours » ; seule une propriété qui régit les cas d'exception le peut. Et dans Tabular Editor, les propriétés au niveau <b>Model</b> gouvernent le comportement global, celles au niveau Table ou Partition des objets individuels.</p>`,
      en:`
      <p><code class="inl">DirectLakeBehavior</code> is a <b>model property</b>, reachable in Tabular Editor over the XMLA endpoint. It controls what happens when Direct Lake cannot answer a query:</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Value</th><th>Behaviour</th></tr>
        <tr><td class="m">Automatic (default)</td><td>Direct Lake where possible, otherwise silently falls back to DirectQuery</td></tr>
        <tr><td class="m">DirectLakeOnly</td><td>Direct Lake only — <b>the query fails rather than falling back</b></td></tr>
        <tr><td class="m">DirectQueryOnly</td><td>Forces DirectQuery permanently, useful for testing</td></tr>
      </table></div>
      <p>The stem requires queries to <b>always</b> use Direct Lake: so switch to <b>DirectLakeOnly</b>.</p>
      <p class="why">Why "always" implies failure</p>
      <p>This is the counter-intuitive point. In Automatic mode, a query that exceeds the SKU's limits or hits a SQL view falls back to DirectQuery: the user gets a result, but more slowly, <b>without knowing</b>. DirectLakeOnly makes that behaviour visible — the query returns an error instead of silently degrading performance. It is a deliberate choice, particularly apt over a billion rows, where a fallback would be catastrophic.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — Default Mode.</b> Sets the default storage mode applied to <i>new tables</i> added to the model. It does not control query execution behaviour.</li>
        <li><b>B — Mode on partitions.</b> Each partition does have a mode, but setting it says nothing about what to do <b>on failure</b>. The fallback would stay active.</li>
        <li><b>C — Storage Location.</b> Concerns where the model is stored, not how it queries.</li>
      </ul>
      <p class="note"><b>An absolute word signals a behaviour setting.</b> <i>always</i>, <i>never</i>, <i>must not fall back</i> — no mode or location option can guarantee an "always"; only a property that governs the exception cases can. And in Tabular Editor, properties at the <b>Model</b> level govern global behaviour, those at Table or Partition level govern individual objects.</p>`}
  },
  {
    id:"q313", kind:"fields", type:TH,
    title:{fr:"Réduire la taille d'un modèle sémantique",en:"Reducing a semantic model's size"},
    stem:{fr:`<p>Vous devez <b>réduire la taille du modèle</b> et améliorer les performances d'actualisation. Deux colonnes posent problème :</p>
    <ul>
      <li><b>TransactionKey</b> — clé de substitution incrémentale, cardinalité <b>2 500 350 000</b> (soit le nombre de lignes), environ <b>160 Go</b>.</li>
      <li><b>SaleDateTime</b> — date et heure à la seconde près. <b>La valeur datetime doit rester disponible.</b></li>
    </ul>
    <p class="ask">Que devez-vous faire pour chaque colonne ?</p>`,
          en:`<p>You need to <b>reduce the model's size</b> and improve refresh performance. Two columns are problematic:</p>
    <ul>
      <li><b>TransactionKey</b> — an incrementing surrogate key, cardinality <b>2,500,350,000</b> (the row count), about <b>160 GB</b>.</li>
      <li><b>SaleDateTime</b> — date and time to the second. <b>The datetime value must remain available.</b></li>
    </ul>
    <p class="ask">What should you do for each column?</p>`},
    fields:[
      {label:{fr:"TransactionKey",en:"TransactionKey"}, hint:{fr:"sert-elle à quelque chose dans le modèle ?",en:"is it used for anything in the model?"},
       opts:{fr:["Change the data type of the column","Remove the column","Split the column","Truncate the data"],en:["Change the data type of the column","Remove the column","Split the column","Truncate the data"]}, ans:1},
      {label:{fr:"SaleDateTime",en:"SaleDateTime"}, hint:{fr:"la valeur doit rester disponible",en:"the value must remain available"},
       opts:{fr:["Change the data type of the column","Remove the column","Split the column","Truncate the data"],en:["Change the data type of the column","Remove the column","Split the column","Truncate the data"]}, ans:2}
    ],
    explain:{fr:`
      <p class="why">Le principe VertiPaq qui commande toute la réponse</p>
      <p>La taille d'une colonne dépend avant tout de sa <b>cardinalité</b> — le nombre de valeurs <i>distinctes</i> — et <b>non du nombre de lignes</b>. Moins il y a de valeurs distinctes, plus le dictionnaire est petit et la compression efficace.</p>
      <p class="why">TransactionKey → Remove</p>
      <p>C'est une clé auto-incrémentée : sa cardinalité <b>égale le nombre de lignes</b>, soit 2,5 milliards de valeurs uniques. VertiPaq ne peut rien compresser — d'où les 160 Go.</p>
      <p>Or une clé de substitution de <b>table de faits</b> ne sert :</p>
      <ul>
        <li>ni de relation — aucune dimension ne la référence ;</li>
        <li>ni d'axe d'analyse — personne ne filtre par numéro de transaction ;</li>
        <li>ni de calcul — aucune mesure ne s'appuie dessus.</li>
      </ul>
      <p>Elle n'est utile qu'à l'entrepôt <b>en amont</b>. La supprimer élimine 160 Go <b>sans aucune perte fonctionnelle</b>.</p>
      <p class="why">SaleDateTime → Split</p>
      <p>L'exigence <b>interdit de la supprimer</b>. La solution classique consiste à la scinder en deux colonnes :</p>
      <ul>
        <li><code class="inl">SaleDate</code> — quelques milliers de valeurs distinctes (le nombre de jours) ;</li>
        <li><code class="inl">SaleTime</code> — 86 400 au maximum.</li>
      </ul>
      <p>Au lieu d'une colonne à plusieurs <b>millions</b> de combinaisons distinctes, on obtient deux colonnes à très faible cardinalité, chacune fortement compressée. La valeur datetime reste entièrement <b>reconstituable</b> (<code class="inl">SaleDate + SaleTime</code>), et la colonne date peut en prime alimenter une relation propre avec une dimension Date.</p>
      <p class="why">Les options écartées</p>
      <ul>
        <li><b>Truncate the data</b> sur SaleDateTime ferait perdre la <b>précision à la seconde</b>, que l'énoncé exige de conserver.</li>
        <li><b>Change the data type</b> ne réduit pas la cardinalité, qui est le vrai facteur de taille.</li>
        <li><b>Split</b> ou <b>Truncate</b> sur TransactionKey conserveraient une colonne <b>inutile</b> : le gain serait partiel là où la suppression est gratuite.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> Optimisation VertiPaq = <b>réduire la cardinalité</b>. Supprimer les clés de substitution de faits ; scinder les datetime en date + heure.</p>`,
      en:`
      <p class="why">The VertiPaq principle that drives the whole answer</p>
      <p>A column's size depends above all on its <b>cardinality</b> — the number of <i>distinct</i> values — and <b>not on the row count</b>. The fewer distinct values, the smaller the dictionary and the better the compression.</p>
      <p class="why">TransactionKey → Remove</p>
      <p>It is an auto-incrementing key: its cardinality <b>equals the row count</b>, i.e. 2.5 billion unique values. VertiPaq can compress nothing — hence the 160 GB.</p>
      <p>Yet a <b>fact table</b> surrogate key serves:</p>
      <ul>
        <li>no relationship — no dimension references it;</li>
        <li>no analysis axis — nobody filters by transaction number;</li>
        <li>no calculation — no measure relies on it.</li>
      </ul>
      <p>It is only useful to the warehouse <b>upstream</b>. Dropping it removes 160 GB <b>with no functional loss</b>.</p>
      <p class="why">SaleDateTime → Split</p>
      <p>The requirement <b>forbids removing it</b>. The classic solution is to split it into two columns:</p>
      <ul>
        <li><code class="inl">SaleDate</code> — a few thousand distinct values (the number of days);</li>
        <li><code class="inl">SaleTime</code> — 86,400 at most.</li>
      </ul>
      <p>Instead of one column with several <b>million</b> distinct combinations, you get two very low-cardinality columns, each heavily compressed. The datetime value remains fully <b>reconstructable</b> (<code class="inl">SaleDate + SaleTime</code>), and the date column can additionally feed a clean relationship with a Date dimension.</p>
      <p class="why">The rejected options</p>
      <ul>
        <li><b>Truncate the data</b> on SaleDateTime would lose the <b>second-level precision</b> the stem requires you to keep.</li>
        <li><b>Change the data type</b> does not reduce cardinality, which is the real size driver.</li>
        <li><b>Split</b> or <b>Truncate</b> on TransactionKey would keep a <b>useless</b> column: a partial gain where removal is free.</li>
      </ul>
      <p class="note"><b>The reflex.</b> VertiPaq optimization = <b>reduce cardinality</b>. Drop fact surrogate keys; split datetimes into date + time.</p>`}
  },
  {
    id:"q314", kind:"fields", type:TH,
    title:{fr:"Élément de groupe de calcul month-to-date",en:"Month-to-date calculation group item"},
    stem:{fr:`<p>Vous avez un modèle sémantique Power BI. Vous prévoyez d'implémenter des <b>groupes de calcul</b>. Vous devez créer un élément de calcul qui changera le contexte de la date sélectionnée vers le <b>cumul mensuel (MTD)</b>.</p>
    <pre class="code">❶ (
    ❷ (),
    DATESMTD ( 'Date'[Date] )
)</pre>
    <p class="ask">Comment devez-vous compléter l'expression DAX ?</p>`,
          en:`<p>You have a Power BI semantic model. You plan to implement <b>calculation groups</b>. You need to create a calculation item that will change the selected date context to <b>month-to-date (MTD)</b>.</p>
    <pre class="code">❶ (
    ❷ (),
    DATESMTD ( 'Date'[Date] )
)</pre>
    <p class="ask">How should you complete the DAX expression?</p>`},
    fields:[
      {label:{fr:"❶ fonction englobante",en:"❶ outer function"}, hint:{fr:"modifier le contexte de filtre",en:"modify the filter context"},
       opts:{fr:["CALCULATE","GENERATE","MEASURE"],en:["CALCULATE","GENERATE","MEASURE"]}, ans:0},
      {label:{fr:"❷ expression réévaluée",en:"❷ re-evaluated expression"}, hint:{fr:"parenthèses vides",en:"empty parentheses"},
       opts:{fr:["COMBINEVALUES","SELECTEDMEASURE","SELECTEDVALUE"],en:["COMBINEVALUES","SELECTEDMEASURE","SELECTEDVALUE"]}, ans:1}
    ],
    explain:{fr:`
      <p><code class="inl">CALCULATE(expression, filtre1, …)</code> est la <b>seule</b> fonction DAX capable de <b>modifier le contexte de filtre</b> d'une expression. C'est le cœur de tout élément de calcul : on réévalue une mesure sous un contexte temporel différent.</p>
      <p class="why">SELECTEDMEASURE() — la clé des groupes de calcul</p>
      <p>C'est une fonction <b>spécifique aux groupes de calcul</b> : elle est un <b>espace réservé</b> pour la mesure actuellement évaluée dans le contexte du rapport. C'est ce qui rend l'élément de calcul <b>réutilisable</b> — le même item « MTD » s'applique à <code class="inl">[Sales Amount]</code>, <code class="inl">[Quantity]</code> ou <code class="inl">[Profit]</code>, sans écrire une variante pour chaque mesure.</p>
      <p>C'est précisément l'intérêt des groupes de calcul face à la multiplication des mesures de time intelligence : au lieu de 3 mesures × 5 périodes = 15 mesures, on a 3 mesures et 5 éléments de calcul.</p>
      <p><b>Indice dans l'énoncé :</b> les <b>parenthèses vides</b> confirment une signature <b>sans argument</b> — ce qui élimine déjà <code class="inl">SELECTEDVALUE</code>.</p>
      <p class="why">Les distracteurs</p>
      <ul>
        <li><b>GENERATE</b> produit un produit cartésien corrélé entre deux tables et ne modifie aucun contexte.</li>
        <li><b>MEASURE</b> est un <b>mot-clé</b> réservé aux blocs <code class="inl">DEFINE</code> d'une requête DAX, pas une fonction utilisable ici.</li>
        <li><b>COMBINEVALUES</b> concatène des valeurs textuelles pour créer des clés composites.</li>
        <li><b>SELECTEDVALUE</b> retourne la valeur unique d'une colonne dans le contexte courant : elle prend une <b>colonne</b> en argument, pas <code class="inl">()</code>, et ne référence pas une mesure.</li>
      </ul>
      <p class="note"><b>Le patron à mémoriser.</b> Élément de groupe de calcul = <code class="inl">CALCULATE ( SELECTEDMEASURE (), &lt;modificateur de contexte&gt; )</code>.</p>`,
      en:`
      <p><code class="inl">CALCULATE(expression, filter1, …)</code> is the <b>only</b> DAX function able to <b>modify an expression's filter context</b>. That is the heart of every calculation item: re-evaluating a measure under a different time context.</p>
      <p class="why">SELECTEDMEASURE() — the key to calculation groups</p>
      <p>It is a function <b>specific to calculation groups</b>: a <b>placeholder</b> for the measure currently being evaluated in the report context. That is what makes the calculation item <b>reusable</b> — the same "MTD" item applies to <code class="inl">[Sales Amount]</code>, <code class="inl">[Quantity]</code> or <code class="inl">[Profit]</code>, without writing a variant per measure.</p>
      <p>That is precisely the point of calculation groups against the proliferation of time-intelligence measures: instead of 3 measures × 5 periods = 15 measures, you have 3 measures and 5 calculation items.</p>
      <p><b>Clue in the stem:</b> the <b>empty parentheses</b> confirm an <b>argument-free</b> signature — which already rules out <code class="inl">SELECTEDVALUE</code>.</p>
      <p class="why">The distractors</p>
      <ul>
        <li><b>GENERATE</b> produces a correlated cartesian product between two tables and modifies no context.</li>
        <li><b>MEASURE</b> is a <b>keyword</b> reserved for <code class="inl">DEFINE</code> blocks in a DAX query, not a function usable here.</li>
        <li><b>COMBINEVALUES</b> concatenates text values to build composite keys.</li>
        <li><b>SELECTEDVALUE</b> returns a column's single value in the current context: it takes a <b>column</b> as argument, not <code class="inl">()</code>, and does not reference a measure.</li>
      </ul>
      <p class="note"><b>The pattern to memorize.</b> Calculation group item = <code class="inl">CALCULATE ( SELECTEDMEASURE (), &lt;context modifier&gt; )</code>.</p>`}
  },
  {
    id:"q315", kind:"single", type:T1,
    title:{fr:"Chaîne de format dynamique",en:"Dynamic format string"},
    stem:{fr:`<p>Vous avez un modèle sémantique Power BI contenant une mesure nommée <b>TotalSalesAmount</b>. TotalSalesAmount retourne un montant de chiffre d'affaires <b>traduit dans une devise sélectionnée</b>. Vous devez garantir que la valeur retournée est formatée avec le <b>bon symbole monétaire</b>.</p><p class="ask">Que devez-vous inclure dans la solution ?</p>`,
          en:`<p>You have a Power BI semantic model that contains a measure named <b>TotalSalesAmount</b>. TotalSalesAmount returns a revenue amount <b>translated into a selected currency</b>. You need to ensure that the returned value is formatted with the <b>correct currency symbol</b>.</p><p class="ask">What should you include in the solution?</p>`},
    options:[
      {k:"A", fr:"un paramètre de champ (field parameter)", en:"a field parameter"},
      {k:"B", fr:"un schéma linguistique (linguistic schema)", en:"a linguistic schema"},
      {k:"C", fr:"une chaîne de format dynamique (dynamic format string)", en:"a dynamic format string"},
      {k:"D", fr:"la fonction DAX WINDOW", en:"the WINDOW DAX function"}
    ],
    answer:["C"],
    explain:{fr:`
      <p>Une chaîne de format <b>statique</b> (<code class="inl">"$#,##0.00"</code>) est figée : elle afficherait un symbole dollar même quand l'utilisateur sélectionne l'euro ou le yen. Or ici <b>le montant est déjà converti</b> — seul l'habillage doit suivre.</p>
      <p>La <b>chaîne de format dynamique</b> permet d'écrire une expression DAX qui produit le format <b>à l'exécution</b>, réévaluée dans le contexte du rapport :</p>
      <pre class="code">SWITCH (
    SELECTEDVALUE ( Currency[CurrencyCode] ),
    "USD", "$#,##0.00",
    "EUR", "#,##0.00 €",
    "GBP", "£#,##0.00",
    "JPY", "¥#,##0",
    "#,##0.00"
)</pre>
      <p>Le <b>montant calculé reste inchangé</b> ; seul son affichage s'adapte.</p>
      <p class="why">Deux modes d'implémentation</p>
      <ul>
        <li>Directement <b>sur la mesure</b> — propriété <i>Dynamic format string</i> dans Power BI Desktop.</li>
        <li>Via un <b>élément de groupe de calcul</b> — propriété <code class="inl">FormatStringDefinition</code>, ce qui permet de réutiliser la même logique pour <b>toutes</b> les mesures monétaires du modèle.</li>
      </ul>
      <p class="why">Les trois autres</p>
      <ul>
        <li><b>A — Field parameter.</b> Permet à l'utilisateur de basculer entre des champs ou des mesures dans un visuel (changer l'axe d'analyse) ; il n'affecte <b>pas le format d'affichage</b>.</li>
        <li><b>B — Linguistic schema.</b> Fichier YAML qui enrichit le vocabulaire de <b>Q&amp;A</b> avec synonymes et expressions. Sans rapport avec le formatage.</li>
        <li><b>D — WINDOW.</b> Fonction de <b>fenêtrage</b> DAX retournant une plage de lignes relative à la ligne courante (cumuls, moyennes mobiles) : purement calculatoire.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> Un format qui <b>varie selon une sélection</b> = chaîne de format dynamique (sur la mesure ou via un groupe de calcul). Un format figé ne peut pas suivre une devise choisie.</p>`,
      en:`
      <p>A <b>static</b> format string (<code class="inl">"$#,##0.00"</code>) is frozen: it would show a dollar sign even when the user selects euros or yen. Yet here <b>the amount is already converted</b> — only the presentation has to follow.</p>
      <p>The <b>dynamic format string</b> lets you write a DAX expression that produces the format <b>at run time</b>, re-evaluated in the report context:</p>
      <pre class="code">SWITCH (
    SELECTEDVALUE ( Currency[CurrencyCode] ),
    "USD", "$#,##0.00",
    "EUR", "#,##0.00 €",
    "GBP", "£#,##0.00",
    "JPY", "¥#,##0",
    "#,##0.00"
)</pre>
      <p>The <b>calculated amount is unchanged</b>; only its display adapts.</p>
      <p class="why">Two implementation modes</p>
      <ul>
        <li>Directly <b>on the measure</b> — the <i>Dynamic format string</i> property in Power BI Desktop.</li>
        <li>Through a <b>calculation group item</b> — the <code class="inl">FormatStringDefinition</code> property, which lets you reuse the same logic for <b>all</b> monetary measures in the model.</li>
      </ul>
      <p class="why">The other three</p>
      <ul>
        <li><b>A — Field parameter.</b> Lets users switch between fields or measures in a visual (changing the analysis axis); it does <b>not affect display format</b>.</li>
        <li><b>B — Linguistic schema.</b> A YAML file that enriches the <b>Q&amp;A</b> vocabulary with synonyms and phrasings. Unrelated to formatting.</li>
        <li><b>D — WINDOW.</b> A DAX <b>windowing</b> function returning a range of rows relative to the current row (running totals, moving averages): purely computational.</li>
      </ul>
      <p class="note"><b>The reflex.</b> A format that <b>varies with a selection</b> = dynamic format string (on the measure or via a calculation group). A fixed format cannot follow a chosen currency.</p>`}
  },
  {
    id:"q316", kind:"single", type:T1,
    title:{fr:"Quand KEEPFILTERS bat FILTER",en:"When KEEPFILTERS beats FILTER"},
    stem:{fr:`<p>Vous avez un modèle sémantique Power BI contenant des mesures. Ces mesures utilisent plusieurs fonctions <code class="inl">CALCULATE</code> et une fonction <code class="inl">FILTER</code>. Vous évaluez les performances des mesures.</p><p class="ask">Dans quel cas d'usage le remplacement de la fonction FILTER par la fonction KEEPFILTERS réduira-t-il le temps d'exécution ?</p>`,
          en:`<p>You have a Power BI semantic model that contains measures. The measures use several <code class="inl">CALCULATE</code> functions and a <code class="inl">FILTER</code> function. You are evaluating the performance of the measures.</p><p class="ask">In which use case will replacing the FILTER function with the KEEPFILTERS function reduce execution time?</p>`},
    options:[
      {k:"A", fr:"quand la fonction FILTER utilise une fonction calculate imbriquée", en:"when the FILTER function uses a nested calculate function"},
      {k:"B", fr:"quand la fonction FILTER référence une mesure", en:"when the FILTER function references a measure"},
      {k:"C", fr:"quand la fonction FILTER référence des colonnes de plusieurs tables", en:"when the FILTER function references columns from multiple tables"},
      {k:"D", fr:"quand la fonction FILTER référence une colonne d'une seule table en mode Import", en:"when the FILTER function references a column from a single table that is an Import mode table"}
    ],
    answer:["D"],
    explain:{fr:`
      <p>La différence de performance tient à <b>quel moteur exécute le filtre</b>.</p>
      <p class="why">Avec FILTER — le formula engine</p>
      <p>DAX doit <b>matérialiser une table itérée ligne par ligne</b>. Cette itération est confiée au <b>formula engine</b>, qui est <b>monothread</b> et travaille sur des tables <b>non compressées</b> en mémoire. Sur une grande dimension, le coût devient significatif.</p>
      <pre class="code">CALCULATE ( [Sales], FILTER ( Product, Product[Color] = "Red" ) )
CALCULATE ( [Sales], KEEPFILTERS ( Product[Color] = "Red" ) )</pre>
      <p class="why">Avec KEEPFILTERS — le storage engine</p>
      <p>Lorsque le prédicat porte sur <b>une seule colonne d'une seule table en mode Import</b>, le moteur peut le traduire en un simple filtre <b>poussé directement au storage engine (VertiPaq)</b> : <b>multithread</b>, compressé et mis en cache, il applique le prédicat <b>sans matérialiser de table intermédiaire</b>.</p>
      <p>Sémantiquement, les deux formes sont <b>équivalentes</b> : <code class="inl">KEEPFILTERS</code> préserve le contexte de filtre existant au lieu de le remplacer, exactement le comportement de <code class="inl">FILTER</code> sur la table entière.</p>
      <p class="why">Pourquoi les trois autres empêchent l'optimisation</p>
      <ul>
        <li><b>A — CALCULATE imbriqué</b> à l'intérieur du filtre force nécessairement le formula engine (transition de contexte).</li>
        <li><b>B — Une mesure</b> implique une évaluation contextuelle ligne par ligne : impossible de la pousser vers VertiPaq.</li>
        <li><b>C — Un prédicat multi-tables</b> ne se traduit pas en filtre simple sur une seule colonne.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> <code class="inl">KEEPFILTERS(Table[Col] = valeur)</code> sur une <b>colonne unique</b> en <b>Import</b> → filtre résolu par VertiPaq. Dès qu'une mesure, un CALCULATE ou plusieurs tables entrent en jeu, le formula engine reprend la main et le gain disparaît.</p>`,
      en:`
      <p>The performance difference comes down to <b>which engine executes the filter</b>.</p>
      <p class="why">With FILTER — the formula engine</p>
      <p>DAX must <b>materialize a table and iterate it row by row</b>. That iteration falls to the <b>formula engine</b>, which is <b>single-threaded</b> and works on <b>uncompressed</b> in-memory tables. On a large dimension the cost becomes significant.</p>
      <pre class="code">CALCULATE ( [Sales], FILTER ( Product, Product[Color] = "Red" ) )
CALCULATE ( [Sales], KEEPFILTERS ( Product[Color] = "Red" ) )</pre>
      <p class="why">With KEEPFILTERS — the storage engine</p>
      <p>When the predicate is on <b>a single column of a single Import-mode table</b>, the engine can translate it into a simple filter <b>pushed straight to the storage engine (VertiPaq)</b>: <b>multi-threaded</b>, compressed and cached, it applies the predicate <b>without materializing an intermediate table</b>.</p>
      <p>Semantically the two forms are <b>equivalent</b>: <code class="inl">KEEPFILTERS</code> preserves the existing filter context instead of replacing it — exactly what <code class="inl">FILTER</code> over the whole table does.</p>
      <p class="why">Why the other three block the optimization</p>
      <ul>
        <li><b>A — A nested CALCULATE</b> inside the filter necessarily forces the formula engine (context transition).</li>
        <li><b>B — A measure</b> implies row-by-row contextual evaluation: it cannot be pushed to VertiPaq.</li>
        <li><b>C — A multi-table predicate</b> does not translate into a simple single-column filter.</li>
      </ul>
      <p class="note"><b>The reflex.</b> <code class="inl">KEEPFILTERS(Table[Col] = value)</code> on a <b>single column</b> in <b>Import</b> → filter resolved by VertiPaq. As soon as a measure, a CALCULATE or several tables are involved, the formula engine takes over and the gain disappears.</p>`}
  },
  {
    id:"q317", kind:"single", type:T1,
    title:{fr:"Relation many-to-many entre clients et comptes",en:"Many-to-many between customers and accounts"},
    stem:{fr:`<p>Vous avez un modèle sémantique nommé <b>Model1</b> contenant des données sur les clients et leurs soldes de comptes bancaires :</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Table</th><th>Colonnes</th></tr>
      <tr><td>DimAccount</td><td>AccountKey (surrogate key), AccountNumber (business key)</td></tr>
      <tr><td>FactTransaction</td><td>Date, AccountKey (clé étrangère vers DimAccount), Amount</td></tr>
      <tr><td>DimCustomer</td><td>CustomerKey (surrogate key), CustomerID (business key), CustomerName</td></tr>
    </table></div>
    <p>Un client peut avoir <b>un ou plusieurs comptes</b>. Chaque compte peut être associé à <b>plusieurs clients</b>. Vous devez permettre aux utilisateurs d'interroger Model1 pour identifier les <b>montants totaux de transactions par client</b>.</p><p class="ask">Que devez-vous ajouter à Model1 ?</p>`,
          en:`<p>You have a semantic model named <b>Model1</b> that contains data about customers and their bank account balances:</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Table</th><th>Columns</th></tr>
      <tr><td>DimAccount</td><td>AccountKey (surrogate key), AccountNumber (business key)</td></tr>
      <tr><td>FactTransaction</td><td>Date, AccountKey (foreign key to DimAccount), Amount</td></tr>
      <tr><td>DimCustomer</td><td>CustomerKey (surrogate key), CustomerID (business key), CustomerName</td></tr>
    </table></div>
    <p>A customer can have <b>one or more accounts</b>. Each account can be associated with <b>multiple customers</b>. You need to enable users to query Model1 to identify the <b>total transaction amounts by customer</b>.</p><p class="ask">What should you add to Model1?</p>`},
    options:[
      {k:"A", fr:"une relation plusieurs-à-plusieurs entre FactTransaction et DimCustomer", en:"a many-to-many relationship between FactTransaction and DimCustomer"},
      {k:"B", fr:"une table de pont avec des relations vers DimCustomer et DimAccount", en:"a bridge table that has relationships to DimCustomer and DimAccount"},
      {k:"C", fr:"une table de pont avec des relations vers FactTransaction et DimCustomer", en:"a bridge table that has relationships to FactTransaction and DimCustomer"},
      {k:"D", fr:"la colonne CustomerKey dans FactTransaction et une relation vers DimCustomer", en:"the CustomerKey column in FactTransaction and a relationship to DimCustomer"}
    ],
    answer:["C"],
    explain:{fr:`
      <p>Le problème est une relation <b>many-to-many</b> entre clients et comptes : un client détient plusieurs comptes, un compte <b>joint</b> appartient à plusieurs clients. Or <code class="inl">FactTransaction</code> ne référence que <code class="inl">AccountKey</code> — <b>aucun lien direct vers le client</b>.</p>
      <p>La solution canonique en modélisation dimensionnelle est une <b>table de pont</b> (bridge table), qui enregistre chaque paire client-compte valide et absorbe ainsi la cardinalité many-to-many :</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>CustomerKey</th><th>AccountKey</th></tr>
        <tr><td>1</td><td>100</td></tr>
        <tr><td>2</td><td>100</td></tr>
        <tr><td>1</td><td>101</td></tr>
      </table></div>
      <p class="why">Le point délicat : le sens des relations</p>
      <p>L'énoncé retient « bridge avec relations vers <b>FactTransaction</b> et DimCustomer », pas « vers DimCustomer et DimAccount » : <b>le filtre doit atteindre la table de faits</b>. En pratique, la table de pont porte <code class="inl">CustomerKey</code> et <code class="inl">AccountKey</code>, et l'on établit une relation avec FactTransaction sur <code class="inl">AccountKey</code>, avec un <b>filtrage croisé bidirectionnel</b>, pour que la sélection d'un client se propage jusqu'aux transactions.</p>
      <p class="why">Les trois autres</p>
      <ul>
        <li><b>A</b> est <b>impossible</b> : FactTransaction ne contient aucune colonne identifiant le client, il n'y a <b>rien sur quoi</b> établir la relation.</li>
        <li><b>B</b> relie les deux <b>dimensions entre elles</b>, mais le filtre n'atteint jamais la table de faits — les montants ne peuvent pas être agrégés par client.</li>
        <li><b>D</b> est le <b>piège majeur</b> : chaque transaction devrait être <b>dupliquée</b> pour chaque cotitulaire du compte, provoquant un <b>double comptage</b> des montants. L'option semble simplifier le modèle mais fausse tous les totaux dès qu'un compte est partagé.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> Many-to-many dimension/faits = <b>table de pont reliée à la table de faits</b>, pas à une autre dimension. Et méfiez-vous de l'option qui « aplatit » la clé dans les faits : elle duplique les mesures.</p>`,
      en:`
      <p>The problem is a <b>many-to-many</b> relationship between customers and accounts: a customer holds several accounts, and a <b>joint</b> account belongs to several customers. Yet <code class="inl">FactTransaction</code> only references <code class="inl">AccountKey</code> — <b>no direct link to the customer</b>.</p>
      <p>The canonical dimensional-modelling solution is a <b>bridge table</b>, which records every valid customer-account pair and absorbs the many-to-many cardinality:</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>CustomerKey</th><th>AccountKey</th></tr>
        <tr><td>1</td><td>100</td></tr>
        <tr><td>2</td><td>100</td></tr>
        <tr><td>1</td><td>101</td></tr>
      </table></div>
      <p class="why">The delicate point: the direction of the relationships</p>
      <p>The stem's answer is "bridge with relationships to <b>FactTransaction</b> and DimCustomer", not "to DimCustomer and DimAccount": <b>the filter must reach the fact table</b>. In practice the bridge carries <code class="inl">CustomerKey</code> and <code class="inl">AccountKey</code>, and a relationship to FactTransaction is built on <code class="inl">AccountKey</code>, with <b>bidirectional cross-filtering</b>, so that selecting a customer propagates down to the transactions.</p>
      <p class="why">The other three</p>
      <ul>
        <li><b>A</b> is <b>impossible</b>: FactTransaction holds no column identifying the customer, so there is <b>nothing to build</b> the relationship on.</li>
        <li><b>B</b> links the two <b>dimensions to each other</b>, but the filter never reaches the fact table — amounts cannot be aggregated by customer.</li>
        <li><b>D</b> is the <b>major trap</b>: each transaction would have to be <b>duplicated</b> for every joint holder of the account, causing <b>double counting</b> of amounts. The option looks like a simplification but corrupts every total as soon as an account is shared.</li>
      </ul>
      <p class="note"><b>The reflex.</b> Dimension/fact many-to-many = <b>bridge table linked to the fact table</b>, not to another dimension. And beware the option that "flattens" the key into the facts: it duplicates the measures.</p>`}
  },
  {
    id:"q318", kind:"fields", type:TY,
    title:{fr:"Format PBIR et référence au modèle sémantique",en:"PBIR format and semantic model reference"},
    stem:{fr:`<p>Vous avez un projet Microsoft Power BI contenant un fichier nommé <code class="inl">definition.pbir</code> :</p>
    <pre class="code">{
    "version": "1.0",
    "datasetReference": {
      "byPath": { "path": "../Sales.Dataset" },
      "byConnection": null
    }
}</pre>
    <p class="ask">Pour chacune des affirmations suivantes, indiquez si elle est vraie.</p>`,
          en:`<p>You have a Microsoft Power BI project that contains a file named <code class="inl">definition.pbir</code>:</p>
    <pre class="code">{
    "version": "1.0",
    "datasetReference": {
      "byPath": { "path": "../Sales.Dataset" },
      "byConnection": null
    }
}</pre>
    <p class="ask">For each statement, select Yes if it is true. Otherwise, select No.</p>`},
    fields:[
      {label:{fr:"definition.pbir est au format PBIR-Legacy.",en:"definition.pbir is in the PBIR-Legacy format."}, hint:{fr:"monolithique ou granulaire ?",en:"monolithic or granular?"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1},
      {label:{fr:"Le modèle sémantique référencé se trouve dans le service Power BI.",en:"The semantic model referenced is located in the Power BI service."}, hint:{fr:"byPath ou byConnection ?",en:"byPath or byConnection?"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1},
      {label:{fr:"À l'ouverture du rapport, Power BI Desktop ouvrira le modèle en mode d'édition complet.",en:"When the associated report is opened, Power BI Desktop will open the model in full edit mode."}, hint:{fr:"conséquence de byPath",en:"consequence of byPath"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0}
    ],
    explain:{fr:`
      <p class="why">1 — Format PBIR-Legacy → <b>No</b></p>
      <p>Un projet Power BI (<code class="inl">.pbip</code>) peut stocker la définition de rapport sous <b>deux formats</b> :</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Format</th><th>Structure</th></tr>
        <tr><td><b>PBIR-Legacy</b></td><td>Le rapport est un fichier <b>monolithique</b> <code class="inl">report.json</code></td></tr>
        <tr><td><b>PBIR (enhanced)</b></td><td>Le rapport est <b>éclaté en fichiers granulaires</b> — pages, visuels — avec un <code class="inl">definition.pbir</code> comme point d'entrée</td></tr>
      </table></div>
      <p>La présence même d'un fichier <code class="inl">definition.pbir</code> ainsi structuré indique le format <b>PBIR</b>, celui qui permet un vrai contrôle de version avec des diffs lisibles et des fusions Git exploitables.</p>
      <p class="why">2 — Modèle dans le service → <b>No</b></p>
      <p>Les deux propriétés sont <b>mutuellement exclusives</b> :</p>
      <ul>
        <li><code class="inl">byPath</code> : le modèle est un <b>dossier local</b>, adjacent au rapport dans le projet.</li>
        <li><code class="inl">byConnection</code> : il est <b>distant</b> (service Power BI ou Analysis Services), référencé par chaîne de connexion.</li>
      </ul>
      <p>Ici <code class="inl">byPath</code> pointe vers <code class="inl">../Sales.Dataset</code> — un chemin relatif sur le système de fichiers — et <code class="inl">byConnection</code> vaut <code class="inl">null</code>.</p>
      <p class="why">3 — Mode d'édition complet → <b>Yes</b></p>
      <p>Puisque le modèle fait partie du <b>même projet local</b>, Power BI Desktop l'ouvre avec l'ensemble des capacités d'édition : ajout de tables, création de mesures, gestion des relations, transformations Power Query.</p>
      <p>C'est précisément la différence avec un modèle référencé par <code class="inl">byConnection</code> : dans ce cas, Desktop se connecte en <b>live connection</b> au modèle publié et l'édition est <b>bridée</b> — on ne peut créer que des mesures de rapport, sans toucher aux tables ni aux relations.</p>
      <p class="note"><b>Le réflexe.</b> <code class="inl">byPath</code> = modèle local, <b>édition complète</b>. <code class="inl">byConnection</code> = modèle distant, <b>live connection</b> et édition restreinte.</p>`,
      en:`
      <p class="why">1 — PBIR-Legacy format → <b>No</b></p>
      <p>A Power BI project (<code class="inl">.pbip</code>) can store the report definition in <b>two formats</b>:</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Format</th><th>Structure</th></tr>
        <tr><td><b>PBIR-Legacy</b></td><td>The report is a <b>monolithic</b> <code class="inl">report.json</code> file</td></tr>
        <tr><td><b>PBIR (enhanced)</b></td><td>The report is <b>split into granular files</b> — pages, visuals — with a <code class="inl">definition.pbir</code> as the entry point</td></tr>
      </table></div>
      <p>The very presence of a <code class="inl">definition.pbir</code> structured this way indicates the <b>PBIR</b> format, the one that enables real version control with readable diffs and workable Git merges.</p>
      <p class="why">2 — Model in the service → <b>No</b></p>
      <p>The two properties are <b>mutually exclusive</b>:</p>
      <ul>
        <li><code class="inl">byPath</code>: the model is a <b>local folder</b>, adjacent to the report in the project.</li>
        <li><code class="inl">byConnection</code>: it is <b>remote</b> (Power BI service or Analysis Services), referenced by connection string.</li>
      </ul>
      <p>Here <code class="inl">byPath</code> points to <code class="inl">../Sales.Dataset</code> — a relative file-system path — and <code class="inl">byConnection</code> is <code class="inl">null</code>.</p>
      <p class="why">3 — Full edit mode → <b>Yes</b></p>
      <p>Since the model is part of the <b>same local project</b>, Power BI Desktop opens it with the full set of editing capabilities: adding tables, creating measures, managing relationships, Power Query transformations.</p>
      <p>That is precisely the difference with a model referenced <code class="inl">byConnection</code>: there, Desktop connects in <b>live connection</b> to the published model and editing is <b>restricted</b> — you can only create report-level measures, without touching tables or relationships.</p>
      <p class="note"><b>The reflex.</b> <code class="inl">byPath</code> = local model, <b>full editing</b>. <code class="inl">byConnection</code> = remote model, <b>live connection</b> and restricted editing.</p>`}
  },
  {
    id:"q319", kind:"fields", type:TH,
    title:{fr:"Configurer un modèle pour MDX et le rendu",en:"Configuring a model for MDX and rendering"},
    stem:{fr:`<p>Vous avez un locataire Fabric contenant un lakehouse nommé <b>LH1</b>. Vous devez déployer un nouveau modèle sémantique répondant aux exigences suivantes :</p>
    <ul>
      <li>Prendre en charge des <b>colonnes calculées complexes</b> incluant des fonctions d'agrégation, des <b>tables calculées</b> et des <b>hiérarchies utilisateur MDX</b> (Multidimensional Expressions).</li>
      <li><b>Minimiser les temps de rendu des pages.</b></li>
    </ul>
    <p class="ask">Comment devez-vous configurer le modèle ?</p>`,
          en:`<p>You have a Fabric tenant that contains a lakehouse named <b>LH1</b>. You need to deploy a new semantic model that meets the following requirements:</p>
    <ul>
      <li>Support <b>complex calculated columns</b> that include aggregate functions, <b>calculated tables</b>, and <b>Multidimensional Expressions (MDX) user hierarchies</b>.</li>
      <li><b>Minimize page rendering times.</b></li>
    </ul>
    <p class="ask">How should you configure the model?</p>`},
    fields:[
      {label:{fr:"Mode",en:"Mode"}, hint:{fr:"colonnes et tables calculées, MDX",en:"calculated columns and tables, MDX"},
       opts:{fr:["Direct Lake","DirectQuery","Import"],en:["Direct Lake","DirectQuery","Import"]}, ans:2},
      {label:{fr:"Query Caching",en:"Query Caching"}, hint:{fr:"minimiser le temps de rendu",en:"minimize rendering time"},
       opts:{fr:["Capacity default","Off","On"],en:["Capacity default","Off","On"]}, ans:2}
    ],
    explain:{fr:`
      <p class="why">Le mode : Import, par élimination stricte</p>
      <p>La première exigence est une liste de fonctionnalités que <b>Direct Lake ne prend pas en charge</b>. C'est l'un des rares endroits où l'examen teste les <i>limites</i> de Direct Lake plutôt que ses avantages.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Fonctionnalité demandée</th><th>Import</th><th>Direct Lake</th><th>DirectQuery</th></tr>
        <tr><td>Colonnes calculées DAX complexes</td><td><b>Oui</b></td><td><b>Non</b></td><td>Limitées</td></tr>
        <tr><td>Tables calculées</td><td><b>Oui</b></td><td><b>Non</b></td><td>Non</td></tr>
        <tr><td>Hiérarchies utilisateur MDX</td><td><b>Oui</b></td><td><b>Non</b></td><td>Non</td></tr>
      </table></div>
      <p>Direct Lake lit les fichiers Delta tels quels : il n'existe pas d'étape de calcul où matérialiser une colonne ou une table calculée. Quant aux hiérarchies MDX, elles sont nécessaires aux clients qui interrogent le modèle en MDX — Excel notamment — et Direct Lake ne les expose pas.</p>
      <p><b>DirectQuery</b> échoue sur les mêmes points <i>et</i> sur le second critère : chaque visuel déclenche une requête vers la source, ce qui est le pire profil pour minimiser les temps de rendu.</p>
      <p class="why">Query Caching : On</p>
      <p>Une fois le mode Import retenu, la seconde exigence — <i>minimize page rendering times</i> — se règle avec la <b>mise en cache des requêtes</b>. Le service conserve les résultats des requêtes des visuels et les ressert sans réévaluer le modèle : les ouvertures de page suivantes sont quasi instantanées.</p>
      <ul>
        <li><b>Off</b> irait dans le sens contraire de l'exigence.</li>
        <li><b>Capacity default</b> laisse le comportement dépendre d'un réglage extérieur au modèle — or l'énoncé demande une <b>garantie</b>, pas une probabilité.</li>
      </ul>
      <p>Point à connaître : le query caching n'est disponible que sur les modes de licence Premium ou Fabric, et <b>uniquement pour les modèles Import ou LiveConnect</b> — ce qui confirme au passage que le premier menu devait être Import.</p>
      <p class="note"><b>Le réflexe.</b> Direct Lake est excellent par défaut, mais il <b>ne sait pas tout faire</b> : ni colonne calculée, ni table calculée, ni hiérarchie MDX. Dès qu'un énoncé cite l'une de ces trois, la réponse est <b>Import</b>. Et <i>minimize rendering times</i> sur un modèle Import appelle le <b>query caching</b>.</p>`,
      en:`
      <p class="why">The mode: Import, by strict elimination</p>
      <p>The first requirement is a list of features <b>Direct Lake does not support</b>. It is one of the rare places where the exam tests Direct Lake's <i>limits</i> rather than its benefits.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Requested feature</th><th>Import</th><th>Direct Lake</th><th>DirectQuery</th></tr>
        <tr><td>Complex DAX calculated columns</td><td><b>Yes</b></td><td><b>No</b></td><td>Limited</td></tr>
        <tr><td>Calculated tables</td><td><b>Yes</b></td><td><b>No</b></td><td>No</td></tr>
        <tr><td>MDX user hierarchies</td><td><b>Yes</b></td><td><b>No</b></td><td>No</td></tr>
      </table></div>
      <p>Direct Lake reads the Delta files as they are: there is no calculation step in which to materialise a calculated column or table. As for MDX hierarchies, they are needed by clients querying the model in MDX — Excel in particular — and Direct Lake does not expose them.</p>
      <p><b>DirectQuery</b> fails on the same points <i>and</i> on the second criterion: every visual fires a query at the source, the worst possible profile for minimizing rendering times.</p>
      <p class="why">Query Caching: On</p>
      <p>With Import settled, the second requirement — <i>minimize page rendering times</i> — is met by <b>query caching</b>. The service keeps the results of visual queries and serves them again without re-evaluating the model: subsequent page opens are near-instant.</p>
      <ul>
        <li><b>Off</b> would run against the requirement.</li>
        <li><b>Capacity default</b> leaves behaviour dependent on a setting outside the model — yet the stem asks for a <b>guarantee</b>, not a likelihood.</li>
      </ul>
      <p>Worth knowing: query caching is available only on Premium or Fabric license modes, and <b>only for Import or LiveConnect models</b> — which incidentally confirms the first menu had to be Import.</p>
      <p class="note"><b>The reflex.</b> Direct Lake is excellent by default, but it <b>cannot do everything</b>: no calculated column, no calculated table, no MDX hierarchy. As soon as a stem names one of those three, the answer is <b>Import</b>. And <i>minimize rendering times</i> on an Import model calls for <b>query caching</b>.</p>`}
  },
  {
    id:"q320", kind:"single", type:T1,
    title:{fr:"Quel outil pour modifier l'OLS",en:"Which tool to modify OLS"},
    stem:{fr:`<p>Vous avez un locataire Fabric contenant un modèle sémantique. Vous devez modifier la <b>sécurité au niveau objet (OLS)</b> du modèle.</p>
    <p class="ask">Que devez-vous utiliser ?</p>`,
          en:`<p>You have a Fabric tenant that contains a semantic model. You need to modify <b>object-level security (OLS)</b> for the model.</p>
    <p class="ask">What should you use?</p>`},
    options:[
      {k:"A", fr:"le service Fabric", en:"the Fabric service"},
      {k:"B", fr:"Microsoft Power BI Desktop", en:"Microsoft Power BI Desktop"},
      {k:"C", fr:"ALM Toolkit", en:"ALM Toolkit"},
      {k:"D", fr:"Tabular Editor", en:"Tabular Editor"}
    ],
    answer:["D"],
    explain:{fr:`
      <p>L'<b>OLS</b> masque des <b>tables ou des colonnes entières</b> à certains rôles : l'objet n'apparaît plus du tout dans la liste des champs, et toute mesure qui le référence échoue pour l'utilisateur concerné. C'est une sécurité réelle, à ne pas confondre avec la propriété <i>Hidden</i>, qui n'est qu'un confort d'affichage.</p>
      <p class="why">Pourquoi Tabular Editor</p>
      <p>L'OLS se définit par la propriété <code class="inl">metadataPermission</code> sur une table ou une colonne, au sein d'un rôle. <b>Aucune interface graphique Microsoft n'expose cette propriété</b> : ni Power BI Desktop, ni le service. Tabular Editor est l'outil tiers de référence pour éditer le modèle tabulaire au niveau des métadonnées, et il se connecte via le point de terminaison XMLA.</p>
      <pre class="code">Rôle → Table ou colonne → Object Level Security → None</pre>
      <p class="why">Pourquoi Power BI Desktop est le distracteur principal</p>
      <p>Desktop gère bien la sécurité au niveau <b>ligne</b> (RLS) : le bouton <i>Manage roles</i> permet de créer des rôles et d'écrire des filtres DAX. Il est donc naturel de penser qu'il gère aussi l'OLS. <b>Ce n'est pas le cas</b> : la distinction RLS / OLS est précisément ce que la question teste.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Outil</th><th>RLS</th><th>OLS</th></tr>
        <tr><td class="m">Power BI Desktop</td><td><b>Oui</b> — Manage roles</td><td><b>Non</b></td></tr>
        <tr><td class="m">Service Fabric / Power BI</td><td>Assignation des membres aux rôles</td><td>Non</td></tr>
        <tr><td class="m">Tabular Editor</td><td>Oui</td><td><b>Oui</b></td></tr>
        <tr><td class="m">ALM Toolkit</td><td colspan="2">Ni l'un ni l'autre — outil de <b>comparaison et de déploiement</b> de modèles</td></tr>
      </table></div>
      <p class="why">Les deux autres</p>
      <ul>
        <li><b>A — le service Fabric.</b> Permet d'assigner des utilisateurs aux rôles existants, jamais de définir ce que le rôle masque.</li>
        <li><b>C — ALM Toolkit.</b> Compare deux modèles et déploie les différences. Il <b>transporte</b> une définition OLS d'un environnement à l'autre, mais ne la crée ni ne la modifie.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> Toute propriété du modèle tabulaire que l'interface Microsoft n'expose pas — OLS, <code class="inl">DiscourageImplicitMeasures</code>, <code class="inl">DirectLakeBehavior</code>, les groupes de calcul dans les versions anciennes — se règle dans <b>Tabular Editor</b>, via XMLA.</p>`,
      en:`
      <p><b>OLS</b> hides <b>whole tables or columns</b> from certain roles: the object disappears entirely from the field list, and any measure referencing it fails for that user. It is real security, not to be confused with the <i>Hidden</i> property, which is mere display convenience.</p>
      <p class="why">Why Tabular Editor</p>
      <p>OLS is defined by the <code class="inl">metadataPermission</code> property on a table or column, inside a role. <b>No Microsoft graphical interface exposes that property</b>: not Power BI Desktop, not the service. Tabular Editor is the reference third-party tool for editing the tabular model at metadata level, and it connects over the XMLA endpoint.</p>
      <pre class="code">Role → Table or column → Object Level Security → None</pre>
      <p class="why">Why Power BI Desktop is the main distractor</p>
      <p>Desktop does handle <b>row</b>-level security (RLS): the <i>Manage roles</i> button lets you create roles and write DAX filters. So it feels natural to assume it handles OLS too. <b>It does not</b>: the RLS / OLS distinction is precisely what this question tests.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Tool</th><th>RLS</th><th>OLS</th></tr>
        <tr><td class="m">Power BI Desktop</td><td><b>Yes</b> — Manage roles</td><td><b>No</b></td></tr>
        <tr><td class="m">Fabric / Power BI service</td><td>Assigning members to roles</td><td>No</td></tr>
        <tr><td class="m">Tabular Editor</td><td>Yes</td><td><b>Yes</b></td></tr>
        <tr><td class="m">ALM Toolkit</td><td colspan="2">Neither — a model <b>comparison and deployment</b> tool</td></tr>
      </table></div>
      <p class="why">The other two</p>
      <ul>
        <li><b>A — the Fabric service.</b> Lets you assign users to existing roles, never define what the role hides.</li>
        <li><b>C — ALM Toolkit.</b> Compares two models and deploys the differences. It <b>carries</b> an OLS definition from one environment to another but neither creates nor modifies it.</li>
      </ul>
      <p class="note"><b>The reflex.</b> Any tabular model property the Microsoft interface does not expose — OLS, <code class="inl">DiscourageImplicitMeasures</code>, <code class="inl">DirectLakeBehavior</code>, calculation groups in older versions — is set in <b>Tabular Editor</b>, over XMLA.</p>`}
  },
  {
    id:"q321", kind:"fields", type:TH,
    title:{fr:"Écrire un modèle Import en Delta dans OneLake",en:"Writing an Import model as Delta to OneLake"},
    stem:{fr:`<p>Vous avez un espace de travail Fabric nommé <b>Workspace1</b> qui utilise le mode de licence <b>Premium Per User (PPU)</b> et contient un modèle sémantique nommé <b>Model1</b>. Le format <b>Large semantic model storage</b> est sélectionné pour Model1.</p>
    <p>Vous devez garantir que les tables importées dans Model1 sont <b>écrites automatiquement en tables Delta dans OneLake</b>.</p>
    <p class="ask">Que devez-vous faire pour Model1 et pour Workspace1 ?</p>`,
          en:`<p>You have a Fabric workspace named <b>Workspace1</b> that uses the <b>Premium Per User (PPU)</b> license mode and contains a semantic model named <b>Model1</b>. <b>Large semantic model storage format</b> is selected for Model1.</p>
    <p>You need to ensure that tables imported into Model1 are <b>written automatically to Delta tables in OneLake</b>.</p>
    <p class="ask">What should you do for Model1 and for Workspace1?</p>`},
    fields:[
      {label:{fr:"Model1",en:"Model1"}, hint:{fr:"exposer les données en Delta",en:"expose the data as Delta"},
       opts:{fr:["Enable OneLake integration.","Enable query caching.","Enable query scale-out."],en:["Enable OneLake integration.","Enable query caching.","Enable query scale-out."]}, ans:0},
      {label:{fr:"Workspace1",en:"Workspace1"}, hint:{fr:"le mode PPU suffit-il ?",en:"is PPU enough?"},
       opts:{fr:["Change the license mode to Fabric capacity.","Create a workspace identity.","Enable authentication by using OneLake user-delegated SAS tokens."],en:["Change the license mode to Fabric capacity.","Create a workspace identity.","Enable authentication by using OneLake user-delegated SAS tokens."]}, ans:0}
    ],
    explain:{fr:`
      <p class="why">Model1 : OneLake integration</p>
      <p>C'est la fonctionnalité nommée par l'énoncé. Activée, elle fait écrire par le modèle sémantique ses tables importées <b>en format Delta dans OneLake</b>, à chaque actualisation. Les données deviennent alors lisibles par Spark, par le SQL analytics endpoint ou par un raccourci — sans copie supplémentaire ni pipeline à maintenir.</p>
      <ul>
        <li><b>Enable query caching</b> accélère la restitution des visuels. Aucun effet sur le stockage.</li>
        <li><b>Enable query scale-out</b> crée des répliques en lecture pour absorber la charge. Aucun effet sur le stockage non plus.</li>
      </ul>
      <p class="why">Workspace1 : le vrai sujet de la question</p>
      <p>Le détail qui compte est dans la première phrase : l'espace de travail est en <b>PPU</b>. Or l'intégration OneLake <b>exige une capacité Fabric (F)</b> ou une capacité Premium avec Fabric activé. En PPU, l'option n'est tout simplement pas disponible.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Mode de licence</th><th>Large semantic model storage</th><th>OneLake integration</th></tr>
        <tr><td class="m">Pro</td><td>Non</td><td>Non</td></tr>
        <tr><td class="m">PPU</td><td><b>Oui</b></td><td><b>Non</b></td></tr>
        <tr><td class="m">Fabric capacity (F)</td><td>Oui</td><td><b>Oui</b></td></tr>
      </table></div>
      <p>L'énoncé précise que <i>Large semantic model storage format</i> est déjà activé : c'est un prérequis de l'intégration OneLake, et il fonctionne en PPU. On pourrait donc croire le terrain prêt — c'est exactement l'effet recherché. Il manque la <b>capacité Fabric</b>.</p>
      <p class="why">Les deux autres options pour Workspace1</p>
      <ul>
        <li><b>Create a workspace identity.</b> Sert à authentifier l'espace de travail auprès de ressources Azure externes. Ici les données restent dans OneLake : aucune authentification externe n'entre en jeu.</li>
        <li><b>Enable authentication by using OneLake user-delegated SAS tokens.</b> Concerne la façon dont des applications tierces accèdent à OneLake. C'est une question d'<i>accès</i>, pas d'<i>écriture</i> par le modèle.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> Sur les hotspots à deux menus, l'un désigne la <b>fonctionnalité</b>, l'autre son <b>prérequis</b>. Repérez le détail d'environnement glissé dans la première phrase — mode de licence, SKU, capacité — c'est presque toujours lui que vise le second menu.</p>`,
      en:`
      <p class="why">Model1: OneLake integration</p>
      <p>This is the feature the stem names. Once enabled, it makes the semantic model write its imported tables <b>as Delta format into OneLake</b> on every refresh. The data then becomes readable by Spark, by the SQL analytics endpoint or through a shortcut — with no extra copy and no pipeline to maintain.</p>
      <ul>
        <li><b>Enable query caching</b> speeds up visual rendering. No effect on storage.</li>
        <li><b>Enable query scale-out</b> creates read replicas to absorb load. Again no effect on storage.</li>
      </ul>
      <p class="why">Workspace1: the question's real subject</p>
      <p>The detail that matters is in the first sentence: the workspace is on <b>PPU</b>. But OneLake integration <b>requires a Fabric (F) capacity</b>, or a Premium capacity with Fabric enabled. On PPU the option simply is not available.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>License mode</th><th>Large semantic model storage</th><th>OneLake integration</th></tr>
        <tr><td class="m">Pro</td><td>No</td><td>No</td></tr>
        <tr><td class="m">PPU</td><td><b>Yes</b></td><td><b>No</b></td></tr>
        <tr><td class="m">Fabric capacity (F)</td><td>Yes</td><td><b>Yes</b></td></tr>
      </table></div>
      <p>The stem points out that <i>Large semantic model storage format</i> is already on: it is a prerequisite of OneLake integration, and it works on PPU. So the ground may look prepared — which is exactly the intended effect. What is missing is the <b>Fabric capacity</b>.</p>
      <p class="why">The other two options for Workspace1</p>
      <ul>
        <li><b>Create a workspace identity.</b> Authenticates the workspace to external Azure resources. Here the data stays in OneLake: no external authentication is involved.</li>
        <li><b>Enable authentication by using OneLake user-delegated SAS tokens.</b> Concerns how third-party applications reach OneLake. That is about <i>access</i>, not about the model <i>writing</i>.</li>
      </ul>
      <p class="note"><b>The reflex.</b> On two-menu hotspots, one names the <b>feature</b> and the other its <b>prerequisite</b>. Spot the environment detail slipped into the first sentence — license mode, SKU, capacity — it is almost always what the second menu targets.</p>`}
  },
  {
    id:"q322", kind:"single", type:T1,
    title:{fr:"Repérer les clés de substitution agrégées",en:"Spotting summarized surrogate keys"},
    stem:{fr:`<p>Vous avez un modèle sémantique Power BI. Vous devez identifier les <b>colonnes de clé de substitution</b> du modèle dont la propriété <b>Summarize By</b> a une valeur <b>autre que None</b>. La solution doit <b>minimiser l'effort</b>.</p>
    <p class="ask">Que devez-vous utiliser ?</p>`,
          en:`<p>You have a Microsoft Power BI semantic model. You need to identify any <b>surrogate key columns</b> in the model that have the <b>Summarize By</b> property set to a value <b>other than None</b>. The solution must <b>minimize effort</b>.</p>
    <p class="ask">What should you use?</p>`},
    options:[
      {k:"A", fr:"Performance Analyzer dans Power BI Desktop", en:"Performance Analyzer in Power BI Desktop"},
      {k:"B", fr:"Model explorer dans Microsoft Power BI Desktop", en:"Model explorer in Microsoft Power BI Desktop"},
      {k:"C", fr:"Model view dans Microsoft Power BI Desktop", en:"Model view in Microsoft Power BI Desktop"},
      {k:"D", fr:"DAX Formatter dans DAX Studio", en:"DAX Formatter in DAX Studio"}
    ],
    answer:["C"],
    explain:{fr:`
      <p>Le problème de fond mérite d'être compris avant l'outil. Une <b>clé de substitution</b> est un identifiant technique : additionner ou moyenner des CustomerKey n'a aucun sens. Or Power BI règle automatiquement <code class="inl">Summarize By</code> sur <b>Sum</b> pour toute colonne numérique importée — clés comprises. Résultat : un utilisateur qui fait glisser la clé dans un visuel obtient une somme absurde.</p>
      <p class="why">Pourquoi Model view</p>
      <p>La <b>vue Modèle</b> affiche le diagramme des tables et, surtout, donne accès au volet <b>Properties</b> pour chaque colonne — où figure <code class="inl">Summarize By</code>. On peut y sélectionner <b>plusieurs colonnes à la fois</b> et corriger la propriété en une seule opération : c'est ce qui satisfait le critère <i>minimize effort</i>.</p>
      <p class="why">Pourquoi B est le distracteur redoutable</p>
      <p><b>Model explorer</b> existe bel et bien, et il vit précisément <i>dans</i> la vue Modèle : c'est le volet arborescent qui liste tables, mesures, rôles et groupes de calcul. Mais c'est un outil de <b>navigation</b> dans les objets sémantiques — il ne présente pas les propriétés de colonne en vis-à-vis. La réponse attendue est la vue qui les <b>expose</b>, pas le volet qui parcourt l'arborescence.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Outil</th><th>Ce qu'il fait</th><th>Montre Summarize By ?</th></tr>
        <tr><td class="m">Model view</td><td>Diagramme + volet Properties des colonnes</td><td><b>Oui</b></td></tr>
        <tr><td class="m">Model explorer</td><td>Arborescence des objets du modèle</td><td>Non</td></tr>
        <tr><td class="m">Performance Analyzer</td><td>Chronomètre les requêtes des visuels</td><td>Non — outil de performance</td></tr>
        <tr><td class="m">DAX Formatter</td><td>Met en forme du code DAX</td><td>Non — outil d'écriture</td></tr>
      </table></div>
      <p class="why">Les deux options hors sujet</p>
      <ul>
        <li><b>A — Performance Analyzer.</b> Mesure la durée d'exécution des visuels. Rien à voir avec les métadonnées de colonne.</li>
        <li><b>D — DAX Formatter.</b> Embellit une expression DAX. Il ne lit aucune propriété du modèle.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> Rattachez toujours la question à l'<b>objet manipulé</b> : une propriété de colonne se règle dans la vue qui affiche les propriétés de colonne. Et corrigez <code class="inl">Summarize By = None</code> sur toutes vos clés — c'est l'une des premières choses qu'un modélisateur vérifie.</p>`,
      en:`
      <p>The underlying problem is worth understanding before the tool. A <b>surrogate key</b> is a technical identifier: summing or averaging CustomerKey values is meaningless. Yet Power BI automatically sets <code class="inl">Summarize By</code> to <b>Sum</b> for every imported numeric column — keys included. The result: a user who drags the key into a visual gets an absurd total.</p>
      <p class="why">Why Model view</p>
      <p><b>Model view</b> shows the table diagram and, crucially, gives access to the <b>Properties</b> pane for each column — where <code class="inl">Summarize By</code> lives. You can select <b>several columns at once</b> there and fix the property in a single operation: that is what satisfies <i>minimize effort</i>.</p>
      <p class="why">Why B is the dangerous distractor</p>
      <p><b>Model explorer</b> genuinely exists, and it lives precisely <i>inside</i> Model view: it is the tree pane listing tables, measures, roles and calculation groups. But it is a <b>navigation</b> tool over semantic objects — it does not present column properties side by side. The expected answer is the view that <b>exposes</b> them, not the pane that browses the tree.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Tool</th><th>What it does</th><th>Shows Summarize By?</th></tr>
        <tr><td class="m">Model view</td><td>Diagram + column Properties pane</td><td><b>Yes</b></td></tr>
        <tr><td class="m">Model explorer</td><td>Tree of the model's objects</td><td>No</td></tr>
        <tr><td class="m">Performance Analyzer</td><td>Times the visuals' queries</td><td>No — a performance tool</td></tr>
        <tr><td class="m">DAX Formatter</td><td>Formats DAX code</td><td>No — an authoring tool</td></tr>
      </table></div>
      <p class="why">The two off-topic options</p>
      <ul>
        <li><b>A — Performance Analyzer.</b> Measures how long visuals take. Nothing to do with column metadata.</li>
        <li><b>D — DAX Formatter.</b> Prettifies a DAX expression. It reads no model property.</li>
      </ul>
      <p class="note"><b>The reflex.</b> Always tie the question to the <b>object being handled</b>: a column property is set in the view that displays column properties. And do set <code class="inl">Summarize By = None</code> on all your keys — it is one of the first things a modeller checks.</p>`}
  },
  {
    id:"q323", kind:"fields", type:TH,
    title:{fr:"Ce qu'ajoute une chaîne de format dynamique",en:"What a dynamic format string adds"},
    stem:{fr:`<p>Vous créez un rapport et un modèle sémantique dans Power BI Desktop. La mesure <b>Value</b> a la propriété <b>Format</b> réglée sur <b>Dynamic</b>, avec l'expression suivante :</p>
    <pre class="code">SWITCH ( SELECTEDVALUE ( Metric[Metric] ),
    "# of Customers", "#",
    "Gross Margin %", "0.00%",
    "#,###" )</pre>
    <p class="ask">Complétez les deux affirmations d'après ce que montre l'exhibit.</p>`,
          en:`<p>You are creating a report and a semantic model in Power BI Desktop. The <b>Value</b> measure has its <b>Format</b> property set to <b>Dynamic</b>, with the following expression:</p>
    <pre class="code">SWITCH ( SELECTEDVALUE ( Metric[Metric] ),
    "# of Customers", "#",
    "Gross Margin %", "0.00%",
    "#,###" )</pre>
    <p class="ask">Complete the two statements based on what the exhibit shows.</p>`},
    fields:[
      {label:{fr:"Un [ … ] a été ajouté à la mesure Value.",en:"A [ … ] was added to the Value measure."}, hint:{fr:"ce que Power BI crée en coulisses",en:"what Power BI creates behind the scenes"},
       opts:{fr:["calculation group","data category","dynamic format string","synonym"],en:["calculation group","data category","dynamic format string","synonym"]}, ans:0},
      {label:{fr:"La mesure Value peut retourner des valeurs formatées en [ … ].",en:"The Value measure can return values formatted as [ … ]."}, hint:{fr:"lisez les chaînes du SWITCH",en:"read the SWITCH's strings"},
       opts:{fr:["percentages only","percentages or decimals","whole numbers only","percentages or whole numbers"],en:["percentages only","percentages or decimals","whole numbers only","percentages or whole numbers"]}, ans:1}
    ],
    explain:{fr:`
