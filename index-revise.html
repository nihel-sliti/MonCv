      <p>Every other tool is <b>batch-oriented</b>: it runs on a trigger or a schedule. Wiring one onto a continuous stream would mean looping it — the opposite of "minimize maintenance".</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>The stem's word</th><th>The tool</th></tr>
        <tr><td>streamed, event hub, real time, telemetry</td><td><b>Eventstream</b></td></tr>
        <tr><td>large volume, relational database, CDC, daily load</td><td><b>Pipeline + Copy activity</b></td></tr>
        <tr><td>low-code, small volume, Power Query transformation</td><td><b>Dataflow Gen2</b></td></tr>
        <tr><td>complex transformations, unstructured, ML</td><td><b>Notebook</b></td></tr>
      </table></div>
      <p class="note"><b>The reflex.</b> On "one tool per source" drag-and-drops, treat each source <b>independently</b> and hunt for its signal word. Here <i>event hub</i> and <i>20 GB a day</i> are each enough on their own: neither answer depends on the other.</p>`}
  },
  {
    id:"q256", kind:"fields", type:TD,
    title:{fr:"Quel type de SCD pour chaque dimension",en:"Which SCD type for each dimension"},
    stem:{fr:`<p>Vous implémentez deux tables de dimension nommées <b>Customers</b> et <b>Products</b> dans un entrepôt Fabric. Vous devez créer deux dimensions à variation lente répondant aux exigences suivantes :</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Table</th><th>Action lors d'un changement</th></tr>
      <tr><td class="m">Customers</td><td><b>Créer une nouvelle version</b> de l'enregistrement client <b>en conservant les versions précédentes</b>.</td></tr>
      <tr><td class="m">Products</td><td><b>Écraser</b> la valeur existante dans l'enregistrement courant.</td></tr>
    </table></div>
    <p class="ask">Quel type de SCD devez-vous utiliser pour chaque table ?</p>`,
          en:`<p>You are implementing two dimension tables named <b>Customers</b> and <b>Products</b> in a Fabric warehouse. You need to create two slowly changing dimensions that meet the following requirements:</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Table</th><th>Change action</th></tr>
      <tr><td class="m">Customers</td><td><b>Create a new version</b> of the customer record <b>while keeping the previous versions</b>.</td></tr>
      <tr><td class="m">Products</td><td><b>Overwrite</b> the existing value in the current record.</td></tr>
    </table></div>
    <p class="ask">Which type of SCD should you use for each table?</p>`},
    fields:[
      {label:{fr:"Customers",en:"Customers"}, hint:{fr:"nouvelle version, historique conservé",en:"new version, history kept"},
       opts:{fr:["Type 0","Type 1","Type 2","Type 3"],en:["Type 0","Type 1","Type 2","Type 3"]}, ans:2},
      {label:{fr:"Products",en:"Products"}, hint:{fr:"écraser la valeur",en:"overwrite the value"},
       opts:{fr:["Type 0","Type 1","Type 2","Type 3"],en:["Type 0","Type 1","Type 2","Type 3"]}, ans:1}
    ],
    explain:{fr:`
      <p>Le tableau des exigences reprend <b>mot pour mot</b> la définition de deux types. Toute la difficulté consiste à ne pas se laisser attirer par le Type 3.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Type</th><th>Comportement</th><th>Historique</th></tr>
        <tr><td class="m">Type 0</td><td>La valeur ne change <b>jamais</b> (date de naissance, date d'ouverture)</td><td>Sans objet</td></tr>
        <tr><td class="m">Type 1</td><td><b>Écrase</b> l'ancienne valeur</td><td><b>Perdu</b></td></tr>
        <tr><td class="m">Type 2</td><td><b>Ajoute une ligne</b> et clôt la précédente (dates de validité, indicateur IsCurrent)</td><td><b>Complet</b></td></tr>
        <tr><td class="m">Type 3</td><td>Ajoute une <b>colonne</b> « valeur précédente »</td><td>Limité à <b>une</b> version antérieure</td></tr>
      </table></div>
      <p class="why">Customers → Type 2</p>
      <p><i>Create a new version … while keeping the previous versions</i> — au <b>pluriel</b>. Seul le Type 2 conserve un nombre illimité de versions, en créant une ligne par état et en gérant des dates de validité.</p>
      <p class="why">Products → Type 1</p>
      <p><i>Overwrite the existing value in the current record</i> est la définition littérale du Type 1 : un simple <code class="inl">UPDATE</code>, sans trace de l'ancienne valeur.</p>
      <p class="why">Le piège : pourquoi pas le Type 3 ?</p>
      <p>Le Type 3 est le distracteur de cette question, et il est bien construit : lui aussi « garde » quelque chose de l'ancienne valeur. Mais il la range dans une <b>colonne supplémentaire</b> (<code class="inl">PreviousCity</code>) et n'en garde qu'<b>une seule</b>. Deux raisons de l'écarter :</p>
      <ul>
        <li>Pour Customers, l'énoncé dit <i>versions</i> au pluriel — le Type 3 plafonne à une.</li>
        <li>Pour Products, l'énoncé dit <i>overwrite</i> sans réserve — le Type 3 conserverait justement ce qu'on demande d'écraser.</li>
      </ul>
      <p class="note"><b>Le réflexe.</b> Un seul mot décide : <i>overwrite</i> → <b>Type 1</b> · <i>new version / keep history</i> → <b>Type 2</b> · <i>previous value</i> au singulier, dans une colonne → <b>Type 3</b> · <i>never changes</i> → <b>Type 0</b>. Et souvenez-vous du corollaire : une SCD de Type 2 impose d'ajouter une <b>clé de substitution</b> et des <b>dates de début et de fin d'effet</b>.</p>`,
      en:`
      <p>The requirements table repeats <b>word for word</b> the definition of two types. The whole difficulty is not being drawn to Type 3.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Type</th><th>Behaviour</th><th>History</th></tr>
        <tr><td class="m">Type 0</td><td>The value <b>never</b> changes (date of birth, opening date)</td><td>Not applicable</td></tr>
        <tr><td class="m">Type 1</td><td><b>Overwrites</b> the old value</td><td><b>Lost</b></td></tr>
        <tr><td class="m">Type 2</td><td><b>Adds a row</b> and closes the previous one (validity dates, IsCurrent flag)</td><td><b>Complete</b></td></tr>
        <tr><td class="m">Type 3</td><td>Adds a "previous value" <b>column</b></td><td>Limited to <b>one</b> prior version</td></tr>
      </table></div>
      <p class="why">Customers → Type 2</p>
      <p><i>Create a new version … while keeping the previous versions</i> — <b>plural</b>. Only Type 2 keeps an unlimited number of versions, creating one row per state and managing validity dates.</p>
      <p class="why">Products → Type 1</p>
      <p><i>Overwrite the existing value in the current record</i> is the literal definition of Type 1: a plain <code class="inl">UPDATE</code>, with no trace of the old value.</p>
      <p class="why">The trap: why not Type 3?</p>
      <p>Type 3 is this question's distractor, and it is well built: it too "keeps" something of the old value. But it stores it in an <b>extra column</b> (<code class="inl">PreviousCity</code>) and keeps only <b>one</b>. Two reasons to discard it:</p>
      <ul>
        <li>For Customers, the stem says <i>versions</i>, plural — Type 3 caps at one.</li>
        <li>For Products, the stem says <i>overwrite</i> without reservation — Type 3 would preserve exactly what you are asked to overwrite.</li>
      </ul>
      <p class="note"><b>The reflex.</b> A single word decides: <i>overwrite</i> → <b>Type 1</b> · <i>new version / keep history</i> → <b>Type 2</b> · <i>previous value</i> singular, in a column → <b>Type 3</b> · <i>never changes</i> → <b>Type 0</b>. And remember the corollary: a Type 2 SCD requires adding a <b>surrogate key</b> plus <b>effective start and end dates</b>.</p>`}
  },
  {
    id:"q257", kind:"single", type:T1,
    title:{fr:"Nombre de jours entre deux dates en Power Query",en:"Days between two dates in Power Query"},
    stem:{fr:`<p>Vous avez une requête dans Microsoft Power BI Desktop contenant deux colonnes nommées <code class="inl">Order_Date</code> et <code class="inl">Shipping_Date</code>.</p>
    <p>Vous devez créer une colonne qui calculera le <b>nombre de jours</b> entre Order_Date et Shipping_Date <b>pour chaque ligne</b>.</p>
    <p class="ask">Quelle fonction Power Query devez-vous utiliser ?</p>`,
          en:`<p>You have a query in Microsoft Power BI Desktop that contains two columns named <code class="inl">Order_Date</code> and <code class="inl">Shipping_Date</code>.</p>
    <p>You need to create a column that will calculate the <b>number of days</b> between Order_Date and Shipping_Date <b>for each row</b>.</p>
    <p class="ask">Which Power Query function should you use?</p>`},
    options:[
      {k:"A", fr:`<code class="inl">DateTime.LocalNow</code>`, en:`<code class="inl">DateTime.LocalNow</code>`},
      {k:"B", fr:`<code class="inl">Duration.Days</code>`, en:`<code class="inl">Duration.Days</code>`},
      {k:"C", fr:`<code class="inl">Duration.From</code>`, en:`<code class="inl">Duration.From</code>`},
      {k:"D", fr:`<code class="inl">Date.AddDays</code>`, en:`<code class="inl">Date.AddDays</code>`}
    ],
    answer:["B"],
    explain:{fr:`
      <p>Soustraire deux dates en M produit une <b>valeur de durée</b> (<code class="inl">duration</code>), pas un nombre. <code class="inl">Duration.Days</code> en extrait la <b>composante « jours »</b> sous forme d'entier :</p>
      <pre class="code">= Duration.Days([Shipping_Date] - [Order_Date])</pre>
      <p>Une durée en M se décompose en quatre parties — jours, heures, minutes, secondes — avec une fonction d'extraction pour chacune : <code class="inl">Duration.Days</code>, <code class="inl">Duration.Hours</code>, <code class="inl">Duration.Minutes</code>, <code class="inl">Duration.Seconds</code>.</p>
      <p class="why">Pourquoi C est le distracteur sérieux</p>
      <p><code class="inl">Duration.From</code> <b>convertit</b> une valeur en durée : elle va dans le sens inverse de ce qu'on cherche. Appliquée à la soustraction, elle renverrait… la durée elle-même, toujours pas un nombre de jours exploitable dans un visuel ou un calcul.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Fonction</th><th>Ce qu'elle fait</th><th>Ce qu'elle retourne</th></tr>
        <tr><td class="m">Duration.Days</td><td>Extrait les jours d'une durée</td><td><b>Un nombre</b></td></tr>
        <tr><td class="m">Duration.From</td><td>Convertit une valeur en durée</td><td>Une durée</td></tr>
        <tr><td class="m">Date.AddDays</td><td>Ajoute n jours à une date</td><td>Une date</td></tr>
        <tr><td class="m">DateTime.LocalNow</td><td>Retourne la date et l'heure courantes</td><td>Un datetime — et aucun argument</td></tr>
      </table></div>
      <p class="why">Pourquoi A et D tombent d'emblée</p>
      <ul>
        <li><b>DateTime.LocalNow</b> ne prend aucun argument : elle ne peut pas comparer deux colonnes. Elle sert aux calculs relatifs à aujourd'hui.</li>
        <li><b>Date.AddDays</b> fait l'opération <b>inverse</b> : elle décale une date d'un nombre de jours donné, au lieu de mesurer l'écart entre deux dates.</li>
      </ul>
      <p class="why">À ne pas confondre avec le DAX</p>
      <p>En DAX, l'équivalent serait <code class="inl">DATEDIFF(Order_Date, Shipping_Date, DAY)</code>. Une question qui parle de <b>Power Query Editor</b> ou de <b>colonne personnalisée en M</b> attend une fonction M ; une question qui parle de <b>mesure</b> ou de <b>colonne calculée</b> attend du DAX.</p>
      <p class="note"><b>Le réflexe.</b> Identifiez d'abord le <b>langage</b> (M ou DAX), puis le <b>sens de l'opération</b> : mesurer un écart ou décaler une date. Ici les deux vérifications éliminent trois options sur quatre.</p>`,
      en:`
      <p>Subtracting two dates in M yields a <b>duration value</b> (<code class="inl">duration</code>), not a number. <code class="inl">Duration.Days</code> extracts its <b>"days" component</b> as an integer:</p>
      <pre class="code">= Duration.Days([Shipping_Date] - [Order_Date])</pre>
      <p>A duration in M breaks into four parts — days, hours, minutes, seconds — with one extraction function each: <code class="inl">Duration.Days</code>, <code class="inl">Duration.Hours</code>, <code class="inl">Duration.Minutes</code>, <code class="inl">Duration.Seconds</code>.</p>
      <p class="why">Why C is the serious distractor</p>
      <p><code class="inl">Duration.From</code> <b>converts</b> a value into a duration: it runs the opposite way from what is wanted. Applied to the subtraction it would return… the duration itself, still not a day count usable in a visual or a calculation.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Function</th><th>What it does</th><th>What it returns</th></tr>
        <tr><td class="m">Duration.Days</td><td>Extracts the days from a duration</td><td><b>A number</b></td></tr>
        <tr><td class="m">Duration.From</td><td>Converts a value into a duration</td><td>A duration</td></tr>
        <tr><td class="m">Date.AddDays</td><td>Adds n days to a date</td><td>A date</td></tr>
        <tr><td class="m">DateTime.LocalNow</td><td>Returns the current date and time</td><td>A datetime — and takes no argument</td></tr>
      </table></div>
      <p class="why">Why A and D fall immediately</p>
      <ul>
        <li><b>DateTime.LocalNow</b> takes no argument: it cannot compare two columns. It serves calculations relative to today.</li>
        <li><b>Date.AddDays</b> does the <b>inverse</b> operation: it shifts a date by a given number of days instead of measuring the gap between two dates.</li>
      </ul>
      <p class="why">Not to be confused with DAX</p>
      <p>In DAX the equivalent would be <code class="inl">DATEDIFF(Order_Date, Shipping_Date, DAY)</code>. A question mentioning <b>Power Query Editor</b> or a <b>custom column in M</b> expects an M function; one mentioning a <b>measure</b> or a <b>calculated column</b> expects DAX.</p>
      <p class="note"><b>The reflex.</b> Identify the <b>language</b> first (M or DAX), then the <b>direction of the operation</b>: measuring a gap or shifting a date. Here those two checks eliminate three options out of four.</p>`}
  }]
},
{
  id:"d3", n:3, short:{fr:"Modèles sémantiques",en:"Semantic models"}, weight:{fr:"20–25 % de l'examen",en:"20–25 % of the exam"},
  title:{fr:"Implémenter et gérer des modèles sémantiques",en:"Implement and manage semantic models"},
  note:{fr:"Conception du modèle, modes de stockage, DAX, actualisation incrémentielle et optimisation à l'échelle. Deux thèmes reviennent sans cesse : la distinction colonne calculée / mesure, et le comportement réel de Direct Lake — souvent différent du mode déclaré.",
        en:"Model design, storage modes, DAX, incremental refresh and enterprise-scale optimisation. Two themes recur constantly: the calculated column versus measure distinction, and Direct Lake's actual behaviour — often different from the declared mode."},
  cases:["contoso","litware"],
  questions:[
  {
    id:"q301", kind:"single", tag:"contoso", type:T1,
    title:{fr:"Actualiser la table Orders",en:"Refreshing the Orders table"},
    stem:{fr:`<p>Vous devez actualiser la table <b>Orders</b> du département Online Sales, en respectant les exigences de modèle sémantique — en particulier : <i>« le nombre de lignes ajoutées à Orders lors des actualisations doit être minimisé. »</i></p><p class="ask">Que devez-vous inclure dans la solution ?</p>`,
          en:`<p>You need to refresh the <b>Orders</b> table of the Online Sales department. The solution must meet the semantic model requirements — in particular: <i>"The number of rows added to the Orders table during refreshes must be minimized."</i></p><p class="ask">What should you include in the solution?</p>`},
    options:[
      {k:"A", fr:"Un pipeline Azure Data Factory exécutant une activité <b>Stored procedure</b> pour récupérer la valeur <b>maximale</b> de OrderID dans le lakehouse de destination.", en:"An Azure Data Factory pipeline that executes a <b>Stored procedure</b> activity to retrieve the <b>maximum</b> value of the OrderID column in the destination lakehouse."},
      {k:"B", fr:"Un pipeline Azure Data Factory exécutant une activité <b>Stored procedure</b> pour récupérer la valeur <b>minimale</b> de OrderID dans le lakehouse de destination.", en:"An Azure Data Factory pipeline that executes a <b>Stored procedure</b> activity to retrieve the <b>minimum</b> value of the OrderID column in the destination lakehouse."},
      {k:"C", fr:"Un pipeline Azure Data Factory exécutant un <b>dataflow</b> pour récupérer la valeur <b>minimale</b> de OrderID dans le lakehouse de destination.", en:"An Azure Data Factory pipeline that executes a <b>dataflow</b> to retrieve the <b>minimum</b> value of the OrderID column in the destination lakehouse."},
      {k:"D", fr:"Un pipeline Azure Data Factory exécutant un <b>dataflow</b> pour récupérer la valeur <b>maximale</b> de OrderID dans le lakehouse de destination.", en:"An Azure Data Factory pipeline that executes a <b>dataflow</b> to retrieve the <b>maximum</b> value of the OrderID column in the destination lakehouse."}
    ],
    answer:["D"],
    explain:{fr:`
      <p>Deux critères croisés, à traiter séparément.</p>
      <p class="why">Critère 1 — maximum, jamais minimum</p>
      <p><i>minimize rows added</i> impose un <b>chargement incrémentiel</b>, donc un watermark. Et le dossier précise : <i>« the OrderID value represents the <b>sequence</b> in which orders are created »</i> — OrderID est croissant, c'est lui le watermark.</p>
      <p>Le <b>MAX</b> dans la destination est le dernier enregistrement déjà chargé : on ne copie ensuite que les lignes source où OrderID &gt; MAX. Le <b>MIN</b> serait le tout premier enregistrement, une valeur figée et inutile, qui provoquerait un rechargement complet à chaque exécution. <b>B et C éliminées.</b></p>
      <p class="why">Critère 2 — dataflow, pas procédure stockée</p>
      <p>Il reste A et D, qui ne diffèrent que par le mécanisme. C'est le <b>type d'artefact de destination</b> qui tranche : l'énoncé dit « the destination <b>lakehouse</b> ».</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Destination</th><th>Stored procedure</th><th>INSERT / UPDATE / DELETE</th><th>Dataflow / Copy / Notebook</th></tr>
        <tr><td class="m">Lakehouse (SQL endpoint)</td><td><b>NON</b></td><td><b>NON</b> (lecture seule)</td><td>OUI</td></tr>
        <tr><td class="m">Warehouse</td><td>OUI</td><td>OUI</td><td>OUI</td></tr>
      </table></div>
      <p>Une activité <i>Stored procedure</i> pointant vers un lakehouse est donc techniquement impossible. Un dataflow, lui, lit sans difficulté depuis un lakehouse et en extrait la valeur maximale d'OrderID.</p>
      <p class="note"><b>Le piège, et le réflexe qu'il enseigne.</b> L'activité Stored procedure est le bon outil de watermark… <b>contre un Warehouse</b>. Le raisonnement métier était juste, mais un seul mot invalide l'option. Sur DP-600, quand deux options portent la même logique métier, le discriminant est presque toujours le type d'artefact Fabric.</p>`,
      en:`
      <p>Two crossed criteria, to be handled separately.</p>
      <p class="why">Criterion 1 — maximum, never minimum</p>
      <p><i>minimize rows added</i> demands an <b>incremental load</b>, hence a watermark. And the dossier states: <i>"the OrderID value represents the <b>sequence</b> in which orders are created"</i> — OrderID is monotonically increasing, so it is the watermark.</p>
      <p>The <b>MAX</b> in the destination is the last record already loaded: you then copy only source rows where OrderID &gt; MAX. The <b>MIN</b> would be the very first record ever loaded, a fixed and useless value that would force a full reload on every run. <b>B and C eliminated.</b></p>
      <p class="why">Criterion 2 — dataflow, not stored procedure</p>
      <p>A and D remain, differing only in mechanism. The <b>destination artifact type</b> decides it: the stem says "the destination <b>lakehouse</b>".</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Destination</th><th>Stored procedure</th><th>INSERT / UPDATE / DELETE</th><th>Dataflow / Copy / Notebook</th></tr>
        <tr><td class="m">Lakehouse (SQL endpoint)</td><td><b>NO</b></td><td><b>NO</b> (read-only)</td><td>YES</td></tr>
        <tr><td class="m">Warehouse</td><td>YES</td><td>YES</td><td>YES</td></tr>
      </table></div>
      <p>A <i>Stored procedure</i> activity pointing at a lakehouse is therefore technically impossible. A dataflow, by contrast, reads from a lakehouse without difficulty and extracts the maximum OrderID.</p>
      <p class="note"><b>The trap, and the reflex it teaches.</b> The Stored procedure activity is the right watermark tool… <b>against a Warehouse</b>. The business reasoning was sound, but one word invalidates the option. On DP-600, when two options carry the same business logic, the discriminator is nearly always the Fabric artifact type.</p>`}
  },
  {
    id:"q302", kind:"fields", tag:"litware", type:TH,
    title:{fr:"Mesure DAX — satisfaction glissante sur 12 mois",en:"DAX measure — rolling 12-month satisfaction"},
    stem:{fr:`<p>Vous devez créer une mesure DAX calculant le <b>score moyen de satisfaction globale</b>.</p>
    <pre class="code">Rolling 12 Overall Satisfaction =
VAR NumberOfMonths = 12
VAR LastCurrentDate = MAX ( 'Date'[Date] )
VAR Period = DATESINPERIOD ( 'Date'[Date], LastCurrentDate,
                             - NumberOfMonths, MONTH )
VAR Result =
    CALCULATE (
        ❶
        ❷
        'Survey Question'[Question Title] = "Overall Satisfaction"
    )
RETURN Result</pre>
    <p class="ask">Comment devez-vous compléter le code DAX ?</p>`,
          en:`<p>You need to create a DAX measure that calculates the <b>average overall satisfaction score</b>.</p>
    <pre class="code">Rolling 12 Overall Satisfaction =
VAR NumberOfMonths = 12
VAR LastCurrentDate = MAX ( 'Date'[Date] )
VAR Period = DATESINPERIOD ( 'Date'[Date], LastCurrentDate,
                             - NumberOfMonths, MONTH )
VAR Result =
    CALCULATE (
        ❶
        ❷
        'Survey Question'[Question Title] = "Overall Satisfaction"
    )
RETURN Result</pre>
    <p class="ask">How should you complete the DAX code?</p>`},
    fields:[
      {label:{fr:"❶ Expression à agréger",en:"❶ Expression to aggregate"}, hint:{fr:"1er argument de CALCULATE",en:"1st CALCULATE argument"},
       opts:{fr:["AVERAGE('Survey'[Response Value]),","AVERAGEA('Question'[Question Text]),","AVERAGEX(VALUES('Survey'[Customer Key]),"],en:["AVERAGE('Survey'[Response Value]),","AVERAGEA('Question'[Question Text]),","AVERAGEX(VALUES('Survey'[Customer Key]),"]}, ans:2},
      {label:{fr:"❷ Filtre",en:"❷ Filter"}, hint:{fr:"2e argument de CALCULATE",en:"2nd CALCULATE argument"},
       opts:{fr:["LastCurrentDate,","NumberOfMonths,","Period,"],en:["LastCurrentDate,","NumberOfMonths,","Period,"]}, ans:2}
    ],
    explain:{fr:`
      <p class="why">Commencez par ❷ : c'est le plus facile</p>
      <p><code class="inl">CALCULATE</code> n'accepte comme arguments suivants que des <b>filtres</b> : une table, ou une condition booléenne. Regardez la nature des trois candidats :</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>Nature</th><th>Verdict</th></tr>
        <tr><td class="m">LastCurrentDate</td><td>Scalaire (une seule date)</td><td>Pas un filtre</td></tr>
        <tr><td class="m">NumberOfMonths</td><td>Scalaire (le nombre 12)</td><td>Pas un filtre</td></tr>
        <tr><td class="m">Period</td><td><b>Table</b> de dates retournée par DATESINPERIOD</td><td><b>Correct</b></td></tr>
      </table></div>
      <p><code class="inl">DATESINPERIOD</code> retourne une table, pas une valeur : seul <code class="inl">Period</code> peut filtrer CALCULATE. Les deux autres sont des variables déjà consommées à la ligne du dessus.</p>
      <p class="why">❶ L'expression à agréger</p>
      <ul>
        <li><b>AVERAGEA('Question'[Question Text])</b> — éliminée. <i>Question Text</i> contient du texte. <code class="inl">AVERAGEA</code> traite le texte comme zéro : la mesure renverrait 0. Absurde.</li>
        <li><b>AVERAGE('Survey'[Response Value])</b> — moyenne simple de toutes les lignes. Lecture naturelle de <i>average of all the surveys</i>, mais chaque client pèse proportionnellement au nombre d'enquêtes qu'il a remplies.</li>
        <li><b>AVERAGEX(VALUES('Survey'[Customer Key]),</b> — réponse retenue. Moyenne par client, puis moyenne de ces moyennes. Neutralise le biais des clients qui remplissent beaucoup d'enquêtes : chacun pèse le même poids dans le score global.</li>
      </ul>
      <p class="why">Point de vigilance sur la syntaxe</p>
      <p>L'option retenue se termine par une virgule : <code class="inl">...[Customer Key]),</code>. C'est le signal que le contenu du menu n'est qu'un <b>fragment</b>, et que la suite de l'expression AVERAGEX est imprimée ailleurs à l'écran. Si l'on assemblait littéralement ❶ + ❷, on obtiendrait <code class="inl">AVERAGEX(VALUES(...), Period, ...)</code> : la parenthèse d'AVERAGEX ne se refermerait jamais.</p>
      <p class="why">Le rôle du troisième filtre, déjà imprimé</p>
      <p><code class="inl">'Survey Question'[Question Title] = "Overall Satisfaction"</code> correspond à la phrase du dossier : <i>« The third question in each survey response is an overall satisfaction score »</i>. Sans ce filtre, la moyenne mélangerait les réponses de toutes les questions.</p>
      <p class="note"><b>Deux réflexes sur les questions DAX à trous.</b> Traitez d'abord le menu en <b>position de filtre</b> : la contrainte y est syntaxique, donc binaire. Puis, quand une option ouvre une parenthèse, vérifiez qu'elle se referme correctement avec le code déjà imprimé. Mémorisez la distinction plutôt que la réponse brute : <code class="inl">AVERAGE(col)</code> = moyenne de toutes les lignes ; <code class="inl">AVERAGEX(VALUES(clé), expr)</code> = moyenne par entité puis moyenne des moyennes.</p>`,
      en:`
      <p class="why">Start with ❷: it is the easier half</p>
      <p><code class="inl">CALCULATE</code> accepts only <b>filters</b> as its subsequent arguments: a table, or a boolean condition. Look at the nature of the three candidates:</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Option</th><th>Nature</th><th>Verdict</th></tr>
        <tr><td class="m">LastCurrentDate</td><td>Scalar (a single date)</td><td>Not a filter</td></tr>
        <tr><td class="m">NumberOfMonths</td><td>Scalar (the number 12)</td><td>Not a filter</td></tr>
        <tr><td class="m">Period</td><td><b>Table</b> of dates returned by DATESINPERIOD</td><td><b>Correct</b></td></tr>
      </table></div>
      <p><code class="inl">DATESINPERIOD</code> returns a table, not a value: only <code class="inl">Period</code> can filter CALCULATE. The other two are variables already consumed on the line above.</p>
      <p class="why">❶ The expression to aggregate</p>
      <ul>
        <li><b>AVERAGEA('Question'[Question Text])</b> — eliminated. <i>Question Text</i> contains text. <code class="inl">AVERAGEA</code> treats text as zero: the measure would return 0. Absurd.</li>
        <li><b>AVERAGE('Survey'[Response Value])</b> — a plain average across all rows. The natural reading of <i>average of all the surveys</i>, but each customer weighs in proportion to how many surveys they completed.</li>
        <li><b>AVERAGEX(VALUES('Survey'[Customer Key]),</b> — the retained answer. An average per customer, then an average of those averages. It neutralises the bias from customers who fill in many surveys: each carries equal weight in the overall score.</li>
      </ul>
      <p class="why">A syntax point to watch</p>
      <p>The retained option ends in a comma: <code class="inl">...[Customer Key]),</code>. That signals the menu's content is only a <b>fragment</b>, and the rest of the AVERAGEX expression is printed elsewhere on screen. If you assembled ❶ + ❷ literally you would get <code class="inl">AVERAGEX(VALUES(...), Period, ...)</code>: AVERAGEX's parenthesis would never close.</p>
      <p class="why">The role of the third filter, already printed</p>
      <p><code class="inl">'Survey Question'[Question Title] = "Overall Satisfaction"</code> matches the dossier's sentence: <i>"The third question in each survey response is an overall satisfaction score"</i>. Without that filter the average would mix answers from every question.</p>
      <p class="note"><b>Two reflexes for fill-in-the-blank DAX.</b> Handle the blank in <b>filter position</b> first: the constraint there is syntactic, therefore binary. Then, when an option opens a parenthesis, check it closes correctly against the printed code. Memorise the distinction rather than the raw answer: <code class="inl">AVERAGE(col)</code> = average over all rows; <code class="inl">AVERAGEX(VALUES(key), expr)</code> = average per entity, then average of averages.</p>`}
  },
  {
    id:"q303", kind:"fields", type:TD,
    title:{fr:"Requête DAX via le XMLA endpoint",en:"DAX query through the XMLA endpoint"},
    stem:{fr:`<p>Vous avez un modèle sémantique contenant des données sur des magasins de détail. Vous devez écrire une <b>requête DAX</b> exécutée via le <b>point de terminaison XMLA</b>, retournant une table des magasins ouverts depuis le <b>1<sup>er</sup> décembre 2023</b>.</p>
    <pre class="code">❶
    VAR _SalesSince = DATE (2023, 12, 01)

❷
FILTER (
    ❸ (Store, Store[Name], Store[OpenDate]),
    Store[OpenDate] &gt;= _SalesSince )</pre>
    <p class="ask">Comment devez-vous compléter l'expression DAX ?</p>`,
          en:`<p>You have a semantic model with data about retail stores. You need to write a <b>DAX query</b> executed through the <b>XMLA endpoint</b>, returning a table of stores that have opened since <b>December 1, 2023</b>.</p>
    <pre class="code">❶
    VAR _SalesSince = DATE (2023, 12, 01)

❷
FILTER (
    ❸ (Store, Store[Name], Store[OpenDate]),
    Store[OpenDate] &gt;= _SalesSince )</pre>
    <p class="ask">How should you complete the DAX expression?</p>`},
    fields:[
      {label:{fr:"❶ Avant le VAR",en:"❶ Before the VAR"}, hint:{fr:"ouverture de la requête",en:"query opening"},
       opts:{fr:["DEFINE","EVALUATE","FILTER","SUMMARIZE","TABLE"],en:["DEFINE","EVALUATE","FILTER","SUMMARIZE","TABLE"]}, ans:0},
      {label:{fr:"❷ Avant le FILTER",en:"❷ Before the FILTER"}, hint:{fr:"expression à retourner",en:"expression to return"},
       opts:{fr:["DEFINE","EVALUATE","FILTER","SUMMARIZE","TABLE"],en:["DEFINE","EVALUATE","FILTER","SUMMARIZE","TABLE"]}, ans:1},
      {label:{fr:"❸ Dans le FILTER",en:"❸ Inside the FILTER"}, hint:{fr:"1er argument de FILTER",en:"1st FILTER argument"},
       opts:{fr:["DEFINE","EVALUATE","FILTER","SUMMARIZE","TABLE"],en:["DEFINE","EVALUATE","FILTER","SUMMARIZE","TABLE"]}, ans:3}
    ],
    explain:{fr:`
      <p>Une requête DAX — celle qu'on envoie via le XMLA endpoint, DAX Studio ou Tabular Editor — suit toujours le même squelette. Ce n'est pas une mesure, c'est un autre objet syntaxique :</p>
      <pre class="code">DEFINE                  # facultatif, obligatoire si VAR ou MEASURE
    VAR ... / MEASURE ...
EVALUATE                # obligatoire, au moins une fois
    &lt;expression retournant une table&gt;
ORDER BY                # facultatif</pre>
      <ul>
        <li><b>❶ DEFINE</b> — un <code class="inl">VAR</code> au niveau de la requête doit vivre dans un bloc DEFINE. Sans lui, la déclaration est invalide.</li>
        <li><b>❷ EVALUATE</b> — introduit l'expression de table à retourner, l'équivalent conceptuel du <code class="inl">SELECT</code> en SQL. C'est le seul mot-clé qui peut précéder <code class="inl">FILTER(</code>.</li>
      </ul>
      <p class="why">❸ Pourquoi SUMMARIZE</p>
      <p>Regardez la signature imposée par le code déjà imprimé : <code class="inl">??? (Store, Store[Name], Store[OpenDate])</code> — une table, puis des colonnes. C'est exactement <code class="inl">SUMMARIZE(table, groupBy_col1, groupBy_col2, ...)</code>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Valeur</th><th>Pourquoi elle ne va pas ici</th></tr>
        <tr><td class="m">FILTER</td><td>Déjà présent à la ligne au-dessus. Sa signature est <code class="inl">FILTER(table, condition)</code> — une table et une condition, pas une liste de colonnes.</td></tr>
        <tr><td class="m">TABLE</td><td>N'est pas une fonction DAX. Le mot-clé existe uniquement dans <code class="inl">DEFINE TABLE nom = ...</code> pour déclarer une table calculée.</td></tr>
        <tr><td class="m">DEFINE / EVALUATE</td><td>Mots-clés de structure de requête, pas des fonctions. Ils ne peuvent pas être imbriqués dans un FILTER.</td></tr>
      </table></div>
      <p>SUMMARIZE produit d'abord une table à deux colonnes, une ligne par magasin distinct ; FILTER parcourt ensuite cette table et ne garde que les lignes où <code class="inl">OpenDate &gt;= _SalesSince</code>. Le résultat est bien <i>a table of stores</i>.</p>
      <p class="note"><b>Trois vérifications, dans cet ordre.</b> 1) Y a-t-il un VAR ou un MEASURE au niveau requête ? → un DEFINE en tête. 2) Où commence la table à retourner ? → EVALUATE juste avant. 3) Quelle est la signature attendue par le code imprimé ? → comptez les arguments et regardez leur nature. Ce troisième point est le plus rentable. Et retenez : <b>EVALUATE = requête, RETURN = mesure</b>.</p>`,
      en:`
      <p>A DAX query — the kind you send through the XMLA endpoint, DAX Studio or Tabular Editor — always follows the same skeleton. It is not a measure; it is a different syntactic object:</p>
      <pre class="code">DEFINE                  # optional, required if VAR or MEASURE
    VAR ... / MEASURE ...
EVALUATE                # required, at least once
    &lt;expression returning a table&gt;
ORDER BY                # optional</pre>
      <ul>
        <li><b>❶ DEFINE</b> — a query-level <code class="inl">VAR</code> must live inside a DEFINE block. Without it the declaration is invalid.</li>
        <li><b>❷ EVALUATE</b> — introduces the table expression to return, the conceptual equivalent of SQL's <code class="inl">SELECT</code>. It is the only keyword that can precede <code class="inl">FILTER(</code>.</li>
      </ul>
      <p class="why">❸ Why SUMMARIZE</p>
      <p>Look at the signature imposed by the printed code: <code class="inl">??? (Store, Store[Name], Store[OpenDate])</code> — a table, then columns. That is exactly <code class="inl">SUMMARIZE(table, groupBy_col1, groupBy_col2, ...)</code>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Value</th><th>Why it does not fit here</th></tr>
        <tr><td class="m">FILTER</td><td>Already present on the line above. Its signature is <code class="inl">FILTER(table, condition)</code> — a table and a condition, not a list of columns.</td></tr>
        <tr><td class="m">TABLE</td><td>Not a DAX function. The keyword exists only in <code class="inl">DEFINE TABLE name = ...</code> to declare a calculated table.</td></tr>
        <tr><td class="m">DEFINE / EVALUATE</td><td>Query-structure keywords, not functions. They cannot be nested inside a FILTER.</td></tr>
      </table></div>
      <p>SUMMARIZE first produces a two-column table, one row per distinct store; FILTER then walks that table and keeps only rows where <code class="inl">OpenDate &gt;= _SalesSince</code>. The result is indeed <i>a table of stores</i>.</p>
      <p class="note"><b>Three checks, in this order.</b> 1) Is there a query-level VAR or MEASURE? → a DEFINE at the top. 2) Where does the table to return begin? → EVALUATE right before it. 3) What signature does the printed code expect? → count the arguments and look at their nature. The third check pays best. And remember: <b>EVALUATE = query, RETURN = measure</b>.</p>`}
  },
  {
    id:"q304", kind:"multi", contested:true, type:TM,
    title:{fr:"Optimiser la mémoire d'un modèle Import",en:"Optimizing an Import model's memory"},
    stem:{fr:`<p>Vous avez un modèle sémantique <b>Model1</b> en mode <b>Import</b>, contenant une table <b>Orders</b> de <b>100 millions de lignes</b> :</p>
    <ul>
      <li><b>OrderID</b> (Integer), <b>OrderDateTime</b> (Date/Time), <b>Quantity</b> (Integer), <b>Price</b> (Decimal) — colonnes importées de la source</li>
      <li><b>TotalSalesAmount</b> (Decimal) — <b>colonne calculée</b> qui multiplie Quantity et Price</li>
      <li><b>TotalQuantity</b> (Integer) — <b>mesure</b></li>
    </ul>
    <p>Vous devez <b>réduire la mémoire utilisée et le temps de rafraîchissement</b>.</p>
    <p class="ask">Quelles <b>deux</b> actions devez-vous effectuer ?</p>`,
          en:`<p>You have a semantic model named <b>Model1</b> using <b>Import</b> mode, containing a table named <b>Orders</b> with <b>100 million rows</b>:</p>
    <ul>
      <li><b>OrderID</b> (Integer), <b>OrderDateTime</b> (Date/Time), <b>Quantity</b> (Integer), <b>Price</b> (Decimal) — columns imported from the source</li>
      <li><b>TotalSalesAmount</b> (Decimal) — a <b>calculated column</b> that multiplies Quantity and Price</li>
      <li><b>TotalQuantity</b> (Integer) — a <b>measure</b></li>
    </ul>
    <p>You need to <b>reduce the memory used by Model1 and the time it takes to refresh</b>.</p>
    <p class="ask">Which <b>two</b> actions should you perform?</p>`},
    options:[
      {k:"A", fr:"Séparer OrderDateTime en colonnes date et heure distinctes.", en:"Split OrderDateTime into separate date and time columns."},
      {k:"B", fr:"Remplacer TotalQuantity par une colonne calculée.", en:"Replace TotalQuantity with a calculated column."},
      {k:"C", fr:"Convertir Quantity au type de données Texte.", en:"Convert Quantity into the Text data type."},
      {k:"D", fr:"Remplacer TotalSalesAmount par une mesure.", en:"Replace TotalSalesAmount with a measure."}
    ],
    answer:["A","D"],
    explain:{fr:`
      <p>Un modèle Import utilise le moteur <b>VertiPaq</b>, qui compresse chaque colonne indépendamment. Deux facteurs dominent la consommation mémoire : la <b>cardinalité</b> (plus une colonne a de valeurs distinctes, moins elle se compresse) et la <b>matérialisation</b> (ce qui est stocké occupe de la place, ce qui est calculé à la volée n'en occupe pas). Les deux bonnes réponses attaquent chacune un de ces facteurs.</p>
      <p class="why">A — séparer date et heure</p>
      <p>OrderDateTime est le pire cas possible pour VertiPaq. Avec 100 millions de lignes et une précision à la seconde, presque chaque valeur est unique → cardinalité maximale, compression quasi nulle.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Colonne</th><th>Valeurs distinctes possibles</th></tr>
        <tr><td class="m">OrderDateTime (avant)</td><td>jusqu'à 100 millions</td></tr>
        <tr><td class="m">OrderDate (après)</td><td>quelques milliers — une par jour</td></tr>
        <tr><td class="m">OrderTime (après)</td><td>86 400 au maximum</td></tr>
      </table></div>
      <p class="why">D — colonne calculée vers mesure</p>
      <p>TotalSalesAmount est une <b>colonne calculée</b> : elle est évaluée pendant le rafraîchissement, puis stockée ligne par ligne — cent millions de valeurs décimales matérialisées en mémoire. Une mesure ne stocke rien : elle est calculée à la demande, uniquement sur le contexte du visuel affiché. Elle sert donc les deux objectifs de l'énoncé à la fois.</p>
      <p class="why">Pourquoi B et C tombent</p>
      <ul>
        <li><b>B — TotalQuantity en colonne calculée.</b> L'exact inverse de D. TotalQuantity est <b>déjà une mesure</b>, donc déjà optimale. La transformer en colonne calculée créerait 100 millions de valeurs à stocker et à recalculer. Cette option <b>aggrave</b> le problème — c'est le distracteur miroir : même mécanisme que D, sens opposé.</li>
        <li><b>C — Quantity en texte.</b> Le texte est moins bien compressé que les entiers dans VertiPaq : un entier se stocke sur quelques octets avec un encodage par valeur très efficace, une chaîne exige un dictionnaire. Vous perdriez aussi toute capacité d'agrégation.</li>
      </ul>
      <p class="contested"><b>Certains corrigés donnent B et D.</b> À vérifier, car B contredit directement l'objectif : l'énoncé précise que TotalQuantity est <i>déjà</i> une mesure. Deux hypothèses : une coquille de recopie (B est adjacent à A dans la liste), ou une inversion dans l'énoncé du dump — si TotalQuantity était la colonne calculée et TotalSalesAmount la mesure, alors B et D seraient corrects. <b>Vérifiez le tableau des champs avant de répondre.</b></p>
      <p class="note"><b>L'opposition fondamentale.</b> Colonne calculée = stockée en mémoire, calculée au refresh. Mesure = rien en mémoire, calculée à l'affichage. Dès qu'un énoncé demande de réduire la mémoire ou d'accélérer le rafraîchissement, la direction est toujours <b>colonne → mesure</b>, jamais l'inverse.</p>`,
      en:`
      <p>An Import model uses the <b>VertiPaq</b> engine, which compresses each column independently. Two factors dominate memory use: <b>cardinality</b> (the more distinct values a column has, the worse it compresses) and <b>materialisation</b> (what is stored takes space, what is computed on the fly does not). The two correct answers each attack one of these.</p>
      <p class="why">A — split date and time</p>
      <p>OrderDateTime is the worst possible case for VertiPaq. With 100 million rows and second-level precision, almost every value is unique → maximum cardinality, near-zero compression.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Column</th><th>Possible distinct values</th></tr>
        <tr><td class="m">OrderDateTime (before)</td><td>up to 100 million</td></tr>
        <tr><td class="m">OrderDate (after)</td><td>a few thousand — one per day</td></tr>
        <tr><td class="m">OrderTime (after)</td><td>86,400 at most</td></tr>
      </table></div>
      <p class="why">D — calculated column to measure</p>
      <p>TotalSalesAmount is a <b>calculated column</b>: it is evaluated during refresh, then stored row by row — one hundred million decimal values materialised in memory. A measure stores nothing: it is computed on demand, only over the displayed visual's context. It therefore serves both of the stem's goals at once.</p>
      <p class="why">Why B and C fail</p>
      <ul>
        <li><b>B — TotalQuantity as a calculated column.</b> The exact inverse of D. TotalQuantity is <b>already a measure</b>, therefore already optimal. Turning it into a calculated column would create 100 million values to store and recompute. This option <b>makes the problem worse</b> — the mirror distractor: same mechanism as D, opposite direction.</li>
        <li><b>C — Quantity as Text.</b> Text compresses worse than integers in VertiPaq: an integer stores in a few bytes with very efficient value encoding, whereas a string requires a dictionary. You would also lose all aggregation ability.</li>
      </ul>
      <p class="contested"><b>Some answer keys give B and D.</b> Worth checking, because B directly contradicts the objective: the stem states TotalQuantity is <i>already</i> a measure. Two hypotheses: a transcription slip (B sits next to A in the list), or an inversion in the dump's stem — if TotalQuantity were the calculated column and TotalSalesAmount the measure, then B and D would be correct. <b>Check the field table before answering.</b></p>
      <p class="note"><b>The fundamental opposition.</b> Calculated column = stored in memory, computed at refresh. Measure = nothing in memory, computed at display time. Whenever a stem asks to reduce memory or speed up refresh, the direction is always <b>column → measure</b>, never the reverse.</p>`}
  },
  {
    id:"q305", kind:"multi", contested:true, type:TM,
    title:{fr:"Empêcher les mesures implicites",en:"Preventing implicit measures"},
    stem:{fr:`<p>Vous avez un modèle sémantique. Vous devez <b>empêcher les créateurs de rapports de remplir des visuels avec des mesures implicites</b>.</p><p class="ask">Quels <b>deux</b> outils pouvez-vous utiliser ? Chaque bonne réponse constitue une solution complète.</p>`,
          en:`<p>You have a Fabric tenant that contains a semantic model. You need to <b>prevent report creators from populating visuals by using implicit measures</b>.</p><p class="ask">What are <b>two</b> tools that you can use to achieve the goal? Each correct answer presents a complete solution.</p>`},
    options:[
      {k:"A", fr:"Microsoft Power BI Desktop", en:"Microsoft Power BI Desktop"},
      {k:"B", fr:"Tabular Editor", en:"Tabular Editor"},
      {k:"C", fr:"Microsoft SQL Server Management Studio (SSMS)", en:"Microsoft SQL Server Management Studio (SSMS)"},
      {k:"D", fr:"DAX Studio", en:"DAX Studio"}
    ],
    answer:["A","C"],
    explain:{fr:`
      <p class="why">Ce qu'est une mesure implicite</p>
      <p>Quand un créateur de rapport fait glisser une colonne numérique dans un visuel, Power BI l'agrège automatiquement — <i>Sum of Amount</i>, <i>Average of Price</i>. C'est une mesure implicite : elle n'existe nulle part dans le modèle, elle est créée à la volée par l'interface. Problèmes : la logique métier échappe au modélisateur, les mesures implicites ne fonctionnent pas avec les <i>calculation groups</i>, et les résultats deviennent incohérents d'un rapport à l'autre.</p>
      <p>Le mécanisme technique est la propriété de modèle <code class="inl">DiscourageImplicitMeasures = true</code>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Outil</th><th>Comment il le fait</th></tr>
        <tr><td class="m">A — Power BI Desktop</td><td>Y parvient <b>indirectement</b> : dès que vous créez un <i>calculation group</i>, Power BI Desktop bascule automatiquement <code class="inl">DiscourageImplicitMeasures</code> à true, car les deux sont incompatibles.</td></tr>
        <tr><td class="m">C — SSMS</td><td>Se connecte au modèle via XMLA et exécute des scripts <b>TMSL</b> modifiant les métadonnées, y compris cette propriété. Plus laborieux, mais techniquement faisable.</td></tr>
      </table></div>
      <p>Subtilité pour A : on pense spontanément que Power BI Desktop n'expose pas cette propriété — c'est vrai, mais il l'active quand même par effet de bord.</p>
      <p class="why">Pourquoi D tombe sans discussion</p>
      <p><b>DAX Studio</b> est un outil de requêtage et de diagnostic : exécuter des requêtes DAX, analyser les plans d'exécution, mesurer les performances via le Server Timings. <b>Il ne modifie jamais les métadonnées d'un modèle.</b> Éliminé dans toutes les lectures.</p>
      <p class="contested"><b>Question contestée — le sort de Tabular Editor.</b> Tabular Editor (option B) est l'outil <b>canonique</b> pour <code class="inl">DiscourageImplicitMeasures</code> : c'est celui que la documentation Microsoft cite, et sa raison d'être est précisément d'exposer les propriétés du modèle tabulaire que Power BI Desktop cache. Beaucoup de corrigés donnent donc <b>A et B</b>. Le corrigé retenu ici donne A et C, avec cette lecture : si la question raisonne en termes d'outils <b>Microsoft officiels</b> plutôt que d'outils tiers, Tabular Editor sort du périmètre et SSMS entre. Ce qui est certain : <b>A est juste dans les deux lectures, D est faux dans les deux.</b></p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Outil</th><th>Lire le modèle</th><th>Exécuter du DAX</th><th>Modifier les métadonnées</th></tr>
        <tr><td class="m">Power BI Desktop</td><td>Oui</td><td>Oui</td><td>Oui (via l'interface)</td></tr>
        <tr><td class="m">Tabular Editor</td><td>Oui</td><td>Oui</td><td><b>Oui (toutes propriétés)</b></td></tr>
        <tr><td class="m">DAX Studio</td><td>Oui</td><td>Oui</td><td><b>Non</b></td></tr>
        <tr><td class="m">SSMS</td><td>Oui</td><td>Oui</td><td>Partiellement (scripts TMSL)</td></tr>
      </table></div>`,
      en:`
      <p class="why">What an implicit measure is</p>
      <p>When a report creator drags a numeric column into a visual, Power BI aggregates it automatically — <i>Sum of Amount</i>, <i>Average of Price</i>. That is an implicit measure: it exists nowhere in the model, created on the fly by the interface. Problems: business logic escapes the modeller's control, implicit measures do not work with <i>calculation groups</i>, and results become inconsistent from report to report.</p>
      <p>The technical mechanism is the model property <code class="inl">DiscourageImplicitMeasures = true</code>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Tool</th><th>How it does it</th></tr>
        <tr><td class="m">A — Power BI Desktop</td><td>Achieves it <b>indirectly</b>: as soon as you create a <i>calculation group</i>, Power BI Desktop automatically flips <code class="inl">DiscourageImplicitMeasures</code> to true, because the two are incompatible.</td></tr>
        <tr><td class="m">C — SSMS</td><td>Connects to the model over XMLA and runs <b>TMSL</b> scripts that change metadata, including this property. More laborious, but technically feasible.</td></tr>
      </table></div>
      <p>A subtlety for A: one instinctively thinks Power BI Desktop does not expose this property — true, but it sets it anyway as a side effect.</p>
      <p class="why">Why D fails without argument</p>
      <p><b>DAX Studio</b> is a querying and diagnostic tool: running DAX queries, analysing execution plans, measuring performance via Server Timings. <b>It never modifies a model's metadata.</b> Eliminated under every reading.</p>
      <p class="contested"><b>Disputed question — the fate of Tabular Editor.</b> Tabular Editor (option B) is the <b>canonical</b> tool for <code class="inl">DiscourageImplicitMeasures</code>: it is the one Microsoft's documentation cites, and its very purpose is to expose the tabular model properties Power BI Desktop hides. Many answer keys therefore give <b>A and B</b>. The key retained here gives A and C, on this reading: if the question reasons in terms of official <b>Microsoft</b> tools rather than third-party ones, Tabular Editor falls outside the scope and SSMS comes in. What is certain: <b>A is right under both readings, D is wrong under both.</b></p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Tool</th><th>Read the model</th><th>Run DAX</th><th>Modify metadata</th></tr>
        <tr><td class="m">Power BI Desktop</td><td>Yes</td><td>Yes</td><td>Yes (through the UI)</td></tr>
        <tr><td class="m">Tabular Editor</td><td>Yes</td><td>Yes</td><td><b>Yes (all properties)</b></td></tr>
        <tr><td class="m">DAX Studio</td><td>Yes</td><td>Yes</td><td><b>No</b></td></tr>
        <tr><td class="m">SSMS</td><td>Yes</td><td>Yes</td><td>Partly (TMSL scripts)</td></tr>
      </table></div>`}
  },
  {
    id:"q306", kind:"multi", contested:true, type:TM,
    title:{fr:"Accélérer un modèle DirectQuery",en:"Speeding up a DirectQuery model"},
    stem:{fr:`<p>Vous avez un modèle sémantique <b>DirectQuery</b> interrogeant une source de <b>500 millions de lignes</b>. Report1 utilise le modèle et contient des visuels sur <b>plusieurs pages</b>. Vous devez <b>réduire le temps d'exécution des requêtes des visuels de toutes les pages</b>.</p><p class="ask">Quelles <b>deux</b> fonctionnalités pouvez-vous utiliser ? Chaque bonne réponse constitue une solution complète.</p>`,
          en:`<p>You have a Fabric workspace that contains a <b>DirectQuery</b> semantic model. The model queries a data source that has <b>500 million rows</b>. Report1 uses the model and contains visuals on <b>multiple pages</b>. You need to <b>reduce the query execution time for the visuals on all the pages</b>.</p><p class="ask">What are <b>two</b> features that you can use? Each correct answer presents a complete solution.</p>`},
    options:[
      {k:"A", fr:"les agrégations définies par l'utilisateur (user-defined aggregations)", en:"user-defined aggregations"},
      {k:"B", fr:"l'agrégation automatique (automatic aggregation)", en:"automatic aggregation"},
      {k:"C", fr:"la mise en cache des requêtes (query caching)", en:"query caching"},
      {k:"D", fr:"l'intégration OneLake", en:"OneLake integration"}
    ],
    answer:["A","B"],
    explain:{fr:`
      <p>En DirectQuery, chaque visuel envoie une requête à la source, qui doit balayer les 500 millions de lignes. Les <b>agrégations</b> créent une table pré-agrégée, beaucoup plus petite, stockée en mémoire. Power BI redirige alors les requêtes : si un visuel demande le chiffre d'affaires par mois, il trouve la réponse dans la table agrégée sans jamais toucher la source — c'est l'<i>aggregation hit</i>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Type de requête</th><th>Sans agrégation</th><th>Avec agrégation</th></tr>
        <tr><td>Ventes par mois</td><td>Scan de 500 M de lignes à la source</td><td>Quelques milliers de lignes en mémoire</td></tr>
        <tr><td>Détail fin (ligne par ligne)</td><td>Scan à la source</td><td>Scan à la source (fallback)</td></tr>
      </table></div>
      <ul>
        <li><b>A — User-defined aggregations.</b> Vous créez vous-même la table agrégée et configurez le mapping colonne par colonne. Contrôle total, travail manuel.</li>
        <li><b>B — Automatic aggregation.</b> Power BI observe les requêtes réellement exécutées et construit automatiquement les agrégats les plus rentables, en les ajustant dans le temps.</li>
      </ul>
      <p>Les deux résolvent le problème indépendamment — d'où la formulation <i>Each correct answer presents a complete solution</i>.</p>
      <p class="why">Pourquoi C tombe</p>
      <p><b>Query caching</b> est le distracteur sérieux, parce que le mot <i>cache</i> évoque immédiatement la performance. Deux raisons de l'écarter : il <b>ne s'applique pas au DirectQuery</b> (il met en cache les résultats pour les modèles Import et LiveConnect) ; et il ne couvrirait pas toutes les pages, puisque le cache ne se remplit qu'après une première exécution, par utilisateur ou par rôle RLS. L'énoncé demande un gain structurel, pas un gain au second passage.</p>
      <p class="why">Pourquoi D tombe</p>
      <p><b>OneLake integration</b> est une fonctionnalité des modèles Direct Lake : elle écrit les données du modèle sémantique en delta dans OneLake pour les rendre accessibles à d'autres moteurs. Elle concerne l'<b>exposition</b> des données, pas la performance des requêtes, et n'existe pas pour un modèle DirectQuery.</p>
      <p class="contested"><b>Certains corrigés donnent B et D.</b> Écarter A est difficile à défendre : les user-defined aggregations sont la fonctionnalité historique conçue exactement pour ce scénario, et font la même chose que B en manuel plutôt qu'en automatique. <b>Si B est correct, A l'est aussi.</b> Retenir D l'est encore plus : ce n'est pas une option de performance.</p>
      <p class="note"><b>Point de vocabulaire.</b> Le cache stocke des résultats <i>déjà calculés</i> ; l'agrégation stocke des données <i>pré-calculées</i> qui répondent à des requêtes jamais vues. Seule la seconde apporte un gain dès la première exécution, sur toutes les pages.</p>`,
      en:`
      <p>In DirectQuery, every visual sends a query to the source, which must scan 500 million rows. <b>Aggregations</b> create a pre-aggregated table, far smaller, stored in memory. Power BI then redirects queries: if a visual asks for revenue by month, it finds the answer in the aggregated table without ever touching the source — the <i>aggregation hit</i>.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Query type</th><th>Without aggregation</th><th>With aggregation</th></tr>
        <tr><td>Sales by month</td><td>Scan of 500 M rows at the source</td><td>A few thousand rows in memory</td></tr>
        <tr><td>Fine detail (row by row)</td><td>Scan at the source</td><td>Scan at the source (fallback)</td></tr>
      </table></div>
      <ul>
        <li><b>A — User-defined aggregations.</b> You build the aggregated table yourself and configure the mapping column by column. Full control, manual work.</li>
        <li><b>B — Automatic aggregation.</b> Power BI observes the queries users actually run and automatically builds the most valuable aggregates, tuning them over time.</li>
      </ul>
      <p>Each solves the problem independently — hence <i>Each correct answer presents a complete solution</i>.</p>
      <p class="why">Why C fails</p>
      <p><b>Query caching</b> is the serious distractor, because the word <i>cache</i> immediately suggests performance. Two reasons to discard it: it <b>does not apply to DirectQuery</b> (it caches results for Import and LiveConnect models); and it would not cover all pages, since the cache only fills after a first execution, per user or per RLS role. The stem asks for a structural gain, not a second-pass gain.</p>
      <p class="why">Why D fails</p>
      <p><b>OneLake integration</b> is a Direct Lake feature: it writes the semantic model's data as delta into OneLake so other engines can read it. It concerns data <b>exposure</b>, not query performance, and does not exist for a DirectQuery model.</p>
      <p class="contested"><b>Some answer keys give B and D.</b> Discarding A is hard to defend: user-defined aggregations are the historical feature built for exactly this scenario, and do the same job as B manually rather than automatically. <b>If B is correct, so is A.</b> Retaining D is harder still: it is not a performance option.</p>
      <p class="note"><b>A vocabulary point.</b> A cache stores results <i>already computed</i>; an aggregation stores <i>pre-computed</i> data that answers queries never yet seen. Only the second delivers a gain on the very first execution, across all pages.</p>`}
  },
  {
    id:"q307", kind:"single", type:T1,
    title:{fr:"Quelle vue pour diagrammer un modèle",en:"Which view to diagram a model"},
    stem:{fr:`<p>Vous avez un modèle sémantique complexe basé sur un <b>star schema</b>, avec de nombreuses tables dont une table de faits <b>Sales</b>. Vous devez créer un <b>diagramme du modèle</b> ne contenant <b>que la table Sales et les tables liées</b>.</p><p class="ask">Que devez-vous utiliser dans Power BI Desktop ?</p>`,
          en:`<p>You have a complex semantic model based on a <b>star schema</b>, with many tables including a fact table named <b>Sales</b>. You need to create a <b>diagram of the model</b> containing <b>only the Sales table and related tables</b>.</p><p class="ask">What should you use from Microsoft Power BI Desktop?</p>`},
    options:[
      {k:"A", fr:"les catégories de données (data categories)", en:"data categories"},
      {k:"B", fr:"la vue Données (Data view)", en:"Data view"},
      {k:"C", fr:"la vue Modèle (Model view)", en:"Model view"},
      {k:"D", fr:"la vue Requête DAX (DAX query view)", en:"DAX query view"}
    ],
    answer:["C"],
    explain:{fr:`
      <p>Le mot qui décide est <b>diagram</b>. La <b>Model view</b> est la seule vue de Power BI Desktop qui affiche les tables sous forme de diagramme, avec leurs relations représentées par des lignes. Et c'est là que se trouve la fonctionnalité que l'énoncé cible sans la nommer : les <b>layouts</b> (dispositions).</p>
      <p class="why">Comment on obtient le résultat demandé</p>
      <ul>
        <li>Créer un nouveau layout (le bouton <b>+</b> en bas, à côté de <i>All tables</i>).</li>
        <li>Faire glisser la table Sales dedans.</li>
        <li>Clic droit sur Sales → <b>Add related tables</b>.</li>
      </ul>
      <p>Power BI ajoute automatiquement toutes les tables directement liées à Sales, et rien d'autre — exactement <i>only the Sales table and related tables</i>.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>B — Data view.</b> Affiche le contenu d'une table sélectionnée, ligne par ligne, comme une feuille de calcul. Aucune représentation des relations.</li>
        <li><b>D — DAX query view.</b> Permet d'écrire et d'exécuter des requêtes DAX contre le modèle. Elle produit un résultat tabulaire, pas un schéma visuel.</li>
        <li><b>A — data categories.</b> Ce n'est même pas une vue, mais une <b>propriété de colonne</b> : elle indique à Power BI qu'une colonne contient une ville, un code postal, une URL d'image. Aucun lien avec la structure du modèle.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Vue</th><th>Ce qu'elle montre</th><th>Usage typique</th></tr>
        <tr><td class="m">Report</td><td>Le canevas de rapport</td><td>Créer des visuels</td></tr>
        <tr><td class="m">Table / Data</td><td>Le contenu des tables</td><td>Vérifier les données, colonnes calculées</td></tr>
        <tr><td class="m">Model</td><td>Le diagramme des tables et relations</td><td>Relations, layouts, propriétés du modèle</td></tr>
        <tr><td class="m">DAX query</td><td>Un éditeur de requêtes DAX</td><td>Interroger le modèle, tester des mesures</td></tr>
      </table></div>
      <p class="note"><b>Rattachez la question à l'objet manipulé.</b> Des lignes de données → Data view ; des relations ou une structure → Model view ; des visuels → Report view ; du code DAX à exécuter → DAX query view.</p>`,
      en:`
      <p>The deciding word is <b>diagram</b>. <b>Model view</b> is the only Power BI Desktop view that shows tables as a diagram, with their relationships drawn as lines. And it is where the feature the stem targets without naming lives: <b>layouts</b>.</p>
      <p class="why">How to get the requested result</p>
      <ul>
        <li>Create a new layout (the <b>+</b> button at the bottom, next to <i>All tables</i>).</li>
        <li>Drag the Sales table into it.</li>
        <li>Right-click Sales → <b>Add related tables</b>.</li>
      </ul>
      <p>Power BI automatically adds every table directly related to Sales, and nothing else — exactly <i>only the Sales table and related tables</i>.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>B — Data view.</b> Shows a selected table's contents row by row, like a spreadsheet. No representation of relationships.</li>
        <li><b>D — DAX query view.</b> Lets you write and run DAX queries against the model. It produces a tabular result, not a visual schema.</li>
        <li><b>A — data categories.</b> Not even a view, but a <b>column property</b>: it tells Power BI a column holds a city, a postcode, an image URL. Nothing to do with model structure.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>View</th><th>What it shows</th><th>Typical use</th></tr>
        <tr><td class="m">Report</td><td>The report canvas</td><td>Building visuals</td></tr>
        <tr><td class="m">Table / Data</td><td>Table contents</td><td>Checking data, calculated columns</td></tr>
        <tr><td class="m">Model</td><td>The diagram of tables and relationships</td><td>Relationships, layouts, model properties</td></tr>
        <tr><td class="m">DAX query</td><td>A DAX query editor</td><td>Querying the model, testing measures</td></tr>
      </table></div>
      <p class="note"><b>Tie the question to the object being handled.</b> Rows of data → Data view; relationships or structure → Model view; visuals → Report view; DAX code to run → DAX query view.</p>`}
  },
  {
    id:"q308", kind:"multi", type:TM,
    title:{fr:"Direct Lake — identifier les colonnes chargées en mémoire",en:"Direct Lake — identifying columns loaded into memory"},
    stem:{fr:`<p>Vous avez un modèle sémantique en mode <b>Direct Lake</b>. Vous suspectez que certaines requêtes DAX chargent des colonnes inutiles en mémoire. Vous devez identifier les <b>colonnes fréquemment utilisées qui sont chargées en mémoire</b>.</p><p class="ask">Quelles <b>deux</b> méthodes permettent d'atteindre l'objectif ? Chaque bonne réponse constitue une solution complète.</p>`,
          en:`<p>You have a semantic model using <b>Direct Lake</b> mode. You suspect that some DAX queries load unnecessary columns into memory. You need to identify the <b>frequently used columns that are loaded into memory</b>.</p><p class="ask">What are <b>two</b> ways to achieve the goal? Each correct answer presents a complete solution.</p>`},
    options:[
      {k:"A", fr:"Utiliser la fonctionnalité <i>Analyze in Excel</i>.", en:"Use the <i>Analyze in Excel</i> feature."},
      {k:"B", fr:"Utiliser l'outil <b>Vertipaq Analyzer</b>.", en:"Use the <b>Vertipaq Analyzer</b> tool."},
      {k:"C", fr:`Interroger la DMV <code class="inl">$System.DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS</code>.`, en:`Query the <code class="inl">$System.DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS</code> DMV.`},
      {k:"D", fr:`Interroger la DMV <code class="inl">DISCOVER_MEMORYGRANT</code>.`, en:`Query the <code class="inl">DISCOVER_MEMORYGRANT</code> DMV.`}
    ],
    answer:["B","C"],
    explain:{fr:`
      <p>En Direct Lake, le modèle ne charge pas tout en mémoire d'un coup. Les colonnes sont <b>paginées à la demande</b> : quand une requête DAX touche une colonne, ses segments sont transcodés depuis les fichiers Parquet et montés en mémoire, où ils restent en cache. Pour diagnostiquer, il faut voir <b>quelles colonnes sont résidentes et lesquelles sont chaudes</b>.</p>
      <p class="why">C — la DMV, source d'information brute</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Colonne de la DMV</th><th>Ce qu'elle révèle</th></tr>
        <tr><td class="m">TABLE_ID, COLUMN_ID</td><td>Quelle colonne</td></tr>
        <tr><td class="m">USED_SIZE</td><td>La taille occupée en mémoire</td></tr>
        <tr><td class="m">SEGMENT_NUMBER</td><td>Le découpage en segments</td></tr>
        <tr><td class="m">RECORDS_COUNT</td><td>Le nombre de lignes</td></tr>
      </table></div>
      <p>En Direct Lake, seuls les segments effectivement chargés apparaissent avec une taille non nulle. Vous l'exécutez depuis DAX Studio ou SSMS via le XMLA endpoint :</p>
      <pre class="code">SELECT * FROM $System.DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS</pre>
      <p class="why">B — Vertipaq Analyzer, l'interface de la même donnée</p>
      <p>C'est l'outil qui interroge cette même DMV et présente le résultat de façon lisible : taille par table, par colonne, cardinalité, taux de compression, part du dictionnaire. Il existe intégré dans DAX Studio (onglet <i>View Metrics</i>) ou comme classeur Excel autonome. Sur un modèle Direct Lake, il montre notamment la <b>température des colonnes</b>, un indicateur de fréquence d'accès — exactement ce que demande <i>frequently used columns</i>.</p>
      <p>C'est pour cela que B et C sont deux solutions complètes indépendantes : l'une est la donnée brute, l'autre son interface.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — Analyze in Excel.</b> Crée une connexion live vers le modèle pour construire des tableaux croisés dynamiques. C'est un outil de <b>consommation métier</b>, pas de diagnostic technique.</li>
        <li><b>D — DISCOVER_MEMORYGRANT.</b> Le distracteur intelligent, parce que le mot <i>memory</i> colle au sujet. Mais cette DMV concerne les <b>allocations mémoire accordées aux requêtes en cours d'exécution</b> — combien de mémoire une requête a demandé pour son traitement. C'est du niveau requête, pas du niveau colonne.</li>
      </ul>
      <p class="note"><b>Point à retenir sur Direct Lake.</b> Les colonnes se chargent <b>à la demande</b>, pas au rafraîchissement. C'est ce qui rend le diagnostic par colonne pertinent — sur un modèle Import, tout est chargé de toute façon.</p>`,
      en:`
      <p>In Direct Lake, the model does not load everything into memory at once. Columns are <b>paged on demand</b>: when a DAX query touches a column, its segments are transcoded from the Parquet files and mounted in memory, where they stay cached. To diagnose, you need to see <b>which columns are resident and which are hot</b>.</p>
      <p class="why">C — the DMV, the raw source</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>DMV column</th><th>What it reveals</th></tr>
        <tr><td class="m">TABLE_ID, COLUMN_ID</td><td>Which column</td></tr>
        <tr><td class="m">USED_SIZE</td><td>The size occupied in memory</td></tr>
        <tr><td class="m">SEGMENT_NUMBER</td><td>How it is split into segments</td></tr>
        <tr><td class="m">RECORDS_COUNT</td><td>The row count</td></tr>
      </table></div>
      <p>In Direct Lake, only segments actually loaded show a non-zero size. You run it from DAX Studio or SSMS over the XMLA endpoint:</p>
      <pre class="code">SELECT * FROM $System.DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS</pre>
      <p class="why">B — Vertipaq Analyzer, the interface onto the same data</p>
      <p>This is the tool that queries that same DMV and presents the result readably: size by table, by column, cardinality, compression ratio, dictionary share. It exists built into DAX Studio (the <i>View Metrics</i> tab) or as a standalone Excel workbook. On a Direct Lake model it notably shows column <b>temperature</b>, an access-frequency indicator — exactly what <i>frequently used columns</i> asks for.</p>
      <p>That is why B and C are two independent complete solutions: one is the raw data, the other its interface.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — Analyze in Excel.</b> Creates a live connection to the model for building pivot tables. A <b>business consumption</b> tool, not a technical diagnostic one.</li>
        <li><b>D — DISCOVER_MEMORYGRANT.</b> The clever distractor, because the word <i>memory</i> fits the subject. But that DMV concerns <b>memory grants made to currently executing queries</b> — how much memory a query requested for its processing. That is query level, not column level.</li>
      </ul>
      <p class="note"><b>A Direct Lake point worth keeping.</b> Columns load <b>on demand</b>, not at refresh. That is what makes per-column diagnosis meaningful — on an Import model, everything is loaded anyway.</p>`}
  },
  {
    id:"q309", kind:"single", type:T1,
    title:{fr:"Échec d'un refresh incrémentiel sur des CSV",en:"Incremental refresh failing on CSV files"},
    stem:{fr:`<p>Vous avez <b>30 fichiers CSV</b> dans OneLake, mis à jour quotidiennement. Vous créez un modèle sémantique <b>Model1</b> qui les utilise comme source, configurez un <b>rafraîchissement incrémentiel</b> et le publiez sur une capacité Premium. Au lancement d'un rafraîchissement, celui-ci <b>échoue par épuisement des ressources</b>.</p><p class="ask">Quelle est une cause possible ?</p>`,
          en:`<p>You have <b>30 CSV files</b> in OneLake, updated daily. You create a Power BI semantic model named <b>Model1</b> that uses the CSV files as a data source. You configure <b>incremental refresh</b> for Model1 and publish it to a Premium capacity. When you initiate a refresh, it <b>fails after running out of resources</b>.</p><p class="ask">What is a possible cause?</p>`},
    options:[
      {k:"A", fr:"Le query folding se produit.", en:"Query folding is occurring."},
      {k:"B", fr:"<i>Only refresh complete days</i> est sélectionné.", en:"<i>Only refresh complete days</i> is selected."},
      {k:"C", fr:"Le XMLA Endpoint est réglé sur Read Only.", en:"The XMLA Endpoint is set to Read Only."},
      {k:"D", fr:"Le query folding <b>ne</b> se produit <b>pas</b>.", en:"Query folding is <b>NOT</b> occurring."},
      {k:"E", fr:"Le type delta de la colonne utilisée pour partitionner les données a changé.", en:"The delta type of the column used to partition the data has changed."}
    ],
    answer:["D"],
    explain:{fr:`
      <p>Le rafraîchissement incrémentiel repose <b>entièrement</b> sur le query folding. Power BI génère automatiquement des filtres de date sur les partitions :</p>
      <pre class="code">WHERE OrderDate &gt;= '2024-01-01' AND OrderDate &lt; '2024-02-01'</pre>
      <p>Pour que cela fonctionne, ces filtres doivent être <b>poussés vers la source</b>, qui ne renvoie alors que les lignes de la période concernée. C'est tout l'intérêt : on ne recharge qu'une petite fenêtre au lieu de l'historique complet.</p>
      <p class="why">Ce qui se passe quand le folding échoue</p>
      <p>Le CSV est le pire cas possible : <b>un fichier plat n'a aucun moteur de requête</b>, il n'existe personne à qui envoyer un WHERE.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Étape</th><th>Ce qui se produit</th></tr>
        <tr><td class="m">1</td><td>Power BI génère le filtre de partition</td></tr>
        <tr><td class="m">2</td><td>La source CSV ne peut pas l'appliquer</td></tr>
        <tr><td class="m">3</td><td>Power BI charge les 30 fichiers <b>en entier</b> en mémoire</td></tr>
        <tr><td class="m">4</td><td>Il applique le filtre localement, <b>pour chaque partition</b></td></tr>
        <tr><td class="m">5</td><td>Multiplié par le nombre de partitions → saturation mémoire</td></tr>
      </table></div>
      <p>Le message <i>runs out of resources</i> décrit exactement ce comportement.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A</b> dit l'inverse. Si le folding fonctionnait, la source filtrerait elle-même et le refresh serait rapide et léger : c'est le fonctionnement normal, pas une cause d'échec. Paire miroir classique.</li>
        <li><b>B — Only refresh complete days.</b> Cette option exclut la journée en cours pour éviter des données partielles. Elle <b>réduit</b> le volume traité.</li>
        <li><b>C — XMLA en Read Only.</b> Le XMLA endpoint concerne l'accès par outils externes. Le refresh planifié d'un modèle ne passe pas par ce canal.</li>
        <li><b>E — type de la colonne de partition.</b> Formulation confuse, probablement une corruption du dump. Un changement de type provoquerait une erreur de configuration, pas un épuisement de ressources.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Source</th><th>Folding</th><th>Convient au refresh incrémentiel ?</th></tr>
        <tr><td>SQL Server, Azure SQL, warehouse Fabric</td><td>Oui</td><td><b>Oui</b></td></tr>
        <tr><td>Lakehouse via SQL endpoint</td><td>Oui</td><td><b>Oui</b></td></tr>
        <tr><td>CSV, Excel, JSON dans un dossier</td><td>Non</td><td><b>Non</b></td></tr>
        <tr><td>API REST, données saisies manuellement</td><td>Non</td><td><b>Non</b></td></tr>
      </table></div>
      <p class="note"><b>Règle courte.</b> Le refresh incrémentiel exige une source dotée d'un <b>moteur de requête</b>. Pour résoudre le problème de l'énoncé : charger d'abord les CSV dans un lakehouse ou un warehouse (c'est exactement ce que fait <i>Load to Tables</i>), puis pointer le modèle dessus.</p>`,
      en:`
      <p>Incremental refresh rests <b>entirely</b> on query folding. Power BI automatically generates date filters over the partitions:</p>
      <pre class="code">WHERE OrderDate &gt;= '2024-01-01' AND OrderDate &lt; '2024-02-01'</pre>
      <p>For this to work, those filters must be <b>pushed to the source</b>, which then returns only the rows for the period in question. That is the whole point: you reload one small window instead of the full history.</p>
      <p class="why">What happens when folding fails</p>
      <p>CSV is the worst possible case: <b>a flat file has no query engine</b>, there is nobody to send a WHERE to.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Step</th><th>What happens</th></tr>
        <tr><td class="m">1</td><td>Power BI generates the partition filter</td></tr>
        <tr><td class="m">2</td><td>The CSV source cannot apply it</td></tr>
        <tr><td class="m">3</td><td>Power BI loads all 30 files <b>in full</b> into memory</td></tr>
        <tr><td class="m">4</td><td>It applies the filter locally, <b>for each partition</b></td></tr>
        <tr><td class="m">5</td><td>Multiplied by the number of partitions → memory saturation</td></tr>
      </table></div>
      <p>The message <i>runs out of resources</i> describes exactly this behaviour.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A</b> says the opposite. If folding worked, the source would filter for itself and the refresh would be fast and light: that is normal operation, not a cause of failure. A classic mirror pair.</li>
        <li><b>B — Only refresh complete days.</b> That option excludes the current day to avoid partial data. It <b>reduces</b> the volume processed.</li>
        <li><b>C — XMLA set to Read Only.</b> The XMLA endpoint concerns access by external tools. A model's scheduled refresh does not go through that channel.</li>
        <li><b>E — the partition column's type.</b> Confused wording, probably dump corruption. A type change would raise a configuration error, not exhaust resources.</li>
      </ul>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Source</th><th>Folding</th><th>Suitable for incremental refresh?</th></tr>
        <tr><td>SQL Server, Azure SQL, Fabric warehouse</td><td>Yes</td><td><b>Yes</b></td></tr>
        <tr><td>Lakehouse via SQL endpoint</td><td>Yes</td><td><b>Yes</b></td></tr>
        <tr><td>CSV, Excel, JSON in a folder</td><td>No</td><td><b>No</b></td></tr>
        <tr><td>REST API, manually entered data</td><td>No</td><td><b>No</b></td></tr>
      </table></div>
      <p class="note"><b>Short rule.</b> Incremental refresh requires a source with a <b>query engine</b>. To solve the stem's problem: load the CSVs into a lakehouse or warehouse first (exactly what <i>Load to Tables</i> does), then point the model at that.</p>`}
  },
  {
    id:"q310", kind:"single", type:T1,
    title:{fr:"Prérequis au scale-out d'un modèle sémantique",en:"Prerequisite for semantic model scale-out"},
    stem:{fr:`<p>Vous avez un tenant Fabric utilisant une capacité Power BI Premium. Vous devez activer le <b>scale-out</b> pour un modèle sémantique.</p><p class="ask">Que devez-vous faire <b>en premier</b> ?</p>`,
          en:`<p>You have a Fabric tenant that uses a Power BI Premium capacity. You need to enable <b>scale-out</b> for a semantic model.</p><p class="ask">What should you do <b>first</b>?</p>`},
    options:[
      {k:"A", fr:"Au niveau du modèle sémantique, régler <i>Large dataset storage format</i> sur <b>Off</b>.", en:"At the semantic model level, set <i>Large dataset storage format</i> to <b>Off</b>."},
      {k:"B", fr:"Au niveau du tenant, activer <i>Create and use Metrics</i>.", en:"At the tenant level, set <i>Create and use Metrics</i> to Enabled."},
      {k:"C", fr:"Au niveau du modèle sémantique, régler <i>Large dataset storage format</i> sur <b>On</b>.", en:"At the semantic model level, set <i>Large dataset storage format</i> to <b>On</b>."},
      {k:"D", fr:"Au niveau du tenant, activer <i>Data Activator</i>.", en:"At the tenant level, set <i>Data Activator</i> to Enabled."}
    ],
    answer:["C"],
    explain:{fr:`
      <p>Le <b>scale-out</b> permet à Power BI de créer des <b>répliques en lecture seule</b> du modèle, afin de répartir la charge des requêtes sur plusieurs instances. Utile quand beaucoup d'utilisateurs interrogent le même modèle simultanément.</p>
      <p>Mais cette fonctionnalité exige d'abord le <b>Large semantic model storage format</b>, qui fait passer le modèle du format standard au format <i>Premium Files</i>. C'est ce format qui rend les répliques possibles. Sans lui, l'option de scale-out <b>n'apparaît même pas</b> dans les paramètres.</p>
      <pre class="code">1. Semantic model settings → Large dataset storage format = On   ← "first"
2. Semantic model settings → Scale out queries = On</pre>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
