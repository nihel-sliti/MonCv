      <p class="contested"><b>Disputed question — A or B for the third answer.</b> The key retains A. The counter-argument: <i>Build</i> is a <b>consumption</b> permission, used to create reports from an existing model; it plays no part in a deployment, and nowhere does the stem ask for developers to build reports on production data — under least privilege it is one privilege too many. In favour of <b>B</b>: without pipeline access, developers do not see the pipeline at all; workspace roles decide what can be written into each stage but grant no access to the pipeline object itself. Certain in both readings: <b>D and E</b>.</p>`}
  },
  {
    id:"q110", kind:"single", type:T1,
    title:{fr:"Diagnostiquer un throttling de capacité",en:"Diagnosing capacity throttling"},
    stem:{fr:`<p>Vous avez un tenant Fabric contenant un warehouse. <b>Plusieurs fois par jour, les performances de toutes les requêtes du warehouse se dégradent.</b> Vous suspectez que Fabric limite (throttle) le calcul utilisé par le warehouse.</p><p class="ask">Que devez-vous utiliser pour identifier si un throttling se produit ?</p>`,
          en:`<p>You have a Fabric tenant that contains a warehouse. <b>Several times a day, the performance of all warehouse queries degrades.</b> You suspect that Fabric is throttling the compute used by the warehouse.</p><p class="ask">What should you use to identify whether throttling is occurring?</p>`},
    options:[
      {k:"A", fr:"Les <i>Capacity settings</i>.", en:"The <i>Capacity settings</i>."},
      {k:"B", fr:"Le <i>Monitoring hub</i>.", en:"The <i>Monitoring hub</i>."},
      {k:"C", fr:"Les vues de gestion dynamique (DMV).", en:"Dynamic management views (DMVs)."},
      {k:"D", fr:"L'application <i>Microsoft Fabric Capacity Metrics</i>.", en:"The <i>Microsoft Fabric Capacity Metrics</i> app."}
    ],
    answer:["D"],
    explain:{fr:`
      <p>Le throttling est un mécanisme <b>de capacité</b>, pas de warehouse. Fabric applique un lissage de charge (<i>smoothing</i>) : quand la consommation d'unités de calcul dépasse durablement ce que la capacité absorbe, une dette s'accumule et le système finit par ralentir ou retarder les opérations. Le phénomène est transversal — il affecte tous les artefacts partageant la capacité.</p>
      <p>La <b>Capacity Metrics app</b> est l'outil conçu pour cela : consommation en CU dans le temps, lissage, dette accumulée, et un onglet <b>Throttling</b> indiquant les périodes de retard ou de rejet des requêtes.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — Capacity settings.</b> Permettent de <i>configurer</i> la capacité (SKU, affectation, workloads). Un panneau de réglage, pas un outil de diagnostic : aucune donnée de consommation dans le temps.</li>
        <li><b>B — Monitoring hub.</b> Liste les exécutions individuelles avec leur statut et leur durée. Utile pour savoir qu'une opération a été lente, mais il ne dit pas <i>pourquoi</i> et n'a aucune vue sur la capacité.</li>
        <li><b>C — DMV.</b> Le distracteur sérieux, car les DMV sont un vrai outil de diagnostic dans un warehouse. Mais leur portée s'arrête au warehouse : elles montrent qu'une requête est longue ou bloquée, sans jamais révéler que la cause est un throttling de capacité. Elles diagnostiquent l'intérieur, pas l'environnement.</li>
      </ul>
      <p class="why">Le raisonnement en une ligne</p>
      <p>Le symptôme est dans le warehouse, la cause est dans la capacité. L'énoncé le suggère lui-même : <b>toutes</b> les requêtes se dégradent, <b>plusieurs fois par jour</b> — un motif de saturation périodique, pas un problème de requête particulière. Quand un problème touche tout uniformément, il faut regarder au niveau supérieur.</p>
      <p class="note"><b>Règle courte.</b> Dès qu'un énoncé emploie <i>throttling</i>, <i>CU</i>, <i>smoothing</i>, <i>bursting</i> ou <i>capacity utilization</i>, c'est la Capacity Metrics app. C'est le seul outil qui donne une vue de la consommation dans le temps.</p>`,
      en:`
      <p>Throttling is a <b>capacity</b> mechanism, not a warehouse one. Fabric applies load smoothing: when compute-unit consumption persistently exceeds what the capacity can absorb, a debt builds up and the system ends up slowing or delaying operations. The phenomenon is cross-cutting — it affects every artifact sharing the capacity.</p>
      <p>The <b>Capacity Metrics app</b> is the tool built for this: CU consumption over time, smoothing, accumulated debt, and a <b>Throttling</b> tab showing periods of delayed or rejected requests.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — Capacity settings.</b> These <i>configure</i> the capacity (SKU, assignment, workloads). A settings panel, not a diagnostic tool: no consumption data over time.</li>
        <li><b>B — Monitoring hub.</b> Lists individual runs with status and duration. Useful for knowing an operation was slow, but it does not say <i>why</i> and has no view of the capacity.</li>
        <li><b>C — DMVs.</b> The serious distractor, because DMVs are a genuine diagnostic tool inside a warehouse. But their reach stops at the warehouse: they show a query is long or blocked, never that the cause is capacity throttling. They diagnose the inside, not the environment.</li>
      </ul>
      <p class="why">The reasoning in one line</p>
      <p>The symptom is in the warehouse, the cause is in the capacity. The stem hints at it: <b>all</b> queries degrade, <b>several times a day</b> — a pattern of periodic saturation, not a problem with one query. When a problem hits everything uniformly, look one level up.</p>
      <p class="note"><b>Short rule.</b> Whenever a stem uses <i>throttling</i>, <i>CU</i>, <i>smoothing</i>, <i>bursting</i> or <i>capacity utilization</i>, it is the Capacity Metrics app. It is the only tool that shows consumption over time.</p>`}
  },
  {
    id:"q111", kind:"fields", type:TY,
    title:{fr:"Domaine par défaut et rôles d'espace de travail",en:"Default domain and workspace roles"},
    stem:{fr:`<p>Un locataire Fabric contient trois utilisateurs — <b>User1</b>, <b>User2</b>, <b>User3</b> — et un groupe de sécurité <b>Group1</b> dont User1 et User3 sont membres.</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Espace de travail</th><th>Admin</th><th>Domaine</th><th>Admin</th></tr>
      <tr><td class="m">Workspace1</td><td class="m">User1</td><td class="m">Domain1</td><td class="m">User1</td></tr>
      <tr><td class="m">Workspace2</td><td class="m">User2</td><td class="m">Domain2</td><td class="m">User2</td></tr>
    </table></div>
    <p>User1 crée un nouvel espace de travail nommé <b>Workspace3</b>. Vous assignez <b>Domain1</b> comme domaine par défaut de Group1.</p>
    <p class="ask">Pour chacune des affirmations suivantes, indiquez si elle est vraie.</p>`,
          en:`<p>A Fabric tenant contains three users — <b>User1</b>, <b>User2</b>, <b>User3</b> — and a security group named <b>Group1</b>; User1 and User3 are members.</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Workspace</th><th>Admin</th><th>Domain</th><th>Admin</th></tr>
      <tr><td class="m">Workspace1</td><td class="m">User1</td><td class="m">Domain1</td><td class="m">User1</td></tr>
      <tr><td class="m">Workspace2</td><td class="m">User2</td><td class="m">Domain2</td><td class="m">User2</td></tr>
    </table></div>
    <p>User1 creates a new workspace named <b>Workspace3</b>. You assign <b>Domain1</b> as the default domain of Group1.</p>
    <p class="ask">For each statement, select Yes if it is true. Otherwise, select No.</p>`},
    fields:[
      {label:{fr:"User2 se voit attribuer le rôle Contributor sur Workspace3.",en:"User2 is assigned the Contributor role for Workspace3."}, hint:{fr:"User2 → Workspace3",en:"User2 → Workspace3"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0},
      {label:{fr:"User3 se voit attribuer le rôle Viewer sur Workspace3.",en:"User3 is assigned the Viewer role for Workspace3."}, hint:{fr:"User3 → Workspace3",en:"User3 → Workspace3"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1},
      {label:{fr:"User3 se voit attribuer le rôle Contributor sur Workspace1.",en:"User3 is assigned the Contributor role for Workspace1."}, hint:{fr:"User3 → Workspace1",en:"User3 → Workspace1"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0}
    ],
    explain:{fr:`
      <p class="note"><b>Corrigé officiel confirmé : Yes / No / Yes.</b> Ce corrigé a longtemps circulé sous plusieurs versions ; la correction officielle tranche. Il repose sur un tableau d'accès aux espaces de travail fourni avec l'énoncé — retenez donc le <b>mécanisme</b> ci-dessous, qui est ce que l'examen teste réellement, plutôt que la suite Yes/No pour elle-même.</p>
      <p class="why">La règle documentée</p>
      <p>Un <b>domaine par défaut</b> affecté à un groupe de sécurité produit <b>un seul effet</b> : lorsqu'un membre du groupe crée un espace de travail, celui-ci est automatiquement rattaché au domaine. C'est purement organisationnel — cela facilite le filtrage dans le OneLake data hub.</p>
      <p><b>Cette assignation n'accorde aucune permission.</b> La documentation Microsoft est explicite : rattacher un espace de travail à un domaine ne modifie ni les rôles ni les accès aux données. Les rôles d'espace de travail — Admin, Member, Contributor, Viewer — doivent toujours être accordés explicitement, individuellement ou à un groupe, depuis le panneau <i>Gérer l'accès</i>.</p>
      <p class="why">Ce qui se passe réellement</p>
      <p>User1 crée Workspace3. Comme il est membre de Group1 et que Domain1 en est le domaine par défaut, Workspace3 est rattaché à Domain1. User1 conserve le rôle <b>Admin</b> en tant que créateur — c'est le seul rôle réellement attribué par cette séquence.</p>
      <p class="note"><b>À retenir.</b> Un domaine est un <b>regroupement logique</b> destiné au data hub. Il ne confère jamais de permission. C'est exactement la même distinction que pour la question sur le regroupement des espaces Research : le domaine organise, il n'autorise pas.</p>`,
      en:`
      <p class="note"><b>Official key confirmed: Yes / No / Yes.</b> This key long circulated in several versions; the official correction settles it. It rests on a workspace-access table supplied with the stem — so learn the <b>mechanism</b> below, which is what the exam actually tests, rather than the Yes/No sequence for its own sake.</p>
      <p class="why">The documented rule</p>
      <p>A <b>default domain</b> assigned to a security group produces <b>exactly one effect</b>: when a member of the group creates a workspace, that workspace is automatically attached to the domain. It is purely organisational — it makes filtering in the OneLake data hub easier.</p>
      <p><b>The assignment grants no permission.</b> Microsoft's documentation is explicit: attaching a workspace to a domain changes neither roles nor data access. Workspace roles — Admin, Member, Contributor, Viewer — must always be granted explicitly, individually or to a group, from the <i>Manage access</i> panel.</p>
      <p class="why">What actually happens</p>
      <p>User1 creates Workspace3. As a member of Group1, whose default domain is Domain1, Workspace3 is attached to Domain1. User1 keeps the <b>Admin</b> role as its creator — the only role this sequence actually assigns.</p>
      <p class="note"><b>Worth keeping.</b> A domain is a <b>logical grouping</b> for the data hub. It never confers permissions. Exactly the same distinction as in the Research workspace grouping question: a domain organises, it does not authorise.</p>`}
  },
  {
    id:"q112", kind:"single", type:T1,
    title:{fr:"Permissions par défaut au partage d'un entrepôt",en:"Default permissions when sharing a warehouse"},
    stem:{fr:`<p>Vous avez un espace de travail <b>Workspace1</b> et un utilisateur <b>User1</b>. Workspace1 contient un entrepôt nommé <b>DW1</b>. Vous partagez DW1 avec User1 et lui assignez les <b>permissions par défaut</b> pour DW1.</p><p class="ask">Que peut faire User1 ?</p>`,
          en:`<p>You have a Fabric tenant that contains a workspace named <b>Workspace1</b> and a user named <b>User1</b>. Workspace1 contains a warehouse named <b>DW1</b>. You share DW1 with User1 and assign the <b>default permissions</b> for DW1.</p><p class="ask">What can User1 do?</p>`},
    options:[
      {k:"A", fr:"Lire les données des tables de DW1.", en:"Read data from the tables in DW1."},
      {k:"B", fr:"Créer des rapports en utilisant le dataset par défaut.", en:"Create reports by using the default dataset."},
      {k:"C", fr:"Lire les fichiers Parquet sous-jacents depuis OneLake.", en:"Read the underlying Parquet files from OneLake."},
      {k:"D", fr:"Se connecter à DW1 via le point de terminaison TDS (Tabular Data Stream).", en:"Connect to DW1 by using the Tabular Data Stream (TDS) endpoint."}
    ],
    answer:["D"],
    explain:{fr:`
      <p>Lorsqu'on partage un entrepôt Fabric, la permission accordée par défaut est <b>Read</b>. Contrairement à ce que son nom suggère, <b>elle n'autorise pas à lire les données</b> : elle donne uniquement le droit de se connecter à l'entrepôt via son point de terminaison SQL, qui utilise le protocole <b>TDS</b> — depuis SSMS, Azure Data Studio ou une chaîne de connexion applicative.</p>
      <p>L'utilisateur voit l'élément et peut s'y connecter, mais <b>toute requête SELECT échoue</b> faute de permission sur les objets.</p>
      <p class="why">Les trois cases décochées par défaut</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Case à cocher</th><th>Permission</th><th>Ce qu'elle débloque</th></tr>
        <tr><td>Read all data using SQL</td><td class="m">ReadData</td><td>Exécuter des SELECT sur les tables et vues</td></tr>
        <tr><td>Read all data using Apache Spark</td><td class="m">ReadAll</td><td>Accéder aux fichiers Parquet dans OneLake</td></tr>
        <tr><td>Build reports on the default dataset</td><td class="m">Build</td><td>Créer des rapports sur le modèle sémantique par défaut</td></tr>
      </table></div>
      <p>Les options <b>A</b>, <b>B</b> et <b>C</b> correspondent <i>exactement</i> à ces trois cases non cochées — c'est la structure même de la question. Chacune décrit une capacité qui nécessite un grant supplémentaire.</p>
      <p class="note"><b>Pour accorder l'accès aux données sans ces cases</b>, on peut aussi utiliser des permissions T-SQL granulaires (<code class="inl">GRANT SELECT ON …</code>), plus conformes au principe de moindre privilège. Et retenez la formule : <b>partage d'entrepôt, Read = se connecter, rien de plus</b>.</p>`,
      en:`
      <p>When you share a Fabric warehouse, the permission granted by default is <b>Read</b>. Despite its name, <b>it does not allow reading the data</b>: it grants only the right to connect to the warehouse through its SQL endpoint, which uses the <b>TDS</b> protocol — from SSMS, Azure Data Studio or an application connection string.</p>
      <p>The user sees the item and can connect to it, but <b>every SELECT fails</b> for lack of object-level permission.</p>
      <p class="why">The three boxes unchecked by default</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Checkbox</th><th>Permission</th><th>What it unlocks</th></tr>
        <tr><td>Read all data using SQL</td><td class="m">ReadData</td><td>Running SELECTs against tables and views</td></tr>
        <tr><td>Read all data using Apache Spark</td><td class="m">ReadAll</td><td>Reaching the Parquet files in OneLake</td></tr>
        <tr><td>Build reports on the default dataset</td><td class="m">Build</td><td>Creating reports on the default semantic model</td></tr>
      </table></div>
      <p>Options <b>A</b>, <b>B</b> and <b>C</b> map <i>exactly</i> onto those three unchecked boxes — that is the question's whole structure. Each describes a capability requiring a further grant.</p>
      <p class="note"><b>To grant data access without those boxes</b>, you can use granular T-SQL permissions (<code class="inl">GRANT SELECT ON …</code>), which fit least privilege better. And remember the formula: <b>warehouse sharing, Read = connect, nothing more</b>.</p>`}
  },
  {
    id:"q113", kind:"fields", type:TD,
    title:{fr:"Masquer une colonne à un rôle de sécurité",en:"Hiding a column from a security role"},
    stem:{fr:`<p>Vous créez un modèle sémantique avec Power BI Desktop. Le modèle contient un rôle de sécurité nommé <b>SalesRegionManager</b> et les tables Sales, SalesRegion et SalesAddress. Vous devez modifier le modèle pour que les utilisateurs assignés à ce rôle <b>ne puissent pas voir</b> la colonne <code class="inl">Address</code> de SalesAddress.</p><p class="ask">Quelles trois actions effectuer, et dans quel ordre ?</p>`,
          en:`<p>You are creating a semantic model in Power BI Desktop. The model contains a security role named <b>SalesRegionManager</b> and the tables Sales, SalesRegion and SalesAddress. You need to modify the model so that users assigned to that role <b>cannot see</b> the <code class="inl">Address</code> column in SalesAddress.</p><p class="ask">Which three actions should you perform in sequence?</p>`},
    fields:[
      {label:{fr:"Étape 1",en:"Step 1"}, hint:{fr:"par où commencer",en:"where to start"},
       opts:{fr:["Open the model in Power BI Desktop","Open the model in Tabular Editor","Select the Address column in SalesAddress","Set the Hidden property to True","Set Object Level Security to Default for SalesRegionManager","Set Object Level Security to None for SalesRegionManager"],en:["Open the model in Power BI Desktop","Open the model in Tabular Editor","Select the Address column in SalesAddress","Set the Hidden property to True","Set Object Level Security to Default for SalesRegionManager","Set Object Level Security to None for SalesRegionManager"]}, ans:1},
      {label:{fr:"Étape 2",en:"Step 2"}, hint:{fr:"ensuite",en:"then"},
       opts:{fr:["Open the model in Power BI Desktop","Open the model in Tabular Editor","Select the Address column in SalesAddress","Set the Hidden property to True","Set Object Level Security to Default for SalesRegionManager","Set Object Level Security to None for SalesRegionManager"],en:["Open the model in Power BI Desktop","Open the model in Tabular Editor","Select the Address column in SalesAddress","Set the Hidden property to True","Set Object Level Security to Default for SalesRegionManager","Set Object Level Security to None for SalesRegionManager"]}, ans:2},
      {label:{fr:"Étape 3",en:"Step 3"}, hint:{fr:"enfin",en:"finally"},
       opts:{fr:["Open the model in Power BI Desktop","Open the model in Tabular Editor","Select the Address column in SalesAddress","Set the Hidden property to True","Set Object Level Security to Default for SalesRegionManager","Set Object Level Security to None for SalesRegionManager"],en:["Open the model in Power BI Desktop","Open the model in Tabular Editor","Select the Address column in SalesAddress","Set the Hidden property to True","Set Object Level Security to Default for SalesRegionManager","Set Object Level Security to None for SalesRegionManager"]}, ans:5}
    ],
    explain:{fr:`
      <p>La <b>sécurité au niveau objet (OLS)</b> rend un objet — table ou colonne — <b>totalement invisible</b> pour les membres d'un rôle : il disparaît de la liste des champs, et toute requête ou visuel qui le référence renvoie une erreur. C'est le seul mécanisme qui satisfait <i>cannot see</i>.</p>
      <p class="why">Pourquoi Tabular Editor en premier</p>
      <p>L'OLS <b>n'est pas exposée dans l'interface de Power BI Desktop</b> — seule la RLS (<i>Gérer les rôles</i>) y est disponible. Elle se configure via Tabular Editor ou un script TMSL. D'où l'ordre imposé : ouvrir le modèle dans Tabular Editor, sélectionner la colonne, puis dans <i>Properties → Object Level Security</i>, affecter la valeur au rôle.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Valeur d'OLS</th><th>Effet pour le rôle</th></tr>
        <tr><td class="m">None</td><td><b>Aucun accès — objet invisible</b></td></tr>
        <tr><td class="m">Default / Read</td><td>Accès normal</td></tr>
      </table></div>
      <p class="why">Les deux distracteurs</p>
      <ul>
        <li><b>Set the Hidden property to True</b> masque simplement la colonne dans le volet Champs, <b>pour tous les utilisateurs sans distinction</b>. Ce n'est pas de la sécurité : la colonne reste accessible en DAX, via <i>Analyser dans Excel</i> ou l'endpoint XMLA.</li>
        <li><b>Object Level Security à Default</b> <i>accorde</i> l'accès au lieu de le refuser — l'inverse exact de l'objectif.</li>
      </ul>
      <p class="note"><b>Le couple à retenir.</b> <code class="inl">Hidden</code> = confort d'affichage. <b>OLS <code class="inl">None</code></b> = sécurité réelle. Dès qu'un énoncé dit <i>cannot see</i> ou <i>must not have access</i>, c'est l'OLS, et donc Tabular Editor.</p>`,
      en:`
      <p><b>Object-level security (OLS)</b> makes an object — table or column — <b>completely invisible</b> to members of a role: it vanishes from the field list, and any query or visual referencing it returns an error. It is the only mechanism that satisfies <i>cannot see</i>.</p>
      <p class="why">Why Tabular Editor first</p>
      <p>OLS <b>is not exposed in the Power BI Desktop interface</b> — only RLS (<i>Manage roles</i>) is available there. It is configured through Tabular Editor or a TMSL script. Hence the fixed order: open the model in Tabular Editor, select the column, then under <i>Properties → Object Level Security</i>, set the value for the role.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>OLS value</th><th>Effect for the role</th></tr>
        <tr><td class="m">None</td><td><b>No access — object invisible</b></td></tr>
        <tr><td class="m">Default / Read</td><td>Normal access</td></tr>
      </table></div>
      <p class="why">The two distractors</p>
      <ul>
        <li><b>Set the Hidden property to True</b> merely hides the column in the Fields pane, <b>for every user without distinction</b>. That is not security: the column stays reachable in DAX, through <i>Analyze in Excel</i> or the XMLA endpoint.</li>
        <li><b>Object Level Security set to Default</b> <i>grants</i> access instead of denying it — the exact opposite of the goal.</li>
      </ul>
      <p class="note"><b>The pair to remember.</b> <code class="inl">Hidden</code> = display convenience. <b>OLS <code class="inl">None</code></b> = real security. Whenever a stem says <i>cannot see</i> or <i>must not have access</i>, it is OLS, and therefore Tabular Editor.</p>`}
  },
  {
    id:"q114", kind:"multi", type:TM,
    title:{fr:"Objets à créer pour une row-level security",en:"Objects to create for row-level security"},
    stem:{fr:`<p>Vous avez un entrepôt Fabric nommé <b>Warehouse1</b> contenant une table <b>Table1</b> avec des données clients. Vous devez implémenter la <b>row-level security</b> pour Table1, en garantissant que les utilisateurs ne voient que leurs propres données.</p><p class="ask">Quels <b>deux</b> objets devez-vous créer ?</p>`,
          en:`<p>You have a Fabric warehouse named <b>Warehouse1</b> that contains a table named <b>Table1</b> with customer data. You need to implement <b>row-level security</b> for Table1. The solution must ensure that users see only their own data.</p><p class="ask">Which <b>two</b> objects should you create?</p>`},
    options:[
      {k:"A", fr:"DATABASE ROLE", en:"DATABASE ROLE"},
      {k:"B", fr:"STORED PROCEDURE", en:"STORED PROCEDURE"},
      {k:"C", fr:"CONSTRAINT", en:"CONSTRAINT"},
      {k:"D", fr:"FUNCTION", en:"FUNCTION"},
      {k:"E", fr:"SECURITY POLICY", en:"SECURITY POLICY"}
    ],
    answer:["D","E"],
    explain:{fr:`
      <p>La RLS dans un entrepôt Fabric repose sur <b>deux objets complémentaires et indissociables</b>.</p>
      <p class="why">1. La fonction table inline — le prédicat</p>
      <p>Elle définit <b>qui peut voir quelles lignes</b> : elle retourne une ligne lorsque l'accès est autorisé, rien sinon. <code class="inl">WITH SCHEMABINDING</code> est obligatoire, et elle s'appuie sur des fonctions système comme <code class="inl">USER_NAME()</code> ou <code class="inl">DATABASE_PRINCIPAL_ID()</code> pour identifier l'appelant.</p>
      <pre class="code">CREATE FUNCTION Security.tvf_SecurityPredicate(@SalesRep AS varchar(50))
RETURNS TABLE WITH SCHEMABINDING
AS RETURN SELECT 1 AS Result WHERE @SalesRep = USER_NAME();</pre>
      <p class="why">2. La stratégie de sécurité — le rattachement</p>
      <p>Elle relie la fonction à la table et active le filtrage.</p>
      <pre class="code">CREATE SECURITY POLICY Security.CustomerFilter
ADD FILTER PREDICATE Security.tvf_SecurityPredicate(SalesRep)
ON dbo.Table1 WITH (STATE = ON);</pre>
      <p>Une fois active, <b>toute</b> requête sur Table1 — <code class="inl">SELECT</code>, vue, rapport Power BI en DirectQuery — est filtrée automatiquement et de manière transparente, sans possibilité de contournement.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — Database role.</b> Gère les permissions au niveau <i>objet</i> (accès à une table entière), pas au niveau ligne.</li>
        <li><b>B — Stored procedure.</b> Une procédure <i>peut</i> filtrer, mais l'utilisateur garde un accès direct à la table sous-jacente — contournable, donc ce n'est pas une mesure de sécurité.</li>
        <li><b>C — Constraint.</b> Contrôle l'intégrité des données <b>en écriture</b> (CHECK, FOREIGN KEY). Aucun effet sur la lecture.</li>
      </ul>
      <p class="note"><b>La formule.</b> RLS = <code class="inl">CREATE FUNCTION</code> (prédicat, avec SCHEMABINDING) + <code class="inl">CREATE SECURITY POLICY</code>. Jamais l'un sans l'autre.</p>`,
      en:`
      <p>RLS in a Fabric warehouse rests on <b>two complementary and inseparable objects</b>.</p>
      <p class="why">1. The inline table-valued function — the predicate</p>
      <p>It defines <b>who can see which rows</b>: it returns a row when access is allowed, nothing otherwise. <code class="inl">WITH SCHEMABINDING</code> is mandatory, and it relies on system functions such as <code class="inl">USER_NAME()</code> or <code class="inl">DATABASE_PRINCIPAL_ID()</code> to identify the caller.</p>
      <pre class="code">CREATE FUNCTION Security.tvf_SecurityPredicate(@SalesRep AS varchar(50))
RETURNS TABLE WITH SCHEMABINDING
AS RETURN SELECT 1 AS Result WHERE @SalesRep = USER_NAME();</pre>
      <p class="why">2. The security policy — the binding</p>
      <p>It attaches the function to the table and switches filtering on.</p>
      <pre class="code">CREATE SECURITY POLICY Security.CustomerFilter
ADD FILTER PREDICATE Security.tvf_SecurityPredicate(SalesRep)
ON dbo.Table1 WITH (STATE = ON);</pre>
      <p>Once active, <b>every</b> query against Table1 — <code class="inl">SELECT</code>, view, DirectQuery Power BI report — is filtered automatically and transparently, with no way around it.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — Database role.</b> Manages permissions at the <i>object</i> level (access to a whole table), not at row level.</li>
        <li><b>B — Stored procedure.</b> A procedure <i>can</i> filter, but the user retains direct access to the underlying table — bypassable, so not a security measure.</li>
        <li><b>C — Constraint.</b> Enforces data integrity <b>on write</b> (CHECK, FOREIGN KEY). No effect on reads.</li>
      </ul>
      <p class="note"><b>The formula.</b> RLS = <code class="inl">CREATE FUNCTION</code> (predicate, with SCHEMABINDING) + <code class="inl">CREATE SECURITY POLICY</code>. Never one without the other.</p>`}
  },
  {
    id:"q115", kind:"fields", type:TH,
    title:{fr:"Contrôles d'accès sur deux tables",en:"Access controls over two tables"},
    stem:{fr:`<p>Workspace1 contient un entrepôt <b>DW1</b> avec deux tables, <b>Employees</b> et <b>Sales</b>. Tous les utilisateurs ont un accès en lecture à DW1. Vous devez implémenter des contrôles d'accès répondant aux exigences suivantes :</p>
    <ul>
      <li>Pour <b>Sales</b>, garantir que les utilisateurs ne voient que les données de <b>leur région</b>.</li>
      <li>Pour <b>Employees</b>, restreindre l'accès à toutes les <b>informations personnelles identifiables (PII)</b>.</li>
      <li><b>Maintenir l'accès aux données non restreintes</b> pour tous les utilisateurs.</li>
    </ul>
    <p class="ask">Que faut-il utiliser pour chaque table ?</p>`,
          en:`<p>Workspace1 contains a warehouse named <b>DW1</b> with two tables, <b>Employees</b> and <b>Sales</b>. All users have read access to DW1. You need to implement access controls that meet the following requirements:</p>
    <ul>
      <li>For <b>Sales</b>, ensure users see only data for <b>their respective region</b>.</li>
      <li>For <b>Employees</b>, restrict access to all <b>personally identifiable information (PII)</b>.</li>
      <li><b>Maintain access to unrestricted data</b> for all users.</li>
    </ul>
    <p class="ask">What should you use for each table?</p>`},
    fields:[
      {label:{fr:"Employees",en:"Employees"}, hint:{fr:"restreindre les PII",en:"restrict the PII"},
       opts:{fr:["Column-level security","Item permissions","Row-level security (RLS)","Workspace permissions"],en:["Column-level security","Item permissions","Row-level security (RLS)","Workspace permissions"]}, ans:0},
      {label:{fr:"Sales",en:"Sales"}, hint:{fr:"restreindre par région",en:"restrict by region"},
       opts:{fr:["Column-level security","Item permissions","Row-level security (RLS)","Workspace permissions"],en:["Column-level security","Item permissions","Row-level security (RLS)","Workspace permissions"]}, ans:2}
    ],
    explain:{fr:`
      <p>La distinction repose sur <b>l'axe de la restriction</b> : des lignes ou des colonnes.</p>
      <p class="why">Employees → CLS</p>
      <p>Les PII — numéro de sécurité sociale, salaire, date de naissance — sont des <b>colonnes entières</b> à masquer. La sécurité au niveau colonne s'implémente par des permissions T-SQL :</p>
      <pre class="code">GRANT SELECT ON dbo.Employees
    (EmployeeID, FirstName, LastName, Department)
TO [SalesTeam];</pre>
      <p>Les utilisateurs continuent d'accéder à la table et voient <b>toutes les lignes</b>, mais les colonnes non accordées leur sont inaccessibles.</p>
      <p class="why">Sales → RLS</p>
      <p>Chaque utilisateur ne doit voir que <b>certaines lignes</b>, selon sa région ; toutes les colonnes restent visibles. C'est la définition même de la row-level security, implémentée via une fonction de prédicat et une stratégie de sécurité.</p>
      <p class="why">Pourquoi les deux autres tombent</p>
      <p><b>Item permissions</b> accorde ou refuse l'accès à un élément entier — l'entrepôt DW1 : c'est du tout ou rien. <b>Workspace permissions</b> a une portée encore plus large. Ces deux options échouent sur la <b>troisième exigence</b> : les utiliser reviendrait à retirer l'accès à des données que tous doivent pouvoir consulter.</p>
      <p class="note"><b>Le couple.</b> Restreindre des <b>lignes</b> = RLS. Masquer des <b>colonnes</b> = CLS. Item et workspace permissions = tout-ou-rien, jamais une réponse quand l'énoncé exige de préserver un accès partiel.</p>`,
      en:`
      <p>The distinction rests on <b>the axis of the restriction</b>: rows or columns.</p>
      <p class="why">Employees → CLS</p>
      <p>PII — social security number, salary, date of birth — are <b>whole columns</b> to be hidden. Column-level security is implemented through T-SQL permissions:</p>
      <pre class="code">GRANT SELECT ON dbo.Employees
    (EmployeeID, FirstName, LastName, Department)
TO [SalesTeam];</pre>
      <p>Users keep access to the table and see <b>every row</b>, but the columns not granted are unreachable.</p>
      <p class="why">Sales → RLS</p>
      <p>Each user must see only <b>certain rows</b>, according to their region; all columns stay visible. That is the very definition of row-level security, implemented through a predicate function and a security policy.</p>
      <p class="why">Why the other two fail</p>
      <p><b>Item permissions</b> grants or denies access to a whole item — the DW1 warehouse: all or nothing. <b>Workspace permissions</b> is broader still. Both fail the <b>third requirement</b>: using them would remove access to data everyone must be able to consult.</p>
      <p class="note"><b>The pair.</b> Restricting <b>rows</b> = RLS. Hiding <b>columns</b> = CLS. Item and workspace permissions are all-or-nothing, never the answer when the stem requires preserving partial access.</p>`}
  },
  {
    id:"q116", kind:"single", type:T1,
    title:{fr:"Appliquer une politique DLP",en:"Applying a DLP policy"},
    stem:{fr:`<p>Vous avez un espace de travail <b>Workspace1</b> contenant un seul modèle sémantique auquel sont associés deux rapports Power BI. Vous avez un abonnement Microsoft 365 contenant une politique de <b>protection contre la perte de données (DLP)</b> nommée <b>DLP1</b>. Vous devez appliquer DLP1 aux éléments de Workspace1.</p><p class="ask">Que devez-vous faire ?</p>`,
          en:`<p>You have a Fabric tenant that contains a workspace named <b>Workspace1</b>. Workspace1 contains a single semantic model with two associated Power BI reports. You have a Microsoft 365 subscription that contains a <b>data loss prevention (DLP)</b> policy named <b>DLP1</b>. You need to apply DLP1 to the items in Workspace1.</p><p class="ask">What should you do?</p>`},
    options:[
      {k:"A", fr:"Créer une identité d'espace de travail (workspace identity).", en:"Create a workspace identity."},
      {k:"B", fr:"Appliquer un endorsement « Certified » au modèle sémantique.", en:"Apply a Certified endorsement to the semantic model."},
      {k:"C", fr:"Appliquer des étiquettes de confidentialité au modèle sémantique et aux rapports.", en:"Apply sensitivity labels to the semantic model and the reports."},
      {k:"D", fr:"Appliquer un endorsement « Master data » au modèle sémantique.", en:"Apply a Master data endorsement to the semantic model."}
    ],
    answer:["C"],
    explain:{fr:`
      <p>Les politiques DLP pour Power BI et Fabric fonctionnent par <b>détection de conditions</b>, et la condition principale est <b>l'étiquette de confidentialité</b> apposée sur un élément.</p>
      <p class="why">Le mécanisme complet</p>
      <p>Une étiquette (Confidential, Highly Confidential…) est appliquée aux éléments ; DLP1, défini dans le portail Microsoft Purview, cible l'emplacement « Power BI » et <b>se déclenche sur cette étiquette</b> ; la politique applique alors ses actions — alerte à l'administrateur, notification à l'utilisateur, blocage de l'export ou du partage.</p>
      <p><b>Sans étiquette, la politique n'a rien à détecter</b> : l'élément reste invisible pour DLP1. L'étiquetage est donc le prérequis indispensable.</p>
      <p>Les étiquettes sont par ailleurs <b>héritées en aval</b> : un modèle étiqueté transmet son étiquette aux rapports qui en dépendent et aux fichiers exportés (PBIX, Excel, PDF).</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — Workspace identity.</b> Identité managée permettant à l'espace de travail de s'authentifier auprès de sources Azure. Aucun lien avec la classification.</li>
        <li><b>B et D — Endorsements.</b> Les badges Promoted, Certified et Master data sont des marqueurs de <b>qualité et de fiabilité</b>, purement informatifs. Ils n'activent aucun mécanisme de protection.</li>
      </ul>
      <p class="note"><b>Ne confondez jamais endorsement et sensitivity label.</b> Le premier dit « ce contenu est fiable », le second dit « ce contenu est sensible ». Seul le second déclenche des mécanismes de protection, et donc la DLP.</p>`,
      en:`
      <p>DLP policies for Power BI and Fabric work by <b>condition detection</b>, and the principal condition is the <b>sensitivity label</b> applied to an item.</p>
      <p class="why">The full mechanism</p>
      <p>A label (Confidential, Highly Confidential…) is applied to the items; DLP1, defined in the Microsoft Purview portal, targets the "Power BI" location and <b>triggers on that label</b>; the policy then applies its actions — admin alert, user notification, blocking export or sharing.</p>
      <p><b>With no label, the policy has nothing to detect</b>: the item stays invisible to DLP1. Labelling is therefore the indispensable prerequisite.</p>
      <p>Labels are also <b>inherited downstream</b>: a labelled model passes its label to dependent reports and to exported files (PBIX, Excel, PDF).</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — Workspace identity.</b> A managed identity letting the workspace authenticate to Azure sources. Nothing to do with classification.</li>
        <li><b>B and D — Endorsements.</b> The Promoted, Certified and Master data badges are markers of <b>quality and trust</b>, purely informational. They activate no protection mechanism.</li>
      </ul>
      <p class="note"><b>Never confuse endorsement with sensitivity label.</b> The first says "this content is trustworthy", the second says "this content is sensitive". Only the second triggers protection mechanisms, and therefore DLP.</p>`}
  },
  {
    id:"q117", kind:"single", type:T1,
    title:{fr:"Format de fichier pour un modèle de rapport",en:"File format for a report template"},
    stem:{fr:`<p>Vous devez créer un fichier Power BI qui servira à créer plusieurs rapports. Le fichier doit : inclure des <b>connexions aux sources prédéfinies</b> ; inclure la <b>structure et le formatage</b> du rapport ; <b>ne contenir aucune donnée</b>.</p><p class="ask">Quel format devez-vous utiliser ?</p>`,
          en:`<p>You need to create a Microsoft Power BI file that will be used to create multiple reports. The solution must meet the following requirements: the file must include connections to predefined data sources; it must include the report structure and formatting; it must contain NO data.</p><p class="ask">Which file format should you use?</p>`},
    options:[{k:"A",fr:"PBIT",en:"PBIT"},{k:"B",fr:"PBIDS",en:"PBIDS"},{k:"C",fr:"PBIX",en:"PBIX"},{k:"D",fr:"PBIP",en:"PBIP"}],
    answer:["A"],
    explain:{fr:`
      <p><b>PBIT</b> (Power BI Template) est la version « vide » d'un fichier PBIX : il embarque les requêtes Power Query et les chaînes de connexion, le modèle de données (tables, relations, mesures DAX), les pages, visuels, thème et mise en forme — <b>mais pas les données mises en cache</b>.</p>
      <p>À l'ouverture d'un <code class="inl">.pbit</code>, Power BI Desktop demande les paramètres éventuels puis déclenche une actualisation pour charger les données depuis les sources ; le fichier résultant devient un <code class="inl">.pbix</code>. D'où sa double utilité : <b>distribuer un standard de rapport</b> à plusieurs équipes, et <b>partager un fichier léger</b> sans exposer de données confidentielles.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Format écarté</th><th>Contenu</th><th>Ce qui manque</th></tr>
        <tr><td class="m">B. PBIDS</td><td>Définition d'une source de données (JSON très léger)</td><td>Ni modèle, ni structure de rapport, ni formatage</td></tr>
        <tr><td class="m">C. PBIX</td><td>Rapport complet avec les données mises en cache</td><td><b>Viole la troisième exigence</b></td></tr>
        <tr><td class="m">D. PBIP</td><td>Projet : dossiers .Report et .SemanticModel en fichiers texte</td><td>Pas un fichier unique ; conçu pour Git, pas comme gabarit</td></tr>
      </table></div>
      <p class="note"><b>Les quatre formats en une ligne.</b> PBIX = rapport + données. PBIT = tout sauf les données. PBIDS = connexion seule. PBIP = projet Git. <b>Attention à la paire PBIT / PBIP</b> : l'un est un gabarit à dupliquer, l'autre un projet à versionner. Une autre question de ce recueil demande PBIP, pour des raisons opposées.</p>`,
      en:`
      <p><b>PBIT</b> (Power BI Template) is the "empty" version of a PBIX file: it carries the Power Query queries and connection strings, the data model (tables, relationships, DAX measures), the pages, visuals, theme and formatting — <b>but not the cached data</b>.</p>
      <p>On opening a <code class="inl">.pbit</code>, Power BI Desktop asks for any parameters then triggers a refresh to load data from the sources; the resulting file becomes a <code class="inl">.pbix</code>. Hence its dual purpose: <b>distributing a report standard</b> across teams, and <b>sharing a lightweight file</b> without exposing confidential data.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Format ruled out</th><th>Contents</th><th>What is missing</th></tr>
        <tr><td class="m">B. PBIDS</td><td>A data source definition (very light JSON)</td><td>No model, no report structure, no formatting</td></tr>
        <tr><td class="m">C. PBIX</td><td>Complete report with cached data</td><td><b>Violates the third requirement</b></td></tr>
        <tr><td class="m">D. PBIP</td><td>Project: .Report and .SemanticModel folders as text files</td><td>Not a single file; designed for Git, not as a template</td></tr>
      </table></div>
      <p class="note"><b>The four formats in one line.</b> PBIX = report + data. PBIT = everything but the data. PBIDS = connection only. PBIP = Git project. <b>Watch the PBIT / PBIP pair</b>: one is a template to duplicate, the other a project to version. Another question in this collection asks for PBIP, for opposite reasons.</p>`}
  },
  {
    id:"q118", kind:"single", type:T1,
    title:{fr:"Fichier à exclure du dépôt Git",en:"File to exclude from the Git repository"},
    stem:{fr:`<p>Vous avez un projet Power BI contenant un modèle sémantique. Vous prévoyez d'utiliser Azure DevOps pour le contrôle de version. Vous devez modifier le fichier <code class="inl">.gitignore</code> pour <b>empêcher les valeurs de données issues des sources d'être poussées vers le dépôt</b>.</p><p class="ask">Quel fichier devez-vous référencer ?</p>`,
          en:`<p>You have a Microsoft Power BI project that contains a semantic model. You plan to use Azure DevOps for version control. You need to modify the <code class="inl">.gitignore</code> file to <b>prevent data values from the data sources from being pushed to the repository</b>.</p><p class="ask">Which file should you reference?</p>`},
    options:[
      {k:"A", fr:`<code class="inl">unappliedChanges.json</code>`, en:`<code class="inl">unappliedChanges.json</code>`},
      {k:"B", fr:`<code class="inl">cache.abf</code>`, en:`<code class="inl">cache.abf</code>`},
      {k:"C", fr:`<code class="inl">localSettings.json</code>`, en:`<code class="inl">localSettings.json</code>`},
      {k:"D", fr:`<code class="inl">model.bim</code>`, en:`<code class="inl">model.bim</code>`}
    ],
    answer:["B"],
    explain:{fr:`
      <p>Dans un projet Power BI (<code class="inl">.pbip</code>), le fichier <code class="inl">cache.abf</code> est un <b>Analysis Services Backup File</b> situé dans le dossier <code class="inl">.pbi</code> du modèle sémantique. Il contient <b>les données importées et mises en cache par le moteur VertiPaq</b>, c'est-à-dire les valeurs réelles issues des sources. <b>C'est le seul artefact du projet qui embarque des données.</b></p>
      <p class="why">Trois raisons de l'exclure</p>
      <ul>
        <li><b>La confidentialité</b> — les données métier ne doivent pas se retrouver dans un dépôt.</li>
        <li><b>Le volume</b> — fichier binaire pouvant atteindre plusieurs centaines de mégaoctets, que Git gère très mal.</li>
        <li><b>L'inutilité</b> — il est régénéré localement à chaque actualisation.</li>
      </ul>
      <pre class="code">*.SemanticModel/.pbi/cache.abf
.pbi/localSettings.json</pre>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A et C</b> — <code class="inl">unappliedChanges.json</code> et <code class="inl">localSettings.json</code> sont souvent exclus aussi, mais pour des raisons <b>d'hygiène de dépôt</b> : ils ne contiennent aucune donnée source.</li>
        <li><b>D — <code class="inl">model.bim</code></b> contient la définition TMSL du modèle — tables, colonnes, relations, mesures — et doit <b>impérativement être versionné</b> : c'est le cœur même de ce qu'on suit en contrôle de source. L'exclure viderait le dépôt de son intérêt.</li>
      </ul>
      <p class="note"><b>La ligne de partage.</b> Dans un <code class="inl">.pbip</code> : <code class="inl">cache.abf</code> = les données VertiPaq, à exclure. <code class="inl">model.bim</code> et les fichiers <code class="inl">.tmdl</code> = les métadonnées, à versionner.</p>`,
      en:`
      <p>In a Power BI project (<code class="inl">.pbip</code>), the <code class="inl">cache.abf</code> file is an <b>Analysis Services Backup File</b> located in the semantic model's <code class="inl">.pbi</code> folder. It contains <b>the data imported and cached by the VertiPaq engine</b>, i.e. the real values from the sources. <b>It is the only artifact in the project that carries data.</b></p>
      <p class="why">Three reasons to exclude it</p>
      <ul>
        <li><b>Confidentiality</b> — business data should not end up in a repository.</li>
        <li><b>Size</b> — a binary file that can reach hundreds of megabytes, which Git handles very poorly.</li>
        <li><b>Pointlessness</b> — it is regenerated locally on every refresh.</li>
      </ul>
      <pre class="code">*.SemanticModel/.pbi/cache.abf
.pbi/localSettings.json</pre>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A and C</b> — <code class="inl">unappliedChanges.json</code> and <code class="inl">localSettings.json</code> are often excluded too, but for <b>repository hygiene</b>: they contain no source data.</li>
        <li><b>D — <code class="inl">model.bim</code></b> holds the model's TMSL definition — tables, columns, relationships, measures — and <b>must be versioned</b>: it is the very heart of what source control tracks. Excluding it would empty the repository of its purpose.</li>
      </ul>
      <p class="note"><b>The dividing line.</b> In a <code class="inl">.pbip</code>: <code class="inl">cache.abf</code> = VertiPaq data, exclude it. <code class="inl">model.bim</code> and the <code class="inl">.tmdl</code> files = metadata, version them.</p>`}
  },
  {
    id:"q119", kind:"single", type:T1,
    title:{fr:"Contenu d'un espace de travail après déploiement",en:"Workspace contents after a deployment"},
    stem:{fr:`<p>Un locataire Fabric contient les espaces de travail suivants :</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Nom</th><th>Contenu</th></tr>
      <tr><td class="m">Workspace_DEV</td><td class="m">Lakehouse1, Notebook1, Pipeline1, SemanticModel1</td></tr>
      <tr><td class="m">Workspace_TEST</td><td class="m">Lakehouse2, Notebook2, SemanticModel1</td></tr>
    </table></div>
    <p>Un pipeline de déploiement déploie les éléments de Workspace_DEV vers Workspace_TEST. <b>Tous les éléments portant des noms identiques sont appariés.</b> Vous déployez le contenu de DEV vers TEST.</p>
    <p class="ask">Quel sera le contenu de Workspace_TEST une fois le déploiement terminé ?</p>`,
          en:`<p>A Fabric tenant contains the following workspaces:</p>
    <div class="tbl-wrap"><table class="schema">
      <tr><th>Name</th><th>Contents</th></tr>
      <tr><td class="m">Workspace_DEV</td><td class="m">Lakehouse1, Notebook1, Pipeline1, SemanticModel1</td></tr>
      <tr><td class="m">Workspace_TEST</td><td class="m">Lakehouse2, Notebook2, SemanticModel1</td></tr>
    </table></div>
    <p>A deployment pipeline deploys the items from Workspace_DEV to Workspace_TEST. <b>In the pipeline, all items with identical names are paired.</b> You deploy the content of DEV to TEST.</p>
    <p class="ask">What will the contents of Workspace_TEST be after the deployment completes?</p>`},
    options:[
      {k:"A", fr:"Lakehouse1, Notebook1, Pipeline1, SemanticModel1 — 4 éléments", en:"Lakehouse1, Notebook1, Pipeline1, SemanticModel1 — 4 items"},
      {k:"B", fr:"Lakehouse1, Lakehouse2, Notebook1, Notebook2, Pipeline1, SemanticModel1 — 6 éléments", en:"Lakehouse1, Lakehouse2, Notebook1, Notebook2, Pipeline1, SemanticModel1 — 6 items"},
      {k:"C", fr:"Lakehouse1, Lakehouse2, Notebook1, Notebook2, Pipeline1, SemanticModel1, SemanticModel1 (2) — 7 éléments", en:"Lakehouse1, Lakehouse2, Notebook1, Notebook2, Pipeline1, SemanticModel1, SemanticModel1 (2) — 7 items"},
      {k:"D", fr:"Lakehouse2, Notebook2, SemanticModel1 — 3 éléments", en:"Lakehouse2, Notebook2, SemanticModel1 — 3 items"}
    ],
    answer:["B"],
    explain:{fr:`
      <p>Un pipeline de déploiement Fabric procède <b>élément par élément</b>, selon trois cas :</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Situation</th><th>Résultat dans la cible</th></tr>
        <tr><td>Élément source <b>apparié</b> (même nom, même type)</td><td>La version cible est écrasée / mise à jour — <b>pas de doublon</b></td></tr>
        <tr><td>Élément source <b>non apparié</b></td><td>Il est <b>créé</b> dans l'espace de travail cible</td></tr>
        <tr><td>Élément présent <b>uniquement dans la cible</b></td><td>Il est <b>conservé intact</b></td></tr>
      </table></div>
      <p class="why">Application</p>
      <p>Lakehouse1, Notebook1 et Pipeline1 sont <b>créés</b> dans TEST. SemanticModel1 est <b>apparié</b>, donc la version DEV écrase celle de TEST. Lakehouse2 et Notebook2, présents uniquement dans TEST, sont <b>conservés</b>. Total : <b>six éléments</b>.</p>
      <p class="why">Les deux pièges</p>
      <ul>
        <li><b>Un déploiement ne synchronise pas les deux espaces de travail.</b> Il n'effectue aucune suppression, donc les éléments qui n'existent que dans la cible survivent — d'où l'élimination de la réponse à 4 éléments.</li>
        <li><b>SemanticModel1 n'apparaît qu'une fois.</b> L'appariement par nom garantit une mise à jour en place : Fabric ne crée jamais un « SemanticModel1 (2) ».</li>
      </ul>
      <p class="note"><b>La formule.</b> Déploiement = créer les manquants + mettre à jour les appariés + laisser intacts les orphelins de la cible.</p>`,
      en:`
      <p>A Fabric deployment pipeline proceeds <b>item by item</b>, in three cases:</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Situation</th><th>Result in the target</th></tr>
        <tr><td>Source item <b>paired</b> (same name, same type)</td><td>The target version is overwritten / updated — <b>no duplicate</b></td></tr>
        <tr><td>Source item <b>unpaired</b></td><td>It is <b>created</b> in the target workspace</td></tr>
        <tr><td>Item present <b>only in the target</b></td><td>It is <b>left intact</b></td></tr>
      </table></div>
      <p class="why">Applied here</p>
      <p>Lakehouse1, Notebook1 and Pipeline1 are <b>created</b> in TEST. SemanticModel1 is <b>paired</b>, so the DEV version overwrites the TEST one. Lakehouse2 and Notebook2, present only in TEST, are <b>kept</b>. Total: <b>six items</b>.</p>
      <p class="why">The two traps</p>
      <ul>
        <li><b>A deployment does not synchronise the two workspaces.</b> It performs no deletions, so items existing only in the target survive — which rules out the 4-item answer.</li>
        <li><b>SemanticModel1 appears only once.</b> Pairing by name guarantees an in-place update: Fabric never creates a "SemanticModel1 (2)".</li>
      </ul>
      <p class="note"><b>The formula.</b> Deployment = create what is missing + update what is paired + leave the target's orphans untouched.</p>`}
  },
  {
    id:"q120", kind:"fields", type:TY,
    title:{fr:"Ce qu'un pipeline de déploiement transporte",en:"What a deployment pipeline carries"},
    stem:{fr:`<p>Workspace_DEV contient les modèles sémantiques <b>Model1</b> (politique d'actualisation planifiée : <b>configurée</b>) et <b>Model2</b> (non configurée), ainsi que les dataflows <b>DF1</b> (Dataflow <b>Gen1</b>, politique configurée) et <b>DF2</b> (Dataflow Gen2, non configurée). Vous créez Workspace_TEST, puis un pipeline de déploiement pour déplacer les éléments de DEV vers TEST. Vous exécutez le pipeline.</p><p class="ask">Pour chacune des affirmations suivantes, indiquez si elle est vraie.</p>`,
          en:`<p>Workspace_DEV contains semantic models <b>Model1</b> (scheduled refresh policy: <b>configured</b>) and <b>Model2</b> (not configured), plus dataflows <b>DF1</b> (Dataflow <b>Gen1</b>, policy configured) and <b>DF2</b> (Dataflow Gen2, not configured). You create Workspace_TEST, then a deployment pipeline to move items from DEV to TEST. You run the pipeline.</p><p class="ask">For each statement, select Yes if it is true. Otherwise, select No.</p>`},
    fields:[
      {label:{fr:"DF1 sera déployé vers Workspace_TEST.",en:"DF1 will be deployed to Workspace_TEST."}, hint:{fr:"un dataflow Gen1",en:"a Gen1 dataflow"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:0},
      {label:{fr:"Les données de Model1 seront déployées vers Workspace_TEST.",en:"The data of Model1 will be deployed to Workspace_TEST."}, hint:{fr:"le cache VertiPaq",en:"the VertiPaq cache"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1},
      {label:{fr:"La politique d'actualisation planifiée de Model1 sera déployée.",en:"The scheduled refresh policy of Model1 will be deployed."}, hint:{fr:"la planification",en:"the schedule"},
       opts:{fr:["Yes","No"],en:["Yes","No"]}, ans:1}
    ],
    explain:{fr:`
      <p><b>Principe directeur :</b> un pipeline de déploiement transporte la <b>définition</b> des éléments — structure, requêtes, mesures, visuels — <b>pas leur contenu ni leur configuration opérationnelle</b>.</p>
      <p class="why">1 — DF1 déployé : Yes</p>
      <p>Les dataflows <b>Gen1 et Gen2</b> figurent tous deux parmi les types d'éléments pris en charge. DF1 est copié vers Workspace_TEST avec ses requêtes et sa structure. Le fait qu'il soit de type Gen1 ne change rien — <b>c'est le piège de la question</b>, qui suggère qu'un ancien type serait exclu.</p>
      <p class="why">2 — Données de Model1 : No</p>
      <p>Seules les <b>métadonnées</b> du modèle sont déployées : tables, colonnes, relations, mesures DAX, requêtes Power Query. Le cache VertiPaq reste dans l'espace de travail source. Après déploiement, Model1 dans TEST est <b>vide</b> tant qu'aucune actualisation n'a été exécutée — ce qui est souhaitable, l'environnement de test devant se connecter à ses propres sources via des règles de déploiement.</p>
      <p class="why">3 — Politique d'actualisation : No</p>
      <p>Les paramètres d'actualisation planifiée sont <b>propres à chaque espace de travail</b> et ne sont jamais transférés. Il en va de même pour les identifiants de connexion aux sources. La logique est saine : un environnement de test n'a pas vocation à hériter du calendrier de la production.</p>
      <p class="note"><b>La formule.</b> Pipeline de déploiement = métadonnées uniquement. Ni données, ni planification, ni credentials.</p>`,
      en:`
      <p><b>Guiding principle:</b> a deployment pipeline carries the <b>definition</b> of items — structure, queries, measures, visuals — <b>not their content or their operational configuration</b>.</p>
      <p class="why">1 — DF1 deployed: Yes</p>
      <p>Dataflows <b>Gen1 and Gen2</b> are both among the supported item types. DF1 is copied to Workspace_TEST with its queries and structure. Its being Gen1 changes nothing — <b>that is the question's trap</b>, implying an older type would be excluded.</p>
      <p class="why">2 — Model1's data: No</p>
      <p>Only the model's <b>metadata</b> is deployed: tables, columns, relationships, DAX measures, Power Query queries. The VertiPaq cache stays in the source workspace. After deployment, Model1 in TEST is <b>empty</b> until a refresh has run — which is desirable, since the test environment should connect to its own sources through deployment rules.</p>
      <p class="why">3 — Refresh policy: No</p>
      <p>Scheduled refresh settings are <b>specific to each workspace</b> and are never transferred. The same goes for source connection credentials. The logic is sound: a test environment has no business inheriting production's schedule.</p>
      <p class="note"><b>The formula.</b> Deployment pipeline = metadata only. No data, no scheduling, no credentials.</p>`}
  },
  {
    id:"q121", kind:"single", type:T1,
    title:{fr:"Règle de déploiement pour une source de données",en:"Deployment rule for a data source"},
    stem:{fr:`<p>Vous avez deux espaces de travail : <b>Workspace1</b> (développement) et <b>Workspace2</b> (production). Chaque environnement utilise un <b>compte de stockage différent</b>. Workspace1 contient un <b>Dataflow Gen2</b> nommé Dataflow1, dont la source est un fichier CSV dans un stockage blob. Vous prévoyez un pipeline de déploiement de Workspace1 vers Workspace2, et devez garantir que la source de données référence le bon emplacement en production.</p><p class="ask">Que devez-vous faire ?</p>`,
          en:`<p>You have two workspaces: <b>Workspace1</b> (development) and <b>Workspace2</b> (production). Each environment uses a <b>different storage account</b>. Workspace1 contains a <b>Dataflow Gen2</b> named Dataflow1 whose data source is a CSV file in blob storage. You plan to implement a deployment pipeline from Workspace1 to Workspace2, and must ensure the data source references the correct location in production.</p><p class="ask">What should you do?</p>`},
    options:[
      {k:"A", fr:"Créer une règle de source de données (data source rule) uniquement.", en:"Create a data source rule only."},
      {k:"B", fr:"Créer une règle de paramètre (parameter rule) uniquement.", en:"Create a parameter rule only."},
      {k:"C", fr:"Créer une règle de source de données et une règle de paramètre.", en:"Create a data source rule and a parameter rule."},
      {k:"D", fr:"Après avoir implémenté le pipeline, modifier manuellement la source de données.", en:"After implementing the pipeline, manually modify the data source."}
    ],
    answer:["B"],
    explain:{fr:`
      <p>Les pipelines de déploiement proposent <b>deux types de règles</b>, et le choix dépend entièrement du type d'élément et de source.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Type de règle</th><th>Portée</th></tr>
        <tr><td class="m">Data source rule</td><td>Remplace une connexion par une autre. Réservée aux <b>sources structurées supportées</b> (SQL Server, Analysis Services…) et principalement aux <b>modèles sémantiques</b>.</td></tr>
        <tr><td class="m">Parameter rule</td><td>Remplace la valeur d'un <b>paramètre Power Query</b> défini dans l'élément.</td></tr>
      </table></div>
      <p class="why">La démarche correcte</p>
      <p>Pour un Dataflow Gen2 lisant un CSV dans un compte de stockage : définir dans Dataflow1 un paramètre Power Query — par exemple <code class="inl">StorageAccountUrl</code> — utilisé dans l'étape Source, puis créer une <b>règle de paramètre</b> sur l'étape Production qui lui affecte l'URL du compte de production. À chaque déploiement, la règle s'applique automatiquement.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A et C.</b> Le stockage blob <b>n'est pas un type de source pris en charge</b> par le mécanisme de data source rule, et celui-ci ne s'applique pas aux Dataflow Gen2.</li>
        <li><b>D.</b> La modification manuelle fonctionnerait une fois, mais serait <b>écrasée à chaque nouveau déploiement</b> — c'est précisément ce qu'un pipeline existe pour éviter.</li>
      </ul>
      <p class="note"><b>Le couple à distinguer.</b> Data source rule = une connexion structurée à substituer. Parameter rule = une valeur de paramètre Power Query. Dès qu'il s'agit d'un Dataflow Gen2 ou d'un stockage de fichiers, c'est le paramètre.</p>`,
      en:`
      <p>Deployment pipelines offer <b>two kinds of rule</b>, and the choice depends entirely on the item type and source type.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Rule type</th><th>Scope</th></tr>
        <tr><td class="m">Data source rule</td><td>Swaps one connection for another. Limited to <b>supported structured sources</b> (SQL Server, Analysis Services…) and mainly to <b>semantic models</b>.</td></tr>
        <tr><td class="m">Parameter rule</td><td>Replaces the value of a <b>Power Query parameter</b> defined in the item.</td></tr>
      </table></div>
      <p class="why">The correct approach</p>
      <p>For a Dataflow Gen2 reading a CSV from a storage account: define a Power Query parameter in Dataflow1 — say <code class="inl">StorageAccountUrl</code> — used in the Source step, then create a <b>parameter rule</b> on the Production stage assigning it the production account's URL. The rule applies automatically on every deployment.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A and C.</b> Blob storage <b>is not a source type supported</b> by the data source rule mechanism, and that mechanism does not apply to Dataflow Gen2.</li>
        <li><b>D.</b> A manual change would work once, but would be <b>overwritten on every subsequent deployment</b> — precisely what a pipeline exists to prevent.</li>
      </ul>
      <p class="note"><b>The pair to separate.</b> Data source rule = a structured connection to substitute. Parameter rule = a Power Query parameter value. Whenever a Dataflow Gen2 or file storage is involved, it is the parameter.</p>`}
  },
  {
    id:"q122", kind:"fields", contested:true, type:TD,
    title:{fr:"Activer le contrôle de version pour un espace de travail",en:"Enabling version control for a workspace"},
    stem:{fr:`<p>Vous avez un espace de travail <b>Workspace1</b> qui utilise le mode de licence <b>Pro</b> et contient un modèle sémantique <b>Model1</b>. Vous avez une organisation Azure DevOps. Vous devez activer le contrôle de version pour Workspace1, en garantissant que <b>Model1 est ajouté au dépôt</b>.</p><p class="ask">Quelles trois actions effectuer, et dans quel ordre ?</p>`,
          en:`<p>You have a workspace named <b>Workspace1</b> that uses the <b>Pro</b> license mode and contains a semantic model named <b>Model1</b>. You have an Azure DevOps organization. You need to enable version control for Workspace1. The solution must ensure that <b>Model1 is added to the repository</b>.</p><p class="ask">Which three actions should you perform in sequence?</p>`},
    fields:[
      {label:{fr:"Étape 1",en:"Step 1"}, hint:{fr:"par où commencer",en:"where to start"},
       opts:{fr:["Connect Workspace1 to a Git provider","Sync Workspace1 with the repository","Configure branch policies in Azure DevOps","Create a deployment pipeline","Assign Workspace1 to a Fabric capacity"],en:["Connect Workspace1 to a Git provider","Sync Workspace1 with the repository","Configure branch policies in Azure DevOps","Create a deployment pipeline","Assign Workspace1 to a Fabric capacity"]}, ans:0},
      {label:{fr:"Étape 2",en:"Step 2"}, hint:{fr:"ensuite",en:"then"},
       opts:{fr:["Connect Workspace1 to a Git provider","Sync Workspace1 with the repository","Configure branch policies in Azure DevOps","Create a deployment pipeline","Assign Workspace1 to a Fabric capacity"],en:["Connect Workspace1 to a Git provider","Sync Workspace1 with the repository","Configure branch policies in Azure DevOps","Create a deployment pipeline","Assign Workspace1 to a Fabric capacity"]}, ans:1},
      {label:{fr:"Étape 3",en:"Step 3"}, hint:{fr:"enfin",en:"finally"},
       opts:{fr:["Connect Workspace1 to a Git provider","Sync Workspace1 with the repository","Configure branch policies in Azure DevOps","Create a deployment pipeline","Assign Workspace1 to a Fabric capacity"],en:["Connect Workspace1 to a Git provider","Sync Workspace1 with the repository","Configure branch policies in Azure DevOps","Create a deployment pipeline","Assign Workspace1 to a Fabric capacity"]}, ans:2}
    ],
    explain:{fr:`
      <p class="why">1. Connecter</p>
      <p>Dans <i>Workspace settings → Git integration</i>, on sélectionne Azure DevOps puis on renseigne l'organisation, le projet, le dépôt, la branche et le dossier cible. Le compte Fabric doit appartenir au <b>même locataire Entra ID</b> que l'organisation Azure DevOps.</p>
      <p class="why">2. Synchroniser</p>
      <p>À la connexion, Fabric compare l'espace de travail et le dépôt. Comme Model1 existe déjà côté espace de travail et que la branche est vide, on choisit la direction <b>Workspace → Git</b> et l'on valide le commit. <b>C'est cette opération qui ajoute effectivement Model1 au dépôt</b>, satisfaisant l'exigence explicite de l'énoncé.</p>
      <p class="why">3. Protéger la branche</p>
      <p>Les politiques de branche — revues obligatoires, restriction des pushes directs — rendent le contrôle de version opérationnel en équipe. Elles viennent <b>après</b> la synchronisation initiale, sinon le premier commit du contenu existant y serait lui-même soumis.</p>
      <p><b>Create a deployment pipeline</b> sert à promouvoir du contenu entre environnements : un mécanisme distinct et complémentaire du contrôle de version, pas un prérequis.</p>
      <p class="contested"><b>À garder en tête malgré ce corrigé.</b> L'intégration Git de Fabric <b>exige une capacité F ou P</b> ; en mode <b>Pro</b>, l'option « Git integration » est tout simplement indisponible dans les paramètres de l'espace de travail. C'est un fait documenté, et l'énoncé mentionne explicitement le mode Pro. Si une variante de la question propose cette action en position utile, <b>« Assign Workspace1 to a Fabric capacity » devient alors la première étape</b>.</p>
      <p class="note"><b>La séquence.</b> Connecter → Synchroniser → Protéger la branche.</p>`,
      en:`
      <p class="why">1. Connect</p>
      <p>Under <i>Workspace settings → Git integration</i>, select Azure DevOps then supply the organization, project, repository, branch and target folder. The Fabric account must belong to the <b>same Entra ID tenant</b> as the Azure DevOps organization.</p>
      <p class="why">2. Sync</p>
      <p>On connection, Fabric compares the workspace with the repository. Since Model1 already exists on the workspace side and the branch is empty, you choose the <b>Workspace → Git</b> direction and commit. <b>This operation is what actually adds Model1 to the repository</b>, satisfying the stem's explicit requirement.</p>
      <p class="why">3. Protect the branch</p>
      <p>Branch policies — required reviews, restricting direct pushes — make version control workable for a team. They come <b>after</b> the initial sync, otherwise the first commit of existing content would itself be subject to them.</p>
      <p><b>Create a deployment pipeline</b> promotes content between environments: a distinct, complementary mechanism to version control, not a prerequisite.</p>
      <p class="contested"><b>Worth keeping in mind despite this key.</b> Fabric's Git integration <b>requires an F or P capacity</b>; in <b>Pro</b> mode the "Git integration" option is simply unavailable in the workspace settings. That is documented, and the stem explicitly mentions Pro mode. If a variant of this question offers that action in a usable position, <b>"Assign Workspace1 to a Fabric capacity" becomes the first step</b>.</p>
      <p class="note"><b>The sequence.</b> Connect → Sync → Protect the branch.</p>`}
  },
  {
    id:"q123", kind:"single", type:T1,
    title:{fr:"Accélérer les écritures via l'endpoint XMLA",en:"Speeding up XMLA endpoint writes"},
    stem:{fr:`<p>Vous avez un espace de travail <b>Workspace1</b> contenant plusieurs modèles sémantiques, dont <b>Model1</b>. Model1 est mis à jour via un <b>endpoint XMLA</b>. Vous devez <b>augmenter la vitesse des opérations d'écriture</b> de l'endpoint XMLA.</p><p class="ask">Que devez-vous faire ?</p>`,
          en:`<p>You have a workspace named <b>Workspace1</b> that contains several semantic models, including <b>Model1</b>. Model1 is updated by using an <b>XMLA endpoint</b>. You need to <b>increase the speed of the write operations</b> of the XMLA endpoint.</p><p class="ask">What should you do?</p>`},
    options:[
      {k:"A", fr:"Supprimer de Workspace1 les modèles sémantiques inutilisés.", en:"Delete unused semantic models from Workspace1."},
      {k:"B", fr:"Sélectionner le format de stockage « Large semantic model » pour Workspace1.", en:"Select the Large semantic model storage format for Workspace1."},
      {k:"C", fr:"Configurer Model1 pour utiliser le format de stockage Direct Lake.", en:"Configure Model1 to use the Direct Lake storage format."},
      {k:"D", fr:"Supprimer de Model1 les colonnes inutilisées.", en:"Delete unused columns from Model1."}
    ],
    answer:["B"],
    explain:{fr:`
      <p>Le format <b>Large semantic model storage</b> (anciennement <i>Large dataset storage format</i>) modifie la manière dont le modèle est stocké et géré en mémoire par le moteur Analysis Services. Deux effets concrets sur les écritures XMLA :</p>
      <ul>
        <li>Le modèle utilise le stockage <b>Premium Files</b>, avec une gestion de la mémoire <b>par pagination</b> au lieu d'un chargement monolithique.</li>
        <li>Les opérations d'écriture — création de partitions, actualisations incrémentielles, déploiements de métadonnées — deviennent <b>nettement plus rapides</b>.</li>
      </ul>
      <p>Microsoft recommande explicitement d'activer ce format <b>lorsque l'endpoint XMLA est utilisé en écriture</b>, indépendamment de la taille actuelle du modèle. Le paramètre s'active dans <i>Workspace settings → Semantic models</i>.</p>
      <p class="why">Pourquoi les autres tombent</p>
      <ul>
        <li><b>A — supprimer des modèles inutilisés.</b> Libère de la mémoire de capacité et réduit l'encombrement, mais n'a <b>aucun effet sur la mécanique d'écriture XMLA</b> d'un modèle donné.</li>
        <li><b>C — Direct Lake.</b> Ce mode concerne les <b>lectures</b> et supporte mal les écritures XMLA, imposant au contraire des restrictions sur les modifications de modèle.</li>
        <li><b>D — supprimer des colonnes inutilisées.</b> Excellente pratique d'optimisation — elle réduit la taille du modèle et accélère l'actualisation des données — mais l'énoncé vise <b>les écritures via l'endpoint</b>, pas le volume du modèle.</li>
      </ul>
      <p class="note"><b>Recoupement.</b> Le <i>Large semantic model storage format</i> est aussi le prérequis du scale-out. C'est un réglage qui conditionne plusieurs fonctionnalités avancées en Premium : dès qu'une question porte sur l'une d'elles, vérifiez d'abord ce format.</p>`,
      en:`
      <p>The <b>Large semantic model storage</b> format (formerly <i>Large dataset storage format</i>) changes how the model is stored and managed in memory by the Analysis Services engine. Two concrete effects on XMLA writes:</p>
      <ul>
        <li>The model uses <b>Premium Files</b> storage, with <b>paged</b> memory management instead of a monolithic load.</li>
        <li>Write operations — creating partitions, incremental refreshes, metadata deployments — become <b>markedly faster</b>.</li>
      </ul>
      <p>Microsoft explicitly recommends enabling this format <b>when the XMLA endpoint is used for writing</b>, regardless of the model's current size. The setting lives under <i>Workspace settings → Semantic models</i>.</p>
      <p class="why">Why the others fail</p>
      <ul>
        <li><b>A — deleting unused models.</b> Frees capacity memory and reduces clutter, but has <b>no effect on the XMLA write mechanics</b> of a given model.</li>
        <li><b>C — Direct Lake.</b> That mode concerns <b>reads</b> and handles XMLA writes poorly, in fact imposing restrictions on model modifications.</li>
        <li><b>D — deleting unused columns.</b> An excellent optimisation practice — it shrinks the model and speeds up data refresh — but the stem targets <b>writes through the endpoint</b>, not model size.</li>
      </ul>
      <p class="note"><b>Cross-reference.</b> The <i>Large semantic model storage format</i> is also the prerequisite for scale-out. It is a setting that gates several advanced Premium features: whenever a question touches one of them, check this format first.</p>`}
  },
  {
    id:"q124", kind:"single", type:T1,
    title:{fr:"RLS dynamique — USEROBJECTID",en:"Dynamic RLS — USEROBJECTID"},
    stem:{fr:`<p class="note" style="margin:0 0 10px"><b>Série « Does this meet the goal ? »</b> — trois solutions différentes sont proposées pour le même problème. Chacune se juge séparément, et plusieurs peuvent être valables.</p>
    <p>Votre réseau contient un domaine AD DS <b>contoso.com</b> synchronisé avec un locataire Microsoft Entra via Entra Connect. Vous avez un locataire Fabric contenant un modèle sémantique. Vous activez la <b>sécurité au niveau ligne dynamique (RLS)</b> et publiez le modèle dans le service Fabric.</p>
    <p>Vous interrogez une mesure qui utilise la fonction <code class="inl">USERNAME()</code> : <b>la requête retourne un résultat vide</b>. Vous devez garantir que la mesure retourne le <b>nom principal de l'utilisateur (UPN)</b>.</p>
    <p><b>Solution :</b> vous modifiez la mesure pour utiliser la fonction <code class="inl">USEROBJECTID()</code>.</p>
    <p class="ask">Cette solution atteint-elle l'objectif ?</p>`,
          en:`<p class="note" style="margin:0 0 10px"><b>"Does this meet the goal?" series</b> — three different solutions are proposed for the same problem. Each is judged on its own, and more than one may work.</p>
    <p>Your network contains an on-premises AD DS domain named <b>contoso.com</b> that syncs with a Microsoft Entra tenant by using Entra Connect. You have a Fabric tenant that contains a semantic model. You enable <b>dynamic row-level security (RLS)</b> for the model and deploy it to the Fabric service.</p>
    <p>You query a measure that includes the <code class="inl">USERNAME()</code> function, and <b>the query returns a blank result</b>. You need to ensure that the measure returns the <b>user principal name (UPN)</b> of a user.</p>
    <p><b>Solution:</b> You update the measure to use the <code class="inl">USEROBJECTID()</code> function.</p>
    <p class="ask">Does this meet the goal?</p>`},
    options:[
      {k:"A", fr:"Oui", en:"Yes"},
      {k:"B", fr:"Non", en:"No"}
    ],
    answer:["B"],
    explain:{fr:`
      <p>L'objectif est précis : retourner le <b>UPN</b>, c'est-à-dire une chaîne du type <code class="inl">alice@contoso.com</code>. <code class="inl">USEROBJECTID()</code> ne retourne pas cela : elle renvoie l'<b>identifiant d'objet Entra</b> de l'utilisateur, un GUID du type <code class="inl">f7a3c1e2-…</code>.</p>
      <p>La solution ne fait donc que remplacer un résultat inexploitable par un autre : au lieu d'une valeur vide, vous obtenez un GUID — techniquement non vide, mais ce n'est pas le UPN demandé.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>Fonction DAX</th><th>Ce qu'elle retourne</th></tr>
        <tr><td class="m">USERNAME()</td><td>Dans le <b>service</b> : le UPN. Dans <b>Power BI Desktop</b> : <code class="inl">DOMAINE\\utilisateur</code></td></tr>
        <tr><td class="m">USERPRINCIPALNAME()</td><td><b>Toujours</b> le UPN, dans Desktop comme dans le service</td></tr>
        <tr><td class="m">USEROBJECTID()</td><td>Le GUID de l'objet Entra — utile pour joindre sur un ObjectID, pas pour afficher un nom</td></tr>
        <tr><td class="m">USERCULTURE()</td><td>Les paramètres régionaux du client</td></tr>
      </table></div>
      <p class="why">Le fond du problème</p>
      <p>Le résultat vide vient du fait que <code class="inl">USERNAME()</code> n'a pas le comportement attendu selon l'environnement d'exécution. <code class="inl">USERPRINCIPALNAME()</code> est la fonction conçue pour lever cette ambiguïté — c'est elle qui répond à l'objectif, et c'est l'objet de la variante suivante.</p>
      <p class="note"><b>Le réflexe.</b> Sur une série « Does this meet the goal ? », ne jugez jamais si la solution est <i>raisonnable</i> — vérifiez si elle produit <b>exactement</b> ce que l'objectif demande. Ici l'objectif nomme le UPN : toute fonction qui retourne autre chose échoue, même si elle identifie correctement l'utilisateur.</p>`,
      en:`
      <p>The goal is precise: return the <b>UPN</b>, i.e. a string such as <code class="inl">alice@contoso.com</code>. <code class="inl">USEROBJECTID()</code> does not return that: it returns the user's <b>Entra object identifier</b>, a GUID such as <code class="inl">f7a3c1e2-…</code>.</p>
      <p>The solution therefore just swaps one unusable result for another: instead of a blank value you get a GUID — technically non-blank, but not the UPN that was asked for.</p>
      <div class="tbl-wrap"><table class="schema">
        <tr><th>DAX function</th><th>What it returns</th></tr>
        <tr><td class="m">USERNAME()</td><td>In the <b>service</b>: the UPN. In <b>Power BI Desktop</b>: <code class="inl">DOMAIN\\user</code></td></tr>
        <tr><td class="m">USERPRINCIPALNAME()</td><td><b>Always</b> the UPN, in Desktop as in the service</td></tr>
        <tr><td class="m">USEROBJECTID()</td><td>The Entra object GUID — useful for joining on an ObjectID, not for showing a name</td></tr>
        <tr><td class="m">USERCULTURE()</td><td>The client's locale settings</td></tr>
      </table></div>
      <p class="why">The underlying problem</p>
      <p>The blank result comes from <code class="inl">USERNAME()</code> not behaving as expected depending on the execution environment. <code class="inl">USERPRINCIPALNAME()</code> is the function built to remove that ambiguity — it is the one that meets the goal, and it is the subject of the next variant.</p>
      <p class="note"><b>The reflex.</b> On a "Does this meet the goal?" series, never judge whether the solution is <i>reasonable</i> — check whether it produces <b>exactly</b> what the goal asks for. Here the goal names the UPN: any function returning something else fails, even if it identifies the user correctly.</p>`}
  },
  {
    id:"q125", kind:"single", type:T1,
    title:{fr:"RLS dynamique — USERPRINCIPALNAME",en:"Dynamic RLS — USERPRINCIPALNAME"},
    stem:{fr:`<p><b>Énoncé identique à la question précédente</b> : la mesure utilisant <code class="inl">USERNAME()</code> retourne un résultat vide, et vous devez garantir qu'elle retourne le <b>UPN</b> de l'utilisateur.</p>
    <p><b>Solution :</b> vous modifiez la mesure pour utiliser la fonction <code class="inl">USERPRINCIPALNAME()</code>.</p>
    <p class="ask">Cette solution atteint-elle l'objectif ?</p>`,
          en:`<p><b>Identical scenario to the previous question</b>: the measure using <code class="inl">USERNAME()</code> returns a blank result, and you need to ensure it returns the user's <b>UPN</b>.</p>
    <p><b>Solution:</b> You update the measure to use the <code class="inl">USERPRINCIPALNAME()</code> function.</p>
    <p class="ask">Does this meet the goal?</p>`},
    options:[
      {k:"A", fr:"Oui", en:"Yes"},
      {k:"B", fr:"Non", en:"No"}
    ],
    answer:["A"],
    explain:{fr:`
      <p><code class="inl">USERPRINCIPALNAME()</code> est la fonction DAX dont la définition <b>est</b> l'objectif de l'énoncé : elle retourne le nom principal de l'utilisateur authentifié, sous la forme <code class="inl">alice@contoso.com</code>.</p>
      <p class="why">Pourquoi elle règle le problème</p>
